<!doctype html><html lang="en"><head><meta charset="utf-8"><title>So you're arguing about…</title><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* A diagram that grows. Fields on the left; touching one runs wires out to its philosophies, a philosophy to the three levels,
   a level to the replies. One typeface, one size, black wires on a blank page. */
:root{--ink:#111;--dim:#a3a3a3;--bg:#fff;--wire:#111;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=day]){--ink:#eaeaea;--dim:#666;--bg:#0c0c0c;--wire:#eaeaea;color-scheme:dark}}
:root[data-theme=night]{--ink:#eaeaea;--dim:#666;--bg:#0c0c0c;--wire:#eaeaea;color-scheme:dark}
:root[data-theme=day]{color-scheme:light}
#theme{position:absolute;top:31.5px;right:18px;width:34px;height:34px;padding:0;justify-content:center;color:var(--dim);z-index:4}
#theme svg{width:16px;height:16px}
#theme:hover{color:var(--ink)}
@media (max-width:700px){#theme{top:22.5px;right:8px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 17px/1.4 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-text-size-adjust:100%}
h1{font:inherit;margin:0;padding:28px 28px 18px}
/* opening: the heading fades up, one leg reaches in from the edge, taps the "…", the names appear, it pulls away */
#intro{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible;z-index:3}
.intro #c1 > button,.intro #theme,.intro .credit,.intro .more{opacity:0}
.intro.show #c1 > button,.intro.show #theme{opacity:1;transition:opacity 1.4s ease-in}
.intro.show .credit.on,.intro.show .more.on{opacity:1;transition:opacity 1.4s ease-in}
.intro #hd{opacity:0}
.intro #hd.wake{animation:wake 1.1s ease-in .2s both}
@keyframes wake{from{opacity:0}to{opacity:1}}
#intro g.tap{animation:tap .62s ease-in-out both}
@keyframes tap{0%,100%{transform:none}22%{transform:rotate(-1.1deg)}40%{transform:none}64%{transform:rotate(-.8deg)}80%{transform:none}}

#scroll{overflow-x:auto;overflow-y:visible;padding:0 28px 40vh;scrollbar-width:none}
#scroll::-webkit-scrollbar{display:none}
#tree{position:relative;display:flex;align-items:flex-start;gap:var(--gap);width:max-content;--gap:110px}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
path{fill:none;stroke:var(--wire);stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
path.off{opacity:.16}
.col{display:flex;flex-direction:column;flex:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:6px 0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:opacity .3s}
.col.has button{opacity:.3}
.col.has button:hover{opacity:.7}
.col.has button[aria-current="true"]{opacity:1}
.av{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;background:#8883;display:grid;place-items:center;font-size:12px;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#c1 button,#c2 button{white-space:nowrap}
#c3 button{white-space:nowrap}
#c4,#c5{width:min(27em,78vw)}
#c4 button,#c5 button{padding:9px 0;display:block}
#c4 .q{display:block;font-size:13.5px;line-height:1.35;color:var(--dim);margin-bottom:1px}
#c4 .say,#c5 .say{display:block}
#c5 .q{display:block;font-size:13.5px;line-height:1.35;color:var(--dim);margin-bottom:1px}
#c5 button.c .say{opacity:.3}
#c4 button.c .say{opacity:.3}
.col.in button{opacity:0;animation:in .35s ease-out forwards;animation-delay:calc(var(--wait, .5s) + var(--n)*.02s)}
@keyframes in{to{opacity:1}}
.credit{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);z-index:5;background:var(--bg);padding:4px 6px 4px 4px;border-radius:999px}
.credit b{font-weight:400;color:var(--ink)}
.credit,.more{opacity:0;pointer-events:none;transition:opacity .5s}
.credit.on,.more.on{opacity:1;pointer-events:auto}
.more{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--dim);z-index:5;background:var(--bg);padding:4px 6px;border-radius:999px;text-decoration:none}
.more:hover{color:var(--ink)}
.credit .av{width:20px;height:20px}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
@media (max-width:700px){body{font-size:16px}h1{padding:20px 18px 12px}#scroll{padding:0 18px 40vh}#tree{--gap:64px}}
@media (prefers-reduced-motion:reduce){.col.in button{animation:none;opacity:1}}
/* the copy mark: faint, after the line, on hover or once the line is chosen */
.cp{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;margin-left:9px;width:16px;height:16px;color:var(--dim);opacity:0;transition:opacity .2s,color .2s;cursor:pointer;border-radius:3px}
.cp svg{position:static;inset:auto;width:13px;height:13px;pointer-events:none;overflow:visible}
.cp svg *{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:none}
button:hover .cp,button:focus-visible .cp,#c4 button[aria-current="true"] .cp,#c5 .cp{opacity:.55}
.cp:hover,.cp:focus-visible,.cp.ok{opacity:1!important;color:var(--ink)}
.cp.ok svg{display:none}
.cp.ok::after{content:"\2713";font-size:13px;line-height:1}
@media (hover:none){#c4 .cp{opacity:.4}}
/* sigils: one character per option, in a fixed slot so the names stay in a column */
.sg{flex:none;width:26px;text-align:center;line-height:1;white-space:nowrap;font-variant-emoji:text}
#c3 .sg{font-size:15px}
.qw.sp{margin-left:.28em}
/* the "…" in the heading is the search: type there and legs run from the word to whatever matches */
.qw{display:inline-block;position:relative;vertical-align:baseline;cursor:text}
.qw>*{font:inherit;letter-spacing:inherit}
#qm{visibility:hidden;white-space:pre;pointer-events:none;padding-right:2px}
#q{position:absolute;left:0;top:0;height:100%;width:calc(100% + 1.5em);min-width:0;margin:0;padding:0;border:0;border-radius:0;background:none;color:inherit;outline:none;caret-color:var(--ink);appearance:none}
#q::placeholder{color:var(--ink);opacity:1;transition:color .25s}
#q:focus::placeholder{color:var(--dim)}
.hint{color:var(--dim);font-size:13.5px;margin-left:14px;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.hint.on{opacity:1}
.intro .hint{opacity:0}
#find{display:none;position:relative;z-index:2;width:max-content;max-width:calc(100vw - 20px);padding-bottom:30vh}
.finding #find{display:block}
.finding #scroll{display:none}
#find button{white-space:nowrap;gap:12px;align-items:baseline;opacity:.45;max-width:100%}
#find .say{flex:none}
#find button:hover{opacity:.8}
#find button[aria-selected="true"]{opacity:1}
#find .sub{color:var(--dim);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:30em}
#find .none{color:var(--dim);padding:6px 0}
#find.in button{animation:fin .35s ease-out backwards;animation-delay:calc(var(--wait, .4s) + var(--n)*.02s)}
@keyframes fin{from{opacity:0}}
#fw{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible;z-index:1}
@media (prefers-reduced-motion:reduce){#find.in button{animation:none}}
</style><script>try{var t=localStorage.getItem('pa-theme');if(t==='day'||t==='night')document.documentElement.dataset.theme=t}catch(e){}try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&location.hash.length<2&&localStorage.getItem('pa-intro')!==new Date().toDateString())document.documentElement.classList.add('intro')}catch(e){}</script></head><body>
<button id="theme" type="button" aria-label="Switch between white and black" title="White / black"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
<h1 id="hd">So you’re arguing about<label class="qw"><input id="q" type="text" placeholder="…" aria-label="Search philosophies, philosophers and ideas" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><span id="qm" aria-hidden="true">…</span></label><span class="hint" id="hint">type a name or an idea</span></h1>
<div id="find" role="listbox" aria-label="Matches"></div>
<a class="more" id="more" href="https://jere-mee-as.github.io/philosophyragebait/">Just the rage bait →</a>
<div class="credit" id="credit">made by <b>Jere</b></div>
<div id="scroll"><div id="tree"><svg id="wires" aria-hidden="true"></svg><div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div><div class="col" id="c4"></div><div class="col" id="c5"></div></div></div>
