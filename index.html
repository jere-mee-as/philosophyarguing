<style>

:root{--ink:#111;--dim:#a3a3a3;--bg:#fff;--wire:#111;color-scheme:light dark}

<script id="data" type="application/json">[{"n": "Ancients", "s": "Ω", "t": [{"t": "Socrates", "k": [{"b": "The unexamined life is not worth living", "l": ["Plenty of people live decent, meaningful lives without philosophical scrutiny. The claim takes what made his life worthwhile and makes it the test for everyone’s.", "Examining things is what got him executed, and the people who never examined anything went home to dinner. So the examined life is the one that demonstrably wasn’t worth it.", "Socrates lost his own trial. If the method worked, he’d have talked his way out."], "r": ["The claim is about what’s worthy of a human being, not what’s pleasant. A decent life lived on borrowed opinions is decent by luck, and its owner can’t say why.", "Everyone at that dinner is dead too. He’s the only person from that courtroom anyone can name, so examination is the one thing in Athens with a survival rate.", "He wasn’t trying to win. Asked to propose his own punishment, he suggested free meals for life."]}, {"b": "He knew that he knew nothing", "l": ["The modesty is selective. He’s confident that virtue is knowledge and that doing wrong is worse than suffering it, which is a lot to know.", "If he knew nothing, he didn’t know that either, so the statement is false, so he knew something and lied about it. Either way the oracle picked a liar.", "“I know that I know nothing,” and then he corrected people for fifty years."], "r": ["He separates knowing from holding a view that has survived testing. What he asserts is what’s been questioned and still stands, and he says he’d drop it if refuted.", "Knowing that you don’t know is the one thing a person can check from the inside. So it’s the only certain knowledge there is, and he had all of it.", "He asked questions. They corrected themselves."]}, {"b": "The Socratic method gets at the truth", "l": ["The early dialogues mostly end in a shrug. The method is good at showing a definition fails and has almost no record of producing one that holds.", "A method that worked would finish at some point. Twenty-four centuries later they’re still asking what justice is, so the success rate is zero.", "The Socratic method is asking “but what is justice?” until the other guy has to go home."], "r": ["Clearing away false confidence is a result. Someone who knows his definition of courage fails is better placed than someone still acting on it.", "The method produced Plato, who produced Aristotle, who produced everything else. That’s the best success rate in the history of teaching.", "The other guy went home because he didn’t have an answer."]}, {"b": "No one does wrong knowingly", "l": ["Weakness of will is one of the most familiar things about people. Aristotle thought denying it plainly contradicts what everyone sees.", "Everyone who has eaten a second dessert knew. After all, if wrongdoing were only ignorance, a pamphlet would end crime.", "“Virtue is knowledge,” so nobody ever does wrong on purpose. He’d met Athenians."], "r": ["His reply is that the nearer pleasure distorts the measurement, the way a near object looks bigger. What looked like knowing better was a belief that gave way under pressure, so it wasn’t knowledge.", "Nobody who really understood what the dessert was doing would take it. Doctors don’t smoke. Well, the ones who understand.", "He had met them. That’s where he got the idea they didn’t know anything."]}, {"b": "He died for his principles", "l": ["The sources are admirers writing afterwards, and the Crito’s case for obeying the verdict sits badly with the Apology’s promise to disobey any ban on philosophy.", "He was offered a fine or exile and turned both down, so it wasn’t an execution, it was a choice. That’s not a martyr, that’s a man who wouldn’t take the deal.", "He picked hemlock over exile to make a point, and the point was Plato’s career."], "r": ["The two fit. He’d disobey an order to stop philosophizing and accept the penalty for it. Refusing to do wrong and refusing to run from the consequences are one position.", "A man who could leave and stays is the definition of a martyr. The ones who couldn’t leave are just victims.", "It’s been 2,400 years and you’re still talking about him. Point made."]}], "s": "?"}, {"t": "Plato", "k": [{"b": "The Forms explain what things have in common", "l": ["The Third Man regress, which Plato raises himself: if a Form explains why large things are alike, something has to explain why they’re like the Form.", "Things have something in common because people use one word for them. After all, nobody needed a heavenly Chair before the word “chair,” and the chairs were fine.", "The Forms are just concepts. Plato discovered that words have meanings."], "r": ["The regress needs the Form of Large to be one more large thing. If the Form is what largeness is, and not another item that has it, there’s nothing further to group it with.", "Different languages use different words and still sort the same things together. So the sameness isn’t in the word, and it has to be kept somewhere.", "And you’ve discovered nothing, which is also what the people in the cave say."]}, {"b": "Philosophers should rule", "l": ["Even if there are experts on the good, that doesn’t settle who checks them. Plato’s own late work retreats to the rule of law.", "Every profession thinks it should be in charge. Generals propose juntas, priests propose theocracies, and Plato happened to be a philosopher.", "Plato wanted philosophers to rule, and he was a philosopher. Nobody designs a utopia where they’re the plumber."], "r": ["The Republic’s answer is the training: decades of it, no property, no family, and rule as a burden they’d rather avoid. The check is that they don’t want the job.", "Generals are trained to win and priests to pray. Only one profession is trained in what’s good, so it’s the only one whose self-nomination counts.", "In the Republic the rulers own nothing and the plumbers keep their money. Read it."]}, {"b": "Most people are still in the cave", "l": ["The allegory assumes a privileged view without any independent way to tell who has left the cave from who has swapped one cave for another.", "Everyone who tells the cave story is outside the cave in it. They can’t all be outside, so the story shows nobody is.", "The cave is a nice story, but The Matrix did it better."], "r": ["The test is explanation. Someone outside can account for what the prisoners see, and the prisoners can’t account for the outside. Mathematics is his example of knowledge with that asymmetry.", "Somebody had to be outside to bring the story back. A story about the outside can’t be written from the inside, so the author’s out, at minimum.", "The Matrix is the cave with a budget. You watched a shadow of it."]}, {"b": "Learning is recollection", "l": ["The slave boy in the Meno is steered by leading questions. It shows reasoning can be prompted, which doesn’t need a previous life.", "If the soul learned everything before birth, it learned it somewhere for the first time. So ordinary learning is possible and the theory isn’t needed, by its own account.", "Babies have seen the Form of the Good and still can’t find their feet."], "r": ["The questions lead, but the boy has to see for himself that each step follows, and nobody tells him that part. Where that recognition comes from is the puzzle.", "The soul never learned it a first time, because the soul always existed. Things that always existed don’t have first times. That’s what “always” means.", "Feet aren’t a Form."]}, {"b": "Justice is each part doing its own work", "l": ["That makes justice an inner order, and then a further argument is needed that an ordered soul won’t wrong other people. The Republic’s bridge between the two is widely thought weak.", "A well-run gang has every part doing its job. So by the Republic the Mafia is the most just institution in Italy.", "The noble lie: the ideal state runs on propaganda. That’s in the plan, not a flaw in it."], "r": ["The bridge is motive. Wronging others comes from appetite or ambition running the soul, and a soul where reason rules has no motive left for it.", "A gang’s parts aren’t doing their own work, they’re doing crime, which is nobody’s proper work. It fails the definition at the first word.", "Every state has a founding story. He’s the only one who labelled his."]}], "s": "△︎"}, {"t": "Aristotle", "k": [{"b": "Virtue is the mean between extremes", "l": ["The doctrine guides nothing unless the right amount is already known, and virtues like justice and honesty don’t fit a too-much, too-little scheme.", "The middle of two wrong answers is a third wrong answer. Halfway between arson and nothing is still a small fire.", "The golden mean says the right answer is always in the middle. Aristotle invented centrism."], "r": ["It was never meant as a decision procedure. It says what the virtues have in common, and the guidance comes from the person of practical wisdom, as he tells you.", "Some acts have no mean, like murder and arson, and he says so in the same chapter. Somebody skipped a page.", "The mean depends on the situation. Sometimes the mean is being very angry. Like now."]}, {"b": "Everything has a telos", "l": ["Biology now explains apparent purpose by selection, without final causes, and purpose in non-living nature has no explanatory job left.", "If everything had a purpose, the appendix would have one. One counterexample is enough, and everyone carries it around.", "Teleology is saying the rain falls so the plants can drink."], "r": ["Biologists still explain the heart by what it’s for. Selection is how functions come about. It isn’t a reason to stop talking about them, and that’s most of what he claimed for living things.", "They proposed a purpose for the appendix in 2007: it stores gut bacteria. He waited 2,300 years on that one and didn’t complain.", "Ask a biologist what a kidney is for and watch them not hesitate."]}, {"b": "Eudaimonia is the human good", "l": ["The function argument goes from what is distinctive about humans to what is good for them, and being distinctive doesn’t obviously carry that weight.", "Flourishing took leisure, and leisure took slaves, which he said out loud. So the theory is correct for about four thousand Athenians.", "Aristotle said some people are natural slaves, and the virtue ethics crowd just skips that chapter."], "r": ["The argument isn’t from uniqueness. It’s that a thing’s good lies in doing well what it is its nature to do, and a human life is organized around reasoning, whoever else can reason.", "Leisure is now available to anyone with a dishwasher. The theory was early, and it’s finally in stock.", "We skip it the way physicists skip Newton’s alchemy."]}, {"b": "He was the first real empirical scientist", "l": ["The careful work on marine animals sits beside claims nobody tested for centuries, and his physics resisted exactly the checking he gets praised for.", "He looked, and reported that women have fewer teeth. So either looking doesn’t work or he didn’t look, and both are bad for the father of observation.", "Aristotle said heavy things fall faster and nobody checked for 2,000 years. That’s the legacy."], "r": ["He also said that where theory and observation conflict, observation wins. The centuries of not checking were his readers’ failure.", "Ancient women did lose more teeth, from diet and childbearing. So he counted, and he was right about the sample in front of him.", "Drop a hammer and a feather. In air. Where he lived."]}, {"b": "Logic starts with the syllogism", "l": ["The syllogism covers a small fragment of valid reasoning. It can’t handle relations or nested quantifiers, which is why Frege’s logic replaced it.", "All a syllogism can deliver is what was already in the premises. So two thousand years of logic produced zero new information, by design.", "Aristotle is Plato for people who like lists."], "r": ["He never claimed it was all of inference, and for two thousand years nobody did better. A complete system for a fragment is how every science starts.", "All of mathematics is also “already in the axioms.” If that’s zero information, tell the people who are surprised by theorems.", "1. That’s fair. 2. Lists are how you find things."]}], "s": "μ"}, {"t": "Stoicism", "k": [{"b": "Care only about what’s up to you", "l": ["The line between what is and isn’t up to us is blurry. Many things worth caring about are partly in our control, and indifference to them costs something.", "Nothing is fully in anyone’s control, including their thoughts, which just show up. So by the rule nothing matters, and Stoicism is nihilism with a morning routine.", "Marcus Aurelius had the easiest job to be calm in. He owned Rome."], "r": ["The Stoics handle the middle with the archer: do everything in your power to hit, and hold the result loosely. The care goes into the aiming, which is fully yours.", "Thoughts show up, and assent is what you do with them. That one step is yours, and it’s the only step that was ever doing anything.", "Epictetus was a slave. Same philosophy."]}, {"b": "Virtue is enough for happiness", "l": ["It follows that the good person is happy on the rack, which Aristotle said nobody would maintain unless they were defending a thesis.", "If virtue were enough, virtuous people wouldn’t need a philosophy for coping with everything else. The size of the Stoic bookshelf is the refutation.", "If nothing external can hurt a Stoic, it’s weird how many books they need about it."], "r": ["They mean happiness as a life going well by the standard that matters, not as feeling good. On the rack the sage is in pain and has lost nothing that made his life worth having.", "Athletes have coaches. Nobody says the gym proves exercise doesn’t work.", "It’s weird how many reps it takes to lift something."]}, {"b": "Emotions are judgments, and can be corrected", "l": ["Feelings often persist against a person’s considered judgment, as with phobias, which suggests they aren’t simply beliefs.", "If emotions were judgments, calm people would be the smartest people. Nobody has ever been talked out of a feeling by hearing it was a logic error.", "Stoicism is bottling it up with a Latin name."], "r": ["They allowed for involuntary first movements, like flinching or going pale. The emotion proper is the assent that follows, and that’s where the training applies.", "Cognitive therapy is talking people out of feelings by checking the judgment underneath. It’s the most tested treatment there is, and its founders said where they got it.", "It’s a Greek name."]}, {"b": "Live according to nature", "l": ["“Nature” only does the work once it’s been read as rational and providential, which is the conclusion the slogan was supposed to support.", "Nature gave people anger, fear and grief. So living according to nature means having all three, and the Stoics are the ones going against it.", "The Stoics said to live according to nature, and nature is mostly animals screaming."], "r": ["Fair that “nature” means rational nature for them. That’s an argued view of what humans are: the animal that can assent or refuse.", "Nature also gave people the ability to not act on those, and no other animal got that. The part only we have is our nature. The rest we share with raccoons.", "And the animals still handle it better than you handle a delayed flight."]}, {"b": "Wealth is a preferred indifferent", "l": ["A class of things that don’t matter but are rational to prefer is hard to keep stable. Ancient critics already called it the rival view in different words.", "Something preferred is something that matters, because that’s what preferring is. So the doctrine is “money matters” with a compliance department.", "Seneca wrote about how wealth doesn’t matter from inside one of the biggest fortunes in the empire."], "r": ["The distinction is between what’s worth choosing and what makes a life good. Health is worth choosing, and losing it doesn’t make you a worse person. Those are two scales.", "I prefer the window seat. If I get the aisle my life isn’t ruined. That’s the whole doctrine, and you already live by it for everything under forty dollars.", "Seneca said so himself. Then he was ordered to die and did it calmly. Check the ending."]}], "s": "≡︎"}, {"t": "Heraclitus", "k": [{"b": "Everything flows", "l": ["If nothing stayed the same there’d be nothing for the change to happen to. Talk of change needs something that persists through it.", "If everything flows, so does the claim that everything flows. By Tuesday it’s a different claim, and nobody has to answer the old one.", "Heraclitus said nothing stays the same, and people have been quoting the same line for 2,500 years."], "r": ["What persists for him is the pattern, the measure by which fire kindles and goes out. Stability is change held in proportion, not the absence of change.", "“Everything changes” is the only claim that’s true every day, because each day’s change confirms it. It’s the one fixed point, and the flow is what fixes it.", "Different people every time."]}, {"b": "You can’t step into the same river twice", "l": ["The river is the same river because rivers are the kind of thing that consists of moving water. Different water was never a different river.", "The Nile is on every map since there were maps. Same place, same name, same river. Cartography settled this.", "You can step in the same river twice. People have summer houses on it."], "r": ["That’s his point, not an objection to it. The river is the same river because the waters keep changing. Sameness that consists in change is the thesis.", "The Nile has shifted its course by miles and lost whole branches since those maps. The name is the only part that held still.", "And every year the river takes a few."]}, {"b": "Strife is justice; war is the father of all", "l": ["That opposites are in tension doesn’t make conflict good or generative. Plenty of tension just destroys things.", "War is the father of ruins. Everything that’s still standing is standing because nobody fought near it.", "“War is the father of all” is a thing said by a man who never left Ephesus."], "r": ["He doesn’t say conflict is pleasant. He says what stands is held up by opposed pulls, like a bow or a lyre, and slackening one side loses the thing.", "Every standing wall is two forces pushing on each other with neither winning. That’s strife. A wall where one side wins is called a pile.", "Ephesus was at war for most of it. He didn’t need to travel."]}, {"b": "There’s a logos, and most people sleep through it", "l": ["A principle that only the speaker grasps, stated in riddles, can’t be checked by anyone else. Obscurity isn’t evidence of depth.", "If most people can’t hear the logos, the simplest explanation is that it isn’t making a sound.", "They called him “the Obscure” in his own lifetime. It wasn’t a compliment then either."], "r": ["The fragments are compressed, and they are arguments: each puts two opposed descriptions of one thing side by side. The reader is meant to do the work, which is different from there being none.", "Most people can’t hear a dog whistle either, and the dog comes.", "The people who said it are known for one thing, which is saying it about him."]}], "s": "≈︎"}, {"t": "Parmenides & Zeno", "k": [{"b": "Change is impossible: what is, is", "l": ["The argument treats “is not” as naming a thing, nothing, and then says it can’t be spoken of. Saying something isn’t red doesn’t refer to nothingness.", "He wrote a poem to prove it. Before the poem there was no poem. Then there was.", "Parmenides proved nothing changes and then changed philosophy, apparently."], "r": ["Explaining “is not” as “is different from” was Plato’s answer, and it took him a whole dialogue. That it had to be invented shows the argument was hitting something.", "The poem always existed. It only appeared to you to begin, which is the kind of thing appearances do.", "Apparently. That’s the word, yes."]}, {"b": "Achilles never catches the tortoise", "l": ["An infinite series of shrinking intervals can have a finite sum. The calculus answers the arithmetic, whatever puzzles remain about space.", "Achilles is faster than a tortoise. That’s the whole problem and the whole solution.", "Zeno proved motion is impossible, and someone answered by standing up and walking. Still the best reply."], "r": ["The sum tells you where he catches it. Zeno asked how anyone completes infinitely many tasks one after another, and a limit is a number, not an account of the finishing.", "Being faster doesn’t help when there’s always one more gap to close first. Speed makes the gaps smaller. It doesn’t make them stop.", "He walked half the way first. Then half of that."]}, {"b": "Reason overrides the senses", "l": ["When a chain of reasoning ends in “nothing moves,” the more reasonable step is to doubt a premise. Conclusions can discredit arguments.", "Reason is done by a brain, which he found out about using his senses.", "When the argument says the tortoise wins and the eyes say otherwise, one of them has a problem, and it isn’t the eyes."], "r": ["Agreed that’s the rational response, and it’s what he’s demanding: say which premise. For a century nobody could, and the answers that came were new philosophy.", "The senses told people the brain was for cooling the blood. Reason corrected it. So even about the brain, it’s reason one, senses nothing.", "Your eyes also say the sun is the size of a coin."]}, {"b": "Nothing comes from nothing", "l": ["As a principle about causes it’s plausible, but it doesn’t follow that there’s no change. Things come from other things.", "Every idea Parmenides had came from nothing. He’d say so himself, he was very proud they were original.", "Zeno’s paradoxes are word problems that got out of hand."], "r": ["His point is stronger than that. Coming to be needs an earlier state in which the thing was not, and he denies that state can be coherently described. “From other things” assumes the description he’s challenging.", "He says a goddess told him. It’s in the opening lines. He cited his source, which is more than you’ve done.", "Then solve one."]}], "s": "½"}, {"t": "Pythagoras", "k": [{"b": "All is number", "l": ["That numbers describe things doesn’t make things numbers. The map and the territory get merged in one sentence.", "My landlord is not a number. I’ve checked, he has a car.", "Pythagoras thought everything was number, and then the square root of two showed up and they reportedly drowned the guy who told people."], "r": ["Physics now describes the basic constituents entirely by their mathematical properties and has found nothing underneath. Merging map and territory keeps looking less like a mistake.", "The landlord is a credit score, a rent figure and an account number to everyone who deals with him, including you. The car is a VIN.", "And it stayed leaked. The number’s still irrational."]}, {"b": "The soul passes from body to body", "l": ["There’s no evidence of memory or character carrying over, and without those it’s unclear what it would mean for it to be the same soul.", "The population has gone up by billions. Either souls are being manufactured or the theory has an inventory problem.", "He said he recognized a dead friend’s voice in a dog’s bark. That’s the evidence."], "r": ["The claim is that the soul is what carries over. Memory is one more thing it can lose, as people lose it within a single life without becoming someone else.", "Insect numbers are down by billions. The souls are being promoted. The books balance if you count everyone.", "You’ve never looked at a dog and known?"]}, {"b": "Mathematics purifies the soul", "l": ["Mathematical skill and moral character come apart all the time. Whatever proof does for the mind, it isn’t a moral training.", "If math purified the soul, accountants would be the holiest people alive.", "The Pythagoreans wouldn’t eat beans. Founders of rational thought."], "r": ["The claim is about attention. Practice at truths that don’t bend to what you want trains a person out of wishful thinking. That’s a discipline, even if it isn’t all of character.", "Accounting is arithmetic for money, which is the impure use. He specifically meant the kind nobody pays for.", "Everyone has dietary rules now. He was early."]}, {"b": "The heavens move in harmony", "l": ["The planets’ motions don’t fit musical ratios. Kepler tried for years to make them, and what survived of that work was the ellipses.", "Space is a vacuum. Sound doesn’t travel in a vacuum. The music of the spheres is, physically, nothing.", "He didn’t prove the theorem. The Babylonians had it a thousand years earlier. He had the cult."], "r": ["Kepler’s third law is a ratio between orbital periods and distances, and he found it looking for harmony. The spheres went. That the heavens obey number is the part that stayed.", "Three of Jupiter’s moons keep a 1:2:4 ratio. That’s an octave on top of an octave, playing in a vacuum, to nobody.", "The Babylonians had the numbers. He had the idea that it needed proving."]}], "s": "a²"}, {"t": "Epicurus", "k": [{"b": "Pleasure is the highest good", "l": ["He then defines the highest pleasure as the absence of pain and trouble, which is a different thing. A stone has that.", "If pleasure were the highest good, the wisest people would be at the buffet, and he ate bread and water.", "Epicurus said pleasure is the goal and then banned everything fun. It’s hedonism for people who go to bed at nine."], "r": ["A stone has no pain and no awareness of having none. His claim is about a conscious being with nothing lacking, which is a positive state, and most people have felt it after a need is met.", "The buffet is how you get the stomach ache. He did the math on the whole evening, including the part afterwards, and bread wins.", "And wake up feeling great. That’s the argument."]}, {"b": "Death is nothing to us", "l": ["Death can be bad for the one who dies by depriving them of the life they’d have had, even though they aren’t there to feel it.", "If death were nothing to us, nobody would have needed the argument. He wrote it down four separate ways.", "“Where death is, I am not.” Sure. That’s the complaint."], "r": ["Deprivation needs someone who is deprived. You missed all the centuries before your birth and it harmed no one, and he asks what makes the time after any different.", "Doctors write down four treatments for a fever too. The repetition is for the patient. The fear is the illness, not the death.", "Complaint from whom?"]}, {"b": "The gods exist but don’t care", "l": ["Gods that do nothing explain nothing. Keeping them looks like a concession to the neighbors more than a conclusion.", "Gods who don’t answer, don’t act and don’t notice are called “no gods.” He was an atheist with a lawyer.", "His gods are too relaxed to do anything, which is also his ethics."], "r": ["They aren’t there to explain anything. They’re the model of an undisturbed life, and their not intervening is the point of the model.", "A god who had to manage the world would be busy and anxious, which is less than perfect. So only gods who do nothing are really gods. Yours have jobs.", "Yes. It’s consistent. That’s supposed to be good in a philosophy."]}, {"b": "Live unnoticed; stay out of politics", "l": ["Withdrawal is only safe if others keep the city running and defended. As general advice it depends on most people ignoring it.", "The Garden had walls, a deed and a legal system protecting both. Somebody was doing the politics.", "“Live unnoticed,” he wrote, in 300 books, with his name on them."], "r": ["He didn’t forbid public life where security needs it. He said ambition is a bad trade for most people, and that a community of friends supplies what the city only promises.", "He bought the house. That’s a purchase, not politics. Buying bread doesn’t make you a farmer.", "Almost all of them are lost. It worked."]}], "s": "∘︎"}, {"t": "Diogenes & the Cynics", "k": [{"b": "Live by nature, not convention", "l": ["Humans are conventional by nature. Language, cooperation and shared rules are how the animal lives, not an add-on to strip away.", "Nature gave people language, and language is a convention. So he used a convention to say that, in a city, to an audience.", "Diogenes lived in a jar in the middle of Athens. Rejecting society works best with foot traffic."], "r": ["He isn’t against every shared practice. He’s testing which ones survive when people stop pretending. Language passes. Most of what people are ashamed of doesn’t.", "Dogs communicate without grammar and get by. He used words because you wouldn’t have understood the barking.", "A lesson needs a classroom."]}, {"b": "Shamelessness exposes hypocrisy", "l": ["Shocking people shows that they have norms, which nobody denied. It doesn’t show the norms are baseless.", "Doing something rude in public proves one thing, which is that it’s rude. The audience already knew.", "The Cynics were performance artists who got mistaken for philosophers because nobody had invented the grant yet."], "r": ["The target is the ranking. People found it shameful to eat in the market and not shameful to cheat there. Showing which norms get enforced is a criticism of the order they’re in.", "If everyone already knew, nobody would have gasped. A gasp is the sound of a belief being found.", "There was no grant. That was the performance."]}, {"b": "Needing nothing is freedom", "l": ["Independence bought by wanting almost nothing gives up most of what freedom is for. And he lived on what others gave him.", "He needed nothing except the food people handed him, the city he slept in, and someone to watch.", "He told Alexander to get out of his sun. Alexander conquered the known world. Diogenes kept the sun."], "r": ["Begging was part of the practice: take only what’s freely given and be content when nothing is. He threw away his cup when he saw a child drink from his hands.", "He needed food the way a sparrow does, and nobody says the sparrow is dependent on the bakery.", "Alexander died at 32 in Babylon wanting more. One of the two got what he asked for."]}, {"b": "I am a citizen of the world", "l": ["Rights and duties come from actual institutions. Citizenship of everywhere was, in his case, a way of owing nothing to anywhere.", "Citizens pay taxes and serve on juries. He was a tourist of the world.", "“Citizen of the world” is what someone says when their own city exiled them for a currency scandal."], "r": ["The claim was a refusal to let birthplace decide whom he owed consideration. The Stoics built an ethics of duties to all humanity on it.", "Tourists pay more tax than anyone. Hotel tax, airport tax. He’d be the most taxed man alive.", "He said the exile is what made him a philosopher. Best thing Sinope ever did."]}], "s": "☼︎"}, {"t": "The Sophists", "k": [{"b": "Man is the measure of all things", "l": ["If each person’s judgment is true for them, so is the judgment that Protagoras is wrong. Plato pointed that out.", "If man is the measure, I measure that he isn’t. That’s now true, by his rule, and the lesson is over.", "“Man is the measure of all things,” and the measurement cost fifty drachmas."], "r": ["Protagoras can reply that “true for” isn’t “true.” Your judgment holds for you, and the expert is the one who can change how things seem, for the better. Plato’s refutation needs him to drop the qualifier.", "And that’s true for you. He agrees. You’ve performed the doctrine and billed it as a refutation.", "You get what you pay for. Socrates was free."]}, {"b": "Justice is the advantage of the stronger", "l": ["The strong can be mistaken about their own advantage, and then obeying them isn’t to their advantage. Thrasymachus has to pick one.", "The stronger die too, and the laws are still there afterwards. So the laws are stronger, and they say he’s wrong.", "Thrasymachus lost the argument in book one and sulked for nine more."], "r": ["Thrasymachus answers that. A ruler in the strict sense doesn’t err, as a doctor in the strict sense doesn’t. The claim is about what rule is when it’s done competently.", "Laws don’t outlive the strong, they get rewritten by the next strong. Every legal code is the minutes of whoever won.", "Plato wrote both sides of that argument. I’d sulk too."]}, {"b": "Virtue can be taught, for a fee", "l": ["If it could be taught reliably, the sons of good men would be good, and the dialogues keep noticing that they often aren’t.", "Anything that can be taught for a fee has reviews. The reviews were written by Plato.", "The Sophists were the first consultants. Confident, expensive, and gone before the results came in."], "r": ["Protagoras’s reply in the dialogue is a good one: everyone teaches virtue all the time, so the differences come from talent, as with the sons of flute-players. Uneven results don’t show there’s no teaching.", "The students kept coming for a century, at full price. That’s the review. The other one is from a competitor.", "And the first to be resented by people who do it for free, and worse."]}, {"b": "Every question has two sides", "l": ["That two cases can be argued doesn’t make them equally good. Skill at making the weaker argument win is skill at misleading.", "Does every question have two sides? If yes, then also no.", "Debate club is the Sophists’ surviving institution, and it shows."], "r": ["The training was in finding the best case for each side before judging, which is what courts and peer review do. That it can be abused doesn’t make abuse the purpose.", "Yes, and I can argue either one. That’ll be fifty drachmas each.", "Also the legal profession, every parliament, and the essay you were graded on."]}], "s": "¢"}, {"t": "Democritus & atomism", "k": [{"b": "Only atoms and void exist", "l": ["It was a lucky guess with no evidence behind it, and his atoms, solid and uncuttable, aren’t what physics found.", "The word means “uncuttable,” and they cut it in 1938. Wrong in the name.", "Democritus guessed, and physics spent two thousand years making it look like a prediction."], "r": ["It was an argument: to answer Parmenides, something unchanging has to exist that can rearrange. And the core of it, that the world is small things in motion in empty space, is what was found.", "What they split wasn’t the atom, it was the thing chemists gave the name to too early. The uncuttables are further down, and they’re still called elementary.", "That’s what a prediction is."]}, {"b": "Sweet, hot and color exist only by convention", "l": ["If the senses mislead about all that, the atomist has undercut the evidence for atoms. Democritus has the senses say exactly this back to him.", "Sugar is sweet in every country. A convention that nobody agreed to and everyone follows is called a fact.", "Color isn’t real, he explained, in a world he could only find his way around by color."], "r": ["He saw the problem and wrote that exchange himself. His answer is two kinds of knowing: the senses give the dim kind, and reasoning from them reaches the genuine kind without trusting them fully.", "Sugar isn’t sweet to cats. They lack the receptor. So sweetness is in the tongue, and he said so from Thrace without one experiment.", "People find their way around by street names too."]}, {"b": "Everything happens by necessity", "l": ["If thoughts are just atoms falling as they must, there’s no reason to trust that they track the truth, including that thought.", "Epicurus took the same atoms and added a random swerve because nobody could live with it. Even the atomists left.", "They called him the laughing philosopher. If it’s all atoms bumping, the laughing was involuntary."], "r": ["Being necessitated doesn’t make a belief unreliable. A calculator’s output is necessitated and correct. What matters is whether the process is the kind that tracks truth.", "Epicurus added a random twitch and called it freedom. It’s the one part of ancient atomism nobody has ever found.", "So is yours. It’s still funny."]}, {"b": "The goal of life is cheerfulness", "l": ["It’s amiable advice with little argument behind it, and it doesn’t follow from atoms and void in any way he shows.", "Cheerfulness is some atoms. Telling atoms to be a different arrangement is not ethics, it’s yelling at gravel.", "His ethics is “be in a good mood.” Thanks."], "r": ["The link is his psychology. The soul is atoms too, disturbed by excess and by want, so measured living is literally a settled state. It’s thin by later standards, and it is an argument.", "Medicine is also telling atoms to be in a different arrangement, and it has a building.", "You’re welcome. See, it’s working."]}], "s": "⁖"}]}, {"n": "Metaphysics", "s": "∃︎", "t": [{"t": "Free will", "k": [{"b": "I could have done otherwise", "l": ["The feeling of open alternatives is just as expected if choice is determined. Introspection doesn’t show the absence of causes, only that we can’t see them.", "Nobody has ever done otherwise. Every person in history did exactly one thing each time, so the evidence is a hundred billion to zero.", "“I could have done otherwise.” Okay, then do it."], "r": ["True, the feeling alone proves little. The case rests on deliberation: weighing options presupposes they’re open, and nobody can deliberate while believing the outcome is already fixed.", "Every one of those hundred billion times, somebody picked. A hundred billion picks is a hundred billion data points for picking.", "I just didn’t. On purpose."]}, {"b": "Without it there’s no moral responsibility", "l": ["That’s a reason to want free will, which isn’t a reason to think it exists. And holding people responsible can be justified by what it does going forward.", "Courts already punish people whose brains made them do it, since that’s everyone. So responsibility has worked fine without free will since the first court.", "Free will was invented so God wouldn’t get blamed for anything. Augustine needed someone to pin it on."], "r": ["Forward-looking justifications license punishing an innocent person when it deters. Desert is what rules that out, and desert needs an agent who could have done otherwise.", "Courts have an insanity defense because “his brain made him do it” gets a man off. So the law assumes everybody else’s brain didn’t.", "Aristotle had it 700 years before Augustine, with no God to protect."]}, {"b": "Quantum indeterminacy leaves room for it", "l": ["Indeterminism gives randomness, and a random event in a neuron is no more a person’s own doing than a determined one.", "Quantum effects wash out above the size of a molecule, and a brain is bigger than a molecule. That’s the whole physics.", "Random isn’t free, so quantum mechanics doesn’t help, and nothing else is left."], "r": ["The indeterminism isn’t the freedom, it’s the room for it. The proposal is that the agent settles what physics leaves open, which is different from a coin settling it.", "A Geiger counter is bigger than a molecule and it clicks for one atom. Amplifying small events is what a brain is built for.", "Determined isn’t free either, by your count. So nobody chose to believe you."]}, {"b": "Libet didn’t disprove anything", "l": ["Granted, the readiness potential is weaker evidence than advertised. Beating one experiment still doesn’t supply an account of choice that is neither determined nor random.", "The brain started 300 milliseconds before the person knew. Whoever is 300 milliseconds late to their own decision isn’t the one making it.", "Free will got disproven in the 80s. A guy with an EEG watched the brain decide before the person did."], "r": ["Fair demand. One answer is the hard choice where both sets of reasons are the agent’s own, so whichever wins is hers and for reasons. It’s contested, and it is an account.", "Libet found the conscious veto comes in the last 200 milliseconds. So the brain proposes and I dispose. That’s a monarchy, and I’m the king.", "Libet believed in free will. Read the last page."]}, {"b": "I am the source of my own acts", "l": ["Agent causation posits a self that causes events with nothing about it explaining why then and why that. It names the gap more than it fills it.", "Nobody picked their parents, their brain or their first language, and those picked everything else. An uncaused chooser would have to turn up from nowhere at about age four.", "Free will is the soul with the serial numbers filed off."], "r": ["Every theory has a primitive. Event causation isn’t explained by anything further either, and agents causing things is at least something we seem acquainted with.", "Nobody picks the chessboard or the rules, and the game is still the player’s. Starting conditions aren’t moves.", "And determinism is fate with a physics degree."]}], "s": "⋔︎"}, {"t": "Compatibilism", "k": [{"b": "Freedom is acting on your own desires, unforced", "l": ["Manipulation cases: if a neuroscientist installs the desires, the agent passes the test and looks unfree, and it’s hard to say why ordinary determinism is different.", "A dog acts on its own desires, unforced, all day. So either dogs are morally responsible or the definition is missing the entire thing.", "A thermostat does what it wants with nothing stopping it. That’s compatibilist free will."], "r": ["The difference is history. A manipulator goes around the agent’s own capacity to reflect, and ordinary causes work through it. Versions with a history condition say exactly this.", "A dog can’t step back and ask whether it wants to want that. Add that ability and the dog’s a person, and yes, then we’d blame the dog.", "The thermostat can’t be talked out of it. You can. That’s the difference, and it’s the only one that matters."]}, {"b": "It’s the only free will worth wanting", "l": ["What most people say they want includes being the ultimate source of their choices. Calling the remainder all that was worth wanting is a revision and should be labelled one.", "“Worth wanting” is what people say about the thing they got. Nobody describes the prize they were hoping for as “the one worth wanting.”", "Dennett wrote two books on free will, and the answer both times was “the kind worth wanting,” which is the kind that’s left."], "r": ["Some revision, yes, as with “solid” after atoms. Tables turned out not to be what people pictured and the word stayed, because what mattered about it survived.", "The other kind is being the uncaused cause of yourself. Nobody wanted that until a philosopher told them they’d lost it.", "Your side’s answer, in every book, is a miracle between the ears."]}, {"b": "Determinism doesn’t threaten responsibility", "l": ["The consequence argument: if our acts follow from the laws and the distant past, and neither is up to us, it’s hard to see how the acts are.", "If the first domino isn’t responsible, the last one isn’t either, and it doesn’t become responsible by being the one with opinions about it.", "Compatibilists keep blame and throw out the only thing that made blame make sense."], "r": ["The argument’s key step is disputed: “not up to us” may not carry over from the past and the laws to what flows through our own deliberation. Being a link in the chain is how anything gets to be up to anyone.", "A domino that can see the others, weigh reasons and stay standing isn’t a domino. You’ve described a person and called it a tile.", "You kept the magic and threw out the person."]}, {"b": "“Could have” means “would have, if I’d wanted to”", "l": ["The conditional reading fails when the agent couldn’t have wanted otherwise. Then the conditional is true and the ability is missing.", "And I’d have been a bird if I’d had wings. Any sentence comes out true with an “if” that size.", "Compatibilism is redefining “free” until the argument’s over."], "r": ["Right, the simple conditional fails. Current versions treat ability as a disposition that can be blocked without being lost, the way a glass stays fragile while it’s packed in foam.", "Wanting is something I do every day. Wings aren’t. One of those ifs is five minutes away.", "You defined it as impossible and then announced it doesn’t exist."]}, {"b": "Most philosophers are compatibilists", "l": ["About 59% in the last PhilPapers survey, and survey majorities track training and fashion as well as argument. Headcount doesn’t answer the consequence argument.", "Most philosophers were dualists once, then idealists, then positivists. The majority view in philosophy has a perfect record of being the last thing everyone believed.", "Most philosophers are compatibilists, because most philosophers need both a paycheck and a clear conscience."], "r": ["Agreed, a survey settles nothing. It does move the burden: a view most specialists hold after studying the objections is unlikely to be the dodge its critics say it is.", "Every true view was also the majority view right before it stayed true. Round earth polls very well.", "Hard determinists cash paychecks too. They just can’t take credit for the work."]}], "s": "≅︎"}, {"t": "Determinism", "k": [{"b": "Every event is fixed by prior causes", "l": ["Whether the basic laws are deterministic is open. Quantum mechanics is indeterministic on most readings, so the thesis can’t just be read off physics.", "Physics dropped that a century ago, when it found out particles don’t have positions until someone looks. Determinists are defending Newton.", "Determinists still look both ways before crossing."], "r": ["Granted. The argument doesn’t need strict determinism: chance at the quantum level gives a person no more control than necessity does, so the conclusion about responsibility stands either way.", "On the many-worlds and pilot-wave readings the equations are fully deterministic. Physics didn’t drop it. A conference in Copenhagen did.", "Yes. I was caused to. It works great."]}, {"b": "Nobody deserves blame or praise", "l": ["Blame, gratitude and resentment are built into relationships in ways that may not be optional. And that desert dies with determinism is itself contested.", "Then nobody deserves blame for believing in free will, or for blaming. So the determinist has no complaint about anything anyone does, including punishing people.", "Determinists say nobody deserves blame and then get really mad at people who believe in free will."], "r": ["Some of those attitudes may be unavoidable, and resentment isn’t one: people drop it when they learn about the tumor or the childhood. The view asks us to generalize what we already do.", "Right, no blame. I’m not blaming them, I’m correcting them. Like a thermostat, which your side loves.", "I don’t blame you. You couldn’t have believed otherwise."]}, {"b": "Neuroscience shows choices are just brain events", "l": ["That choices are brain events doesn’t show those events aren’t choosing. Finding how a capacity works usually isn’t finding that it’s missing.", "Scans show brain events when people do math too. By that logic nobody has ever done math, and the scanners were designed by nobody.", "Sapolsky wrote 500 pages on it, so that’s done."], "r": ["Fair for choosing in the everyday sense. What the mechanism rules out is the further thing people want: a chooser who could have overridden the mechanism.", "Exactly, and nobody thinks the math was up to them. Two plus two wasn’t a choice. Neither was the rest.", "It’s 500 pages more than the other side has in evidence."]}, {"b": "Accepting it makes people more compassionate", "l": ["The evidence is mixed: some studies found that weakening belief in free will increased cheating, though they replicate poorly. Compassion doesn’t follow from a metaphysical thesis either.", "If everything’s determined, so is who turns out compassionate. So accepting it changes nothing, because the accepting was also on the schedule.", "Determinism is fatalism in a lab coat."], "r": ["The cheating studies mostly failed to replicate. And the point is conceptual as much as empirical: retribution loses its rationale, which matters for sentencing whatever anyone feels.", "Arguments are causes. This one just got scheduled into you. Check back in a week.", "Fatalism says it happens whatever you do. Determinism says it happens because of what you do. Small word, big difference."]}, {"b": "Free will is an illusion we should drop", "l": ["“Should drop” assumes we can respond to reasons and revise what we think, which is the very capacity compatibilists mean by freedom.", "If it’s all determined, so is believing in determinism, so there’s no reason to think it’s true. It’s just what the atoms did.", "“There’s no free will” is always announced by someone who clearly chose to bring it up."], "r": ["Responding to reasons is a causal process and fits the view fine. What’s denied is ultimate desert, and “should” never needed that.", "A calculator is all atoms and gets the answer right. Being caused isn’t being wrong. Being caused by the evidence is what being right is.", "You were always going to say that."]}], "s": "⇒︎"}, {"t": "Personal identity", "k": [{"b": "Psychological continuity makes you you", "l": ["Continuity can branch. In a fission case two people are continuous with one, and identity can’t hold between one thing and two.", "Nobody remembers being two. So by this theory everyone replaced a toddler and took the body, and that’s a lot of unsolved cases.", "Psychological continuity means a bad enough hangover is a death."], "r": ["Fission shows that identity isn’t what matters. It doesn’t show continuity fails. Both people who walk out have everything worth caring about, and that’s the theory’s lesson.", "Continuity is a chain. You remember yesterday’s you, who remembered the day before. The toddler’s in the chain, he’s just bad at writing things down.", "You’ve had those hangovers. You know."]}, {"b": "The teleporter is just travel", "l": ["If the original isn’t destroyed there are two, and the one who steps out isn’t the one who stepped in. That suggests the standard case is a copy plus a death.", "A photocopy isn’t the original even when it’s perfect, which is why banks don’t take photocopied money. Same rule for people.", "The teleporter obviously kills you. People who say otherwise have never lost a save file."], "r": ["The branching case is the odd one. With a single continuer, nothing you care about is missing on arrival, and “death” is being used for an event with no loss in it.", "Banks care about the paper. Nobody cares about your atoms, which is lucky, since you’ve swapped nearly all of them since your last flight.", "You’ve loaded a save file. Were you upset?"]}, {"b": "Identity isn’t what matters", "l": ["Parfit needs prudential concern to transfer cleanly to a successor. Many find that caring about their own future isn’t used up by caring about someone psychologically similar.", "If identity didn’t matter, people wouldn’t mind who collects their paycheck as long as he’s similar. Everyone minds.", "Parfit said identity doesn’t matter and still signed his books."], "r": ["Parfit grants the feeling and argues it has no object. Once every fact about continuity is known, there’s no further fact for the extra concern to be tracking.", "I mind who gets the paycheck because he isn’t continuous with me. Give it to my perfect continuer and I’ll be thrilled. I’ll be him.", "Somebody sufficiently continuous with him signed them."]}, {"b": "You are a human animal", "l": ["Brain transplant cases cut against it: most people judge that the person goes where the cerebrum goes and the animal stays behind.", "The body replaces all its cells every seven years. So if a person is their body, marriages expire, and so do prison sentences.", "Every cell gets replaced every seven years, so nobody is the person who took out their student loans."], "r": ["The animalist says that verdict tracks what we care about, not what we are. Move the cerebrum and an animal gets a new organ with someone’s memories in it. Organs transfer. Animals don’t.", "A river replaces its water and stays the river. An organism is a process, and the process has one birth certificate.", "The lender agrees with the animalists. So does the bank, the DMV and your mother."]}, {"b": "There’s no self, just a bundle", "l": ["The bundle needs something that makes these experiences one stream and not scattered ones, and saying what that is tends to bring back what was denied.", "A bundle needs something to tie it. Nobody has seen a bundle of sticks with no string, and the string is the self.", "Personal identity is philosophers discovering that people change."], "r": ["Causal connection does it: these experiences produce and refer to one another. That’s a relation among them, and no extra owner has to be added.", "A whirlpool is water with no string. So is a flame, and a queue. Lots of things hold together by what they’re doing.", "And you’ve discovered nothing, since there’s no you. Sorry."]}], "s": "="}, {"t": "Modal realism", "k": [{"b": "Possible worlds are as real as this one", "l": ["The view buys an analysis of possibility at the price of an ontology most find incredible, and abstract stand-ins for worlds get much of the benefit.", "If they were real, somebody from one would have turned up by now. Infinite worlds, infinite people, zero visitors.", "David Lewis thought there’s a universe with talking donkeys, and Princeton gave him an office."], "r": ["Abstract stand-ins represent possibilities, so they have to take “could” as a primitive. Lewis’s worlds explain it with nothing left over, and that’s the trade on offer.", "They’re causally isolated. It’s in the definition. A visitor would prove it was the same world all along.", "In some world they didn’t. Count yourself lucky to be in this one."]}, {"b": "It’s the best analysis of “could have”", "l": ["What happens to a counterpart in a sealed-off universe seems irrelevant to what could have happened to me. That’s Kripke’s Humphrey objection.", "“Could have” already means something. It means it didn’t. That analysis is free and needs one universe.", "“Could have” is a figure of speech. Lewis built a cosmos for it."], "r": ["Humphrey cares that he might have won, and the analysis says what that comes to: someone suitably like him wins. Saying what a fact consists in isn’t changing the subject.", "“Could have won” and “could have been a prime number” both didn’t happen. Only one of them is true. Your free analysis can’t tell them apart.", "Physics built a whole field for “if.” Nobody laughed at that."]}, {"b": "The benefits are worth the ontological cost", "l": ["Lewis says only kinds of thing count against a theory, not how many. It’s unclear why an infinity of concrete universes shouldn’t count heavily anyway.", "Occam’s razor says don’t multiply entities, and this multiplies them by infinity. By size of violation it’s the most refuted theory there has ever been.", "It’s the most expensive theory ever proposed. Infinite universes to explain one word."], "r": ["Kinds are what parsimony counts in science too: nobody rejects a theory for having more electrons. And he adds no new kind, only more of what everyone already believes in.", "Occam counts kinds, and he added zero. Worlds: one kind, we already had one. The razor has nothing to cut.", "The word is “possible.” It’s in every sentence of every science."]}, {"b": "“Actual” just means “here”", "l": ["If “actual” only marks where we are, merely possible suffering is as real as ours, which strains ordinary moral thinking.", "“Here” is where I am and “actual” is what exists. One of those is a location. Mixing them up is how you end up paying rent in a counterfactual.", "If every possible world exists, there’s one where modal realism is false, and it could be this one."], "r": ["Lewis accepts that, and argues our duties were never to all of reality, only to those we can affect. Nothing done here harms anyone elsewhere.", "“Now” used to sound special too. Then physics said it’s just where you are in time. “Actual” is next.", "It’s a claim about all the worlds, so it’s true in all of them or none. You can’t shop for it."]}, {"b": "An incredulous stare isn’t an argument", "l": ["Strong, steady, widely shared disbelief is ordinary evidence in philosophy, the same kind Lewis leans on when he rejects other views for offending common opinion.", "If everyone in the room stares at a guy, the stare is data. That’s how peer review works.", "Lewis said the one objection he couldn’t answer was people staring at him. That is an objection."], "r": ["It is some evidence, and he says so. He weighs it against what the theory buys and reports the balance, which is more than a stare does.", "Then continental drift was refuted from 1915 to 1960. Geologists stared the entire time.", "Then state its premises."]}], "s": "◇︎"}, {"t": "Spinoza", "k": [{"b": "God and Nature are one substance", "l": ["The proof runs on definitions of substance and attribute that already rule out more than one. Reject the definition and the monism doesn’t follow.", "If everything is God then nothing is, the way that if everything’s on sale there’s no sale. He proved atheism and kept the branding.", "Spinoza says everything is God, so my parking ticket is God."], "r": ["The definition was the standard one of his day, and Descartes shared it. He refused the exception Descartes made for created things and followed it through.", "If everything’s water, there’s still water. “Everything is X” is how you say a lot about X.", "Yes. Pay it with equanimity."]}, {"b": "Everything follows necessarily", "l": ["If nothing could have been otherwise in any respect, the difference between laws and accidents, which explanation relies on, disappears.", "If everything were necessary, so was everyone’s opinion of the Ethics, and nobody needed persuading. He wrote arguments anyway.", "Spinoza said there’s no free will and then wrote a guide to becoming free."], "r": ["He keeps a version of the difference: some things follow from God’s nature directly and others through the series of finite causes. Both are necessary, in different ways.", "The arguments were necessary too, and so is whether you’re persuaded. Causes work by happening.", "Free of being pushed around by things like this, mostly."]}, {"b": "The geometric method makes it rigorous", "l": ["The proofs often use premises that aren’t among the stated axioms, and the definitions carry the contested content. The form is deductive and the rigor is uneven.", "Geometry has diagrams and the Ethics has none. A geometric proof with no shapes is a list with confidence.", "The Ethics is laid out like geometry so it looks proven. Nobody argues with a QED."], "r": ["There are gaps. The form still earns its keep: every claim lists what it depends on, so a critic can say exactly where to cut. Few philosophers offer that.", "Geometry hasn’t needed diagrams since Descartes turned it into algebra. He was up to date.", "You’re arguing with it right now. It’s holding up."]}, {"b": "Freedom is understanding necessity", "l": ["Understanding why one is determined is still being determined. Calling that freedom changes the subject from what everyone else means by the word.", "A prisoner who understands the lock is still in the cell. Understanding has never opened a door.", "Spinoza is Stoicism with axioms."], "r": ["He’d say the ordinary notion was always confused. “Free” meant not being pushed around from outside, and understanding is what turns outside causes into your own reasons.", "A prisoner who understands the lock is called a locksmith.", "Stoicism without the providence. Read to the end."]}, {"b": "Mind and body are one thing, two attributes", "l": ["With no interaction between the attributes, nothing explains why they line up, and how one substance has really distinct attributes is a standing puzzle.", "If mind and body were one thing, a haircut would be a change of mind. Two words, two things. The language settled it.", "Spinoza is atheism for people who like the word God."], "r": ["Nothing has to line them up, because there aren’t two things. It’s one sequence of events described twice. The sameness is the explanation.", "A haircut is a change of mind: now there’s the idea of the haircut. Every change in the body has its idea. He wins that example.", "He was expelled, cursed and banned for it. He could have just used a different word."]}], "s": "∎︎"}, {"t": "Leibniz", "k": [{"b": "This is the best of all possible worlds", "l": ["There may be no best world, as there’s no largest number. And that less evil overall was impossible is asserted, not shown.", "A world exactly like this one minus one mosquito is possible and better. That took four seconds, and God had eternity.", "Leibniz said this is the best possible world. Presumably he hadn’t been outside."], "r": ["If there were no best, God would have had no reason to create any world, and there is one. And he never claims to show the details, only that it follows from what God is.", "Remove the mosquito and you’ve removed what eats it, what it pollinates and everything downstream. That’s not editing a line, that’s writing another world. Show your work.", "Best possible isn’t best imaginable. You’ve imagined worlds. You haven’t checked that they’re possible."]}, {"b": "Everything has a sufficient reason", "l": ["An unrestricted version arguably means nothing is contingent: if every contingent truth has a sufficient reason, so does the whole lot together, and then it couldn’t have been otherwise.", "Then the principle needs a reason, and that reason needs one. So it’s a circle, or a guy saying “because” forever.", "The principle of sufficient reason is refusing to accept “it just is.” Toddlers have it too."], "r": ["He answers with two kinds of necessity: the reasons for contingent truths incline without compelling, and their analysis never ends. Whether that works is the live question.", "Its reason is that denying it means accepting things for no reason, which is what “unreasonable” means.", "The toddler is right. You just got tired."]}, {"b": "Monads are the true substances", "l": ["Monads that can’t interact make causation an appearance and need a pre-established harmony, which explains the coordination by announcing it.", "Atoms were found. They have parts and they bump into each other. The Monadology was a prediction and the lab results came in.", "Monads have no windows, can’t touch each other, and God syncs them like clocks. This was the serious proposal."], "r": ["It solves a problem everyone had: how separate substances act on each other. He denied that they do and explained the appearance. The rival needed constant miracles, and his needs one.", "Anything with parts is made of something. Follow that down and you reach things without parts or you never stop. He picked the option that stops.", "Your phone stays in sync with a billion others and none of them touch."]}, {"b": "No two things differ only in number", "l": ["Two exactly alike spheres alone in an empty universe seem possible and seem to be two. Identical particles in quantum physics press the same point.", "Two new pennies. Same everything, still two pennies. He could have checked his pocket.", "He said no two leaves are alike, and a courtier went into the palace garden to look. That was the experiment."], "r": ["If space is real, the spheres differ in where they are. If it isn’t, you’ve described one sphere twice. He’d say you imagined a picture, not a possibility.", "Put them under a microscope. Different scratches. He told you there would be.", "And the courtier didn’t find two. Experiment confirmed."]}, {"b": "God permits evil for a greater good", "l": ["Greater-good answers struggle with horrors that serve no good in proportion, and with why an all-powerful being needs evil as a tool.", "If every evil leads to a greater good, preventing evil makes the world worse. So firefighters are working against God.", "Voltaire ended Leibniz with one short novel."], "r": ["He doesn’t say each evil buys its own good. The claim is about the whole: this world’s laws and its goods come as a package, and a world without the laws loses more.", "The firefighters are in the plan. The best possible world includes people putting fires out.", "Voltaire refuted “everything is nice.” Nobody had said that."]}, {"b": "The calculus we use is his", "l": ["The notation is his and it won, but Newton got there about a decade earlier. The modern verdict is independent invention, with the rigor supplied by neither.", "Newton had it first, and in science first is the only place. Nobody remembers the second man on the moon either.", "Newton invented calculus. Leibniz invented writing it down nicer."], "r": ["Newton had it and sat on it. The calculus the world learned, with dx, the integral sign and rules a student can apply, is what made it a method.", "Britain kept Newton’s notation out of pride and fell a century behind the continent. First isn’t the only place. Usable is.", "Writing it down nicer is what mathematics is."]}], "s": "∫︎"}, {"t": "Idealism", "k": [{"b": "To be is to be perceived", "l": ["Berkeley’s argument runs together imagining an unseen tree and the tree being imagined. That I have to think of it to picture it doesn’t make it depend on a mind.", "Things get discovered. If being were being perceived, Neptune began existing in 1846 with a full orbital history already in place.", "“To be is to be perceived” is what an influencer believes."], "r": ["That argument is his weakest. The stronger one: every property we give to matter is known as an appearance, and the supposed thing behind the appearances does no work.", "Neptune was being perceived the whole time, by God. That’s the job. It’s in the first book.", "And “it exists whether or not anyone’s ever aware of it” is what a man says about his novel."]}, {"b": "Matter is an unnecessary posit", "l": ["Objects that exist apart from minds explain why experience is coherent and shared more simply than a divine mind coordinating everyone does.", "Then starving would be a perception problem. People have tried perceiving food.", "If everything is mental, a brick to the head is a difference of opinion."], "r": ["Matter doesn’t explain the order either, it moves it into laws nobody can explain. A mind producing orderly experience is at least a kind of cause we know.", "Dream food doesn’t fill you up, and it’s nothing but perceptions. Not all perceptions are up to you. That’s the line between real and imagined, and he draws it.", "The brick, the head and the pain are all still there. He denied matter, not bricks."]}, {"b": "Consciousness is the one thing we know directly", "l": ["Granting special access to experience doesn’t give that everything is experience. A starting point for knowledge isn’t an inventory of what exists.", "The first thing anyone sees in the morning is the ceiling. That doesn’t make the universe ceiling.", "Idealism is solipsism with guests."], "r": ["Right, it takes a second step: everything else is known only as structure, so nothing else we know of could be what the world is in itself.", "The ceiling was an experience of a ceiling. That’s what you saw first. You’ve never seen anything else.", "Solipsism has one mind. This has all of them. That’s the opposite."]}, {"b": "We are dissociated parts of one mind", "l": ["It inherits a problem as hard as the one it avoids: how one universal subject splits into many private ones is named by analogy and never explained.", "Dissociation is something that happens to brains. So the theory needs the universe to have a brain first, which is what it was supposed to explain.", "Kastrup says the universe has a dissociative disorder and people are the alters. This is the leading version."], "r": ["It is a problem, and an easier one. Minds are known to dissociate, and nobody has ever watched matter turn into experience. One of the two mechanisms exists in nature.", "A brain is what dissociation looks like from outside. You’ve got the picture and the thing the wrong way round, which is the whole theory.", "The leading rival is that it’s all tiny billiard balls that somehow hurt."]}, {"b": "Physics only describes structure, so the rest is mental", "l": ["That physics is silent on what things are in themselves leaves the question open. It doesn’t favor the mental over the unknown.", "Physics also doesn’t say the universe isn’t soup. A gap in physics is not a vote for the first thing somebody thinks of.", "Idealism comes back every time someone does mushrooms."], "r": ["It leaves it open, and we have one example of an inner nature, which is our own experience. Extending the only known case is inference, not preference.", "Nobody is acquainted with cosmic soup. We have one sample of what reality is like from the inside, and it isn’t soup.", "And materialism comes back every time someone’s hungover."]}], "s": "☉︎"}, {"t": "Eternalism", "k": [{"b": "Past, present and future are equally real", "l": ["The view has trouble with why experience seems to move and why we care differently about what’s coming than what’s over.", "If the future were already real, somebody could go look. Nobody has ever brought anything back, not even a newspaper.", "The past is real, the future is real, and somehow the rent is only ever due now."], "r": ["The sense of movement is explained by memory: each moment holds traces of earlier ones and none of later ones. Caring more about the future has an evolutionary story too.", "Paris is real and you can’t see it from here either. Real doesn’t mean reachable from where you’re standing.", "“Now” is like “here.” The rent is due here too, and nobody thinks other places are unreal."]}, {"b": "Relativity proves the block universe", "l": ["Relativity removes a universal “now.” It doesn’t force the block, and physicists and philosophers still defend other readings.", "Einstein also said God doesn’t play dice. He was wrong about his own field, so his metaphysics isn’t a tiebreaker.", "“Physics says so” is carrying the whole view, and physics didn’t say so."], "r": ["Not forced, agreed. Every alternative has to add a preferred frame that the physics can’t detect, and that’s a high price for keeping the present special.", "This is the part of his work he was right about. It’s been tested to fourteen decimal places.", "Physics says there’s no universal now. The rest is two lines of reasoning."]}, {"b": "The flow of time is an illusion", "l": ["An illusion is itself something that happens in time. The seeming to flow needs explaining, and “illusion” just renames it.", "An illusion takes time to have. So time passes while people are being fooled about whether time passes.", "Time doesn’t pass, according to people who are late."], "r": ["The experience is real and has a place in the block: each moment contains the sense of having come from the last. What’s denied is a moving spotlight on top of that.", "A filmstrip contains motion in every frame and the strip isn’t going anywhere.", "And they’re late at a fixed point in spacetime, forever. It’s worse."]}, {"b": "You always exist at the times you exist", "l": ["That’s true on every view of time, so it’s no comfort. The loss in dying is the future one doesn’t get.", "“He still exists, in 1987” has never once helped at a funeral.", "Eternalism is “he’s in a better place,” where the place is last year."], "r": ["It was never offered as a comfort that outweighs the loss. It’s a correction: the dead aren’t nothing, they’re elsewhere in time, and that’s simply true on the view.", "It doesn’t help because grief is about now. It’s still a fact, and some people do find it steadies them. Einstein wrote it to a widow.", "Last year is a real place. You were there."]}], "s": "t₀"}, {"t": "Why there's something", "k": [{"b": "It’s the deepest question there is", "l": ["The question may be ill-formed. “Nothing” isn’t a state that could have obtained and needed preventing, so there may be nothing to explain.", "There’s something because if there weren’t, nobody would be asking. That’s the answer. It took one line.", "“Why is there something rather than nothing” has produced nothing. It’s the question answering itself."], "r": ["Even if “nothing” isn’t a possible state, one can ask why there’s this contingent arrangement and not another. The question survives being tidied.", "That explains why anyone notices there’s something. Why there is something is still sitting there.", "It produced cosmology. People wanted to know how far back the something goes."]}, {"b": "Physics shows a universe can come from nothing", "l": ["The “nothing” in those accounts is a quantum vacuum with laws and fields, which is something. Critics pointed this out at once.", "The physicist’s nothing has energy, laws and a budget. That’s the kind of nothing people have in their bank account before payday.", "A whole book called A Universe from Nothing, and the nothing turned out to be stuff."], "r": ["Fair, it changes the subject from absolute nothing. It still shows the starting material can be far simpler than anyone guessed, and that narrows the mystery.", "An empty account that fills itself with money for no reason would be worth a book.", "The stuff is as close to nothing as physics allows. Ask for less and you’re asking for a void with no properties, which can’t be discussed."]}, {"b": "A necessary being explains it", "l": ["A being whose existence is necessary needs its necessity explained, and it’s unclear why the universe couldn’t have that status as easily.", "“It exists because it has to” works for the universe too, and the universe has the advantage of being here.", "The answer to “why is there anything” is a thing. That’s the question again, with a beard."], "r": ["The universe looks contingent: it began, it changes, it could have had other constants. A necessary foundation would have to be unlike that, which is why it gets a different name.", "The universe started 13.8 billion years ago. Things that have to exist don’t have a first day.", "A thing whose nonexistence is impossible. That’s a different answer from “a thing.”"]}, {"b": "It’s just a brute fact", "l": ["Brute facts are where explanation stops, and stopping at the largest fact there is looks like giving up exactly where it matters.", "“It just is” is what every explanation was invented to avoid saying.", "Brute fact is “because I said so,” from nobody."], "r": ["Every explanation ends somewhere. Ending at the totality is at least ending at something we know exists, with nothing extra posited.", "Every explanation ends in “it just is.” The only choice is how early you say it.", "From nobody is correct. That’s the position."]}], "s": "∃︎?"}, {"t": "Many-worlds", "k": [{"b": "The wavefunction never collapses; every branch is real", "l": ["The branches can’t be observed even in principle, so the extra worlds do no work that could ever be checked against the alternatives.", "If the universe copied itself every time an atom did anything, the energy bill would be noticeable.", "Many-worlds says there’s a version of you who understood it."], "r": ["The branches aren’t an added hypothesis. They’re what the equation gives if nothing is added, and collapse is the extra, unobserved thing.", "Energy is conserved across the whole wavefunction. Each branch gets its share of the weight. The bill was paid at the start.", "And one who thinks you’re funny."]}, {"b": "It’s the simplest reading of the equations", "l": ["It’s simple in postulates and enormous in ontology, and it needs extra work to say what a “world” is and why branches look classical.", "Occam’s razor says don’t multiply entities. This multiplies universes, every instant, forever. It’s the least simple thing ever proposed.", "“Simplest interpretation,” they say, pointing at infinity universes."], "r": ["Simplicity is measured in laws. One equation, no exceptions, beats one equation plus a rule for when it switches off that nobody can state.", "Occam counts assumptions. This has one. The stars are numerous too, and nobody shaves those.", "One equation. You can count to one."]}, {"b": "Probability comes from uncertainty about which branch you’re in", "l": ["If every outcome happens, it’s unclear what “70% likely” means. Deriving the Born rule from rational betting is contested, to put it mildly.", "If everything happens, the odds of everything are 100%. So the theory predicts every result, which is the same as predicting none.", "In some branch this argument was convincing."], "r": ["It’s the hard part, and there are two serious derivations of the usual rule. The rivals get their probabilities by putting the rule in by hand.", "Everything happens, in different amounts. A branch with weight 0.9 is nine times the one with 0.1. That’s what the number was always measuring.", "In most of them, by weight."]}, {"b": "It just takes quantum mechanics seriously", "l": ["Every interpretation takes the formalism seriously. They differ on what it describes, and “seriously” doesn’t pick one.", "Taking the math seriously is how people end up thinking negative numbers of apples exist.", "Many-worlds is fan fiction for physicists. What if I’d asked her out. It’s in the wavefunction."], "r": ["The others take the formalism and then add a collapse, hidden variables or a rule about observers. This is the reading with nothing added.", "Negative numbers turned out to describe debt, charge and direction. Taking the math seriously has a good record.", "It’s the least romantic theory there is. In most branches she said no."]}], "s": "ℋ"}, {"t": "Mathematical platonism", "k": [{"b": "Numbers exist independently of us", "l": ["If numbers are outside space and time and cause nothing, it’s a mystery how we could know anything about them.", "Where? It’s a fair question about anything that exists. Things that exist are somewhere.", "Platonists believe in an
