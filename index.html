 of it being wrong. He picked the smallest case because it’s the clearest."]}, {"b": "Grace alone saves, not our efforts", "l": ["If salvation depends wholly on grace given to some and not others, the withholding looks arbitrary, and effort and blame lose their point.", "If it’s all grace, there’s no reason to try, and he spent thirteen books telling people to try.", "“Lord, make me chaste, but not yet.” He wrote that down himself. It’s in the book."], "r": ["He holds both: grace is unearned and the will is healed by it, not replaced. You try because you’ve been helped to want to.", "If it’s grace, trying is what receiving it looks like. A patient getting better also walks.", "He wrote it down so nobody could say he didn’t understand the objection."]}, {"b": "Our hearts are restless until they rest in God", "l": ["Restlessness is evidence of desire, not of what would satisfy it. Many traditions and none read the same longing differently.", "People are restless until lunch, too. Restless isn’t an argument, it’s a blood sugar level.", "The Confessions is the first memoir, and like all of them it’s about how wild he used to be."], "r": ["It’s a report first: he’d tried pleasure, career and philosophy, and says what happened. As an argument it’s an inference to what fits.", "And after lunch they’re restless again. That’s his observation.", "It’s addressed to God, for thirteen books. The author isn’t the hero of it."]}], "s": "☩︎"}, {"t": "Pascal's wager", "k": [{"b": "Betting on God is the rational choice", "l": ["The wager assumes one God to bet on. With many possible gods rewarding different things, including a god who punishes wagerers, the math gives no answer.", "Which God? There are a few thousand on the menu and most of them punish picking the wrong one. The odds got worse.", "Pascal’s wager works for every religion, which means it works for none."], "r": ["The wager was written for someone already torn between Christianity and unbelief. For that person only two options are live, and the argument is about those.", "Most of the thousands don’t punish honest seekers. The field narrows quickly once you read them.", "It works for any religion that offers infinite stakes and asks for sincere seeking. That’s a short list."]}, {"b": "Infinite reward outweighs any finite cost", "l": ["Infinite payoffs break expected value: any action with any chance of leading to belief gets infinite value too, so the rule recommends everything equally.", "I’ll offer infinite reward for five dollars. The math is the same. Pay up.", "It’s the argument a casino would make if casinos sold heaven."], "r": ["The argument can be run with a very large finite reward and gets the same answer. The infinity isn’t doing the work.", "He’s dead and can’t collect, so the offer isn’t from a con man. That’s the difference from yours.", "A casino takes your money now. This asks for decency and some Sundays."]}, {"b": "You can come to believe by acting as if you do", "l": ["Belief adopted for the payoff isn’t obviously the kind a God would reward, and deliberately inducing a belief you think unsupported is self-deception.", "An all-knowing God would notice the difference between faith and a hedge.", "Pascal’s plan is to fool God, who he believes knows everything."], "r": ["He doesn’t say fake it. He says remove the obstacles, which are habits and passions more than arguments, and see what you then find believable.", "It isn’t a hedge once it’s become your life. That’s how every commitment starts, including marriage.", "He’s proposing to seek a God who rewards seekers. Nothing’s being hidden."]}, {"b": "You have to bet; not choosing is choosing", "l": ["One can decline to treat the question as a gamble at all and go by the evidence. The forced-bet framing is part of what’s being sold.", "Not playing the lottery is also a bet, and it wins every week.", "Pascal invented probability theory and then used it for the worst bet in the book."], "r": ["You can decline the word “bet.” You can’t decline to live one way or the other, and the lives differ.", "The lottery charges for the ticket. Here not playing has the cost.", "He invented expected value and spotted the one case where it’s all-in."]}], "s": "⚁︎"}, {"t": "Agnosticism", "k": [{"b": "We can’t know whether God exists", "l": ["“Can’t know” is a strong claim about every possible argument and experience. Not knowing so far is all the evidence supports.", "He knows that nobody can know. That’s a lot to know for an agnostic.", "Agnostics are certain about one thing, which is that everyone else is too certain."], "r": ["Read it as “nobody now knows, and I can’t see how the available methods would settle it.” That’s modest, and it’s what Huxley meant by the word.", "I know the arguments on both sides and that neither closes. That’s knowledge about arguments.", "Certain of that, and I’ve checked more carefully than they have."]}, {"b": "Withholding judgment is the honest position", "l": ["Nobody withholds judgment on fairies or Zeus. Singling out one god for neutrality needs a reason beyond its popularity.", "He’s not agnostic about Thor. He made a call there. So it’s not about evidence, it’s about who’s at dinner.", "Agnosticism is atheism that wants to be invited back."], "r": ["Fairies and Zeus make claims we can check and they fail. A creator outside the universe makes none, and that’s why the verdict differs.", "Thor is supposed to cause thunder, and we found what does. The other question has no thunder to test.", "It’s the position that survives the dinner with either guest."]}, {"b": "Agnosticism is neutral between theism and atheism", "l": ["In practice the agnostic lives as though there’s no God, so the neutrality is in what’s said, not in what’s done.", "He doesn’t pray, doesn’t go, doesn’t tithe. That’s not the fence. That’s a yard.", "Fifty-fifty on God, zero-hundred on Sunday mornings."], "r": ["How one lives under uncertainty and what one believes are different questions. A juror who hasn’t convicted hasn’t declared the defendant innocent.", "I also don’t act on string theory. That isn’t denying it.", "Zero-hundred on Sunday mornings is a fact about mornings."]}, {"b": "The question is beyond human reason", "l": ["That’s a substantive claim about the limits of reason, and it’s been argued against by theists and atheists who think reason reaches further.", "“Beyond reason,” he reasoned.", "Agnosticism is “I’m not really a politics person,” for the universe."], "r": ["It’s a conclusion drawn after watching the best arguments on both sides stall for two thousand years. Hume and Kant got there by reasoning.", "Reason working out where it runs out is reason at its best.", "It’s the only answer that’s gotten truer the longer people have argued."]}], "s": "(?)"}, {"t": "New Atheism", "k": [{"b": "Religion is a delusion", "l": ["Calling belief held by most humans in history a delusion stretches a clinical word past use. It explains nothing about why belief is so common or what it does.", "If most of the species has it, it’s not a delusion, it’s a feature. That’s how the word works.", "The God Delusion was written by a biologist who refuses to read theology and can tell."], "r": ["The word was chosen to provoke. The claim under it is ordinary: a belief held without good evidence and protected from criticism by custom.", "Most of the species believed the sun went round the earth. Popular and mistaken go together fine.", "You don’t need a degree in fairyology to doubt fairies."]}, {"b": "Faith is belief without evidence", "l": ["Most religious traditions define faith as trust, and offer arguments and testimony. The definition wins by choosing the opponent’s position for them.", "Everyone takes most of what they know on trust from people they’ve never met. He believes in Australia.", "New Atheists define faith as being stupid and then prove that being stupid is bad."], "r": ["When believers are asked what would change their minds, the usual answer is “nothing.” That’s the sense of faith being criticized, and it’s theirs.", "Australia can be visited. That’s the difference between trust and faith.", "It’s defined the way the Letter to the Hebrews defines it: the evidence of things not seen."]}, {"b": "Religion poisons everything", "l": ["The claim ignores the hospitals, universities, art and abolitionists. A fair account would have to weigh both columns, and this one doesn’t try.", "Everything includes Bach, the university system and most of the charity on earth. Some poison.", "“Religion poisons everything,” published in the same decade the New Atheists split over everything else."], "r": ["The good done by believers is real. The question is whether the belief was needed for it, and secular hospitals and charities suggest it wasn’t.", "Bach would have written for whoever was paying. Then it was the church.", "People who think for themselves disagree with each other. That’s the selling point."]}, {"b": "Science and religion are at war", "l": ["Historians of science abandoned the conflict thesis long ago. Most of the people who built modern science were believers and saw no war.", "The war is news to Mendel, who was a monk, and to the Vatican, which has an observatory.", "The Four Horsemen held one two-hour conversation in 2007 and people called it a movement."], "r": ["Individual scientists believed. The methods still conflict: one revises on evidence and the other holds doctrines no evidence may touch.", "Mendel did his science in the garden and his faith in the chapel and never mixed the two. That’s the point.", "One conversation and a decade of bestsellers. Some movements need less."]}], "s": "Ⅳ"}, {"t": "Intelligent design", "k": [{"b": "Some biological systems are irreducibly complex", "l": ["Parts can evolve for one function and be co-opted for another. The textbook examples, including the flagellum, have plausible stepwise histories.", "The eye is very complicated, and also has a blind spot and is wired backwards. If that’s design, the designer was learning.", "“Irreducibly complex” means the author couldn’t think of how, and then biologists did."], "r": ["A possible pathway isn’t a demonstrated one. The proposals for the flagellum borrow parts that are themselves complex and need explaining.", "A camera with a blind spot is still a camera. Poor design is design.", "“They couldn’t think how either” is still the published state of several of those systems."]}, {"b": "Design is the best explanation of biological information", "l": ["The inference rests on probability calculations that ignore selection, which is exactly the process that makes improbable arrangements accumulate.", "A watch implies a watchmaker. Watches don’t have babies. That’s the difference, and it’s the whole difference.", "The designer made 400,000 species of beetle and one that can read the argument."], "r": ["Selection needs something that already copies itself. The origin of the first code is where the inference is strongest, and selection can’t be invoked there.", "Cells have babies, and they need the watch already working to do it. That’s the problem.", "A designer fond of beetles. You’re criticizing the taste, which concedes the designer."]}, {"b": "It’s science, not religion", "l": ["It makes no testable predictions about the designer or the method, and a US federal court found it to be creationism relabeled, after reading the drafts.", "A court read the textbook’s early drafts. The word “creationists” had been find-and-replaced. One time it was replaced halfway.", "Intelligent design is creationism in a lab coat it bought online."], "r": ["It predicted that “junk” DNA would turn out to have functions, and much of it has. A judge is no authority on what counts as science.", "A publisher’s sloppy editing isn’t an argument about the flagellum.", "The lab coat fits. Several of them have the doctorates."]}, {"b": "Evolution can’t explain the Cambrian explosion", "l": ["The “explosion” took tens of millions of years, has precursors in earlier fossils, and has ordinary explanations in ecology and genetics.", "The explosion took about twenty million years. That’s the slowest explosion ever recorded.", "Every gap in the fossil record is a miracle until someone finds the fossil, and then there are two gaps."], "r": ["Twenty million years is short for the appearance of nearly every animal body plan, and the precursors are few and disputed.", "For the origin of every major animal design, twenty million years is an explosion.", "The big gap is still there, and it’s the same one Darwin worried about."]}], "s": "⚙︎"}, {"t": "Calvinism", "k": [{"b": "God predestines who is saved", "l": ["If the choice was made before anyone was born and nothing we do affects it, punishment for unbelief punishes people for what they couldn’t have done.", "Then it doesn’t matter what anyone does, including being a Calvinist. He’s handing out a theology that says handing it out changes nothing.", "Calvinism: God decided before the universe began, and you still have to come on Sundays."], "r": ["People act from their own wills and are judged for what they willingly do. That the will’s direction was foreknown and ordained doesn’t make the act someone else’s.", "God ordains the means too. The preaching is how the chosen get called, which is why it’s done.", "You don’t know which you are. So yes, Sundays."]}, {"b": "Humans are totally depraved", "l": ["If human judgment is wholly corrupted, so is the judgment that it’s corrupted, and the reading of scripture that supports it.", "If every human faculty is corrupt, so is the one he used to work that out.", "Total depravity is a doctrine people apply mainly to others."], "r": ["“Total” means every faculty is affected, not that each is destroyed. Reason still works. It’s bent toward what we want to be true.", "He worked it out from scripture, which is why the doctrine says not to trust yourself.", "It’s applied to oneself first. That’s the first page of the catechism."]}, {"b": "Grace is irresistible", "l": ["Grace that can’t be refused makes faith something done to a person. It’s hard to see what love or obedience mean when there was no alternative.", "An offer that can’t be refused is not called grace in any other context.", "Irresistible grace, and yet somehow most people have resisted it."], "r": ["Grace changes what a person wants, so they come willingly. Being made able to love isn’t being forced to.", "A blind man given sight isn’t said to have been coerced into seeing.", "The claim is about those it’s given to. It was never that everyone gets it."]}, {"b": "God’s sovereignty means nothing is outside his will", "l": ["Then the evils are his will too. Distinguishing what God wills from what he merely permits brings back the freedom the system removed.", "If everything is God’s will, so is the guy disagreeing with Calvin. Take it up with management.", "Calvin believed in salvation by faith alone and had a man burned in Geneva for getting the Trinity wrong."], "r": ["Scripture says both: the same act is meant by men for evil and by God for good. The doctrine keeps both and doesn’t claim to see how they join.", "It is. And so is my answering him. The system has room for arguments.", "A city council burned him, as every city in Europe then would have. Calvin asked for a quicker death and was refused."]}], "s": "⇣︎"}, {"t": "Mysticism", "k": [{"b": "Direct experience of the divine is a source of knowledge", "l": ["Mystics in different traditions report experiences that fit their own doctrines. The experience may be real and its interpretation still unsupported.", "Christians see Christ and Hindus see Krishna. Nobody’s ever had a vision of somebody else’s god. That’s a clue.", "Mystical experience always confirms the religion of whoever’s having it."], "r": ["The interpretations differ and the core reports don’t: loss of the boundary of self, a sense of unity, certainty. That’s what one would expect if something is being met and then described.", "People describe the same mountain in different languages. Nobody concludes there’s no mountain.", "The experience comes first and the vocabulary after. You’d reach for your own words too."]}, {"b": "The experience is ineffable", "l": ["If nothing can be said about it, nothing can be claimed on its basis either. Yet mystics say a great deal, including that it supports their creed.", "It can’t be put into words, and here’s the book.", "Ineffable: four hundred pages, three volumes, available in paperback."], "r": ["It means words fall short, as they do for music. The books describe the approach and the effects and say so on every page.", "The book is directions. Nobody thinks the map is the city.", "Four hundred pages saying “this isn’t it, go and see.”"]}, {"b": "All mystics are describing the same reality", "l": ["The reports differ on essentials: union or communion, a personal God or an impersonal void. The sameness is imposed by the collector.", "One says everything is one, another says there’s nothing, another met a person. Those are three different things. Count them.", "All mystics agree, once the parts where they disagree are called “cultural.”"], "r": ["Scholars separate the experience from the report. The stripped-down descriptions from unrelated traditions match more closely than their theologies do.", "Three people describe an elephant in the dark. Count the elephants.", "That’s a fair summary of comparative method in any field."]}, {"b": "It can’t be judged by ordinary reason", "l": ["A source of knowledge that’s exempt from checking is one nobody else has reason to trust, however vivid it was from the inside.", "“You can’t judge it rationally” is also the defense for every bad decision made at 3 a.m.", "The same states are available from fasting, drums, or a mushroom, and the mushroom is faster."], "r": ["It can be judged by its fruits, which is the traditions’ own test: what the person is like afterwards. That’s a public check.", "The decision at 3 a.m. doesn’t leave people kinder for forty years.", "The mushroom route gets the same reports. That suggests there’s something there to get to."]}], "s": "✦︎"}]}, {"n": "The East", "s": "道", "t": [{"t": "Buddhism", "k": [{"b": "There is no self", "l": ["Without a self, karma and rebirth have nobody to carry them. The answer is causal continuity, and then responsibility across lives is as puzzling as before.", "If there’s no self, nobody is enlightened, because there’s nobody to be. The Buddha achieved something for no one.", "No self, but somebody keeps getting reborn."], "r": ["A flame passed from candle to candle is neither the same flame nor a different one. Continuity without an owner is the teaching itself.", "Right. Enlightenment is the end of the idea that somebody needed to achieve something. You’ve stated the doctrine as an objection.", "A wave keeps arriving too. No particular water travels."]}, {"b": "Desire is the root of suffering", "l": ["A lot of suffering, like pain, loss and injustice, doesn’t come from craving, and a life without attachments also lacks much of what makes lives good.", "Wanting to end desire is a desire. So the path is powered by the thing it’s getting rid of, like a car that runs on having no car.", "The cure for wanting things is wanting nirvana."], "r": ["The first arrow is pain and the second is what the mind adds: resistance, grasping, the story about it. The teaching is aimed at the second arrow.", "A raft is for crossing the river. You leave it on the far bank. The desire for the path gets dropped last, and the texts say so.", "And when you get there you put that one down too. It’s a ladder."]}, {"b": "It’s a philosophy, not a religion", "l": ["Historical Buddhism has rebirth, heavens and hells, merit, relics, prayer and monasteries. The “philosophy” reading is a modern Western edit.", "It has monks, temples, hells, saints, and a founder born out of his mother’s side. That’s the full set.", "Buddhism is a religion in Asia and a personality in California."], "r": ["Fair, historically. The arguments about self, causation and suffering stand without the cosmology, and the tradition has always graded its own teachings by level.", "Monks, temples and saints is also a description of a university.", "And Christianity is a religion in Rome and a personality in Texas."]}, {"b": "Meditation reveals the nature of mind", "l": ["What trained meditators find is shaped by the doctrine the training teaches. Agreement among them may show shared instruction.", "Staring at the inside of your eyelids reveals the inside of your eyelids.", "Mindfulness went from ending rebirth to getting through a quarterly review."], "r": ["Then compare across traditions with different doctrines. They report the same instabilities of attention and the same passing of sensations, described in rival vocabularies.", "You’ve looked at them for ten seconds. Try ten days and report back.", "The Buddha taught kings, merchants and soldiers who went back to work. It was always for people with jobs."]}, {"b": "Everything is empty of intrinsic existence", "l": ["If everything is empty, so is the doctrine. Its defenders accept that, and critics have long replied that a thesis which denies its own standing can’t refute anything.", "If nothing has intrinsic existence, emptiness doesn’t either, so things are full again. It cancels.", "Schopenhauer read two translations, and Western Buddhism has been him ever since."], "r": ["He says he holds no thesis, and that emptiness is empty too. It works like medicine that leaves the body along with the illness it cleared.", "Empty means dependent on other things. Emptiness depends on there being things. So it’s empty, and nothing fills back up.", "He read two translations and still got the first noble truth right."]}], "s": "☸︎"}, {"t": "Daoism", "k": [{"b": "The Dao that can be told isn’t the eternal Dao", "l": ["A teaching that disowns statement can’t be assessed or told apart from having no content. The text goes on to make many definite claims anyway.", "Then the first line is wrong, because it just told it. The book refutes itself in line one and keeps going.", "The Dao can’t be put into words, and there are 81 chapters of words about it."], "r": ["It says the told Dao isn’t the constant one. It doesn’t say telling is useless. The words are a finger pointing, and the chapters keep saying so.", "The first line is a warning label. You read the label and then complained there’s a product.", "Five thousand characters. It’s the shortest scripture there is. He was trying."]}, {"b": "Wu wei: act without forcing", "l": ["As advice it can’t fail. Success shows the flow, failure shows forcing, and nothing tells trained spontaneity from doing nothing.", "Nothing was ever built by not forcing. The Great Wall was a lot of forcing.", "Wu wei is procrastination with a lineage."], "r": ["It’s a claim about skill: the cook’s knife that never dulls because it goes through the gaps. The difference between forcing and fitting is visible in any craft.", "The Great Wall didn’t keep anyone out. Water got around it. That’s the example.", "Procrastination is forcing yourself not to. Different thing entirely."]}, {"b": "Opposites depend on each other", "l": ["That the ideas come in pairs doesn’t show the things are balanced or that preferring one is a mistake. Health doesn’t need disease.", "By that logic the cure for being poor is that rich people exist. It’s been tried.", "Yin and yang is “it is what it is” with a logo."], "r": ["The point isn’t that all preferences are mistakes. It’s that pushing one side to its limit produces the other, as with strength that becomes brittleness.", "High needs low the way a door needs the empty part. The emptiness is the bit you use.", "It is what it is. You say that like you’ve found a flaw."]}, {"b": "The useless tree lives longest", "l": ["The parable is a survival plan for one person under bad rulers. Made general, it rides free on everyone who does carry a load.", "The useless tree lives longest because nobody wants it. That isn’t wisdom, that’s being picked last.", "Zhuangzi dreamed he was a butterfly, and people have been pretending it’s a hard question since."], "r": ["Zhuangzi’s target is usefulness on other people’s terms. The tree gives shade and shelter. It just can’t be made into someone’s coffin.", "Picked last and still standing. The ones picked first are furniture.", "It is a hard question. You’ve had 2,300 years."]}, {"b": "The best government barely governs", "l": ["The ideal village keeps people ignorant and at home. As politics it has no account of defense or disputes beyond hoping they won’t come up.", "“The best ruler does nothing.” Every country has tried a ruler who did nothing. They have a different word for it.", "Daoism is anarchism for people who nap."], "r": ["The ideal is a ruler whose people say “we did it ourselves.” As a limit on meddling it’s the oldest statement of an idea that later got very popular.", "A ruler who does nothing and has things run well is called a good ruler. The ones you’re thinking of did plenty, all of it for themselves.", "Naps are good. That was in the argument."]}], "s": "☯︎"}, {"t": "Confucius", "k": [{"b": "Ritual cultivates virtue", "l": ["Ritual trains conformity just as easily. The Mohists objected early that elaborate rites waste resources and serve whoever is at the top.", "If ritual made people good, the most ceremonial institutions would be the most honest. Think about weddings, and then the DMV.", "Confucius is “sit up straight” as a civilization."], "r": ["He says ritual without feeling is empty, repeatedly. The claim is that shared forms are how feeling gets trained and shown. Even the Mohists kept funerals.", "The DMV has procedure, which is ritual with the meaning taken out. That’s what he warned about.", "Sit up straight, look at people when they talk, show up for the dead. It’s held up."]}, {"b": "Filial piety is the root of virtue", "l": ["Putting family loyalty first collides with impartial justice. The Analects praises a son who covers for his father’s theft.", "Parents are assigned by lottery. A morality rooted in whoever you happened to get is astrology with chores.", "Confucius said a good son covers for his dad stealing a sheep. It’s in the book."], "r": ["The same text has him tell sons to remonstrate with a father who does wrong. The sheep passage is about whether a child should be the state’s informant.", "Everyone gets a family before they get a theory. Morality has to start where people start. Yours begins with strangers and never arrives home.", "He said the son doesn’t testify against his father. Most legal systems now agree. It’s called privilege."]}, {"b": "Moral example governs better than law", "l": ["Counting on a ruler’s virtue offers no remedy when he lacks it. The Legalists’ complaint was that institutions have to work with ordinary people.", "He tried it. He went from state to state for fourteen years offering to be the moral example, and nobody hired him.", "Confucius spent fourteen years looking for a government job and didn’t get one. Then he taught."], "r": ["He wanted both. Laws alone make people evasive, and laws plus rulers worth copying give them a sense of shame. The Legalist state lasted fifteen years.", "Nobody hired him, and then his students ran the civil service for two thousand years. Slow start.", "And then he taught. That’s where the two thousand years came from."]}, {"b": "Harmony comes from everyone filling their role", "l": ["An ethics of roles has trouble criticizing the roles. Ruler over subject and husband over wife are built in.", "Every role-based harmony has one man at the top explaining that harmony means staying where you are.", "“Know your place” doesn’t get deeper by being 2,500 years old."], "r": ["Roles bind upward too: a ruler who fails his role stops being a ruler. Mencius drew the conclusion that such a man may be removed.", "He told the men at the top that the name “ruler” has to be earned. That’s why none of them hired him.", "Your place includes telling the ruler he’s wrong. It’s in the job description."]}, {"b": "The Analects is a guide to living well", "l": ["It’s a collection of sayings put together over generations, tied to lost contexts and often opaque. Most of the guidance comes from later commentary.", "It’s a list of things a teacher said, written down by students who liked him. Every teacher has one. Most are on Rate My Professors.", "Half the things Confucius said, he didn’t. The other half are “respect your elders.”"], "r": ["A book of remembered conversations is the form the teaching took, because it was about situations. The opacity is what any context-bound advice looks like out of context.", "The ones on Rate My Professors didn’t get an examination system built on them.", "And you can quote two of them, which is two more than most philosophers get."]}], "s": "仁"}, {"t": "Advaita Vedanta", "k": [{"b": "Only Brahman is real; the world is appearance", "l": ["If the world is illusion, so are the scriptures, the teacher and the argument. The system has to climb a ladder it says isn’t there.", "If the world is illusion, so is the book that says so. It’s an illusion telling an illusion about illusion.", "The world is unreal, said the teacher, and then looked both ways."], "r": ["The tradition has two levels of truth. Teacher and scripture are real at the everyday level and are used to reach the higher one, like a thorn to remove a thorn.", "A dream tiger can wake you up. The book is one of those.", "At the everyday level traffic is real. He never said to ignore it."]}, {"b": "The self is identical with the absolute", "l": ["If individual selves are really one, it’s unexplained who is ignorant and who gets liberated. Ignorance can’t belong to Brahman or to nobody.", "If I’m already the absolute, there’s nothing to do, and the course is twelve years long.", "You are God, and so is the guy who cut you off in traffic. Enlightenment is being fine with that."], "r": ["Ignorance has no beginning and no owner you can find. Asking whose it is, is like asking where the darkness went when the lamp was lit.", "Nothing to do, and twelve years to notice it. Seeing what’s already the case can take that long.", "Being fine with that is the hard part. That’s why it’s called a path."]}, {"b": "Ignorance is what makes us see many where there is one", "l": ["Ignorance needs someone to have it. Locating it in Brahman makes the absolute deluded, and locating it in the individual assumes the many it was to explain.", "Whose ignorance? If there’s only one thing, it’s the one that’s confused. The absolute has a problem.", "Maya is the answer to every objection. That’s an objection."], "r": ["It’s called indescribable for that reason: it can’t be put in either place. The school names the difficulty and builds it into the teaching.", "From the absolute’s side there never was any. The problem appears only from where you’re asking.", "It’s an objection the tradition wrote down first, a thousand years ago, and answered at length."]}, {"b": "Liberation is realizing what you always were", "l": ["A change that changes nothing is hard to tell from no change. If knowledge alone frees, it’s unclear why the knowledge is so rarely enough.", "If I always was it, nothing happened. He’s charging for a receipt.", "Advaita is the oldest way of saying “it was inside you all along.”"], "r": ["The change is the falling away of a mistake. A man who thought a rope was a snake changes a great deal when he sees it, and the rope doesn’t.", "A receipt for something you had and were terrified you’d lost. People pay a lot for that.", "It’s the oldest way of saying it because it keeps being what people find."]}], "s": "ॐ"}, {"t": "Zen", "k": [{"b": "Enlightenment is beyond words and scriptures", "l": ["The tradition that says so has one of the largest literatures in Buddhism, with lineages, commentaries and canonical records of what masters said.", "A tradition outside words with ten thousand koans, written down, with official answers.", "Zen says truth can’t be written, across about four hundred years of writing."], "r": ["The texts are records of people being pointed past texts. A library of fingers pointing at the moon isn’t a claim that the moon is made of fingers.", "Ten thousand ways of saying “not this.” It takes that many.", "Four hundred years of writing down what can’t be written. Persistence counts."]}, {"b": "Koans break the grip of conceptual thinking", "l": ["Koan practice is highly conventional. Standard responses are taught and checked, which is a curriculum, not an escape from concepts.", "There are answer books. Monks pass them around. It’s conceptual thinking with a cheat sheet.", "What is the sound of one hand clapping? There’s a traditional answer. It’s on the exam."], "r": ["The standard responses are the floor. A teacher can tell a memorized answer from one that’s been seen through, and that’s what the interview is for.", "Monks who use the cheat sheet get sent back. The teacher has read it too.", "And reciting it fails the exam."]}, {"b": "Just sitting is itself enlightenment", "l": ["If sitting is already enlightenment, nothing distinguishes the master from the novice, and the long training and certification have no point.", "If sitting is enlightenment, everyone at the DMV has attained it.", "Zen is doing nothing in an extremely specific way for thirty years."], "r": ["Practice and realization are one, on that view. The training exists because sitting with nothing extra, no aim and no escape, is the hardest thing a person does.", "Everyone at the DMV is trying to be somewhere else. That’s the difference.", "Thirty years to do one thing without adding anything. You try it for ten minutes."]}, {"b": "Zen is pure experience, free of dogma", "l": ["Historical Zen is a monastic institution with rituals, hierarchy and doctrine. The dogma-free version was assembled for export in the twentieth century.", "It has robes, ranks, a founder, chanting and a guy who hits people with a stick. That’s a full religion.", "Zen arrived in America as “no rules,” which was news to the monasteries."], "r": ["True of the institution. The teaching inside it keeps undercutting its own forms, which is why the tradition tells stories about burning the statues.", "A full religion that tells you to kill the Buddha if you meet him.", "The monasteries have rules so that nothing else has to be decided."]}], "s": "◯︎"}, {"t": "Karma & rebirth", "k": [{"b": "Actions bring their fitting results", "l": ["As a law of nature it has no mechanism and no evidence. As a moral claim it implies that those who suffer earned it, which few can accept looking at a sick child.", "Bad things happen to good people on the news every night. The law has a lot of exceptions for a law.", "Karma is “what goes around comes around,” with a schedule nobody can check."], "r": ["Read psychologically it needs no cosmic machinery: acts form habits, habits form character, and character meets its own results. That’s the oldest layer of the teaching.", "The law doesn’t say when. A seed doesn’t come up the day it’s planted.", "The schedule is the length of a habit."]}, {"b": "We are reborn according to our deeds", "l": ["Without memory or continuity of character, it’s unclear in what sense the one reborn is the one who acted, or why the consequences are just.", "If I can’t remember it, somebody else did it. I’m doing his time.", "Everyone who remembers a past life was royalty. Nobody was the guy who carried the royalty’s water."], "r": ["The same puzzle holds within one life. The child who earned the scar isn’t the adult who carries it, and we don’t call that unjust.", "You don’t remember being three, and you still have that kid’s teeth and his fear of dogs.", "In the texts most past lives are as animals and servants. Royalty is the Western edition."]}, {"b": "Karma explains inequality and suffering", "l": ["Any outcome can be explained by an unobservable past life, so the explanation risks nothing. It has also served to justify leaving hierarchies alone.", "It explains everything, in the sense that nothing could show it wrong. So does “a wizard did it.”", "“They must have done something in a past life” is the oldest way of not helping."], "r": ["The teaching says the reverse about helping: another’s suffering is your chance to act well, and what you do about it is your own karma.", "It explains the past and leaves the next act entirely to you. A wizard doesn’t do that.", "That reading is condemned in the texts. Not helping is an act with results."]}, {"b": "There are cases of children recalling past lives", "l": ["The case collections rely on testimony gathered after families had talked, in cultures that expect such memories. Controlled verification is absent.", "The memories show up in countries that believe in rebirth and nowhere else. Souls apparently respect borders.", "The evidence for reincarnation is anecdotes, and the anecdotes have reincarnated many times."], "r": ["The strongest files have statements written down before the families met, and details later verified. Few, and they exist.", "They get reported where reporting them doesn’t cost you your reputation.", "Each anecdote has a name, an address and a file. That’s called a case series."]}], "s": "↺︎"}, {"t": "Sun Tzu", "k": [{"b": "All warfare is based on deception", "l": ["Deception matters, but logistics, numbers and industry decide most wars. A theory centered on cleverness flatters the reader.", "Wars are won by the side with more trucks. There’s no chapter on trucks.", "The Art of War is thirteen chapters of “be smarter than the other guy.”"], "r": ["Logistics gets two of the thirteen chapters. Deception is how the smaller force makes numbers matter less, which is who the book was for.", "There’s a chapter on supply. He says an army without its baggage train is lost.", "Every plan that works is that. The book says how to check whether you are."]}, {"b": "The supreme art is to win without fighting", "l": ["It’s an attractive ideal with few instructions attached. Opponents who could be beaten without fighting weren’t much of a problem to begin with.", "If you can win without fighting, the other side was losing anyway. He’s taking credit for the weather.", "“Win without fighting” is great advice, right up there with “buy low, sell high.”"], "r": ["The instructions are there: attack the enemy’s plans first, then his alliances, then his army, and cities last. It’s an order of priorities.", "Arranging things so the other side is losing before the fight is the skill. That’s the weather he’s taking credit for.", "“Buy low” is also correct. Almost nobody does it."]}, {"b": "Know your enemy and know yourself", "l": ["True and nearly empty. It tells a commander to have good information without saying how, which is the entire difficulty.", "“Have all the information” is not strategy. It’s what strategy is for when that didn’t happen.", "Know yourself, know your enemy, and you’ll never lose. Unfalsifiable: if you lost, you didn’t know."], "r": ["The book says how: use spies, measure terrain, count provisions, watch the dust. The maxim is the heading and the chapters are the content.", "It’s what strategy is, and there’s a chapter on getting it, with five kinds of spy.", "It says you’ll never be in peril. Losing a battle and being ruined are different, and he’s careful about it."]}, {"b": "Its lessons apply to business and life", "l": ["The maxims are general enough to fit anything, which is why they fit quarterly sales as easily as siege warfare.", "A book that applies to war, marketing, dating and golf is a horoscope.", "Sun Tzu may not have existed, which is the one piece of deception that definitely worked."], "r": ["It applies wherever there’s an opponent, limited resources and uncertainty. The business readers go wrong by skipping the half about restraint.", "A horoscope doesn’t tell you to count your supplies before you start.", "Thirteen chapters appearing from nowhere and fooling everyone for 2,500 years would be the best campaign in the book."]}], "s": "兵"}, {"t": "The Bhagavad Gita", "k": [{"b": "Act without attachment to the fruits of action", "l": ["Complete indifference to results would make it impossible to choose between actions, since their results are how they differ.", "If the results don’t matter, there’s no reason to do one thing over another. He’s detached all the way to the couch.", "Do your job and don’t think about the outcome. Management loves this book."], "r": ["It says to give up the claim on results. You still aim the arrow as well as you can, and you don’t make your peace depend on where it lands.", "You do it because it’s yours to do. That’s a reason, and it gets people off couches.", "Management quotes one verse. The book has seven hundred."]}, {"b": "Do the duty of your station", "l": ["The duty in question comes from birth into a class. The ethic tells each person to stay in their assigned role, which is what its critics have always pointed out.", "“Better your own duty done badly than another’s done well.” Convenient for whoever handed out the duties.", "The Gita’s answer to “should I do this?” is “what were you born as?”"], "r": ["The same text says the divisions follow qualities and conduct, and reformers from inside the tradition have read it against birth for centuries.", "It was said to a prince who wanted to resign and become a monk. Convenient for nobody in the scene.", "It answers “what are you fitted for and what’s in front of you?” Read on a chapter."]}, {"b": "Arjuna must fight, though it means killing his kin", "l": ["The argument that the soul can’t be killed, so killing isn’t really killing, would excuse any killing whatever.", "“Nobody really dies, so go ahead” is an argument that works for every war and every murder. It proves too much by a lot.", "A man doesn’t want to kill his family, and God talks him into it. That’s the plot."], "r": ["That verse is one argument of many. The main one is that he’s a soldier in a war he didn’t seek, all negotiation has failed, and walking away abandons the people depending on him.", "Krishna tried to prevent the war first and failed. It’s the argument for after diplomacy.", "A man is frozen on the worst day of his life and someone tells him how to act without hatred. That’s the plot."]}, {"b": "There are many paths to the same goal", "l": ["Paths of knowledge, devotion and action rest on different pictures of what’s ultimately real. Calling them one goal papers over the difference.", "If every path gets there, there’s no reason to take the hard one, and the book is eighteen chapters of the hard ones.", "Oppenheimer quoted it at the bomb test. That’s the most famous application."], "r": ["The paths suit temperaments: the thinker, the lover, the worker. One mountain and several trails is the plain reading.", "The path that’s easy for you is hard for someone else. That’s why there are three.", "He quoted the verse about time. He read it in Sanskrit, and reported that it helped."]}], "s": "➶︎"}, {"t": "Mindfulness", "k": [{"b": "Paying attention to the present moment reduces suffering", "l": ["The measured benefits are modest, about what other active treatments give, and the early studies were small and poorly controlled.", "The studies say it works about as well as going for a walk. The walk is free and gets somewhere.", "Mindfulness is noticing that you’re stressed, for ten minutes, on an app with a subscription."], "r": ["“About as well as other treatments” for depression relapse, with no drug and no side effects, is a good result. The early hype was the problem.", "A walk where you notice the walk is the practice. You’ve described it.", "Ten minutes of noticing is ten more than most people manage."]}, {"b": "It’s Buddhism’s insight without the religion", "l": ["What was removed is the ethics and the goal. A technique meant to end attachment was repurposed to make people better at their attachments.", "They kept the breathing and dropped the part about giving everything up. That’s keeping the wrapper.", "Mindfulness was designed to end the self, and got sold as self-care."], "r": ["The clinical programs were designed to carry the ethics implicitly and reach people who’d never enter a temple. Whether that worked is fair to debate.", "People who start with the breathing often go looking for the rest. It’s a door.", "Seeing what the self is up to turned out to be good for it."]}, {"b": "Observe your thoughts without judging them", "l": ["Sometimes thoughts deserve judgment, and distress is a signal about one’s situation. Non-judgment can turn a real problem into a private attitude adjustment.", "“Don’t judge your thoughts” is a judgment about thoughts. He failed in the instructions.", "If your job is making you miserable, mindfulness will help you notice that calmly and stay."], "r": ["Not judging is a method for the cushion. You see the thought clearly first, and what to do about it is decided afterwards, better informed.", "It’s an instruction for twenty minutes. You get your opinions back afterwards.", "People who see clearly that the job is making them miserable tend to leave."]}, {"b": "It belongs in schools and workplaces", "l": ["Offered by employers, it puts the burden of coping on the individual and leaves the conditions causing the stress as they were.", "The company that causes the stress pays for the class about the stress. It’s cheaper than fixing anything.", "Corporate mindfulness: breathe through the layoffs."], "r": ["Both can be true: fix the conditions and teach the skill. People under stress that won’t be fixed this year still have to get through this year.", "Teach it and fix things. The class wasn’t the reason nothing got fixed.", "Breathing through a layoff beats not breathing through it."]}], "s": "∙︎"}]}, {"n": "Continental", "s": "∅︎", "t": [{"t": "Nietzsche", "k": [{"b": "God is dead and we must create our own values", "l": ["If values are made by will, nothing ranks the creator’s above the herd’s except the creator saying so. Revaluing values presupposes a standard.", "Created values are called preferences. He announced the death of God and replaced it with a mood board.", "“God is dead.” Nietzsche’s dead too, and God has more followers."], "r": ["He ranks them by a standard he does state: whether a way of valuing strengthens life or sickens it. You can dispute it, and it isn’t “because I said so.”", "A preference is what you have about soup. A value is what you’d reorganize a life around. He knew the difference, and that was the whole worry.", "He predicted the followers. He said the shadow would be shown in caves for centuries."]}, {"b": "Master morality is healthier than slave morality", "l": ["The Genealogy is speculative psychology and word history presented as history, and that a morality grew from resentment says nothing about whether it’s right.", "The slaves won. By his own standard, winning is what the strong do. So slave morality is master morality and the book is over.", "Nietzsche fans have never once pictured themselves as the herd."], "r": ["He agrees origins don’t settle validity and says so. The history is there to break the assumption that these values have always been obvious.", "Winning by making strength ashamed of itself is the thing he was describing. You’ve summarized the book and called it a refutation.", "He says the reader is the herd. In the preface. You were warned."]}, {"b": "He was no proto-Nazi; his sister distorted him", "l": ["The editing was real and he despised nationalism. Still, the praise of rank and breeding and the contempt for equality are his own, and they made the theft easy.", "When that many people misread a writer the same way, that’s the reading.", "Misunderstood by everyone except whoever’s explaining him."], "r": ["His aristocratism is of spirit and is aimed at Germans above all. He broke with Wagner over antisemitism and called nationalism a sickness. The theft needed forgery.", "They had to delete and rearrange him to get that reading. A reading that needs scissors is not the reading.", "And the people who “understood” him had to edit the books first."]}, {"b": "The will to power explains life", "l": ["As psychology it can’t be tested, since any motive can be redescribed as power. As metaphysics it rests mostly on notebooks he didn’t publish.", "Sloths. A whole animal that refutes it.", "The will to power is a self-help book the author decided not to publish."], "r": ["In the published books it’s mostly a psychological hypothesis, offered against the idea that people chiefly seek pleasure or survival. He put it forward as an experiment.", "A sloth owns its niche so completely that nothing bothers to compete. That’s power with no wasted motion.", "The book of that name was assembled by his sister. He’d abandoned the project."]}, {"b": "Live so you’d will it all again", "l": ["As cosmology it fails, and as a test it’s empty. A contented tyrant passes, and it can’t tell better lives from more self-satisfied ones.", "If everything recurs exactly, nobody remembers, so nothing changes, so it’s the same as not recurring. He invented a thought experiment with no difference in it.", "He printed forty copies of the last part of Zarathustra and found seven people to send it to."], "r": ["It isn’t a test of whether a life is good. It’s a test of whether you affirm yours, and a tyrant who passes has shown something about himself.", "If nobody could tell, the only question left is whether you’d say yes. That’s the difference. It’s in you.", "Seven readers. Now there’s a shelf of him in every bookstore, and you’re the one counting."]}], "s": "↯︎"}, {"t": "Kierkegaard", "k": [{"b": "Truth is subjectivity", "l": ["Passionate inwardness doesn’t discriminate between its objects. The fanatic has the “how” as fully as the knight of faith.", "If truth were subjectivity, being really into something would make it true. Sports fans would win every game.", "“Truth is subjectivity” is “that’s my truth” in Danish."], "r": ["He doesn’t say sincerity makes a belief correct. He says that for the questions of how to live, the relation you take is part of what’s being asked.", "Fans don’t stake their lives on it. Passion in his sense is what’s left when being wrong would cost you everything.", "“My truth” asks nothing of you. His asks for all of it."]}, {"b": "The leap of faith is beyond reason, not against it", "l": ["If nothing rational constrains the leap, there’s no reason to leap toward Christianity over anything else. The choice is arbitrary by design.", "A leap with no reasons is called falling.", "The leap of faith is jumping to the conclusion and calling the jump the point."], "r": ["The leap isn’t picking a creed off a shelf. It’s what’s left when the evidence runs out and living still requires a decision, which is everyone’s position.", "Falling is what happens when you didn’t choose. He’s describing the half-second before, when you could still step back.", "You jumped to that one."]}, {"b": "Abraham shows the ethical can be suspended", "l": ["If a private command from God can suspend ethics, nothing tells the knight of faith from a murderer. Kierkegaard states that problem and doesn’t solve it.", "A man who hears a voice telling him to kill his son and saddles the donkey isn’t suspending the ethical. He’s a case file.", "Fear and Trembling is 150 pages defending a man the police would like a word with."], "r": ["Right, and that’s the book. It was written to make faith terrifying again for readers who thought they had it for the price of a pew.", "That’s what his own pseudonym says: either he’s a murderer or the ethical isn’t the highest. He doesn’t let you off with the first.", "The author can’t sleep over it either. That’s the title."]}, {"b": "The crowd is untruth", "l": ["Lonely conviction has no better record than shared judgment. Science and law use public checking because individuals fool themselves.", "The crowd is who decided Kierkegaard was important. He’d have to throw that out.", "He published under a dozen fake names so he could disagree with himself and still win."], "r": ["The claim is narrower: a crowd can’t repent, love or die for you. Where the task is becoming a self, numbers have no vote.", "The crowd also laughed him out of Copenhagen in the papers for a year. He’d tell you which verdict he trusts.", "None of the names agree with each other. That was the method."]}, {"b": "Aesthetic, ethical, religious: the stages of life", "l": ["The ranking is asserted from inside the religious stage. From the other two, the “higher” one looks like a different choice, not a higher one.", "Three stages, and the last one is the author’s. Every stage theory ends where the man writing it lives.", "Kierkegaard is for people who want to be religious without going to church or agreeing with anyone there."], "r": ["He doesn’t argue you up the ladder. Each stage breaks down by its own standards, in boredom or in guilt, and the next is a choice.", "He wrote the first stage so well that people still stop there. Hardly a man rigging it for his own side.", "He spent his last year attacking the church by name. He had the agreeing-with-no-one part covered."]}], "s": "↥︎"}, {"t": "Sartre", "k": [{"b": "Existence precedes essence", "l": ["People arrive with a biology, a temperament and a situation they didn’t choose. Sartre’s later work conceded how much of that he’d underplayed.", "Babies exist and don’t choose anything for years. So for the first while, essence is winning.", "Existence precedes essence. Genetics would like a word."], "r": ["Biology gives a situation. It doesn’t give its meaning: whether a limp is a tragedy, a fact or a dare is not in the leg.", "For the first years somebody else is choosing for them. Somebody always is. That’s the point.", "Genes gave you a temper. What you do when you’re angry is still yours."]}, {"b": "We are radically free", "l": ["Freedom to interpret a situation isn’t freedom to change it. Calling a prisoner free in Sartre’s sense drains the word of what people care about.", "If people were radically free, nobody would be at work on a Monday.", "He said a man is always free, and he said it from a café."], "r": ["He means there’s no fact about you that makes the choice for you. The prisoner decides what the walls are to him, and that’s the freedom nobody can take or give.", "They chose the paycheck over the alternative. That’s a choice with a commute.", "He wrote in the café because the apartment had no heat. During the occupation."]}, {"b": "Bad faith is lying to yourself about your freedom", "l": ["The account needs a person to know the truth in order to hide it from themselves, the paradox Sartre raises against Freud and doesn’t clearly escape.", "The waiter is acting like a waiter because it’s his job. Sartre watched a man work and diagnosed him.", "Bad faith is whatever the other person is doing."], "r": ["It works because we are both a set of facts and more than them. One half can be played off against the other, and no second inner person has to be fooled.", "He isn’t faulted for working. He’s faulted for a little too much flourish, as though being a waiter were all he could ever be.", "Yes. And you can only see it in them because you know the move."]}, {"b": "Hell is other people", "l": ["The line dramatizes his view that relations are a contest of stares, which leaves love and solidarity unexplained. He later reached for Marxism to fill the gap.", "Solitary confinement is the punishment prisons use on people who are already in prison. Hell is the opposite of other people.", "Hell is other people, said the man who was never once alone at a table."], "r": ["He said later that it means our relations are hell when they’re poisoned, since we know ourselves through others’ eyes. It was never a recommendation of solitude.", "Solitary is a punishment because the others are still there, deciding it. You’ve found the play’s plot.", "All three people in the play want to leave the room and none of them does. He understood tables."]}, {"b": "We choose our values with no outside standard", "l": ["In his own lecture he says that in choosing I choose for all mankind, which imports a Kantian universality his premises don’t support.", "With no standard, choosing is the same as flipping a coin. He made a philosophy out of heads.", "Total freedom, total responsibility, and then he spent the fifties making excuses for the Soviet Union."], "r": ["The universality isn’t a law from above. It’s that choosing shows what you take a human being to be, like it or not.", "A coin doesn’t answer for the result. You do. That’s the whole difference and it’s the theory.", "He got that wrong, and by his own philosophy it’s his to answer for. That’s the philosophy working."]}], "s": "ø"}, {"t": "Camus", "k": [{"b": "Life is absurd: we want meaning from a silent universe", "l": ["Nagel: the absurd comes from our ability to step back from our lives, and calls for irony more than revolt. The silence only disappoints a demand nobody has to make.", "The universe isn’t silent. It has thunder, birds, traffic. He meant it doesn’t talk to him specifically.", "Camus noticed nothing matters and wrote five books about it mattering."], "r": ["Irony is one response. He’s asking whether a person can live with the question open, without pretending it’s closed, and irony may be one way of doing that.", "It doesn’t answer the question you asked it. That’s what silent means.", "Nothing mattering in the end and things mattering now aren’t the same claim. The five books are about the second."]}, {"b": "One must imagine Sisyphus happy", "l": ["Nothing in the argument shows that scorn is the fitting response and not despair or resignation. “Must” is rhetoric.", "Sisyphus has job security, clear goals and exercise. He’s doing better than most readers. That’s a comparison, not a philosophy.", "One must imagine Sisyphus happy. One doesn’t have to. He’s pushing a rock."], "r": ["“Must” means it’s the only picture that leaves him anything. Despair hands the rock the win.", "He owns the walk back down. That’s the hour Camus cares about, and it’s better than most readers get.", "Then he’s unhappy and still pushing a rock. You’ve made it worse and changed nothing."]}, {"b": "The answer to the absurd is revolt", "l": ["Revolt against a condition that can’t change is hard to tell from the change of attitude he rejects in religion. He calls one a leap and the other lucidity.", "Revolting against the universe is yelling at weather.", "Camus’s answer to the absurd is to keep going, which is what everyone was doing."], "r": ["The difference is what you claim. Religion says the condition is other than it looks. Revolt says it’s exactly as it looks and declines to approve.", "You carry an umbrella and you don’t say thank you to the rain.", "Doing it knowing is the difference. It’s a small one. It’s the only one on offer."]}, {"b": "Camus wasn’t an existentialist", "l": ["He refused the label, but the themes, the period and the circle are theirs. The difference rests mostly on his declining Sartre’s politics.", "He sat with the existentialists, wrote about the same thing at the same tables, and fought with them like family. That’s membership.", "Camus spent years explaining he wasn’t an existentialist to people who didn’t care which kind of sad Frenchman he was."], "r": ["It’s more than a label. They hold that we make our essence and he holds there’s a human nature worth defending, which is why he wouldn’t excuse the camps.", "Sitting at the table isn’t signing the manifesto. He’s the one who got up.", "He cared. It cost him every friend he had in Paris."]}, {"b": "The Stranger exposes society’s hypocrisy", "l": ["Meursault kills an Arab the novel never names and barely registers. Later readers took that silence as the book’s own blind spot.", "A man shoots someone, and the lesson is that the court was rude about his mother’s funeral.", "The Stranger is about a guy who shot a man because it was sunny, and people put it on their dating profiles."], "r": ["The silence is the narrator’s, and the book is a portrait of that blankness. An author who grew up poor in Algiers knew what he was showing.", "The court convicts him for not crying at the funeral. That’s in the transcript, and that’s the point.", "It’s a hundred pages. They could finish it before the second date."]}, {"b": "Camus was right and Sartre was wrong", "l": ["The Rebel’s history of ideas is sweeping and thin, which was the original criticism, and his own stance on Algeria struck many as evasion.", "Sartre got the students, the funeral and the school of thought. Being right is supposed to come with something.", "Camus was a goalkeeper. It’s the one position where the job is to stand there while things happen."], "r": ["The history is thin and the judgment was right: no future paradise justifies present murder. On Algeria he refused both sides’ terror, and that’s a position.", "Sartre got the students. Camus got the verdict of everyone who later counted the dead.", "A goalkeeper is the one who can’t blame anyone else."]}], "s": "◣︎"}, {"t": "Heidegger", "k": [{"b": "The question of Being has been forgotten", "l": ["“Being” may not name anything to ask about. On the classic objection, the question comes from treating “is” as a noun.", "Nobody forgot it. Nobody asked, because “what is is” isn’t a question, it’s a stutter.", "Heidegger asked what “is” is for 400 pages and didn’t finish the book."], "r": ["He begins with that objection. The claim is that we already understand “is” well enough to use it everywhere and can’t say what we understand.", "You used it twice in that sentence without trouble and can’t define it. That’s the question.", "The unfinished half is why it’s still being read."]}, {"b": "The difficult prose is necessary", "l": ["That ordinary language can’t carry the thought is a claim that certifies itself. Good expositors restate much of it plainly, which suggests the difficulty wasn’t required.", "If it could only be said that way it couldn’t be translated, and most of his fans read him in English.", "Heidegger is hard to read because he’s hiding."], "r": ["The paraphrases use the tradition’s vocabulary, which carries the assumptions he’s digging out. Something is lost each time, even where it helps.", "It’s been translated twice into English and the translators fought over every term for decades. That’s what “can’t be said otherwise” looks like.", "He invents a word and defines it on the same page. Hiding is the reverse of that."]}, {"b": "His politics are separate from his philosophy", "l": ["His own notebooks tie the antisemitism to his history of Being, and he never took it back. Separation has to be argued passage by passage, not assumed.", "A philosophy of resolve and destiny, by a man who used it once and picked that. The field test is the result.", "Being and Time is about authenticity, by a man who joined the party in 1933 and paid dues until 1945."], "r": ["Agreed that it must be argued passage by passage. Done that way, the analysis of everyday existence in the 1927 book stands without the politics, and Levinas and Arendt built on it.", "Then judge Frege by his diaries and Aristotle by his slaves. The rule can be applied. Just apply it to everyone.", "It’s a 1927 book. His students who had to flee kept teaching it."]}, {"b": "We are being-in-the-world, not subjects facing objects", "l": ["The account of skilled, unreflective coping is valuable, but it’s description. It doesn’t show the subject and object picture is wrong for science or reflection.", "Hammers. His main example of how humans exist is a hammer, and he never built anything.", "Dasein is “person” with a toll booth."], "r": ["It doesn’t say the detached view is false. It says that view is derived, a special way of standing back from a world we were already at work in.", "The hammer you don’t notice until it breaks. That’s the example, and you’ve never thought about your keyboard either until today.", "“Person” already sneaks in a mind inside a body. The toll is for not doing that."]}, {"b": "Technology turns the world into a stockpile", "l": ["The critique is too sweeping to guide anything. He infamously said mechanized farming and far worse were the same in essence.", "He wrote that in a hut with a stove, a road and a publisher.", "The technology essay is “phones bad” for people with a reading group."], "r": ["The remark was grotesque. The analysis is narrower than “technology bad”: it’s about a way of revealing in which everything shows up as stock to be optimized.", "The stove was for heat. He didn’t think of the forest as a wood supply measured in units. That’s the distinction.", "“Phones bad” is about the phone. His is about why you check it as if you were inventory."]}], "s": "Da"}, {"t": "Hegel", "k": [{"b": "The real is rational", "l": ["Read one way it blesses whatever exists, and read the other way it’s nearly empty. Hegel’s own gloss doesn’t settle which.", "Traffic is real.", "Hegel proved the Prussian state was the goal of history while being paid by the Prussian state."], "r": ["“Real” translates his word for what has worked itself out fully, and he separates it from whatever merely exists. A bad state exists and falls short of that.", "Traffic exists. He said so himself, and it’s the distinction: what merely exists against what’s actual.", "He’d lost a job under censorship already. The preface is aimed at the people who wanted the state stormed and the people who wanted it worshipped."]}, {"b": "History is the progress of freedom", "l": ["The story is selected to fit. Whole continents are set outside history, and every regression is renamed a moment.", "History is one thing after another. He drew an arrow on it, and the arrow pointed at Berlin.", "History ended in 1806. Then again in 1989. It keeps ending near whoever’s writing."], "r": ["The geography is indefensible. The thesis survives it: that slavery has gone from unquestioned to unthinkable is hard to describe in any other way.", "The arrow points at the principle that everyone is free. Berlin was only where he was standing.", "He said the principle had been reached, not that events were over. The rest is other people."]}, {"b": "Contradiction drives thought and reality forward", "l": ["Popper’s complaint: if contradictions are welcome, no criticism can bite. And the famous three-step formula isn’t even his, which shows how loosely the method is specified.", "From a contradiction anything follows. So a method that runs on contradictions can prove anything, and did.", "Thesis, antithesis, synthesis. He never said it, and it’s still the clearest thing with his name on it."], "r": ["He doesn’t assert that P and not-P. A position pressed far enough undermines itself in a specific way, and the next one is what’s needed to fix that.", "Explosion is a rule of formal logic. He’s describing what happens when a concept is applied, and that follows no such rule.", "He never said it because it’s a cartoon of it. That it’s clearer tells you about cartoons."]}, {"b": "The Phenomenology leads to absolute knowing", "l": ["Each step is supposed to be necessary, and commentators can’t agree on what the argument for most of them is.", "A path where every step is necessary doesn’t need 600 pages of the guide explaining why no other way was possible.", "Schopenhauer scheduled his lectures against Hegel’s to prove a point, and nobody came. He was still right about Hegel."], "r": ["Each shape of consciousness is tested by its own standard, and fails by it. The reader is supposed to check each step, which is why it can be disputed at all.", "It’s 600 pages because he shows each wrong turn failing. A map with only the right road isn’t a proof.", "Schopenhauer was right about nobody coming."]}, {"b": "His critics haven’t understood him", "l": ["A position that can only be criticized after accepting its whole framework is protected from criticism by design.", "If nobody can be said to understand a writer after two hundred years, the simplest explanation involves the writer.", "Hegel supposedly said only one man ever understood him, and even he didn’t."], "r": ["Every system asks to be read whole before it’s judged. The test is whether, once inside, it explains more than its rivals, and plenty of readers left unconvinced.", "Marx understood him well enough to turn him over. Understanding isn’t the problem. Liking it is.", "It’s a joke told about every difficult writer. It was told about Kant first."]}], "s": "Ⅲ"}, {"t": "Schopenhauer", "k": [{"b": "The world is will and representation", "l": ["He says the thing in itself can’t be known through experience and then identifies it through inner experience, which is still experience in time.", "The will is blind and has no goals, and somehow it built eyes.", "Schopenhauer looked inside himself, found wanting things, and decided that’s what the universe is made of."], "r": ["He concedes it: inner experience still has the form of time, so the will is the thing in itself under its thinnest veil. He claims that much and no more.", "Eyes are what blind striving looks like after a few hundred million years. He said that forty years before Darwin.", "He looked inside, found wanting, and then found it in the plant, the magnet and you. Check for yourself."]}, {"b": "Life is suffering; pleasure is only relief", "l": ["The claim that pleasure is merely the absence of pain is false to experience. Learning and music, his own example, aren’t relief from a prior lack.", "If pleasure were only no pain, a nap and a concert would be the same thing.", "The great pessimist ate well, played the flute every day and lived to 72."], "r": ["Even granting some positive pleasures, the ledger is his real argument: wants are many and lasting, satisfactions brief, and boredom fills what’s left.", "You nap because you were tired and go to the concert because you were bored. Two lacks, two reliefs.", "A man who expected the worst and arranged a tolerable life anyway. That’s the philosophy applied."]}, {"b": "Compassion is the basis of morality", "l": ["Grounding compassion in everyone being one will makes concern for others a disguised concern for oneself.", "If everyone is the same will underneath, helping someone else is helping myself. So compassion is selfishness with extra steps, and he proved egoism.", "The philosopher of compassion loved his poodles and couldn’t stand people."], "r": ["Egoism needs a wall between me and you. If the wall is appearance, the self that egoism serves is what has gone, and the concern is left.", "Selfishness with the self removed is called kindness.", "He left his estate to disabled soldiers and their families."]}, {"b": "Art, above all music, releases us from the will", "l": ["If we are will through and through, will-less contemplation is unexplained. The escape hatch contradicts the system.", "People want to hear music. Wanting is will. So the release from the will is powered by the will, like a diet of cake.", "Schopenhauer’s solution to existence is a nice evening in."], "r": ["He says it’s rare and brief, and takes an excess of intellect over what the will needs. An exception at the margin doesn’t contradict the rule.", "You want it before it starts. During it, for a few minutes, you don’t want anything. That’s the release.", "A nice evening in is most of what anyone gets. He just said so."]}, {"b": "Denying the will is the way out", "l": ["The will denying itself is either one more act of will or impossible on his premises, and he made no attempt to live it.", "Wanting to stop wanting. Buddhism had this bug first, and at least they noticed.", "He recommended renouncing the world from a comfortable apartment, on an inheritance."], "r": ["He says he describes sainthood and doesn’t practice it, any more than a sculptor of beautiful figures must be beautiful. The possibility is what he argues for.", "It isn’t achieved by wanting. It comes from seeing through the thing, and the wanting quiets down. He’s explicit that it can’t be forced.", "He said a philosopher doesn’t have to be a saint. He was right about himself as usual."]}], "s": "♪︎"}, {"t": "Existentialism", "k": [{"b": "We must create our own meaning", "l": ["If meaning is whatever one chooses, no choice can be better than another, and the seriousness the movement demands has nothing to rest on.", "If I get to make it up, I pick “naps.” That’s as valid as his, by his rules, and he hates that.", "Existentialism is being a teenager, but in French and with citations."], "r": ["The choice isn’t unconstrained. It’s made in a situation, in front of others, and you answer for it. What’s denied is a ready-made answer handed down.", "Pick naps and then live it, in front of everyone, for forty years. The seriousness comes from that part.", "Teenagers ask the question. The French kept asking it past twenty, which is the difference."]}, {"b": "Authenticity is the highest value", "l": ["Authenticity says be true to yourself and is silent on what self. A committed fanatic is as authentic as anyone.", "Plenty of terrible people were being completely themselves. That was the problem.", "“Authentic” is what people call themselves right before being rude."], "r": ["It was never the whole ethic. It’s the condition for having one: owning your choices instead of crediting them to your role, your nature or your orders.", "They were being what their party, their rank and their mob told them to be. That’s the opposite.", "That’s sincerity, and it’s cheap. Authenticity is admitting you chose to be rude."]}, {"b": "Anxiety reveals our freedom", "l": ["Anxiety has ordinary causes, and reading a mood as a disclosure of metaphysical truth is a choice the argument doesn’t justify.", "Anxiety reveals too much coffee. It’s revealed that for years and nobody built a philosophy on it.", "They took a bad mood and gave it a Danish name and a German name."], "r": ["The claim is about a particular mood with no object, different from fear of something. That it sometimes has a chemical trigger doesn’t tell you what it shows.", "Coffee gives you jitters about nothing. Now ask why “about nothing” is unbearable.", "Two names because two languages noticed the same thing separately."]}, {"b": "Existence can’t be captured by any system", "l": ["The claim is general and systematic, and the major existentialists wrote very large books laying out structures of existence.", "“No system can capture it,” Being and Nothingness, 700 pages, with a table of contents.", "Existentialism rejected systems and then had required reading."], "r": ["The big books describe structures every existence has, like being in a situation and facing death. They leave the content to each person, and that was the claim.", "Seven hundred pages on why no page can live it for you. He was thorough.", "Required reading that tells you nobody can do your reading for you."]}], "s": ":("}, {"t": "Phenomenology", "k": [{"b": "Go back to the things themselves", "l": ["The descriptions that result differ from one phenomenologist to the next, with no agreed way to tell whose account of experience is right.", "Everyone went back to the things themselves and came home with a different thing.", "Phenomenology is describing a coffee cup for forty pages and calling it rigor."], "r": ["The descriptions get corrected against each other, as observations do. Merleau-Ponty’s account of perception displaced Husserl’s on specific points.", "They came back with different parts of the same thing and argued about how they fit. That’s a field.", "The forty pages show how much you were taking for granted about the cup. That’s the rigor."]}, {"b": "Bracket the natural attitude and describe pure experience", "l": ["Whether anyone can suspend their assumptions on command is doubtful, and there’s no check on whether it was done. Husserl’s own students mostly gave it up.", "“Set aside all your assumptions” is an assumption about what can be set aside.", "The epoché is closing your eyes and saying you’ve stopped assuming things."], "r": ["Full suspension may be impossible, and he came to say so. Even a partial one shows how much of what we “see” is assumption.", "It’s a working assumption that gets tested by trying it. That’s allowed.", "Try it for one minute. You’ll find out how much you never stopped assuming."]}, {"b": "Consciousness is always consciousness of something", "l": ["Moods, pains and dizziness don’t obviously point at anything. The thesis holds for many mental states and is stretched to cover the rest.", "A headache isn’t about anything. It’s just there, being a headache.", "Intentionality: the discovery that when you think, you think about stuff."], "r": ["Moods are about the world as a whole: in boredom everything shows up as flat. They have a wider object.", "A headache is of your head, as hurting. Ask where it is and you’ll point.", "And that nobody had said how. That part took the next hundred years."]}, {"b": "It’s a rigorous science of experience", "l": ["A science has shared methods and results others can check. A century on, phenomenology has schools and founders, and no body of settled findings.", "A science where every practitioner gets different results from the same experiment is called a hobby.", "Husserl kept restarting the whole project from scratch every few years. That’s how the rigorous science was going."], "r": ["The results exist and went elsewhere: the lived body, the horizon of perception and the structure of time-consciousness are now standard in cognitive science.", "Psychologists and roboticists use the results. Being absorbed by other fields is what success looks like.", "He restarted because he found the earlier version wasn’t rigorous enough. That’s the standard he was applying."]}], "s": "[ ]"}, {"t": "Levinas", "k": [{"b": "Ethics is first philosophy", "l": ["Putting ethics before any account of what exists or what we can know leaves the ethical claim with nothing to be checked against.", "Ethics can’t be first. Somebody has to exist before anybody owes them anything. Order of operations.", "Levinas put ethics before everything, including clarity."], "r": ["The claim is that the demand another person makes on me doesn’t wait for my theory of what they are. It’s checked against every encounter you’ve had.", "Someone asks you for help before you’ve worked out your metaphysics. That’s the order he means.", "The clarity comes when someone needs something from you. It’s in the text less."]}, {"b": "The face of the Other commands me", "l": ["If the command comes before all concepts and reasons, there’s no way to say what it asks or to weigh one face against another.", "The face says “do not kill,” apparently. Mostly faces say “do I know you?”", "His whole ethics is making eye contact."], "r": ["He’s describing where obligation starts. He isn’t offering a decision procedure. Weighing claims comes with the third person, and he says that’s where justice and institutions begin.", "“Do I know you?” is already an answer to someone. You were addressed before you decided.", "Try refusing someone while looking at them. Then tell me it’s nothing."]}, {"b": "My responsibility to the Other is infinite", "l": ["An obligation without limit can’t be met and can’t guide a choice between claims. Something infinite in every direction recommends nothing in particular.", "Infinite responsibility to each of eight billion people. He’s behind.", "“I am infinitely responsible for everyone” has never once gotten a dish washed."], "r": ["Infinite means it’s never discharged, so you can’t say “I’ve done m
