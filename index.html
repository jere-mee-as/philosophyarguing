y share” and stop. The guiding is done by justice, which compares and limits.", "Behind is the correct self-assessment. He wrote the philosophy of knowing you are.", "It’s why you feel bad about the dish."]}, {"b": "Western philosophy reduces the Other to the Same", "l": ["The charge sweeps two and a half millennia into one gesture. Any tradition can be made to look uniform at that distance.", "All of Western philosophy made the same mistake, and one man noticed. That’s usually not how that goes.", "Levinas says philosophy erases difference, in prose where every sentence sounds the same."], "r": ["It’s a claim about a tendency: to understand is to fit a thing into what’s already known. He names exceptions, Plato’s Good beyond being and Descartes’s idea of the infinite.", "He credits Plato and Descartes with noticing first. He says so repeatedly.", "He lost his family to people who were certain they’d understood who the Other was. He’s entitled to a theme."]}], "s": "ツ"}, {"t": "Cioran", "k": [{"b": "It would have been better never to have been born", "l": ["The claim compares existing with a state in which there’s no one to be better off. And he lived to 84 without acting on it.", "Better for whom? There’s no one in the other column. He’s comparing his life to an empty chair and losing.", "Cioran thought being born was the catastrophe and lived to 84 in Paris on a nice street."], "r": ["He grants there’s no one to be better off. The remark is a judgment from inside life on what it costs, and living to 84 was his evidence.", "The empty chair has never had a bad night.", "He said the idea of an exit was what let him stay. The nice street doesn’t contradict it."]}, {"b": "Consciousness is a disease", "l": ["“Disease” assumes a healthy state for comparison, and the only vantage from which to make the comparison is the supposedly diseased one.", "If consciousness is a disease, so is the thought that it’s a disease. It’s a symptom reviewing itself.", "He diagnosed consciousness as an illness using consciousness, and didn’t get a second opinion."], "r": ["It’s a figure for excess: awareness beyond what living requires, which no other animal carries. The comparison class is everything else alive.", "Every doctor is a symptom reviewing symptoms. It works for them.", "He asked the mystics and the Stoics. They concurred and prescribed more of it."]}, {"b": "Lucidity means seeing that everything is futile", "l": ["Pessimism is presented as clear sight and optimism as illusion, with no argument that the dark mood is the accurate one.", "Being miserable isn’t the same as being right. Lots of people manage only one.", "Cioran is what happens when insomnia gets a book deal."], "r": ["He doesn’t prove it and says proof belongs to systems. He reports what’s left when the consolations are examined one at a time.", "He was funny about it, which the merely miserable never are.", "Seven years of insomnia and the best French prose of the century. Some people get neither."]}, {"b": "Only the aphorism is honest; systems lie", "l": ["A scattered form protects claims from having to cohere. That’s convenient, and it isn’t the same thing as honesty.", "A man who never writes more than three sentences in a row can’t be caught contradicting himself. That’s the method.", "Aphorisms: for when an argument would take effort."], "r": ["An aphorism can be judged on the spot, with nothing around it to lean on. A system lets a weak step hide behind the strong ones.", "He contradicts himself constantly and says that’s the honest record of a mind.", "A good one takes longer than the chapter you’d write instead."]}], "s": "↓︎"}, {"t": "Dostoevsky", "k": [{"b": "Without God, everything is permitted", "l": ["People without belief hold and act on moral norms, and belief has licensed plenty. Whatever grounds morality, the psychology doesn’t go the way the line predicts.", "Then with God, nothing bad would have been done by believers. Somebody should check the record on that.", "“Without God everything is permitted” is said in the novel by a character, and people quote it like he signed it."], "r": ["The claim concerns justification. People behave decently on inherited habits, and he’s asking what happens over generations once the ground is seen to be gone.", "Believers who did evil broke their own law and knew it. That’s a different condition from having none to break.", "He gave it to his most intelligent character and couldn’t fully answer him. That’s honesty."]}, {"b": "Reason alone leads to the Grand Inquisitor", "l": ["The novels dramatize what rationalists do in Dostoevsky’s imagination. A story built to show a view failing isn’t evidence that it fails.", "He wrote the atheists himself and then they lost. That’s not an argument, that’s being the author.", "Every rationalist in Dostoevsky goes mad or kills someone. It’s a pattern, and the pattern is the novelist."], "r": ["He gave the other side its strongest speech. Readers still argue over whether the Inquisitor is answered, which a rigged book wouldn’t allow.", "He wrote the Inquisitor so well that atheists quote it. An author rigging the game doesn’t arm the other side.", "He’d watched the real ones in the 1860s. Some of them did."]}, {"b": "Suffering redeems", "l": ["Much suffering crushes people and teaches nothing. Finding redemption in it risks telling the wretched their condition is good for them.", "If suffering redeemed, the worst places on earth would be full of saints. They’re full of suffering.", "Suffering ennobles, wrote a man who gambled away the rent and wrote about that too."], "r": ["He never says suffering is good. He says a person can refuse or accept the truth it shows them, and Ivan’s objection about children stays in the book unanswered.", "He doesn’t say it redeems on contact. Raskolnikov suffers for five hundred pages and it does nothing until he stops lying.", "He wrote that down as well. He’s the least excused person in his own books."]}, {"b": "The Underground Man refutes rational egoism", "l": ["He shows that people can act against their interest out of spite, which is a fact about perversity, not a refutation of a theory about what’s good.", "A man doing something stupid to prove he’s free has proved one of those two things.", "Notes from Underground is the first blog."], "r": ["It hits the premise that people act for their advantage once they see it. If they’ll wreck their interest to prove they aren’t piano keys, the planned society fails.", "One of the two, and it wrecks every plan built on people doing what’s good for them.", "The first blog, and the comments section, in one voice."]}], "s": "☦︎"}]}, {"n": "Theory", "s": "¶", "t": [{"t": "Foucault", "k": [{"b": "Power produces knowledge", "l": ["If all knowledge is an effect of power, so is that claim. Critics pressed that the critique needs a standard of truth or freedom it refuses to state.", "If power made knowledge, the most powerful people would know the most. Check on that.", "Power is everywhere, which is a nice way of saying he couldn’t find it."], "r": ["He never says knowledge is nothing but power. He says the two come together, in clinics and prisons and surveys, and that what gets studied depends on who can be made to hold still.", "The powerful don’t know the most. They decide what counts as knowing: who gets examined, filed and graded. That’s the claim.", "He found it in the timetable, the exam and the case file. You were looking for a villain."]}, {"b": "Madness and sexuality are historical constructions", "l": ["Historians have challenged the evidence, including the mass confinement he describes, and showing a category was built doesn’t show the condition isn’t real.", "Broken legs were also categorized by institutions with power. Still broken.", "Historians checked the footnotes. That’s why he’s shelved in philosophy."], "r": ["He doesn’t say the suffering is unreal. He says where the line fell, and who policed it, has a history. The archival fights are over dates.", "A broken leg has been a broken leg in every century. Homosexuality was a sin, then a disease, then neither. Only one of those needs a historian.", "The historians checked them and then started writing history his way."]}, {"b": "Modern discipline is a subtler prison", "l": ["The model prison was never built as designed, and treating schools, hospitals and prisons as one diagram flattens real differences in consent and exit.", "Schools are like prisons except for the going home at three, the no bars, and wanting your kid to get in.", "The Panopticon is his big example and nobody ever built one."], "r": ["It’s a diagram. Its principle is being visible without knowing when you’re watched, so you watch yourself. That needs no round building.", "You want your kid to get in. Having a subject want it is how the thing works.", "Nobody had to. There’s a camera on your street and a rating on your profile."]}, {"b": "There’s no human nature, only discourses", "l": ["Chomsky’s reply in their debate: without some idea of human nature there’s no basis for calling any arrangement unjust, including the ones Foucault opposed.", "Discourses are made by humans. Whatever makes them come out the same way every time is the nature.", "Chomsky asked what would be better and what would justify it, and he wouldn’t say."], "r": ["His reply was that the idea of justice Chomsky appeals to was itself shaped by the society it would judge. That’s a caution about the standard, and not a refusal to oppose anything.", "They come out the same every time? Read two centuries apart on madness or sex and say that again.", "He said the task was to criticize institutions that look neutral. He then went and organized on behalf of prisoners."]}, {"b": "Critique doesn’t have to offer norms", "l": ["Showing that a practice has ugly, accidental origins invites suspicion and can’t by itself show the practice should go. Some norm is doing unacknowledged work.", "A critic with no standards is a guy saying “interesting” in a suspicious voice.", "Foucault is the most cited author in the humanities, which by Foucault makes him the regime."], "r": ["Genealogy removes a practice’s claim to be natural and necessary. Once it looks optional, the people subject to it can ask whether they want it.", "“Interesting” in a suspicious voice is how every reform started. Somebody noticed the thing wasn’t inevitable.", "He’d agree, and tell you to write the genealogy of it."]}], "s": "◉︎"}, {"t": "Derrida & postmodernism", "k": [{"b": "There is nothing outside the text", "l": ["Read as “meaning always needs context” it’s a mild claim few deny. The radical reading is the one that made it famous, and defenders move between the two.", "Rent.", "“There is nothing outside the text,” and he still cashed the checks, which are outside it."], "r": ["The mild reading is the right one and he said so many times. That it’s uncontroversial once stated correctly isn’t a mark against it.", "The lease is a text. So are the notice and the law that backs it. You picked the example with the most paperwork.", "A check is a text with a signature, and he wrote a whole essay about signatures."]}, {"b": "Meaning is endlessly deferred", "l": ["That meaning depends on differences and context doesn’t make it indeterminate. People communicate reliably, and the theory has to explain that away.", "If meaning were endlessly deferred, nobody would have understood that sentence, and his fans claim to.", "Deconstruction is finding out the dictionary defines words with other words."], "r": ["He doesn’t deny that people communicate. He denies that any context can be closed for good, which is why contracts get litigated and scripture has commentaries.", "You understood it well enough for now. Ask again in a hundred years. That’s “deferred.”", "And then finding out what follows from that. You stopped at the dictionary."]}, {"b": "Binary oppositions hide hierarchies", "l": ["Some pairs are ranked for good reason, like true and false or valid and invalid. The method assumes in advance that ranking is illegitimate.", "On and off is a binary with a hierarchy, and every light switch is fine.", "The Sokal paper got in. That was the peer review."], "r": ["He doesn’t say every ranking is wrong. He shows that the first term keeps needing the second to define itself, so the ranking isn’t the simple thing it claimed to be.", "“On” is defined by a circuit that includes “off.” You can’t have the top without the bottom. The switch is his example, working.", "Sokal fooled an unrefereed journal. The same trick has since worked on physics and medicine journals."]}, {"b": "Be suspicious of grand narratives", "l": ["“The grand narratives are over” is a story about the whole of modernity. The contradiction was pointed out immediately.", "A story about how all the big stories ended is the biggest story.", "Postmodernism says there’s no truth, and gets upset when it’s misquoted."], "r": ["He called it a report on what had already happened to belief, and he qualified it later. Describing a loss of faith isn’t founding a new church.", "A weather report that the big storms are over isn’t a big storm.", "It says truths have histories. People who repeat “there’s no truth” are the ones misquoting."]}, {"b": "The obscure style does philosophical work", "l": ["That defense puts the writing beyond checking. Where plainer statements of the ideas exist, they seem to lose little except the aura.", "If the difficulty were the point, the books explaining him clearly would be destroying him. They outsell him.", "Foucault reportedly said a French book needs ten percent nonsense to be taken seriously. Derrida went for a higher score."], "r": ["Where the claim is that ordinary phrasing hides an assumption, writing in ordinary phrases would repeat it. The style is an argument, and you can judge it as one.", "The guides sell because readers want to get to him. Nobody writes a guide to a writer who’s finished.", "That story comes from Searle, who was not a neutral party."]}], "s": "≢︎"}, {"t": "Deleuze", "k": [{"b": "Philosophy is the creation of concepts", "l": ["That doesn’t say what makes one created concept better than another. Novelty and “interest” replace truth as the test, which critics find evasive.", "Creating concepts is also what conspiracy forums do. Output isn’t the standard.", "Deleuze said philosophy is making up concepts. At least he was upfront."], "r": ["The test is what a concept lets you do: which problems it makes thinkable. He says a concept is good the way a tool is good, and that’s a standard.", "Conspiracy forums recycle one concept, the hidden hand. Making a new one is the hard part.", "He was. The others say they’re discovering what they invented."]}, {"b": "Difference comes before identity", "l": ["Difference looks like a relation between things that can already be told apart. Making it basic takes a “difference in itself” that’s hard to state without identities creeping back.", "Different from what? There. That’s identity. It was already in the question.", "Difference and Repetition says it’s different every time, and repeats that."], "r": ["The view from identity treats difference as what’s left after comparing two finished things. His claim is that the things are produced by differing, like a gradient before there are two sides.", "Different from what it was a moment ago. No second thing required.", "Each time it comes back it’s changed. That’s the title, and you read it."]}, {"b": "The rhizome, not the tree", "l": ["The contrast is itself a neat pair of the kind it rejects, and real knowledge, in classification, proof and causal explanation, is often usefully tree-shaped.", "A rhizome is a root. It’s ginger. He replaced the tree with a different plant and called it the end of trees.", "The rhizome has no beginning, middle or end, which also describes reading it."], "r": ["He says trees and rhizomes turn into each other and the pair isn’t a ranking. It’s a way of noticing when a branching model is being forced on a network.", "Ginger has no trunk and no top, and any piece grows a new plant. That’s the property. He picked the right vegetable.", "It’s written so you can start on any chapter. That was announced on page one."]}, {"b": "Desire is productive, not a lack", "l": ["Throwing out lack leaves no room to criticize any desire. The book says desire can desire its own repression and can’t say why that’s bad.", "Hunger. A desire that is one hundred percent lack, three times a day.", "Anti-Oedipus has a thousand machines in it and none of them do anything."], "r": ["He criticizes desires by what they do: whether they connect and expand or close down. That’s a standard, and it replaces “lack” with “blockage.”", "Hunger builds farms, kitchens, trade routes and cuisines. It’s the most productive thing people have.", "They produce. That’s the entire point of calling them machines."]}, {"b": "The math and science references are rigorous", "l": ["Sokal and Bricmont documented uses of calculus and physics that are trivial or wrong. Calling them metaphors concedes they do no technical work.", "If the math were right, mathematicians would cite it. Citations from the math department: zero.", "A body without organs is a bag."], "r": ["The borrowed terms are used as concepts. He says philosophy takes from science without doing science. Judge the concept by its use.", "Mathematicians have read him and written books on his use of the calculus. Zero is not the count.", "A bag is organized. Read it again."]}], "s": "⋈︎"}, {"t": "Žižek", "k": [{"b": "Ideology is strongest where we think we’re outside it", "l": ["The claim can’t lose: belief confirms ideology and disbelief confirms it more. Nothing could count as being free of it, his own account included.", "Then the people who think they’re in it are outside it. So the most ideological person in the room is whoever read Žižek.", "Everything is ideology except the guy pointing."], "r": ["The claim is specific: we now know very well and act as if we didn’t. That can be checked against behavior, and it describes how most people use their phones.", "Reading Žižek and feeling safely outside is the exact move he describes. So yes. He’d agree and include himself.", "He says he’s in it too. That’s most of the act."]}, {"b": "Lacan plus Hegel explains contemporary culture", "l": ["The method applies the same three-step to films, toilets and elections. A tool that fits everything explains nothing in particular.", "Lacan can’t be tested and Hegel can’t be read. Adding them doesn’t fix either.", "Žižek explains capitalism using a movie he’s describing from memory, wrong."], "r": ["The same structure turning up in many places is what a theory of ideology predicts. The test is whether each reading shows something the film’s makers would recognize.", "Hegel can be read, and you’ve used the word “alienation” this week.", "Wrong about the plot, right about why you liked it."]}, {"b": "The jokes carry real arguments", "l": ["Often the example stands in for the argument. The paradoxical reversal is asserted, and the audience’s laugh is taken as agreement.", "If jokes carried arguments, comedians would be the theorists. Some of them think so too.", "Žižek has written the same book forty times, and the toilets are in all of them."], "r": ["A joke that works shows the structure it relies on. If you laughed, you already saw the mechanism, and the explaining comes after.", "The good comedians are theorists. Ask one how a joke about class works and you’ll get twenty minutes.", "He says he repeats himself. It’s the only way to find out what you actually think."]}, {"b": "He’s a serious communist thinker", "l": ["The positive program is thin to absent. Calls to “think” and to refuse are offered where a politics would go.", "A serious communist charges less for tickets.", "The most dangerous philosopher in the West, available for corporate events."], "r": ["He says the old program failed and the first duty is not to rush into the next one. Refusing to supply a blueprint on demand is a position about blueprints.", "He takes capitalism’s money to attack capitalism. That’s the contradiction he lectures on, performed live.", "Dangerous and booked. That’s what the system does to everything, as he keeps saying."]}, {"b": "The provocations are dialectical, not contrarian", "l": ["The line is hard to draw when the provocation lands opposite the audience’s expectation every time, whatever the topic.", "Saying the opposite of what the room expects, in every room, is called a bit.", "“It’s precisely the opposite” works on any sentence. That’s the method, and so on."], "r": ["The reversal is the method when the audience’s expectation is the ideology. It fails as argument only if the reversed claim can’t be defended, and he usually tries.", "If the opposite is true in every room, the rooms have a problem.", "And so on, and so on. He knows."]}], "s": "Ž"}, {"t": "Psychoanalysis", "k": [{"b": "The unconscious drives behavior", "l": ["Science accepts plenty of unconscious processing. Freud’s unconscious of repressed wishes is a further, specific claim with weak support.", "If it’s unconscious nobody can check, including the analyst. He’s guessing, at an hourly rate.", "Freud discovered that people don’t know why they do things and then told them it was their mother."], "r": ["The modern findings cover the core: motives people can’t report, defenses, the long reach of early attachment. The specific mechanisms have been revised, as in any field.", "The analyst can’t check, and the patient can: something shifts when the guess is right. That’s the test, session by session.", "And when you rolled your eyes just now, whose voice was that in?"]}, {"b": "Repression and the Oedipus complex are real", "l": ["The Oedipal theory rests on a handful of case histories that Freud shaped, and evidence from other cultures and from child development doesn’t support it.", "Most people have checked how they feel about their mother, and it’s fine.", "The Oedipus complex is one man’s situation, generalized."], "r": ["The literal family drama is the weakest part. The general claim survives: a child’s first loves and rivalries leave a pattern that later ones repeat.", "“It’s fine” is the most examined sentence in the history of the couch.", "Sophocles had it packing theaters two thousand years before Freud."]}, {"b": "Resisting the interpretation confirms it", "l": ["That’s the classic objection. If acceptance and denial both confirm, the interpretation risks nothing.", "Heads he’s right, tails the patient’s in denial. That’s not a method, it’s a coin he owns.", "If the patient agrees, it’s true. If the patient disagrees, it’s really true."], "r": ["Good practice never took a “no” as confirmation. An interpretation is tested by what follows it: new memories, a change in the symptom, or nothing.", "He doesn’t own the coin. The patient can leave. They mostly come back, and that’s also data.", "Freud wrote the paper saying yes and no both prove nothing. You’re attacking a position he rejected in 1937."]}, {"b": "Clinical experience is the evidence", "l": ["Uncontrolled case reports can’t separate suggestion from discovery. That the therapy helps about as much as others doesn’t validate the theory behind it.", "Clinical experience also supported bloodletting. The clinicians were very experienced.", "Freud’s famous cures mostly weren’t. Somebody followed up."], "r": ["The long-term outcome studies now exist, and the gains from this kind of therapy keep growing after it ends. That’s a measurable difference.", "Bloodletting never had a patient say “that’s it” and stop having the symptom.", "The follow-up on the pills isn’t flattering either."]}, {"b": "Lacan made Freud rigorous", "l": ["The formulas and knot diagrams have no fixed content. Critics, and some sympathetic readers, found the mathematics decorative.", "Lacan said the unconscious is structured like a language, and then didn’t use one.", "Lacan charged full price for five-minute sessions and called it technique."], "r": ["The formulas are shorthand for teaching, and he said they weren’t mathematics. The rigor is in reading Freud line by line against what patients say.", "He meant it’s made of substitution and combination, like metaphor and metonymy. He used French, heavily.", "A session ends when something has been said. Sometimes that takes five minutes. Sometimes it takes you ten years."]}], "s": "id"}, {"t": "Frankfurt School", "k": [{"b": "The culture industry manufactures conformity", "l": ["Audiences interpret, resist and repurpose what they consume. The picture of passive masses was asserted from above, with little study of actual audiences.", "People watched a lot of movies and then had the 1960s. The conformity machine had a recall.", "Adorno heard jazz and concluded civilization was over."], "r": ["Audiences reinterpret what they’re sold and still buy the next one. The claim is about the form, standardized and pre-digested, and that survives lively fans.", "The sixties were on vinyl by 1969 and in commercials by 1975. He predicted the second part.", "He heard the dance-band jazz of 1930s radio, the product he was writing about."]}, {"b": "Enlightenment reason turns into domination", "l": ["If reason as such leads to domination, the critique, which is an exercise of reason, has no ground to stand on. Habermas made this point against his own teachers.", "They used reason to show reason is a trap. So either the argument’s a trap or it isn’t true.", "Dialectic of Enlightenment: two men in California explaining that everything is fascism, including the weather."], "r": ["The book says so itself: it’s reason criticizing a narrowing of itself into mere calculation, for the sake of the wider kind. Habermas built on that.", "They used one kind of reason against another. There’s more than one, and that was the argument.", "Two refugees from the real thing, noticing what it had in common with the radio. They’d earned the comparison."]}, {"b": "Critical theory unites analysis with emancipation", "l": ["Building the desired political result into the method means the theory can’t discover that it’s wrong about what would free anyone.", "A theory that knows its conclusion before it starts is called a position.", "They theorized revolution for forty years, and when students actually occupied the institute, Adorno called the police."], "r": ["The aim is fixed only as less needless suffering. What would bring that about is left open to inquiry, and they revised their own answers repeatedly.", "Medicine knows it wants the patient well before it starts. Nobody calls that bias.", "He thought their tactics would bring a backlash, and he said so in advance. It did."]}, {"b": "Tolerance of the intolerable is repressive", "l": ["A theory that licenses suppressing views the theorist judges regressive hands a weapon to whoever holds power, whichever direction they face.", "Tolerance means only tolerating the correct side. He needed a whole essay because it doesn’t sound good short.", "Marcuse figured out that free speech is oppression unless he’s the one talking."], "r": ["The essay argues that formal neutrality favors whoever already owns the megaphones. Who decides is its weak point, and he admits as much.", "It says tolerance that treats the megaphone and the leaflet alike isn’t neutral. That takes more than a sentence.", "He was talking about a few broadcasters owning nearly every channel. That detail usually goes missing."]}], "s": "♮︎"}, {"t": "Baudrillard", "k": [{"b": "We live in simulation; the real has disappeared", "l": ["The claim trades on the difference between the real and its images to announce that there’s no difference. If it were true it couldn’t be stated.", "If the real had disappeared, he couldn’t know what was missing. He’s describing the thing he says is gone.", "Baudrillard announced that reality was over and kept accepting real money for it."], "r": ["It can be stated because it’s a matter of degree. Models now precede the events they describe: polls, forecasts, brands. He names the tipping point.", "He’s describing the missing thing from memory, like everyone over forty.", "The money’s a number on a screen, backed by confidence in other numbers. He’d take the example."]}, {"b": "Signs now refer only to other signs", "l": ["People still get wet in the rain. That media shape perception doesn’t show that nothing lies behind the images.", "A stop sign refers to stopping. People who treat it as referring to other signs are in the hospital.", "Hyperreality is noticing that Disneyland is fake and then not stopping."], "r": ["The rain is real. What it means to you, a ruined event or a trending storm with a name, arrives pre-packaged, and that layer is what he’s describing.", "People stop for the sign with no car in sight. They’re obeying the sign.", "He says Disneyland is there to make the rest look real by contrast. Noticing it’s fake is the first step and he took the second."]}, {"b": "The Gulf War did not take place", "l": ["Read as media criticism it says the public saw a staged version. Read as written, it’s false and offensive to the people it happened to.", "There were casualties. They took place.", "He said a war didn’t happen while it was on television, and his defenders say you have to read it carefully."], "r": ["The essays came out before, during and after. The thesis is that what the West experienced was a televised event with a fixed outcome, and he says the dead were real.", "He says so. The claim is that for the audience it wasn’t a war, it was programming, and for one side it was a slaughter.", "You do have to read it. It’s forty pages."]}, {"b": "The Matrix is based on his work", "l": ["He said the film misunderstood him. On his view there’s no outside to escape to, which is the film’s entire plot.", "Baudrillard said The Matrix got him wrong. The movie made more sense, so that checks out.", "The book appears in The Matrix for four seconds, hollowed out, used as a box. Fair."], "r": ["Right, and his fans say the same. The film’s error is instructive: it imagines a real world you could wake up into.", "The movie made more sense because it kept the door marked “exit.”", "The filmmakers opened the book, put the money in it and didn’t read it. He couldn’t have staged it better."]}], "s": "©"}, {"t": "Lacan", "k": [{"b": "The unconscious is structured like a language", "l": ["The slogan borrows linguistic terms loosely, and working linguists don’t recognize the borrowed concepts in the use he makes of them.", "Languages have grammar and can be learned. Nobody has ever learned to speak unconscious.", "Lacan said the unconscious is structured like a language, specifically one that only he spoke."], "r": ["He means it works by substitution and displacement, as jokes and slips do. Freud’s own examples are wordplay, and that’s the evidence.", "You speak it fluently every time you say the wrong name.", "Several thousand analysts trained in it. It’s a crowded language."]}, {"b": "The mirror stage founds the ego", "l": ["The developmental claim was made with almost no evidence, and children blind from birth form a sense of self without mirrors.", "People had selves before mirrors were invented. Ponds are not that reliable.", "A baby looks in a mirror, and from that he got a theory of everything and fifty years of seminars."], "r": ["The mirror is the example. The claim is that the self is first met from outside, as an image held together by someone else’s gaze, and a parent’s face will do.", "A mother’s face did the job before glass. He says the mirror can be a person.", "From a baby delighted by its reflection six months before it can walk. It’s a good observation."]}, {"b": "Desire is the desire of the Other", "l": ["The phrase supports several incompatible readings, and the theory doesn’t choose. What can’t be pinned down can’t be tested or applied.", "I want a sandwich. Nobody else is involved.", "Every Lacanian sentence means three things and is defended with whichever one wasn’t attacked."], "r": ["The readings are meant together: we want what others want, we want to be wanted, and we want from a place others shaped. It’s compressed, on purpose.", "You want the sandwich you saw in an ad, at the place your friends go. Somebody else is involved.", "It means three things because desire does."]}, {"b": "The Real resists symbolization", "l": ["A category defined as what can’t be said or imagined does no explanatory work and can’t be wrong.", "If it resists symbolization, stop writing about it. He wrote about it for thirty years.", "The Real is whatever the theory can’t explain, renamed as the theory’s deepest concept."], "r": ["It names the point where the patient’s story breaks down, in trauma or repetition. Clinically, that’s where the work is.", "Thirty years circling a thing that can’t be said is called an analysis.", "Every theory has a remainder. His is the only one with a chapter on it."]}], "s": "$"}, {"t": "Jung", "k": [{"b": "There’s a collective unconscious shared by all humanity", "l": ["Shared themes in myths are explained by shared biology, common life situations and contact between cultures. An inherited store of images adds nothing testable.", "Every culture has stories about mothers because everybody has a mother. No psychic underground required.", "Jung found the same symbols in every culture, having gone looking for them."], "r": ["He agrees it’s biological: inherited patterns of response, the way a chick fears a hawk’s shadow. “Collective unconscious” is his name for the shared equipment.", "Everybody has a mother, and every culture tells the same six stories about her. That’s the thing to be explained.", "He went looking, in patients who’d never read a myth and dreamed one anyway."]}, {"b": "Archetypes shape our psychology", "l": ["The archetypes are vague enough to fit any story or dream, and no finding could count against their presence.", "A wise old man, a trickster, a mother. That’s not the structure of the psyche, that’s casting.", "Archetypes are zodiac signs for people who went to graduate school."], "r": ["They’re patterns of situation: threat, guide, betrayal, return. Screenwriters and game designers use them because audiences respond on schedule.", "It’s casting that works in every country without translation. Ask why.", "Zodiac signs don’t predict what scares a three-year-old."]}, {"b": "Synchronicity: meaningful coincidences aren’t mere chance", "l": ["With enough events, striking coincidences are expected. Calling them meaningful describes how they feel and adds no connection between them.", "Thinking of someone right before they call happens. So do the nine thousand times they didn’t call.", "Synchronicity is noticing a coincidence and refusing to do the math."], "r": ["He called it a hypothesis about meaning and said it wasn’t causation. Its use is clinical: what a coincidence means to the patient tells you about the patient.", "The nine thousand didn’t arrive on the day it mattered. That’s what he’s pointing at.", "He co-wrote it with a Nobel physicist, who didn’t think it was arithmetic."]}, {"b": "Individuation is the goal of psychological life", "l": ["The stages and their end state come from his own experience and his reading of alchemy. There’s no evidence that minds develop along that path.", "He based the map of the human soul on his own dreams and some medieval chemistry books.", "Jung gave us the Myers-Briggs. That’s the testable part, and it failed."], "r": ["The map is his. That midlife turns people from achievement toward meaning is among the better-replicated findings in the psychology of aging.", "He used his own dreams, his patients’ and the alchemists’, who he argued were describing the same process in other symbols.", "He disowned being typed. Introvert and extravert are his, and they held up."]}], "s": "☽︎"}, {"t": "Structuralism", "k": [{"b": "Meaning comes from differences within a system", "l": ["That signs contrast with each other doesn’t show the world plays no part in what they mean. Words are also used to pick things out.", "“Cat” means cat because of cats. The differences help. The cats help more.", "Structuralism is the theory that a dictionary could be written without anyone going outside."], "r": ["The world supplies the things and the system supplies the cuts. Where one language has a single word and another has two, the difference is in the system.", "Cats help, and then English has “cat” and “kitten” where another language cuts elsewhere.", "A dictionary does define every word with other words, and it works."]}, {"b": "The sign is arbitrary", "l": ["The sound is arbitrary. What follows from that is modest, and it was stretched into the claim that categories and facts are arbitrary too.", "The word “poison” is arbitrary. The poison isn’t. He confused the label with the bottle.", "Saussure never wrote the book. His students assembled it from lecture notes after he died. The foundation is somebody’s homework."], "r": ["It’s modest and it’s the foundation: no sound has a natural meaning, so meaning has to come from the system. Stretching it was other people’s doing.", "The label is arbitrary and what counts as “poison” versus “medicine” is a line the language draws. Ask a pharmacist about dose.", "Students assembled the Gospels too."]}, {"b": "Myths and kinship share universal deep structures", "l": ["The analyses can’t be replicated: different analysts find different structures in the same myth, with no procedure for deciding between them.", "He found binary oppositions in every myth. Give anyone two columns and a myth and they will too.", "Lévi-Strauss reduced world mythology to raw and cooked, and people let him."], "r": ["The kinship work made testable claims about which marriage systems can exist, and anthropologists argued over the data for decades. That’s replication being attempted.", "Two columns and a myth, and then predicting the variants found in the next valley. He did that part.", "Raw and cooked is nature and culture, which every society marks. He picked the kitchen because every society has one."]}, {"b": "The subject is an effect of structures", "l": ["If people are produced by structures all the way down, the theorist is too, and the theory is one more effect with no claim to have seen the truth.", "Then the structures wrote his book, and they should get the royalties.", "Structuralism abolished the author, and every structuralist put their name on the cover."], "r": ["A theorist shaped by structures can still describe them, as a native speaker can write a grammar. Being inside a system doesn’t stop you mapping it.", "The royalties go where the contract says. That’s a structure.", "The name on the cover is a legal function. One of them wrote a famous essay on exactly that."]}], "s": "╬︎"}, {"t": "Mark Fisher", "k": [{"b": "It’s easier to imagine the end of the world than the end of capitalism", "l": ["That says something about imagination and film budgets. People imagined alternatives constantly, and the hard part was showing they’d work.", "People imagine the end of capitalism all the time. There are whole bookstores. What’s hard is the second chapter.", "“Capitalist realism” is a name for not having a plan."], "r": ["The claim is about what’s publicly thinkable: no party, film or mainstream program presents an alternative as live. The bookstores are the niche he describes.", "The second chapter is missing from all of them, and that’s his point.", "It’s a name for why nobody has one. A diagnosis isn’t a prescription."]}, {"b": "Capitalism has absorbed all resistance", "l": ["A theory on which every protest is absorbed and every success is co-optation can’t be told apart from one where things simply aren’t that bad.", "If all resistance gets absorbed, so did the book. It’s sold by a multinational and comes with free shipping.", "Capitalist Realism is eighty pages on how nothing can be done, and it sold very well."], "r": ["He doesn’t say resistance is impossible. He says its usual forms were already priced in, and asks what a form that isn’t would look like.", "He says exactly that about his own book, in the book.", "It sold to people who felt that and had no word for it. That’s what books are for."]}, {"b": "Culture has stalled: nothing new, only retro", "l": ["Every generation’s critics say this about the music after their youth. Novelty is easier to see in retrospect and in scenes one isn’t part of.", "Every forty-year-old thinks music stopped being new when he was twenty-five. He wrote it up.", "Hauntology is being sad that the future from old TV shows didn’t arrive."], "r": ["His test is concrete: play a record from 1975 to someone in 1955 and it would shock them. Play one from 2015 in 1995 and it wouldn’t.", "He was listening to new music weekly and writing about it. The claim came from someone keeping up.", "Sad that a future was promised, budgeted for and cancelled. That’s a political fact."]}, {"b": "Mental distress is political, not just personal", "l": ["Social conditions matter, but making every case a symptom of the economy tells people nothing useful about their own, and it isn’t supported in that strong form.", "Unhappiness predates capitalism by a few thousand years. The Book of Job has no employers in it.", "Everything is capitalism’s fault, a claim that’s very available on mugs."], "r": ["He doesn’t say every case. He says treating a mass rise in distress as millions of private chemical accidents is itself a political choice.", "Job’s troubles came from on high, were nobody’s fault he could find, and he was told to look within. Good example.", "The mugs are how you know the claim got absorbed. He covered that."]}], "s": "k"}, {"t": "Accelerationism", "k": [{"b": "Speed capitalism up to push through it", "l": ["Nothing shows that intensifying a system produces its successor and not just more of it, or a collapse nobody would choose.", "“Make it worse until it gets better” has been tried by every gambler.", "Accelerationism: the plan is to floor it and find out what the wall is made of."], "r": ["The left version says: take the productive forces capitalism built, the automation and the logistics, and push them past what it can use. It’s a plan about technology.", "It’s what every technological transition has been. Nobody reformed their way from horses to engines.", "We know what the brake is made of. It’s the same people it was last time."]}, {"b": "Capital is an inhuman intelligence using us", "l": ["Markets are aggregates of human choices under rules humans set. Treating the aggregate as an agent with aims is a metaphor promoted to a theory.", "Capital doesn’t want anything. It’s money. He got scared of a spreadsheet.", "Nick Land wrote that capitalism is an alien intelligence from the future, and people in tech said “finally, someone gets it.”"], "r": ["A process that sets its own goals, routes around obstacles and reshapes its parts is an agent on any definition used for other systems.", "It decides where you live and what you study. For a spreadsheet it has a lot of say.", "They’d been building it and wanted to know what it was."]}, {"b": "Technology’s growth can’t and shouldn’t be steered", "l": ["Technologies have been steered, slowed and banned many times. “Inevitable” tends to be said by those who’d profit from nobody trying.", "Human cloning, chemical weapons, lead in gasoline. Steered. It happens constantly.", "e/acc is “you can’t stop progress” from people who own the progress."], "r": ["Each of those was slowed in some places for some time. The claim is about the whole system under competition: what one group declines, another builds.", "Steered until somebody else needed it. Look at where each of those stands now.", "The people who own the last round of progress are the ones asking for the pause."]}, {"b": "Slowing down is the real risk", "l": ["Speed and safety trade off in every engineered system. Asserting that caution is always the greater danger is a slogan, not an analysis.", "Every engineer who ever lived would like a word about “slowing down is the risk.”", "The movement that wants to accelerate everything has been mostly posting for ten years."], "r": ["Delay costs lives too: cures arriving later, poverty lasting longer. A ledger that counts only the risks of acting is missing a column.", "Engineers ship. The ones who never ship aren’t called careful.", "Posting while the thing gets built by people who read the posts."]}], "s": "↠︎"}, {"t": "Byung-Chul Han", "k": [{"b": "We’re a burnout society, exploiting ourselves", "l": ["Most overwork still has an employer, a mortgage or a visa behind it. Describing it as self-exploitation takes the pressure off whoever’s applying it.", "People aren’t exploiting themselves. They have a boss. He can be reached by email, at midnight, that’s the issue.", "The Burnout Society is sixty pages, because the reader is too tired for more. He knows his market."], "r": ["The boss is real. What’s new is how many people with no boss in the room still can’t stop, and call it passion.", "The email arrives at midnight and you answer it because you want to be the kind of person who does.", "Sixty pages is the form the argument takes about attention. He means it."]}, {"b": "Transparency destroys trust and depth", "l": ["The essays assert broad cultural diagnoses without evidence, and the opposite claim, that secrecy protects abuse, has at least as much support.", "Opaque institutions have an excellent record, he said, naming none.", "Han is against transparency and proves it with his prose."], "r": ["He’s writing essays in a tradition that argues by concepts. The claim is that trust means not needing to see everything, and a demand for total visibility admits it’s gone.", "Friendship, the confessional, the ballot booth. Some good things work because nobody’s watching.", "It’s clear, short sentences with no footnotes. You’ve confused opaque with uncited."]}, {"b": "Digital life has abolished the Other", "l": ["“The Other has disappeared” is the sort of sentence that can’t be checked. People online meet more strangers and more disagreement than any generation before.", "The internet is nothing but other people. That’s the complaint everyone actually has.", "He writes that we’ve lost the capacity for contemplation, in books designed to be read on a train."], "r": ["More strangers, fewer others: the feed shows you people sorted to resemble you or to enrage you. An Other is someone you didn’t select.", "Other people as content. That’s what he means by abolished.", "Short enough to finish on the train and long enough to make you put the phone away for it."]}, {"b": "We’ve lost ritual and the ability to linger", "l": ["Nostalgia for a slower, more ritual past rarely specifies when that was or who got to enjoy the lingering.", "The people who had time to linger had servants. Somebody else was not lingering.", "Byung-Chul Han publishes the same short book about once a year. It’s a ritual."], "r": ["He isn’t asking for the past back. He’s noting that repeated shared forms did something for attention and belonging that nothing has replaced.", "The servants had festivals, sabbaths and saints’ days, which was more shared time off than you get.", "One short book a year, the same themes, turned slightly. He practices what he describes."]}], "s": "▂︎"}]}, {"n": "Political Thinkers", "s": "♛︎", "t": [{"t": "Marx", "k": [{"b": "History is the history of class struggle", "l": ["Much of history is driven by religion, nationalism, technology, disease and accident. Reducing those to class takes a new side-assumption each time.", "The longest wars in history were between people of the same class over which church. He’d read about them.", "Marx said the workers would rise up. The workers bought houses."], "r": ["He doesn’t claim class is the only cause. Other struggles take the shape that material interests allow, and the long sweep from feudalism to capitalism fits that.", "Follow the church’s land and the princes’ revenues through those wars and say that again.", "With a mortgage. He covered that. It’s called a chain."]}, {"b": "Labor is the source of value", "l": ["Economics dropped the labor theory of value for good reasons, since value depends on demand. Exploitation has to be restated without it, as later Marxists tried.", "A mud pie takes labor. A lot of it, if it’s a big one.", "Marx never worked in a factory. His friend owned one."], "r": ["The exploitation claim survives without it: one group owns the means of production, the other must sell its time, and the surplus goes to the first.", "He says in chapter one that useless labor creates no value. You’ve refuted page ten with something on page eleven.", "He read every factory inspector’s report in the British Museum for thirty years. The inspectors are the ones in the footnotes."]}, {"b": "Capitalism’s contradictions will bring it down", "l": ["The predictions didn’t come about: deepening misery, falling profits, revolution in the richest economies. The theory was adjusted each time to survive.", "It’s been about to collapse since 1848. A prophecy on its 180th extension is a lifestyle.", "Late capitalism has been late for a hundred and fifty years."], "r": ["The crises came on schedule. What he missed was how far the state would go to manage them, and that’s a revision the theory can take.", "1873, 1929, 1973, 2008. It keeps having the heart attack and getting the paddles.", "And it’s still the best description of last quarter."]}, {"b": "Real Marxism has never been tried", "l": ["Marx left little institutional design, so regimes filled the gap. That every attempt took a similar turn is evidence about the theory, not only about the attempts.", "It’s been tried in about forty countries. At some point the sample is the result.", "“That wasn’t real communism” is the only part of the theory that’s been tested every time."], "r": ["He expected revolution in rich industrial countries with a majority working class. It was tried in poor agrarian ones under siege, which he said couldn’t work.", "All forty were poor, rural and at war. The sample has one kind of country in it.", "“That wasn’t real capitalism” is what gets said after every crash."]}, {"b": "Ideas reflect the material base", "l": ["If ideas are fixed by class position, so is Marxism, a theory written by middle-class intellectuals. The thesis is either too weak to matter or false.", "Marx was middle class and lived on a factory owner’s money. So by his own theory Capital is factory-owner ideology.", "Engels paid for Capital out of the family mill’s profits. Surplus value has its uses."], "r": ["He says ideas are conditioned, and that members of a class can see past its interests when its position is crumbling. He names himself as an instance.", "A factory owner’s money paying for a book against factory owners isn’t the ideology you’d expect. That’s the anomaly the theory explains.", "Yes. Best use of surplus value on record."]}], "s": "☭︎"}, {"t": "Rawls & liberalism", "k": [{"b": "Justice is what we’d choose behind the veil of ignorance", "l": ["The outcome depends on what’s stipulated about the choosers. Other theorists’ equally ignorant parties pick average utility. The veil illustrates a view more than it argues for one.", "Nobody was ever behind a veil. It’s a contract nobody signed, by people who don’t exist, in a room that isn’t there.", "Behind the veil of ignorance everyone turns out to be a Harvard professor."], "r": ["The veil is a device for showing what fairness requires, and he says so. The stipulations are argued for one by one, since they express conditions people accept on reflection.", "It’s a test, like asking how you’d cut the cake if someone else picked first. You don’t need to have cut it.", "A Harvard professor who concluded Harvard professors shouldn’t get more unless the janitor does better for it."]}, {"b": "Inequalities must benefit the worst off", "l": ["The rule is extremely risk-averse, and Nozick’s objection is that keeping any such pattern requires constant interference with free transfers.", "So if the poorest get one more dollar, any inequality is fine. He wrote the mission statement for every billionaire’s foundation.", "Rawls proved that justice is roughly the Democratic platform of 1971."], "r": ["Extreme caution fits a one-time choice of basic institutions with your whole life at stake. And the principle applies to the basic structure, leaving individual transfers alone.", "“Any inequality” has to be the arrangement that leaves the poorest best off out of all the possibilities. One dollar almost never passes.", "No Democratic platform has ever come close to it."]}, {"b": "The state should be neutral about the good life", "l": ["Neutrality is itself a commitment, to autonomy and individualism, that many reject, and no state is neutral in its effects.", "A state that’s neutral about what’s good can’t say why neutrality is good.", "Liberal neutrality: every way of life is welcome that’s already liberal."], "r": ["He dropped neutrality of effect. The claim is neutrality of justification: basic law shouldn’t rest on one contested account of the good life.", "It can say why. People who disagree about the good still have to share a state, and neutrality is the term each can accept.", "Welcome so long as it doesn’t use the police to make the others join. That’s the one condition."]}, {"b": "Laws must be justifiable to all reasonable citizens", "l": ["“Reasonable” is defined to leave out those who reject liberal premises, so the agreement is built into the entry conditions.", "Reasonable people are the ones who agree. So it’s justified to everyone who already said yes.", "“Reasonable” does so much work in Rawls it should have tenure."], "r": ["“Reasonable” means willing to offer terms others could accept and to admit that sincere people disagree. It leaves out those who’d impose, whatever their doctrine, liberals included.", "Reasonable people agree to look for terms. They don’t agree on the answer. That gap is the whole theory.", "It’s defined in the text. Twice. It earned tenure."]}, {"b": "Natural talents are morally arbitrary", "l": ["If my talents and efforts aren’t mine in the sense that matters, it’s unclear what self is left to have rights at all.", "If nobody deserves their talents, nobody deserves credit for a theory of justice.", "A Theory of Justice is 600 pages, and the later books are him taking some of it back."], "r": ["He doesn’t say talents aren’t yours. He says no one deserves their starting place, so the rules for rewarding talent need a justification other than desert.", "He agreed. He said his career was mostly luck and wouldn’t take credit for it in interviews.", "A theorist who revises under criticism. You say that as if it’s a flaw."]}], "s": "░︎"}, {"t": "Hobbes", "k": [{"b": "Without a sovereign, life is nasty, brutish and short", "l": ["Anthropology finds stateless societies with norms, reciprocity and ways of settling disputes. His state of nature is a model of civil war, not of human origins.", "People lived without states for two hundred thousand years. If it was that bad there’d be nobody left to write Leviathan.", "Hobbes was afraid of everything and built a philosophy so it would be the government’s job."], "r": ["Those societies are small and their homicide rates, where measured, run high. His claim is about strangers at scale with nothing to enforce agreements.", "They lived in bands of fifty where everyone was a cousin. Try it with eight million strangers.", "He lived through a civil war. The fear was a field observation."]}, {"b": "Rational people would give a sovereign all power", "l": ["Locke’s reply: nobody escapes polecats by handing themselves to a lion. Unchecked power recreates the insecurity it was meant to end.", "Nobody rational signs a contract with no exit clause. He described the worst lease in history and called it reason.", "Hobbes’s solution to “people are dangerous” is to give one of them everything."], "r": ["Divided power is how the war he lived through began: two authorities each claiming the last word. A lion is one danger and a pack is many.", "The exit clause is the state of nature. You can always go back. People don’t.", "One you can predict beats a thousand you can’t."]}, {"b": "Human beings are fundamentally self-interested", "l": ["That’s either false, since people sacrifice for others, or made true by redescribing every motive as self-interest, which empties it.", "Then Hobbes only wrote the book for himself, and there’s no reason to believe it.", "Hobbes thought people were wolves, and he’d only met Englishmen."], "r": ["He needs less than egoism: only that enough people may be dangerous and nobody can tell which. Distrust alone gets the argument going.", "He wrote it for his own safety and yours. They happened to coincide. That’s the book.", "You lock your door at night. Who do you think is out there, by your account?"]}, {"b": "There’s no justice before the covenant", "l": ["If nothing obliges before the covenant, nothing obliges anyone to keep it. His answer to the man who breaks it when it’s safe has never convinced many.", "A promise only counts if promises already count. He needed the thing to build the thing.", "The social contract: nobody saw it, nobody signed it, everybody owes."], "r": ["His answer is that the man who breaks faith can’t be let into any group that knows it, so he’s betting his life on never being found out.", "Promises count once there’s something to make them count. That’s the thing being built.", "You renew it every day you call the police instead of a cousin."]}, {"b": "Order matters more than liberty", "l": ["The trade assumes the sovereign delivers order. Absolute regimes have been major sources of violence against their own subjects.", "The most orderly place there is, is a cemetery.", "Leviathan is a very long way of saying “do what you’re told.”"], "r": ["He never says the sovereign is safe. He says the alternative is worse, and the worst modern death rates do come from places where the state collapsed.", "A cemetery is what you get without order. That was his whole point.", "It’s a long way of saying what happens when nobody can tell anyone anything."]}], "s": "♚︎"}, {"t": "Rousseau", "k": [{"b": "Man is born free, and everywhere he is in chains", "l": ["The noble savage doesn’t fit the evidence on violence in societies without states, and he admitted the state of nature may never have existed.", "Babies are born unable to hold their own heads up. “Free” is a stretch.", "Man is born free, and Rousseau left all five of his at the orphanage."], "r": ["He says outright that the state of nature is a hypothesis for separating what’s natural from what’s made. The claim it supports is that existing chains are no fact of nature.", "He means no one is born a subject or a master. The baby’s neck was never the claim.", "He said so himself, in print, with shame. The argument doesn’t depend on his being fit to make it."]}, {"b": "The general will is always right", "l": ["With no procedure to tell the general will from the majority’s, or from a ruler’s claim to speak for it, the doctrine licenses coercion in the people’s name.", "If it’s always right there’s no need to vote, and that’s where everyone who used the idea ended up.", "“Forced to be free” is a sentence a person wrote down and kept."], "r": ["He gives conditions: general laws only, no factions, informed citizens, rough equality. Where they fail he says the vote doesn’t express it. Those are demanding standards.", "It’s found by voting. The vote is the procedure. People who skipped the voting weren’t using his idea.", "It means the law you gave yourself can be enforced on you. Every speed limit does it."]}, {"b": "Civilization corrupts natural goodness", "l": ["That the arts and sciences ruined morals is argued from selected history. Trends in health, literacy and violence point the other way.", "He wrote that for an essay contest, at a desk, with a pen, and took the prize.", "Rousseau said society ruins people, and every society that took him in came to agree, about him."], "r": ["The later books refine it. Progress in knowledge and comfort is real, and it came with dependence, vanity and inequality. He’s asking about the cost.", "He won an essay contest by saying essay contests make people worse. He knew. That’s the joke, and he was in on it.", "They took him in, lionized him, then threw stones at his house. That’s about what he predicted."]}, {"b": "Property is the origin of inequality", "l": ["Inequalities of status and power exist among foragers with little property, and property rights also support the investment that reduces want.", "The first man to fence a plot also grew more food on it. That part gets left out.", "Voltaire read it and said it made him want to walk on all fours."], "r": ["He separates natural differences from the kind that needs other people’s agreement. Status among foragers isn’t rent, debt or inheritance.", "And then needed guards for it. More food and the first guard arrived in the same season.", "Voltaire made a joke. That was his method with everything he couldn’t answer."]}, {"b": "Education should follow nature", "l": ["The “natural” education is stage-managed in detail by a tutor who arranges the child’s whole world. The freedom is an appearance.", "Kids following nature eat dirt.", "He wrote the great book on raising children, having declined to try it."], "r": ["The tutor arranges the world so the child meets things before words about them. All teaching arranges something, and this kind hides the hand so the child reasons.", "Eating dirt once is how a child learns about dirt. That’s the method.", "He says in the book that a man who can’t do a father’s duty has no right to be one. He knew who he meant."]}], "s": "∪︎"}, {"t": "Machiavelli", "k": [{"b": "It’s better to be feared than loved", "l": ["He adds: only if both can’t be had, and above all avoid being hated. His other book praises republics where rulers depend on the people.", "Feared rulers get poisoned. Loved ones get statues. He didn’t run the numbers.", "Machiavelli wrote the manual on keeping power after losing his job."], "r": ["Yes, that’s the actual view, and it’s better than the slogan: fear without hatred, cruelty used once and briefly, and the people’s support as the only real fortress.", "Loved rulers get poisoned by the people closest to them. He ran the numbers on Rome, emperor by emperor.", "He lost it for serving a republic loyally. Then he wrote down what he’d seen."]}, {"b": "Politics should be judged by results, not private morality", "l": ["Results for whom is the question. If only the prince’s safety counts the view is self-serving, and if the common good counts it’s a morality after all.", "If results are the standard, his own were prison and unemployment. By Machiavelli, don’t read Machiavelli.", "The Prince is a cover letter. He didn’t get the job."], "r": ["He means the survival of the state and the safety of the people in it. A ruler with clean hands who loses the city has failed the people he was responsible for.", "He kept Florence’s republic alive for fourteen years with no army and no money. The exile came when someone else’s troops arrived.", "The best cover letter ever written. Still read after five hundred years."]}, {"b": "The Prince is realism, not a defense of tyranny", "l": ["The reading on which it’s secretly satire has little support in the text. The book advises on taking and holding power, whatever his republican sympathies elsewhere.", "When a book has to be explained as secretly meaning the opposite, the book said it.", "Every guy who says The Prince is satire owns it in hardcover."], "r": ["Agreed, it isn’t satire. It describes what holding power requires so that it can be done with the least cruelty. The moralizing manuals around it described nothing.", "It means what it says: this is how it’s done. Not liking that is different from finding a secret meaning.", "In hardcover, and so do the people who say it’s evil. Somebody’s reading it."]}, {"b": "Skill can master fortune", "l": ["His own model undercuts it. Cesare Borgia is ruined by his father’s death and one misjudgment, and Machiavelli has to call it bad luck.", "His model prince was Cesare Borgia, who lost everything within about a year. That’s the case study.", "Cesare Borgia followed the advice before it was written and died at 31 in an ambush."], "r": ["He says fortune rules about half of what we do. Borgia is the example of how much skill achieves and where it stops, and the chapter says both.", "He built a state out of nothing in three years and was undone by falling ill the week his father died. That’s the half that’s fortune.", "At 31 he’d done more than most dynasties."]}, {"b": "He founded modern political science", "l": ["Hard-headed description of power is older than him, and his method is anecdote from Roman history and recent memory, not anything systematic.", "Science has data. He had stories about Romans.", "Machiavelli is the favorite philosopher of men who manage six people."], "r": ["The step was the question he asked: what actually happens, and what follows from it. Earlier writers described rulers as they ought to be.", "Cases are data. He compared Rome, Sparta, Venice and Florence on the same questions, which is the method.", "And of the six people. They read it to see what he’s up to."]}], "s": "♞︎"}, {"t": "Locke", "k": [{"b": "Mix your labor with something and it’s yours", "l": ["Nozick’s question: if I pour my tomato juice into the sea, do I own the sea or lose my juice? Why mixing labor yields ownership is never shown.", "I painted a fence once. I don’t own the fence. I asked.", "Locke’s theory of property is that whoever got there first and did some gardening owns it forever."], "r": ["The labor argument comes with limits he states: enough and as good left for others, and nothing taken to spoil. The juice case ignores the first.", "You were paid for the fence. You sold the labor. That’s in the theory.", "Whoever worked it and left enough for others. The second clause does a lot."]}, {"b": "Government rests on the consent of the governed", "l": ["Almost nobody has consented. Tacit consent by staying put, as Hume said, is like saying a man pressed onto a ship consents by not jumping overboard.", "Nobody asked me. Nobody asked anyone. The consent is theoretical and the taxes aren’t.", "Tacit consent: you agreed by being here. Check the terms and conditions of standing on a road."], "r": ["Tacit consent is his weak point. The standard it sets isn’t: a government that couldn’t be justified to the people under it has no claim on them.", "Nobody asked, and that’s the test your government is failing.", "Staying is the weak version and he knew it. Full membership, he says, takes express consent."]}, {"b": "There’s a right to revolution when government breaks its trust", "l": ["With no judge of when the trust is broken except the people rebelling, the right amounts to: revolutions are justified when they succeed.", "Who decides the trust was broken? Whoever wins. So it’s a right that’s awarded afterwards, like a trophy.", "Locke defended the right to revolution, published it anonymously, and denied writing it until he died."], "r": ["He answers that the people judge, and that they’re slow to it: they bear a long train of abuses before stirring. Rulers who break the trust are the rebels.", "Whoever wins is who decides under every theory. His says which side was in the right before the result.", "Men were being hanged for manuscripts that said less. Anonymous was prudent."]}, {"b": "Toleration should extend to all peaceful beliefs", "l": ["His own letter excludes Catholics and atheists. The principle is narrower in his hands than in his admirers’.", "All beliefs should be tolerated, except two, which were the two he didn’t like.", "The philosopher of liberty held shares in the Royal African Company and helped write a slave constitution for Carolina."], "r": ["The exclusions were about allegiance to a foreign power and oath-keeping. His own principle, that belief can’t be forced, later overturned both.", "He excluded two groups on grounds that turned out to be false. The argument he built removed the exclusions.", "He did. The same texts were quoted by the people who ended it."]}], "s": "▭︎"}, {"t": "Mill", "k": [{"b": "Power may be used over someone only to prevent harm to others", "l": ["“Harm” is the contested term. Almost any conduct affects others somehow, so the principle settles little until harm is defined, and Mill doesn’t.", "Everything affects somebody. Under the harm principle either nothing’s allowed or the word “harm” is doing a quiet shift.", "The harm principle is “mind your own business,” with exceptions to be announced."], "r": ["He specifies it in practice: harm to interests that ought to be treated as rights. The principle rules out one class of reasons, the person’s own good.", "Affecting someone isn’t harming them. He draws the line at their protected interests, in chapter four.", "With the exceptions listed. Most people don’t get as far as the list."]}, {"b": "Free discussion leads to truth", "l": ["Markets in ideas reward what’s vivid and flattering as much as what’s true. The evidence that open debate reliably sorts them is thin.", "The internet is the freest discussion in history. Check on how the truth is doing.", "Mill thought the best argument wins. He’d never seen a comment section."], "r": ["He never promises truth wins quickly. He says suppression assumes infallibility, and even true beliefs go dead when nobody may challenge them.", "And every correction of those falsehoods is on the same internet. Try the version with a censor.", "He saw the Victorian pamphlet wars. He’d recognize it."]}, {"b": "Experiments in living benefit everyone", "l": ["Some experiments impose costs on children and neighbors who didn’t volunteer, and a society can reasonably decline to run them all.", "Experiments have control groups and ethics boards. He meant “let me do what I want,” with a lab coat on it.", "On Liberty: everyone should be free to live as they like, by a man who spent his career administering India."], "r": ["The harm principle already covers those cases: children and neighbors are others. The liberty is for what’s left over.", "He meant that nobody knows in advance which ways of living are good. A lab coat fits fine.", "He drafted the company’s defense, and its critics won. He then spent a career arguing for the losers of other fights."]}, {"b": "Better Socrates dissatisfied than a fool satisfied", "l": ["The judges are people who’ve known both pleasures, but someone formed by one kind of life can’t fairly sample the other. The test is rigged toward the examiner.", "The fool is satisfied. That’s the whole point of being satisfied. Mill lost and wrote it down as a win.", "“Better to be Socrates dissatisfied” is a sentence only ever said by people who think they’re Socrates."], "r": ["It’s the best test available: ask those who know both. The alternative is a judge who knows one side only.", "The fool doesn’t know what he’s missing. That’s the argument.", "He’d had a breakdown at twenty from a life of pure intellect, and poetry got him out. He’d tried both."]}], "s": "⇥︎"}, {"t": "Adam Smith", "k": [{"b": "The invisible hand turns self-interest into public good", "l": ["It does under conditions he listed and his admirers skip: competition, information and no power to rig the game. He was scathing about merchants.", "If self-interest produced public good, burglars would be philanthropists.", "The invisible hand appears once in The Wealth of Nations. One time. In a book of a thousand pages."], "r": ["That is the claim: under competition and with justice enforced, self-interest serves the public. The conditions are part of it, and he listed them.", "Burglary isn’t exchange. He said self-interest within the rules of justice, and it’s in the sentence.", "Once was enough. Newton states the law of gravity once too."]}, {"b": "The division of labor is the source of wealth", "l": ["He also wrote that it makes the worker as stupid and ignorant as a human can become, and called for public schooling to offset it.", "He said the pin factory makes pins faster and makes the men idiots. Same book. Nobody quotes the second half.", "Smith’s proof of capitalism is a factory that makes pins."], "r": ["He saw the cost and prescribed the remedy in the same book: public education. Naming a trade-off and paying for the fix is what you want from an economist.", "Same book, and then he says what to do about it. That’s the half his critics don’t quote.", "Eighteen operations, ten men, forty-eight thousand pins a day. It’s a good proof."]}, {"b": "Markets work best left alone", "l": ["He supported regulation of banks, usury limits, public works and taxes that fall on the rich. The laissez-faire Smith is a later invention.", "Smith wanted bank regulation and progressive taxes. His fans haven’t read him. He’s the Marx of the right.", "Everyone who cites Adam Smith has read the same one paragraph."], "r": ["He’s for markets freed from the privileges merchants arrange for themselves, with a state that does justice, defense and public works. The cartoon belongs to his fans.", "Smith is against monopoly, tariffs and merchants writing the law. That’s still the right-wing position where there is one.", "The book is a thousand pages and every one of them is against somebody’s subsidy."]}, {"b": "Sympathy is the basis of morality", "l": ["Sympathy is partial and fades with distance. He patches it with an imagined impartial spectator, who brings in a standard sympathy doesn’t supply.", "We sympathize with people like us. So it’s a theory of being nice to your friends, which was not in short supply.", "The father of economics lived with his mother."], "r": ["The spectator is built from sympathy: we learn to see ourselves as others see us and correct for bias. The standard grows out of the feeling.", "We start with friends and learn to imagine a stranger watching. That’s how anyone has ever become fair.", "And wrote two of the most important books of the century at her house."]}], "s": "☞︎"}, {"t": "Hayek", "k": [{"b": "No planner can have the knowledge that prices carry", "l": ["Prices miss what isn’t traded, like pollution and future generations, and large firms plan internally at vast scale without collapsing.", "Walmart is a planned economy bigger than most countries. It plans every shelf. Somebody tell the knowledge problem.", "Hayek proved central planning is impossible, and then logistics software happened."], "r": ["Firms plan inside a market that tells them, through profit and loss, when the plan is wrong. Take that away and you have the plan without the correction.", "Walmart buys and sells at market prices and loses money when it guesses wrong. The prices are what it plans with.", "The software runs on prices set by rivals. Remove them and it has nothing to optimize."]}, {"b": "Economic planning is the road to serfdom", "l": ["Postwar Western Europe built large welfare states with heavy planning and stayed free. The slide he predicted didn’t happen.", "Sweden’s been on the road to serfdom for ninety years. Lovely road. Bike lanes.", "The Road to Serfdom predicted Britain would turn totalitarian. It got the NHS."], "r": ["The book warns about central direction of production. He says in it that a safety net and regulation are compatible with freedom, and Europe built those.", "Sweden has free trade, private firms and school vouchers. That’s the road he recommended.", "He supported a basic minimum and health insurance in that book. Britain nationalized steel and reversed it."]}, {"b": "Social order emerges spontaneously, without design", "l": ["Markets rest on designed institutions: property law, courts, central banks. “Spontaneous” order had a lot of drafting behind it.", "Nothing about a stock exchange is spontaneous. It has a rulebook and a building.", "Spontaneous order: nobody planned it, except all the people who wrote the laws."], "r": ["He includes law in the order: common-law rules grown case by case, which no one drafted whole. Legislation tidies what custom found.", "The rulebook records practices traders had already worked out. It came after.", "The laws were mostly writing down what people were already doing."]}, {"b": "“Social justice” is a mirage", "l": ["That no one intended a distribution doesn’t make it beyond assessment. We judge unintended outcomes of systems we could change all the time.", "Nobody intended traffic deaths either, and there’s still a department for it.", "He said liberty mattered most, and he preferred a liberal dictator to a democracy that wasn’t liberal. He said that about Chile, out loud."], "r": ["We can judge and change rules. His point is that calling an unplanned outcome “unjust” implies a culprit, and it licenses someone to assign shares.", "Traffic deaths get reduced by rules that apply to everyone. He’s for that. He’s against deciding who should arrive first.", "It was a bad thing to say. His argument against central planning doesn’t depend on it."]}], "s": "¤"}, {"t": "Arendt", "k": [{"b": "Evil can be banal", "l": ["Later research suggests Eichmann was a committed ideologue who performed the dull clerk at trial. The thesis may fit some functionaries and not its famous example.", "The recordings came out. He was a true believer and proud of it. She watched a performance and reviewed it as real.", "The banality of evil is the most quoted idea ever based on misjudging one man in a glass booth."], "r": ["She may have misread Eichmann. The thesis doesn’t need him: most of the people who made it run were clerks, drivers and schedulers who never asked.", "A true believer who talks entirely in clichés and office-speak is still her specimen.", "Take him out and the camps were still staffed by thousands who were only doing a job."]}, {"b": "Totalitarianism is a wholly new form of government", "l": ["Putting Nazism and Stalinism under one concept flattens deep differences in ideology and structure, and historians of each have resisted it.", "Every tyranny in history felt new to the people in it. She had a better publisher.", "“Unprecedented” is what every generation calls its own disasters."], "r": ["She compares structures: terror as a method, ideology as logic, the camps as the central institution. The two differed in content and matched on those.", "Tyrants wanted obedience. These wanted to remake what a person is, and built institutions for it.", "She gave reasons, at five hundred pages."]}, {"b": "Politics is action among equals, distinct from the social", "l": ["Separating the political from questions of poverty and work leaves politics oddly empty, and she was criticized for what that separation made her say about schools and welfare.", "Politics that isn’t about who gets what is a book club.", "Arendt’s ideal politics is ancient Athens, minus the part where most people there couldn’t take part."], "r": ["The distinction protects something: a space where people decide together as equals, which administration by experts can’t supply. She misapplied it in places.", "Who gets what can be settled by a spreadsheet. Whether we’re the kind of people who settle it that way is politics.", "Athens for the form. She’s explicit that the question is how to have it without the exclusions."]}, {"b": "Thinking is what guards against evil", "l": ["Highly educated, reflective people have joined and led terrible movements. Whate
