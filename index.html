false", "l": ["The argument spreads. Rules about what one ought to believe are as strange as moral ones, so the error theorist can’t say anyone ought to accept error theory.", "If all moral claims are false then “murder is wrong” is false, so murder isn’t wrong, which is a moral claim, so that’s false too. It deletes itself.", "Error theory says every moral sentence is false, including “you shouldn’t lie about error theory.”"], "r": ["Some error theorists accept it for epistemic norms too. Others note the difference: “ought to believe” can be cashed out in terms of truth, and “ought to do” has nothing similar.", "“Murder is not wrong” isn’t a moral claim, it’s the denial of one. “There are no unicorns” isn’t a unicorn.", "I didn’t say you shouldn’t. I said it’s false."]}, {"b": "Moral judgments express attitudes, not beliefs", "l": ["Moral sentences behave like ordinary true-or-false ones inside arguments and “if” clauses. A semantics that explains this is still a project, not a result.", "People change their moral views after hearing arguments. Nobody has ever been argued out of liking cilantro.", "Emotivism is ethics as booing."], "r": ["It’s a hard technical problem with thirty years of serious answers. That a theory has open problems puts it level with every rival.", "People are argued out of tastes all the time: tell them how the sausage is made. Attitudes respond to facts. That’s the theory.", "It’s booing with reasons. Like yours, minus the metaphysics."]}, {"b": "Evolution explains morality without moral truth", "l": ["Debunking threatens to spread to perception and logic, which evolved too, and a realist can argue that getting morality roughly right was useful.", "Evolution also gave people the belief in evolution. So by that logic it’s false, and the argument goes with it.", "Anti-realists have a lot of opinions about justice for people who think it’s a flavor."], "r": ["Perception and logic pay off only when they’re accurate. Moral beliefs pay off by getting us to cooperate, whether or not anything is there to be accurate about.", "Believing in evolution wasn’t selected for. It showed up in 1859. Believing your family matters most was.", "I have opinions about food too, and I’ll fight you on those."]}, {"b": "You can be one and still condemn atrocities", "l": ["One can, but the condemning is then the voicing of one’s own stance. Whether that’s what people mean by “wrong whatever anyone thinks” is the dispute.", "Condemning something that isn’t really wrong is called acting.", "Anti-realists say nothing is really wrong, and then somebody takes their parking spot."], "r": ["Right, and realists do the same: they voice their stance and add that the cosmos seconds it. The extra clause has never stopped an atrocity.", "An actor doesn’t mean it. I mean it. Meaning it is the part that was ever doing any work.", "I’m against it. I never said I wasn’t. I said the universe doesn’t have a parking policy."]}], "s": "¬"}, {"t": "Deontology", "k": [{"b": "Some acts are wrong whatever the consequences", "l": ["Pushed far enough, with thousands of lives against one small violation, almost everyone gives way. Then the rule was a strong weight, not an absolute.", "So it’s wrong to tell one lie to save a city. A theory that loses a city on a technicality has a bug.", "Deontology is caring more about your own clean hands than about what happens to anyone."], "r": ["Most deontologists hold thresholds: the constraint yields at catastrophe. A weight that holds against ordinary gains and gives only at the extreme is still a different thing from one more cost.", "One lie to save a city is the threshold case, and nearly every deontologist allows it. Try arguing with the view its defenders hold.", "It’s caring about what you do to people, as against what merely happens near you. Those were always different."]}, {"b": "Rights are side constraints, not goals", "l": ["If violating a right is so bad, it’s puzzling why one may not violate one to prevent five identical violations. The constraint needs a ground other than the badness.", "If rights matter, more rights respected is better than fewer. He’s against that. He prefers the one he personally didn’t touch.", "The deontologist lets five rights be violated so his own record stays clean. It’s ethics as a no-hitter."], "r": ["The constraint is about what I may do to you. It was never a quantity to be minimized. Each person holds the right against each agent, and that explains why it doesn’t add up.", "If you may violate one to save five, nobody has a right. Everyone has a place in a calculation that happens to be going their way.", "The one man you’d sacrifice has a view on your record too."]}, {"b": "Intentions matter, not just outcomes", "l": ["The line between intending a harm and merely foreseeing it is easy to redraw by redescribing the act, which makes it a poor guide.", "The road to hell is paved with them. That’s been known for a while.", "“I didn’t intend it, I just knew it would happen” has never worked on anyone’s mother."], "r": ["The line can be gamed, and so can any rule. Used honestly it marks a real difference: the terror bomber needs the deaths and the other would be glad if nobody were there.", "The road to hell is paved with outcomes people were certain justified it.", "It works on her every time you break something by accident. She knows the difference."]}, {"b": "Duties can conflict, and judgment decides", "l": ["A list of duties with no ranking leaves the hard cases to intuition, which is where the theory was supposed to help.", "A theory that says “it depends, use your judgment” when it gets hard is a list, not a theory.", "Deontology has rules for everything except which rule."], "r": ["Judgment is needed in every theory. The other side has to judge what counts as a consequence and how to weigh it, and just hides that inside a number.", "A list that tells you what’s at stake is more than “add it all up,” which tells you nothing until someone supplies the weights.", "Rules for everything except which rule. That part is called being an adult."]}], "s": "⊘︎"}, {"t": "Moral relativism", "k": [{"b": "Morality is relative to culture", "l": ["Cultures aren’t sealed units with one code each. Every society has dissenters, and the view has to say the reformers were wrong by definition.", "Then whoever wanted to end slavery was immoral at the time, since the culture said otherwise. That’s the view. He can keep it.", "Moral relativists become universalists the moment somebody cuts in line."], "r": ["A culture’s code includes its own ideals, and reformers usually appeal to those. The dissenter is holding the society to what it already says.", "The abolitionists argued from the society’s own scripture and its own declaration. They won on home rules.", "Cutting in line is wrong here. I said relative. I didn’t say nothing applies."]}, {"b": "We shouldn’t judge other societies", "l": ["That’s a universal moral rule about what everyone should do, which is what the theory says there aren’t any of.", "“Nobody should judge” is a judgment. Of everybody.", "“Who are we to judge?” asks the person judging people who judge."], "r": ["The careful version makes no such rule. It says that when we judge, we use our own standards, and we should know that’s what we’re doing.", "It’s advice from inside my culture, which values not invading people. I’m allowed to have local values.", "Somebody from here. That’s who."]}, {"b": "Disagreement shows there’s no moral truth", "l": ["People disagreed about the shape of the earth. Disagreement shows that someone is wrong, or that the question is hard.", "People disagree about the restaurant bill too, and there’s still a number.", "Disagreement proves nothing, a point on which there is some disagreement."], "r": ["The argument is from disagreement that survives full information. People with all the facts settled the shape of the earth, and the moral cases don’t go that way.", "The bill has a number because both sides accept arithmetic. Find the moral arithmetic that every party accepts.", "Among the people who’ve looked into it, not much."]}, {"b": "Relativism is the tolerant view", "l": ["If my culture values intolerance, relativism says intolerance is right for me. Tolerance needs a non-relative defense.", "A culture of conquerors is right by its own lights. The tolerant view just endorsed the conquest.", "Relativism: every culture’s values are valid, except the ones that say theirs are better, which is all of them."], "r": ["Tolerance isn’t deduced from it. Someone who sees their own code as one among others has less motive to impose it, and that link is practical.", "It endorsed nothing. It says they think they’re right, which we knew. The view from nowhere that would refute them isn’t available to you either.", "Every one of them says theirs is better. I noticed, and that’s the observation."]}], "s": "⇄︎"}, {"t": "Nihilism", "k": [{"b": "Nothing matters", "l": ["“Matters” might never have needed cosmic backing. Things matter to people, and that may be the only kind of mattering there was.", "If nothing matters, it doesn’t matter that nothing matters, so there’s no reason to say it, and he says it constantly.", "Nihilists believe in nothing and will not stop bringing it up."], "r": ["Mattering to someone is a fact about them. The nihilist’s claim was about whether anything has a claim on us beyond that, and it stands.", "Saying it doesn’t have to matter. Lots of things get said. You’ve confused a remark with a mission.", "You brought it up. I was just standing here."]}, {"b": "There are no objective values", "l": ["From the absence of objective values, nothing follows about what to do, including not caring. Indifference is one more stance needing support.", "If there are no values, “believe what’s true” isn’t one either. So there’s no reason to believe nihilism over anything else.", "Nihilism is the only philosophy where the argument for it is the reason not to bother."], "r": ["Agreed, nothing follows, including indifference. The view is a correction to the metaphysics, and you live as before.", "I believe it because it seems true, the same way I breathe. No value required.", "It never asked you to bother. That’s you."]}, {"b": "The universe is indifferent, so meaning is an illusion", "l": ["The universe isn’t the sort of thing that could care. That it doesn’t is no more a loss than that mountains don’t applaud.", "The universe is also indifferent to math, and the math is fine.", "“In a billion years none of this will matter.” It’s not a billion years from now. It’s Thursday."], "r": ["Fine, drop the disappointment. What remains is that no purpose is built in, and that’s the thesis.", "Math doesn’t need the universe to care because math isn’t asking you to get up in the morning.", "It’s Thursday and none of it will matter in a billion years. Both."]}, {"b": "Facing meaninglessness is the honest position", "l": ["Honesty is being treated as a value that binds, which the position says there aren’t. The pose depends on what it denies.", "If nothing matters, honesty doesn’t. He’s proud of a virtue he just deleted.", "Nihilism is very brave for a view that asks nothing of anyone."], "r": ["Call it a preference for not being fooled. Preferences are allowed. What isn’t on offer is a reason the cosmos backs it.", "I’m not proud. I’m describing. You’re the one handing out medals.", "It asks you to give up the one thing everyone wants to be true. That’s something."]}], "s": "0"}, {"t": "Hedonism", "k": [{"b": "Pleasure is the only thing good in itself", "l": ["People want things besides pleasure: for their beliefs to be true, their friends to be real, their work to have happened. Those seem to matter in themselves.", "If pleasure were the only good, the best life would be a warm bath, and nobody’s written a biography of one.", "Hedonism is the theory that the best person who ever lived was whoever had the best dessert."], "r": ["Take away any experience of it and ask what those things add. A truth you never learn and a friend you never enjoy leave no trace in the life.", "Add a book, a friend and a view to the bath. All pleasures. The theory was never just the warm water.", "The best life is the one that felt best to live. Say what’s wrong with that without mentioning how anything feels."]}, {"b": "Everything we want, we want for the pleasure", "l": ["People sacrifice their own pleasure knowingly, for children or causes. Saying they must be getting pleasure from it makes the claim true by definition.", "People run marathons. Explain that one with pleasure.", "“You only do nice things because it feels good” is something a person says once, at dinner, and is not invited back."], "r": ["The parent would be miserable doing otherwise. Motivation through one’s own feelings is a finding about how brains work, and it isn’t true by definition.", "Ask a runner at the finish line whether it was worth it. They say it felt incredible.", "It’s true, and that’s why nobody wants to hear it at dinner."]}, {"b": "Pain is the only thing bad in itself", "l": ["Being deceived, betrayed or wasted seems bad for a person even if they never find out and feel nothing.", "Exercise hurts and it’s good. Medicine tastes bad and it’s good. He’s 0 for 2 before breakfast.", "So the worst thing that can happen to a life is a stubbed toe, as long as it’s a bad one."], "r": ["Being deceived is bad because of what it risks and how it feels to find out. A deception with no effect on any experience, ever, is hard to call a harm to anyone.", "Exercise and medicine are good because of how you feel later. You’ve made my argument with my examples.", "A bad enough toe, for long enough, yes. You’ve obviously not had the right toe."]}, {"b": "The wise hedonist picks the calm, lasting pleasures", "l": ["Once pleasures are ranked by something other than amount, a second standard has come in, and it’s doing the real work.", "“The best pleasure is moderation and reading.” That’s not hedonism, that’s a librarian.", "Every hedonist philosopher ends up recommending a quiet life, which is how you know none of them tried the other kind."], "r": ["The ranking is by amount over a lifetime. Calm pleasures win because they last and cost nothing afterwards, so one standard is doing all of it.", "The librarian is still enjoying herself at eighty. Check on the other guy.", "Several tried the other kind first. That’s how they knew."]}], "s": "♡︎"}, {"t": "Egoism", "k": [{"b": "Everyone always acts in their own interest", "l": ["Either it’s false, since people sacrifice for others, or “interest” is stretched to cover whatever anyone does, and the claim says nothing.", "Soldiers jump on grenades. “He wanted to” isn’t self-interest, it’s the theory eating the evidence.", "“Everyone’s selfish, really” is something people conclude from a sample of one."], "r": ["The unselfish act still comes from the agent’s own motives. The live question is whether any of those motives has another person’s good as its final object, and the evidence is disputed.", "He couldn’t have lived with himself. That’s a motive, and it’s his.", "A sample of everyone I’ve met, including the ones who objected."]}, {"b": "You ought to pursue your own good", "l": ["If everyone ought to pursue their own good, I should want you to pursue yours even against mine, which isn’t in my interest to recommend.", "A real egoist wouldn’t tell anyone. He’d want everyone else to be altruists. Publishing it is the least egoist thing possible.", "Ethical egoism is the only moral theory it’s irrational to teach."], "r": ["The theory says what each person has most reason to do. It needn’t say I should want you to succeed, any more than a chess player wants his opponent to find the best move.", "An egoist who publishes thought the book would sell. Consistent.", "Irrational to teach and perfectly rational to believe. Those are different jobs."]}, {"b": "Helping others is just enlightened self-interest", "l": ["Sometimes it is. But the cases that test a moral theory are the ones where helping costs and nobody will know.", "If it’s all self-interest, anonymous donations are a bookkeeping error.", "“Enlightened self-interest” is being nice and wanting credit for being cynical about it."], "r": ["Even there, people act from the kind of person they want to be and from habits that pay off on the whole. Character is a long-run investment.", "Anonymous donors still know. The audience was always inside.", "Being nice and knowing why. You should try the second half."]}, {"b": "Altruism is a disguise for wanting to feel good", "l": ["That we feel good after helping doesn’t show the feeling was the aim. Usually people feel good because they got what they wanted, which was the other person’s welfare.", "People feel good after helping because they wanted to help. The feeling is the receipt, not the purchase.", "The guy who says charity is selfish has found a way to do neither."], "r": ["If the helper wanted the other’s welfare and got it, she got what she wanted. That is the structure of self-interested action, with a kind object.", "A receipt you’d stop buying without. Take away the good feeling and see how much charity is left.", "He does both, and doesn’t lie about why."]}], "s": "Ⅰ"}, {"t": "Moral luck", "k": [{"b": "We’re judged for things outside our control", "l": ["One response is that we shouldn’t be. The drunk driver who hits no one is as blameworthy as the one who does, and practice is just crude.", "Then nobody’s responsible for anything, since nobody controlled being born. Courts tried ignoring that argument and it went fine.", "Moral luck is the discovery that some people get away with it."], "r": ["If we shouldn’t be, most of our practice is wrong: we do blame the driver who kills more. The puzzle is that both verdicts feel right.", "It follows only if you require control over everything. The point is that we never had it and still judge. Courts are the evidence.", "It’s the discovery that you can’t say why they shouldn’t."]}, {"b": "The reckless driver who kills is worse than the one who doesn’t", "l": ["Many deny this. Both took the same risk with the same mind, and the difference is in what we have to respond to, not in desert.", "One of them killed someone. That’s the difference. It’s a big one. Ask the someone.", "Philosophers needed two essays in 1976 to notice that results matter to people."], "r": ["Then the lucky driver should feel what the unlucky one feels, and nobody thinks so. Regret tracks what you did, and what you did includes what happened.", "That’s the claim. One of them killed someone, and that it mattered is what’s being pointed out.", "Williams and Nagel noticed that it matters and that our theories say it shouldn’t. The second part is the news."]}, {"b": "Who you are is itself a matter of luck", "l": ["If character is luck too, nothing is left for anyone to be responsible for, and the claim proves too much to guide anything.", "If who I am is luck, there’s no me left to be lucky. He deleted the person and kept the complaint.", "“It’s all luck” is always said about someone else’s success and never about one’s own."], "r": ["Too much is exactly the worry Nagel raises: follow the control principle through and the agent shrinks to nothing. He offers it as the problem.", "That’s the conclusion, and it’s Nagel’s, stated as a paradox. You’ve reached the end of the essay.", "It’s said about one’s own, and that’s called humility."]}, {"b": "Kant was wrong that the good will is immune to luck", "l": ["A Kantian can grant that outcomes affect what we owe, like apology and repair, while holding that worth depends on the will.", "Kant said only intentions count. Everyone who has ever received an apology for an accident knows what he meant.", "The moral luck debate is two professors agreeing that life is unfair and disagreeing about the footnotes."], "r": ["If outcomes change what we owe, they change the moral situation. Saying they leave “worth” untouched keeps the word and gives up the substance.", "The apology is for the outcome. If only the will mattered there’d be nothing to apologize for.", "Whether life’s unfairness reaches morality is not a footnote."]}], "s": "⚀︎"}, {"t": "Human rights", "k": [{"b": "Rights belong to all humans by nature", "l": ["Bentham called natural rights nonsense upon stilts. Without an account of where they come from, “by nature” asserts what needs showing.", "Nature gave people appendixes and wisdom teeth. Nobody’s found the rights. Surgeons would have mentioned it.", "Human rights are self-evident, which is why they had to be written down in 1948 and argued over ever since."], "r": ["They can be grounded in what any person needs in order to act at all: freedom and well-being. An agent can’t coherently claim those for himself and deny them to others.", "Nobody’s found the number seven in a body either.", "Self-evident things often take a catastrophe before anyone writes them down."]}, {"b": "They’re universal, not Western", "l": ["The list reflects a particular history and its drafters’ priorities, and the weight given to individual over communal claims isn’t shared everywhere.", "A universal thing shows up everywhere. This one showed up in one place, recently, and then got mailed out.", "Universal rights, as agreed by a committee in a hotel."], "r": ["The drafting committee included a Chinese Confucian and a Lebanese Arab, and delegates from four continents signed. People everywhere have since claimed them against their own governments.", "Gunpowder showed up in one place too. Where an idea started doesn’t limit where it’s true.", "A committee from China, Lebanon, Chile, France and the rest. That’s what universal looks like in a hotel."]}, {"b": "Rights are trumps over the common good", "l": ["Rights conflict with each other constantly, so they can’t all be trumps, and the weighing that follows looks a lot like consulting the common good.", "If two trumps are played, somebody has to count points. The counting is the thing he said rights avoid.", "Everything is a human right now, which is the same as nothing being one."], "r": ["Rights limit which reasons a government may act on. When two conflict, the weighing is between rights, and “it would be better on the whole” stays excluded.", "Two trumps get compared with each other. The common good still doesn’t get to play a low card over either.", "The core list fits on a page. Inflation at the edges doesn’t cancel the page."]}, {"b": "A right exists even where it isn’t enforced", "l": ["A right nobody can claim against anyone is hard to tell from a wish. On one view rights are the creatures of institutions that back them.", "A right nobody enforces is a nice sentence. Ask anyone holding one.", "“You have rights” is what people are told right before finding out who enforces them."], "r": ["People are imprisoned in the name of rights their state denies, and we don’t say they had none. The claim on others comes first, and enforcement is what we owe it.", "A right nobody enforces is what every reform movement started with. Then somebody enforced it.", "And the name of the thing they were owed is how anyone knew it was wrong."]}], "s": "∀︎x"}, {"t": "The repugnant conclusion", "k": [{"b": "A huge population of barely-worth-living lives can be better", "l": ["Most take that verdict as a refutation of the reasoning that leads to it, and reject one of the premises about adding lives.", "If more barely-okay lives is better, the ideal world is an airport. Forever. With everyone in it.", "Total utilitarianism: the best possible future is everyone who could exist, standing in line."], "r": ["The reasoning uses steps each of which seems undeniable. Rejecting the conclusion means rejecting one of them, and nobody has found one that’s cheap to give up.", "The airport has more total good than a perfect village of ten. Disliking the picture isn’t an argument about the sum.", "A line of people each glad to be alive. You wouldn’t delete any one of them."]}, {"b": "Rejecting it costs you something just as bad", "l": ["The impossibility results show every theory violates some intuition. That might mean our intuitions about huge numbers aren’t reliable enough to build on.", "Every option is terrible, so the terrible one is fine. That’s not ethics, that’s choosing an internet provider.", "Population ethics is a field where every paper proves the last paper’s theory is monstrous."], "r": ["That may be the lesson. But then no intuition in this area can be used against any theory, including the one we started with.", "Choosing among costs is all of ethics. The theorems only show there’s no free option.", "Every paper shows the last one had a cost, and that’s how the field knows the true price list."]}, {"b": "We should just accept it", "l": ["Accepting a conclusion named “repugnant” because the math led there treats the formal premises as more certain than the judgment they offend.", "The argument has “repugnant” in the name and his answer is “yes.” Somebody should check on him.", "Some philosophers bit the bullet. It’s the only field where that’s a career move."], "r": ["Our sense of large numbers is known to be unreliable, and the premises are simple, separately tested judgments. Trusting the plain steps over the vivid picture is defensible.", "The name was given by the man who couldn’t refute it. A name isn’t a premise.", "Biting the bullet when the argument is valid is the job description."]}, {"b": "Lives just above zero are better than they sound", "l": ["Redescribing the lives as fine blunts the case, but then the conclusion just says a big good world beats a small great one, and the puzzle returns with adjusted numbers.", "“Muzak and potatoes isn’t so bad.” He’s now defending the potatoes. The argument has gotten away from him.", "Parfit spent forty years looking for a theory that avoids it and called the missing theory X. It’s still missing."], "r": ["The adjustment matters. If those lives are good ones, the “repugnance” was a trick of the word “barely,” and what remains is a preference for small elites.", "He’s pointing out that a life with music and food in it is a life. Billions would take the deal.", "Forty years and he never stopped believing it existed. Most theories that can’t be found aren’t looked for that long."]}], "s": "Z"}]}, {"n": "How to Live", "s": "→︎", "t": [{"t": "Effective altruism", "k": [{"b": "Give where a dollar does the most good", "l": ["Cost-effectiveness estimates carry wide uncertainty and favor what can be measured. Political and structural change resists the method and gets underweighted.", "The most good per dollar is a number in somebody’s spreadsheet, and it changes every year. Last year’s best charity is this year’s mistake, by their own blog.", "EA is charity by people who think nobody tried being smart about it before."], "r": ["The uncertainty is why you measure, and the estimates are published with their error bars. “Hard to compare” was the old excuse for never comparing.", "The number changes because they update on evidence and say so in public. Find another charity sector that announces its own mistakes.", "People had tried being generous. Checking whether it worked was the new part."]}, {"b": "Earning to give can beat direct work", "l": ["It discounts how a career shapes a person’s values and assumes the harms of the earning are small. The movement’s own leaders walked the advice back.", "If everyone earned to give, nobody would be left to do the thing the giving pays for. It only works if most people ignore it.", "“Earning to give” is taking the finance job with a note from philosophy."], "r": ["It was always advice for a few people with unusual earning power, and they did walk it back for most. A movement that revises its advice is working as intended.", "If everyone became a doctor there’d be no farmers. Advice at the margin is for the next person, and it always was.", "The note says the job pays for thirty thousand bed nets a year. What does yours say?"]}, {"b": "Future people matter as much as present ones", "l": ["Grant them equal weight, and our ability to predictably affect the far future is still tiny. Expected value with astronomical stakes turns fanatical.", "Future people don’t exist. Things that don’t exist have zero interests. Zero times a trillion is still zero.", "EA cares deeply about people in the year 9000, and shrimp."], "r": ["Being unable to predict most effects is a reason to pick the few robust ones, like not going extinct. The weight of the future survives the uncertainty.", "Your grandchildren don’t exist either. Tell me they don’t count and then tell them in forty years.", "The shrimp are alive now. So that’s two different complaints."]}, {"b": "AI risk is the most pressing cause", "l": ["The ranking rests on probability estimates nobody can check, and the money flows into a field where the donors have commercial interests.", "Every generation’s smartest people were sure about their apocalypse, and they’re 0 for all of them. The base rate for doom is zero.", "It started with malaria nets and ended up funding essays about robot gods."], "r": ["The estimates are rough, and the people building the systems give similar ones. A small chance of something irreversible is how seatbelts and fire codes are justified.", "Every generation before 1945 was right that nothing could end the world. Then there was a button. Base rates change when the hardware does.", "Malaria nets are still the biggest line in the budget. The essays are just the part you read."]}, {"b": "One fraudster doesn’t discredit the ideas", "l": ["Fraud doesn’t refute a moral theory. But naive expected-value thinking was live in the culture, and warnings about him were raised early and set aside.", "He did the math in public, the movement checked it and took the money. When the calculator is wrong at that size, it’s the calculator.", "The movement’s biggest donor went to prison, which the expected value math somehow didn’t flag."], "r": ["The culture needed fixing and that’s been said in public, at length. The claim stands that the ideas forbid fraud: the founding texts say plainly not to do harm for the greater good.", "The math said don’t commit fraud. It’s in the book, with his endorsement on the cover. He didn’t follow it.", "Neither did his auditors, his investors or the regulators. The philosophers were the last to be asked."]}], "s": "⅒"}, {"t": "Trolley problem", "k": [{"b": "Pull the lever: five outweigh one", "l": ["The same arithmetic recommends pushing the man off the bridge. Most who pull the lever balk there, so numbers alone aren’t their principle.", "The one guy was safe until someone touched the lever. Before that it was an accident. After, it’s a killing with a witness.", "Don’t touch anything. Then it’s the trolley company’s fault."], "r": ["That’s the finding. People who pull aren’t pure counters, and the cases exist to find out what else is in there.", "He was safe because five others weren’t. Letting the track decide is still deciding, and you were the one standing at the lever.", "You were standing right there. The company has you on camera."]}, {"b": "Pushing the man is different from the lever", "l": ["The usual explanations stumble on the loop case, where the lever uses the one man as a means and people’s verdicts drift back.", "Dead is dead. The family doesn’t ask which muscle group was involved.", "Pushing the guy is the same as pulling the lever. The only difference is cardio."], "r": ["The loop case shows the simple account is wrong. That’s a case refining a principle, and it’s the method doing its work.", "The law asks exactly that. Murder and manslaughter differ by what you meant and how you did it, and families care a lot.", "Then you’d push him. Say it out loud, to him."]}, {"b": "The cases reveal principles of moral thinking", "l": ["Answers shift with framing, order and physical contact. One reading is that the footbridge reaction is an emotional alarm, not a principle.", "The cases reveal what undergraduates say for course credit at nine in the morning.", "The trolley problem is a personality quiz that got into journals."], "r": ["An emotional alarm that fires for up-close harm and stays quiet for remote harm is a discovery about moral thinking. The cases produced it either way.", "The pattern replicated in forty-two countries. It’s not the undergraduates.", "Personality quizzes don’t replicate across forty countries."]}, {"b": "Idealized cases isolate what matters", "l": ["Removing uncertainty, relationships and other options may remove exactly what makes real decisions moral ones.", "A problem where nobody can yell, brake, or ask why six people are on a track has removed the variables. All of them.", "Why are they on the tracks? Nobody asks."], "r": ["Every experiment strips things out, and that’s how one factor gets studied at a time. What real decisions add can then be put back one piece at a time.", "Physics removed friction and air and got the laws of motion. Removing variables is what an experiment is.", "Because it’s a thought experiment. Nobody asks why the frictionless plane has no friction."]}, {"b": "It matters for triage and self-driving cars", "l": ["Real triage runs on protocols and probabilities, and engineers treat forced-choice crashes as vanishingly rare next to ordinary safety work.", "Millions of people answered the survey about who the car should hit, and the cars used none of it.", "Self-driving cars were supposed to need it. They just brake."], "r": ["The dilemma is rare. What it stands for is not: any policy that sets how to trade risks between groups, from triage rules to speed limits, has that structure.", "The cars are programmed with a priority order for who to protect. Somebody chose it. They just didn’t hold a survey first.", "Braking is a choice about who gets hit when braking isn’t enough."]}], "s": "⋎︎"}, {"t": "Veganism", "k": [{"b": "Animal suffering matters morally", "l": ["Grant it, and how much it weighs is still contested. Views that tie moral status to reasoning or reciprocity give animals some consideration without equal consideration.", "Suffering needs someone who knows they’re suffering. A chicken doesn’t know it’s Tuesday.", "Plants feel pain too."], "r": ["Even at a steep discount the numbers decide it: tens of billions of land animals a year, most in conditions nobody defends, for a pleasure that has substitutes.", "A baby doesn’t know it’s Tuesday. Pain doesn’t need a calendar.", "Then eat the plants directly. The cow eats ten times as many."]}, {"b": "No trait justifies eating them and not us", "l": ["The challenge assumes moral status has to rest on a single trait. Accounts based on species or relationships deny that.", "The trait is being human. It’s on the form. Every other animal sides with its own species too, and nobody calls a wolf a bigot.", "“Name the trait.” Tasty."], "r": ["A species-norm account has to say why membership matters when the capacities are absent. “Because they’re ours” is the claim under examination.", "“It’s on the form” is what every in-group has said about every out-group. The wolf isn’t offering it as an argument.", "Then you’d eat anything that tastes good. Name the limit."]}, {"b": "A plant-based diet is perfectly healthy", "l": ["Well planned, it is, though it needs supplements. And healthy doesn’t mean obligatory. The health case and the moral case are separate.", "People who went vegan and felt great had also stopped eating gas station food. That’s the variable.", "Humans have canines. That’s what they’re for."], "r": ["Agreed, they’re separate cases. Health only shows the moral case costs nothing important, which removes the last practical excuse.", "They stopped the gas station food and the meat and felt great. You can’t claim one variable and wave off the other.", "Gorillas have bigger ones and eat leaves."]}, {"b": "Animal farming is an environmental disaster", "l": ["The emissions and land use are large. That supports cutting back and reform, and grazing on land that can’t grow crops doesn’t compete with food.", "Cows eat grass and grass grows back. It’s the only industry that runs on lawn.", "Harvesting crops kills more animals than a cow does. Mice count."], "r": ["Reduction and reform is most of what’s being asked for. Grazing on land that can’t grow crops supplies a small share of what people eat.", "The grass grows back and the methane goes up. Most of them never see the lawn. They’re fed soy from a cleared forest.", "Most crops are grown to feed the cow. Fewer cows, fewer dead mice. Thank you for the argument."]}, {"b": "If you wouldn’t do it to a dog, don’t do it to a pig", "l": ["The consistency point is strong, though it can be settled in either direction, and duties to animals people live with may come from the relationship.", "Dogs have jobs. Pigs were offered truffle hunting and it’s a small field.", "Lions eat meat."], "r": ["If the relationship is what protects the dog, then pigs are fine to harm only because nobody bothered to know one. That’s a fact about us.", "Pigs outscore dogs on every cognition test going. If it’s about ability, we’ve been eating the wrong one.", "Lions also kill their rivals’ cubs. Pick a different role model."]}], "s": "❦︎"}, {"t": "Antinatalism", "k": [{"b": "Coming into existence is always a harm", "l": ["Benatar counts absent pain as good though it’s good for no one, and absent pleasure as not bad because it’s bad for no one. Critics say the two must be treated alike.", "Harm needs a before and an after. There’s no before. He’s comparing a life to a blank and saying the blank won.", "Missing out on joy is fine if nobody’s there to miss it, but avoiding pain is good even if nobody’s there to enjoy that. Convenient."], "r": ["The asymmetry explains judgments nearly everyone shares: we have a duty not to create a miserable child and no duty to create a happy one. Reject it and those need another explanation.", "You make that comparison whenever you say someone would have been better off never born. Everybody has said it about somebody.", "It’s not convenient. It’s how you already think about a child who’d be born into agony."]}, {"b": "No one consents to being born", "l": ["Consent applies to existing beings whose interests can be set back. Before conception there’s no one whose consent is missing.", "Nobody consents to being fed as a baby either. By this standard every parent is running a hostage situation with snacks.", "“Nobody consents to being born.” Nobody consents to not being born either."], "r": ["Where consent can’t be had we may act for someone only to spare them harm. Pulling a person from a fire qualifies. Starting a life to give it benefits doesn’t.", "The baby already exists and needs feeding. You rescue the people who are here. That’s not a reason to make more who’ll need rescuing.", "Nobody is there to be wronged by it. That was the point."]}, {"b": "Life is worse than people admit", "l": ["The view needs most people to be wrong about their own lives, and people’s own reports are among the better evidence there is about how lives go.", "People were asked. They said it’s fine. The study’s over.", "Ask people if they’re glad they were born and most say yes. Benatar says they’re wrong about their own lives."], "r": ["Self-reports are bent by known biases, including rosy memory and adapting to anything. The reports measure how people cope, which is different from how the life goes.", "Ask during the dentist, the commute, the 3 a.m. and the funeral. The study only called at lunch.", "People are wrong about their own lives constantly. Ask them how much they exercise."]}, {"b": "Extinction by not having children would be good", "l": ["Even granting the argument, the last generations would have it very hard, and many hold that the continuation of human projects matters in itself.", "A philosophy whose best outcome is nobody left to agree with it has a marketing problem and a logic problem, and they’re the same problem.", "Antinatalism solves itself in about eighty years."], "r": ["He grants the last generations would suffer, which is why the argument is about phasing out and takes no position against anyone already here.", "A view isn’t false because it won’t spread. Most true things have terrible marketing.", "Every solution you’ve got also takes eighty years and then needs doing again."]}, {"b": "It’s wrong to gamble with someone else’s life", "l": ["Ordinary morality allows imposing risks on people who can’t consent when the expected benefit is high, as in rescuing someone unconscious.", "Not having the kid is a gamble too. It bets the kid would have been miserable, at worse odds.", "Antinatalism is the only philosophy that can’t recruit its own kids."], "r": ["The rescue is for someone who exists and has something to lose. Creating the person who’ll then need rescuing is the step that needs justifying.", "Lose that bet and nobody is worse off. Lose yours and somebody is. Those aren’t the same wager.", "Neither can celibate monks, and there are still monks."]}], "s": "⊖︎"}, {"t": "Peter Singer", "k": [{"b": "If you’d save the drowning child, you must give", "l": ["The cases may differ in ways that matter: one emergency in front of you, against an open-ended condition where the demands never end and the duty is shared.", "The pond is one child, once. Charity is every child, forever. That’s a different pond. It’s the ocean.", "Singer goes from a ruined pair of shoes to owing everything forever. It’s a big jump from shoes."], "r": ["Each difference can be tested by changing the pond: add other bystanders, repeat it daily. Most people still think you should wade in.", "The ocean is made of ponds. Nobody said to save all of it. He says the next one’s still there after you’ve walked past.", "It’s a small jump. You’ve just never been asked to make it twice."]}, {"b": "Distance is morally irrelevant", "l": ["Distance can track things that do matter, like relationships, knowledge and the ability to help reliably, even if miles as such don’t.", "If distance didn’t matter, people would feel the same about a stranger’s dinner as their own kid’s. They don’t, and feelings are the data in ethics.", "Distance doesn’t matter morally, says the man in Princeton."], "r": ["Those things matter, and the argument allows for them. Where help is reliable and cheap, as it now is, the miles left over do no moral work.", "Feelings said the same about people of another village, then another country. The data kept being wrong in one direction.", "He gives away about a third of what he earns. From Princeton."]}, {"b": "Speciesism is like racism", "l": ["Race marks no morally relevant difference in capacities and species often does, so the analogy fails where it needs to hold.", "Every species is speciesist. It’s the one thing all of them agree on, which makes it the closest thing nature has to a moral law.", "“Speciesism” is a word invented to make liking people sound like a crime."], "r": ["Where species tracks a real difference in capacity, the difference counts. The claim is that membership counts for nothing by itself, exactly as with race.", "Nature’s moral laws include eating your young. He isn’t taking nominations from the floor.", "Every word for a prejudice was invented by somebody. That’s how it got noticed."]}, {"b": "Equal interests deserve equal consideration", "l": ["It needs a way to compare interests across very different minds, which nobody has, and many reject where the principle leads at the edges of human life.", "A mosquito has an interest in my arm. Equal consideration, it gets a vote. Two mosquitoes and I’m outvoted.", "The circle keeps expanding. Shrimp now. Thermostats soon."], "r": ["We compare interests across humans who can’t tell us anything, like infants, and manage. Rough comparison is enough when one side is a taste and the other a life.", "Equal consideration of equal interests. Its interest in a meal against your interest in not itching. Yours wins. That’s the principle applied, not refuted.", "Thermostats have no interests. Shrimp might. That’s the line, and it’s a principled one."]}, {"b": "Preference utilitarianism gets ethics right", "l": ["Satisfying preferences counts uninformed and malicious ones unless they’re filtered, and the filters bring in values from somewhere else. Singer himself later dropped it.", "He switched to the pleasure version in 2014. So for forty years it got ethics wrong, by his own account, during the famous part.", "Singer is Bentham with a publicist."], "r": ["He changed his mind in public when an argument beat him. The practical conclusions barely moved, which suggests they never hung on the fine print.", "Forty years, one revision, announced by him. Name another moral philosopher who’s reported a mistake.", "Bentham with a publicist has moved more money to the poor than every critic combined."]}], "s": "⊚︎"}, {"t": "Ayn Rand", "k": [{"b": "Rational self-interest is the moral ideal", "l": ["The argument slides from survival to a rich idea of flourishing and never shows that other people’s interests give me no reasons.", "If selfishness were a virtue, toddlers would be saints.", "Objectivism is the philosophy of a teenager who just found out about taxes."], "r": ["Flourishing for a rational being requires dealing with others by trade and not by force. Their interests enter as the terms on which she can live among them.", "Toddlers are whim-driven, and she spent a thousand pages saying whim isn’t self-interest. Rational is the word you skipped.", "Most people do find out about taxes as teenagers. Some of us kept caring."]}, {"b": "A is A: reality is objective", "l": ["Nobody disputes the law of identity, and nothing substantive follows from it. Getting from “A is A” to capitalism takes other premises, and those do the work.", "A is A, and nobody learned anything, because it was already A.", "A is A. Nobody disagreed."], "r": ["The axiom works as a ban on wanting contradictions: wealth without production, effects without causes. The politics is that ban applied.", "Half of politics is people demanding that A be B by next quarter. It needed saying.", "And then everybody disagreed with everything that followed from it."]}, {"b": "Laissez-faire is the only moral system", "l": ["The case assumes all interference is the use of force and that people’s starting holdings are just. Public goods and spillovers are waved off.", "No country has ever tried pure laissez-faire. A system nobody has ever chosen isn’t the only moral one, it’s the only untested one.", "She took the Social Security checks in the end."], "r": ["The argument is moral before it’s economic: no one may start the use of force. Spillovers are handled as rights violations, through courts.", "Every step toward it made the countries that took it richer. A curve that points one way the whole length is a test.", "She paid in for forty years and said taking it back was restitution. It’s in an essay, with reasons."]}, {"b": "Altruism is evil", "l": ["She defines altruism as total self-sacrifice and then condemns ordinary kindness by association. Nobody defends the view she attacks.", "Parents are altruists and the species is still here. An evil that keeps everyone alive is bad at being evil.", "Rand isn’t taught in philosophy departments, which her fans think is a conspiracy and philosophers think is a syllabus."], "r": ["She used the word as its inventor did. Kindness she called benevolence and had no quarrel with. The target is the claim that need is a claim on your life.", "Parents value their children. Giving to what you love isn’t a sacrifice, and she says so about parents in so many words.", "It’s a syllabus that’s assigned Marx since 1968."]}, {"b": "Academics dismiss her because she threatens them", "l": ["She’s dismissed mostly because the arguments are thin, the step from “is” to “ought” above all, though some philosophers have worked on her seriously.", "Philosophers love being threatened. They gave Nietzsche a whole century. If she were dangerous she’d have a seminar.", "The big speech in Atlas Shrugged runs about sixty pages and it’s a radio broadcast. People would have changed the station."], "r": ["There’s a society for her inside the main professional association, and a volume of commentary from a major academic press. The dismissal mostly comes from people who haven’t read it.", "Nietzsche’s dead and can’t take the grant money. She said the universities were living off the people they despise. That one’s still awkward.", "It’s sold thirty million copies. Somebody’s listening to the radio."]}], "s": "A"}, {"t": "Art & beauty", "k": [{"b": "Beauty is objective", "l": ["Deep, lasting disagreement among experienced critics, and the lack of any rule that predicts their verdicts, are hard to square with that.", "If beauty were objective there’d be a unit for it, and museums would post the numbers.", "Beauty is in the eye of the beholder. The whole field fits on a mug."], "r": ["The disagreement is at the margins. Across cultures and centuries, the same works keep winning, which nothing but real features of them explains.", "There’s no unit for funny either, and some jokes are better. Things can be real without a ruler.", "Then nobody’s ever been wrong about a painting. You don’t believe that. You’ve seen your uncle’s."]}, {"b": "Taste can be educated", "l": ["Hume’s standard goes in a circle: good art is what the best judges approve, and the best judges are the ones who approve good art.", "Educated taste is liking what the teacher liked. That’s why every expert agrees with the experts before them.", "Critics exist because some people can’t just like things."], "r": ["The judges are identified by things you can check without the art: practice, comparison, a fine sense for differences, freedom from prejudice. That’s a test, and it isn’t circular.", "People who’ve heard a thousand records hear more in the next one. That happens in wine, in chess and in engines too.", "And some people can’t tell their favorite from the best. That’s what the critic is for."]}, {"b": "Conceptual art is art", "l": ["Definitions that make something art because the art world says so settle the label and leave open whether there’s anything of value to experience.", "If the idea were the art, they could mail the idea. They rent a building, so it’s about the building.", "A banana taped to a wall sold for six million dollars and the buyer ate it. That’s the review."], "r": ["The label matters because it tells you how to look. Whether a given piece repays the looking is criticism, and plenty don’t. That’s true of painting too.", "A recipe isn’t dinner. The idea has to be made and put in front of you, and choosing how is the work.", "And you know about it. It worked."]}, {"b": "Separate the art from the artist", "l": ["Works are acts by people and express attitudes. Knowing the context can rightly change what a work means, so strict separation isn’t neutral.", "Nobody separates the chef from the food once they’ve seen the kitchen.", "The author is dead, and they still check who signed it before pricing it."], "r": ["Context can change a work’s meaning. What it can’t do is change a line of the text. The separation says judge what’s on the page, and that stays possible.", "You’ve eaten in restaurants without inspecting the kitchen your whole life, and you liked the food.", "Price isn’t value. The market checks the signature. Readers don’t."]}, {"b": "AI can’t make real art", "l": ["If the complaint is no intention, the person prompting and choosing supplies some. If it’s no life behind the work, people often love works knowing nothing about who made them.", "Painters said the same about cameras in 1850. The painters lost, and they’ll lose again. It’s basically the same painters.", "Nobody can tell in the blind test. They never can."], "r": ["Curating isn’t making. And we value work from unknown hands on the assumption that a life stood behind it. Take that away and it becomes a different object.", "The camera needed someone standing somewhere, choosing. That’s who the artist was. Find that person here.", "Nobody can tell a forgery in a blind test either. It’s still a forgery."]}], "s": "❧︎"}, {"t": "Retributivism", "k": [{"b": "Wrongdoers deserve to suffer", "l": ["Desert of that kind is a hard notion to ground. That harm should answer harm, with no further good in view, looks like vengeance given a principle.", "Two wrongs don’t make a right. Children learn this. Then they go to law school.", "Retributivism is revenge that went to graduate school."], "r": ["Vengeance has no limit and no rule. Retribution answers to proportion, guilt and due process, which is why it protects the innocent where deterrence can’t.", "The second one isn’t a wrong. That’s the claim. A fine isn’t theft and a prison term isn’t kidnapping.", "Revenge goes after whoever’s in reach. This goes after the one who did it, and stops."]}, {"b": "Punishment should fit the crime", "l": ["Nothing fixes the exchange rate. How many years equals a theft isn’t a fact anyone can discover, and scales differ wildly across places.", "The same crime gets two years in one country and twenty in the next one over. Whatever it’s fitting, it isn’t the crime.", "An eye for an eye, except it’s years, and nobody can say how many years an eye is."], "r": ["It gives an ordering, and that does real work: murder more than theft, never more than was done. The exact tariff is convention inside those bounds.", "They differ on the number and agree on the ranking. No country gives more for shoplifting than for murder.", "Nobody can say how many dollars a broken arm is either, and courts award damages daily."]}, {"b": "Punishing for deterrence uses people as tools", "l": ["Pure retributivism would punish even when it helps no one and harms many. Most find a justice system indifferent to its effects hard to defend.", "A prison that makes nobody safer and nobody better is just an expensive way to be angry.", "Kant said the last murderer on a dissolving island must still be executed before everyone leaves. That’s the purist position."], "r": ["Few hold the pure view. The usual one is that desert is required and sets the ceiling, and effects decide what to do within it.", "A prison aimed only at making people safer would hold whoever is statistically risky. Desert is what stops that.", "He says it to show the debt is owed to justice and not to anyone’s convenience. It’s a thought experiment with a point."]}, {"b": "The guilty must be punished even if no good comes of it", "l": ["If no good comes of it for anyone, the suffering is a pure addition of harm to the world, and “deserved” has to carry all of that.", "“No good comes of it” is in the claim. He said it himself. Nobody had to argue.", "Retributivists want the universe to keep score and volunteered to do it."], "r": ["Honoring the difference between the guilty and the innocent is a good, and it’s one that isn’t a benefit to any particular person.", "He said no further good. Justice being done is the good. You stopped reading one clause early.", "Somebody has to, or the victim’s wrong is officially nothing."]}], "s": "⟷︎"}, {"t": "Just war theory", "k": [{"b": "A war can be just", "l": ["The conditions are demanding enough that few if any actual wars have met them, which pacifists take as the theory conceding the point.", "Every war in history was declared just by both sides. The theory has a 100% approval rate, which is the problem.", "Just war theory has never once stopped a war and has blessed most of them."], "r": ["Demanding standards are the point. The same theory is what lets anyone say a given war was unjust, and that includes the pacifist’s best arguments.", "Both sides claim justice in every lawsuit too. That’s why there’s a standard to hold them to.", "It’s the only vocabulary in which a war has ever been condemned by the country fighting it."]}, {"b": "Civilians may never be targeted, only harmed as a side effect", "l": ["Foreseeing with certainty that civilians will die and proceeding is hard to distinguish morally from aiming at them. The dead can’t tell the difference.", "“We knew they’d die but we didn’t mean it” is a sentence that only works in a seminar.", "Double effect: it’s fine as long as you’re looking at something else when it happens."], "r": ["The principle adds duties: take real risks to reduce the harm, and stop if it’s out of proportion. A commander who merely “didn’t aim” hasn’t met it.", "It works in the seminar and at the tribunal. People have been convicted on exactly that distinction.", "You also have to be trying not to let it happen. That clause is why it’s four conditions long."]}, {"b": "Soldiers on both sides are moral equals", "l": ["If one side’s cause is unjust, its soldiers are killing people who’ve done nothing to forfeit their lives. Revisionists think that can’t be morally equal.", "One side invaded. They’re not equal. One of them could have stayed home.", "Both armies are morally equal, which is a comfort to exactly one of them."], "r": ["Soldiers can rarely know whether their war is just and are compelled to serve. The equality holds the right people responsible: those who decided.", "A nineteen-year-old conscript didn’t invade anywhere. His government did.", "It’s what stops the winners from shooting every prisoner."]}, {"b": "Force must be proportionate", "l": ["Proportion means weighing lives against aims like sovereignty or deterrence, and there’s no common scale. In practice each side does its own math.", "Proportionate to what, by whose count? The side doing the bombing always finds the numbers work.", "Proportionality is a calculation that has never once come out “no.”"], "r": ["There’s no formula, and the limit still excludes cases: nobody defends leveling a city to capture one officer. A vague boundary is a boundary.", "That’s an argument for independent review. Nobody abolishes accounting because companies fudge.", "It has come out “no” in war rooms, and those are the strikes you never heard about."]}], "s": "⚔︎"}, {"t": "The experience machine", "k": [{"b": "We wouldn’t plug in, so more than experience matters", "l": ["The refusal may be status quo bias. Told they’re already in the machine, many people choose to stay, which undercuts the lesson.", "People spend nine hours a day on screens. They plugged in. Nozick lost to a phone.", "Nobody would plug into the experience machine, said a generation that hadn’t been offered one yet."], "r": ["Reverse the case and people still divide: many would leave a simulated life to face a worse real one. That isn’t bias toward what’s familiar.", "People put the phone down to go to their kid’s recital. They’d take reality over the feed when it counts.", "They’ve been offered better and better versions for twenty years and still complain about it."]}, {"b": "We want to do things, not just feel that we did", "l": ["From the inside the two are identical, so the preference is for a fact one could never detect. It’s unclear a preference like that should guide much.", "If nobody could ever tell the difference, there isn’t one. That’s what “difference” means.", "“I want it to be real” is what people say about a life they’d trade for a better fake in about a week."], "r": ["A preference about what’s true and not just about what you feel is still a preference, and a life can go against it without your knowing. Being betrayed in secret is like that.", "Whether your spouse really loves you or only acts it makes no detectable difference either. Tell me that isn’t one.", "In a week they’d want out, to tell someone what happened."]}, {"b": "It refutes hedonism", "l": ["A hedonist can say our reluctance is itself explained by pleasure: the thought of plugging in is unpleasant. The intuition doesn’t settle what’s good.", "Refusing the machine feels better than accepting. So he refused for pleasure. Hedonism wins the experiment designed to beat it.", "Nozick refuted hedonism in three pages of a book about taxes."], "r": ["If the reluctance is explained by pleasure, hedonism predicts we’d plug in once the dread is removed. Most people say they still wouldn’t.", "Refusing feels worse. You give up a perfect life. People refuse anyway, and that’s the data.", "Three pages, and the theory has been answering them for fifty years."]}, {"b": "Contact with reality has value in itself", "l": ["Then a miserable real life should beat a wonderful simulated one, and few hold that when the gap is made large enough.", "Reality is where the dentist is.", "The people most committed to reality are novelists, gamers and philosophers. None of them spend much time there."], "r": ["It’s one value among others, so a large enough gap can outweigh it. That it carries any weight at all is the result.", "And people go, because the tooth is real.", "They make things for other real people. Nobody writes a novel for an audience they know is fake."]}], "s": "◍︎"}, {"t": "Transhumanism", "k": [{"b": "We should use technology to transcend human limits", "l": ["Which limits are flaws and which are part of what makes a human life worth having is exactly the question, and “enhance” assumes the answer.", "Every limit they want gone is one they personally have. It’s a philosophy shaped like a to-do list.", "Transhumanism is a midlife crisis with a research budget."], "r": ["Nobody is ranking limits for others. The proposal is that each person may decide which of their own to keep, and being forced to keep all of them needs the justification.", "Reading glasses, vaccines, anesthesia. The to-do list has been running for a while, and you’re on it.", "The midlife crisis is the one thing it would cure."]}, {"b": "Aging is a disease to be cured", "l": ["Radical life extension raises problems of population, stagnation and access. A cure only for those who can pay would harden every existing inequality.", "If nobody died, the same people would be in charge forever. Think of who’s in charge.", "Tech billionaires want to live forever, which is the strongest argument for death anyone’s made."], "r": ["Every one of those problems was raised against sanitation and antibiotics. We solved them without deciding people should go on dying at forty.", "Term limits fix that. You don’t solve a political problem by having everyone die.", "And it’ll be available to everyone else twenty years later, like every treatment they paid for first."]}, {"b": "Uploading would preserve you", "l": ["A copy that thinks it’s you isn’t obviously you. If the original survives the scan, there are plainly two, and one of them still dies.", "The file is a copy. Everyone understands this about files. Nobody thinks they moved their vacation photos to the cloud.", "Uploading: die, and a computer does an impression of you."], "r": ["If neurons are replaced one at a time while you stay awake, there’s no moment at which you stop. The copy puzzle belongs to one method.", "Move a file and delete the original and everyone says the file moved. That’s the gradual case.", "An impression that remembers your childhood and loves your kids. Ask the kids."]}, {"b": "Enhancement is just more of what medicine already does", "l": ["Restoring normal function and exceeding it differ in what they do to fairness and to the idea of a shared human condition, even if the line is blurry.", "Glasses fix eyes. Nobody’s glasses gave them a third one. There’s a line, and it’s at the third eye.", "“It’s just like vaccines,” he says, about putting a chip in his head."], "r": ["The line is drawn by statistics about the average human. Vaccines give immunity nobody is born with, and nobody thinks they breach the human condition.", "A vaccine is an ability no ancestor of yours had. That was the third eye, and you’ve had several.", "A pacemaker is a chip in the chest. The head is a difference of address."]}], "s": "h+"}, {"t": "The meaning of life", "k": [{"b": "Life has meaning only if there’s a purpose from outside", "l": ["A purpose assigned by someone else doesn’t obviously make a life meaningful to the one living it. Being made for a job isn’t the same as having a point.", "A hammer has a purpose from outside. Nobody envies the hammer.", "If the meaning of life were handed down from above, it would be an assignment."], "r": ["The claim is that meaning needs a source outside your own say-so. Being loved into existence for something differs from being manufactured for a job.", "The hammer doesn’t know. Being made for something and able to take it up as yours is another situation.", "An assignment from someone who knows you. That’s called a vocation."]}, {"b": "We create our own meaning", "l": ["If any chosen project counts, a life spent counting blades of grass is as meaningful as any other. Most think some projects are better than others.", "If people can just make it up, it’s a hobby. Meaning you invented is like a trophy you bought.", "“Create your own meaning” is what the universe says when it forgot to bring any."], "r": ["Self-made meaning still has standards. The project has to engage what you care about and hold up on reflection, and counting grass fails that for almost everyone.", "A trophy you bought. A cathedral you built. Both made up, and they aren’t alike.", "And you make some. That’s how anything ever got done."]}, {"b": "Meaning comes from contributing to something larger", "l": ["Size isn’t the point. A large project can be worthless or evil, so the value has to come from what the thing is, not that it’s bigger.", "An ant contributes to something larger. So does a brick. So did everyone in every bad army.", "“Be part of something bigger than yourself” is also the pitch for every pyramid scheme."], "r": ["Agreed, size isn’t it. The point is that the worth of the thing must come from outside your wish for it, and you have to be actively part of it.", "The soldier in the bad army had purpose and no worth. Both are needed. He’s the example for my side.", "A pyramid scheme is one man at the top. That’s smaller than yourself."]}, {"b": "The question itself is confused", "l": ["Maybe, but people asking it usually mean something answerable: whether their life is worth living and what would make it more so.", "“The question is confused” is what someone says when they don’t know the answer and it’s their job.", "Philosophy was asked one question by the public and returned “what do you mean by meaning.”"], "r": ["Sorting the question into answerable parts is the answer. “Is my life worth living” can be worked on. “What’s the meaning of it all” has to be split first.", "Saying which part of a question has an answer is knowing something.", "It’s what a doctor says to “why do I feel bad.” Then the work starts."]}], "s": "42"}]}, {"n": "Religion", "s": "†", "t": [{"t": "Arguments for God", "k": [{"b": "Whatever begins to exist has a cause", "l": ["The premise comes from things that begin inside time out of earlier material. Whether it applies to time itself is unclear, and a cause is not yet a personal God.", "Then God needs a cause. If God doesn’t, the rule has an exception, and the universe would like to apply for it.", "Who made God?"], "r": ["The premise is metaphysical: things don’t come into being from nothing at all. A cause of space and time would have to be timeless and immaterial, and that’s the argument’s second stage.", "God didn’t begin to exist. The premise says “whatever begins.” The universe did, about 13.8 billion years ago, so its application is denied.", "Who made the question? It ends somewhere on every view. Yours ends at “it just is.”"]}, {"b": "Fine-tuning points to design", "l": ["There’s no known spread of possible constants against which ours are unlikely, selection effects and many universes are rival explanations, and a designer’s wishes are assumed.", "The universe is 99.999% vacuum that kills people instantly. If it’s tuned for life, somebody should check the tuner.", "The puddle thinks the hole was made for it."], "r": ["The many-universes reply needs a generator of universes that is itself finely set. And “we lack a distribution” would end a great deal of physics along with this.", "A house is mostly air and plumbing you’d die inside of. Nobody says the house wasn’t built for people.", "Someone who survives a firing squad of fifty doesn’t say “of course I see them missing, I’m alive.”"]}, {"b": "A maximally great being must exist", "l": ["Kant: existing isn’t a feature that makes a concept greater. And the modern version’s key premise is as disputable as its opposite, which proves atheism by the same steps.", "Imagine the greatest possible pizza. It would be greater if it existed. Check the kitchen.", "A monk did this with an island in the eleventh century and it’s been over since."], "r": ["The modal version doesn’t treat existence as a property. It needs only that such a being is possible, and the atheist’s reverse premise needs the same kind of defense.", "A greatest possible pizza is like a greatest possible number. There isn’t one. Knowledge and power have ceilings and toppings don’t.", "Anselm wrote him a reply. The island has no maximum, so it was never the same argument."]}, {"b": "Objective morality requires God", "l": ["The Euthyphro problem: if good is good because God commands it, it’s arbitrary, and if God commands it because it’s good, the standard doesn’t depend on God.", "Then the most religious countries would have the least crime. Somebody should look that up before using the argument again.", "Atheists somehow manage not to murder anyone without being watched."], "r": ["The standard is God’s nature, which is neither above God nor arbitrary. Commands follow from what God is, and that’s the third option the dilemma leaves out.", "The claim is about what makes anything wrong, not about who behaves. Atheists can be good. The question is what “good” is doing in that sentence.", "Nobody said they murder. The question is what makes it wrong when nobody’s watching anybody."]}, {"b": "Religious experience is evidence", "l": ["Experiences in different traditions support incompatible doctrines, and they can be brought on by known means, which weakens them as evidence.", "People experience Elvis. The standard that gets God also gets Elvis, and Elvis has more sightings a year.", "Five proofs, and each one needs faith to work."], "r": ["Different witnesses to one event also conflict in the details, and we don’t conclude nothing happened. Being able to trigger an experience doesn’t show it’s of nothing. Vision can be triggered too.", "If millions of sober people across five thousand years reported Elvis, I’d look into Elvis.", "Each one needs you to follow an argument. That’s the opposite of faith."]}], "s": "∃︎!"}, {"t": "Atheism", "k": [{"b": "There’s no evidence for God", "l": ["What counts as evidence is the dispute. The cosmological and fine-tuning arguments are evidence in the ordinary sense, even if judged not enough.", "There’s no evidence against, either. Fifty-fifty. And billions of people picked one side, which breaks the tie.", "Atheism takes more faith."], "r": ["Those arguments are evidence the way a suspect’s bad alibi is: something to weigh. Weighed, they point to a first cause at most, and nobody worships that.", "There’s no evidence against a teapot orbiting Mars either. It’s not fifty-fifty on the teapot.", "I don’t have enough faith to believe in yours and the other three thousand."]}, {"b": "The burden of proof is on the believer", "l": ["Burden rules are conventions of conversation. Whoever asserts takes one on, including “there is no God,” and “lack of belief” definitions dodge that.", "The believer was here first. Whoever turns up second with a new claim has the burden, and atheism turned up around 1750.", "“Lack of belief” is a position that somehow needs conventions, podcasts and a logo."], "r": ["Fine, whoever asserts carries it. Most atheists assert only that the case hasn’t been made, and that’s a claim about the arguments they can back up.", "Polytheism was here first. Monotheism turned up second and never did meet its burden with the pagans.", "There are stamp collector conventions too. Not collecting stamps still isn’t a hobby."]}, {"b": "Science has made God unnecessary", "l": ["Science explains processes inside nature. Why there’s a lawful nature at all isn’t a question it’s built to answer, so “unnecessary” goes too far.", "Science was invented by monks, and the Big Bang was a priest’s idea. Atheism is using the church’s own equipment against it.", "Newton was religious. So was the priest who came up with the Big Bang."], "r": ["Agreed that science doesn’t answer why there’s anything. Neither does “God did it,” which moves the question one step back and calls that an answer.", "Monks also brewed the beer. The inventor’s beliefs don’t come with the invention.", "Newton also believed in alchemy. We kept the physics."]}, {"b": "Religion does more harm than good", "l": ["Most of the research ties religious practice to giving, well-being and community. The harms are real, and the net claim isn’t supported.", "The twentieth century ran the experiment with officially atheist states. It isn’t a study people like to cite.", "Stalin was an atheist."], "r": ["Those studies compare the religious with the unreligious inside religious societies. Country by country, the least religious places do at least as well on every measure.", "Those states replaced a church with a party, a prophet and a holy book. They didn’t run short of faith.", "And Stalin trained as a priest. Neither fact is an argument."]}, {"b": "The problem of evil rules out a good God", "l": ["The logical version is widely thought answered by the free will defense. The evidential one depends on whether we’d expect to see God’s reasons if there were any.", "Evil can’t exist without a standard of good, and a standard needs someone to set it. So the problem of evil proves God.", "Nobody stays that angry at something that doesn’t exist."], "r": ["Free will covers what people do. It doesn’t cover the earthquake or the childhood cancer, and “we couldn’t see the reason” would excuse any amount of anything.", "I’m using your standard. On your terms, a good God and that hospital ward don’t fit. No standard of mine is needed.", "You’re not angry at Zeus. You just don’t believe in him. Same thing."]}], "s": "∄︎"}, {"t": "Aquinas", "k": [{"b": "The Five Ways demonstrate God’s existence", "l": ["Each depends on Aristotle’s physics and metaphysics, which need defending first, and none reaches the God of Christianity without more argument.", "The first way says whatever moves is moved by something else. Newton’s first law says no it isn’t. That was the first way.", "Five proofs is four too many if one of them worked."], "r": ["Each needs its metaphysics defended, and it has been, at length. The next hundred questions of the Summa are the further argument to the divine attributes.", "Motion for him means any change, potential becoming actual. Newton’s law is about uniform velocity and says nothing against it.", "They’re five routes to one conclusion. Nobody says a city is fake because it has five roads in."]}, {"b": "An infinite regress of causes is impossible", "l": ["Aquinas himself granted that an endless series back in time can’t be ruled out. The kind he denies needs the premise that borrowed power must have a first lender, which assumes the point.", "The numbers go back forever, minus one, minus two, and math is fine.", "“It can’t go on forever” is something people say when they’re tired."], "r": ["A chain where each member only passes on what it has borrowed is the kind that needs a source. A longer line of borrowers doesn’t make a lender.", "A hand moves a stick that moves a stone. Add infinitely many sticks and nothing moves without the hand. Numbers don’t push anything.", "An infinite train of boxcars doesn’t pull itself."]}, {"b": "Morality follows from human nature", "l": ["Reading rules off natural functions runs into the gap between is and ought, and the same reasoning condemns harmless things its defenders don’t want condemned.", "Nature also gave people the urge to nap after lunch, and nobody has built a moral theology on that. They should. It’s stronger.", "Natural law is “it’s just common sense” with footnotes to Aristotle."], "r": ["The is–ought gap assumes a nature stripped of ends. If a thing has a function, what’s good for it follows as a matter of fact, as it does for a heart.", "Rest after a meal is fine by natural law. It’s in the tradition under temperance. He’s ahead of you again.", "Common sense with footnotes is called a theory."]}, {"b": "Faith and reason are in harmony", "l": ["The harmony is secured by rule: wherever reason contradicts revealed doctrine, reason is held to have erred, so the test can’t fail.", "If they were in harmony he’d have needed one book. The Summa runs over a million words and he didn’t finish.", "Near the end Aquinas said it was all straw and stopped writing. First peer review."], "r": ["He holds that truth can’t contradict truth, so a conflict means an error in one of the two readings, and that can be the reading of scripture. He says so.", "Each article opens with the strongest objections he could find, stated better than the objectors did. That’s the length.", "“Compared to what I’ve seen.” He didn’t say it was wrong. He said it wasn’t enough."]}, {"b": "God is absolutely simple", "l": ["If God is identical to his attributes and to his act of creating, creation looks necessary, and a God who is like a property is hard to square with a personal one.", "A being with no parts can’t do anything, because doing things takes parts. Ask any machine.", "Aquinas is Aristotle baptized. The water did most of the work."], "r": ["Creation is free because God’s one act doesn’t depend on its object, so the collapse is denied. And “personal” is said of God by analogy, which the doctrine was built to explain.", "Parts are what need assembling and can fail. Something with no parts can’t break and needs nobody to put it together. That’s the advantage.", "Baptism is supposed to do most of the work. That’s rather the idea."]}], "s": "Ⅴ"}, {"t": "Augustine", "k": [{"b": "Evil is the absence of good, not a thing", "l": ["Pain and cruelty seem as positively real as anything. Calling them absences relabels them without making them easier to square with a good creator.", "A toothache is not the absence of anything. It’s extremely present.", "Evil is just a lack of good, the way a punch is just a lack of not being punched."], "r": ["Pain is real as a feeling. What’s bad in it is damage, something that should be whole and isn’t. The claim is about what makes it bad.", "A toothache is a tooth missing its health. That’s why the dentist restores and doesn’t extract an evil.", "A punch is a fist where there should have been peace. He’d keep the example."]}, {"b": "We inherit original sin", "l": ["Guilt for an act committed by someone else before one existed contradicts every ordinary principle of responsibility, including ones scripture itself states.", "Nobody’s held responsible for what their great-grandfather did, in any court, anywhere. He applied it to the whole species.", "He stole some pears as a teenager and got a theory of universal human depravity out of it."], "r": ["He means a condition before he means a verdict: we arrive already bent toward ourselves. As a description of people, it’s the doctrine with the most evidence.", "Nobody’s tried for it. Everybody inherits the family’s debts and its temper. He’s describing the second kind.", "Stealing pears he didn’t want, for the fun
