ver protects against that, thoughtfulness alone isn’t it.", "Plenty of the people in charge had doctorates. Some had read philosophy. One had taught her.", "“Evil comes from not thinking,” wrote the best student of a man who thought a great deal and joined anyway."], "r": ["She means the habit of stopping to ask whether you could live with yourself afterwards. It differs from intelligence, and the clever joined in numbers.", "Doctorates measure cleverness. She says cleverness is no protection at all.", "That’s why she drew the distinction. She’d seen the cleverest man she knew fail it."]}], "s": "⋅︎"}, {"t": "Carl Schmitt", "k": [{"b": "Sovereign is he who decides on the exception", "l": ["Constitutional states handle emergencies under rules, with review afterwards. That someone could seize the decision doesn’t make the seizure the essence of law.", "So the law is whoever breaks it most successfully. Every coup leader agrees with him, which should bother him more than it did.", "Schmitt’s theory is that the rules only count until somebody important doesn’t feel like it."], "r": ["Emergency powers written into law still need someone to say when they apply and when they end. That decision can’t be fully written down in advance.", "Every coup leader agrees because it describes what happens. A theory isn’t refuted by who finds it accurate.", "It’s a theory of what’s underneath the rules on the day they’re tested."]}, {"b": "Politics is the distinction between friend and enemy", "l": ["That describes politics at its worst and leaves out bargaining, coalition and persuasion, which is most of what it is.", "If politics is friends against enemies, a city council meeting about parking isn’t politics. That’s most of politics.", "The friend–enemy distinction is high school with armies."], "r": ["He says it’s the limiting case that gives politics its seriousness. Bargaining goes on in the shadow of the possibility that it fails.", "The council’s decision is enforced, in the end, by police. Parking is downstream of who has that power.", "High school has no monopoly on force. That’s the missing ingredient."]}, {"b": "Liberalism only postpones decisions with endless talk", "l": ["Talk and procedure are how decisions get made without bloodshed. That it’s slow is the cost of that, not evidence that it’s empty.", "The alternative to endless discussion was tried in his country, in his lifetime, with his help.", "He complained that parliaments just talk, and then found out what the other option was."], "r": ["His claim is narrower: when the divide is over what kind of state to be, procedure can’t settle it, because the procedure is what’s in dispute.", "The other option showed the diagnosis right and the cure monstrous. Both are true.", "He described a parliament that couldn’t govern in 1923. It then failed to."]}, {"b": "His diagnosis stands apart from his politics", "l": ["He joined the Nazi party in 1933, defended the purge killings in print, and never recanted. The theory of the exception was the one he applied.", "He had a theory about what politics is and then a chance to use it, and he joined the party in 1933.", "People cite Schmitt “for the critique,” the way people read certain magazines for the articles."], "r": ["What he did is on the record and it was vile. Thinkers on the left and right still use the analysis because it describes what constitutional texts leave out.", "Applied by a careerist with no decency. The theory says someone decides. It doesn’t say they’ll be any good.", "Liberal lawyers assign him to learn what a constitution has to be defended against."]}], "s": "※"}]}, {"n": "Politics", "s": "⚑︎", "t": [{"t": "Socialism", "k": [{"b": "Workers should control the means of production", "l": ["Worker cooperatives are legal and exist, and they stay a small share of firms. That suggests costs in raising capital, sharing risk and deciding things that the argument has to face.", "Nobody’s stopping them. A co-op takes a form and a bank account. The revolution is available at the county clerk.", "Workers can already own the means of production. It’s called buying stock."], "r": ["Co-ops that get going survive as long as other firms and pay better. The obstacle is at the start: banks lend against ownership, and workers have none.", "A form and a bank account, and then a loan no bank will make to people with no collateral. The clerk isn’t the obstacle.", "With what? The bottom half owns about one percent of it."]}, {"b": "Planning can beat markets at meeting needs", "l": ["The calculation problem: without prices that come from exchange, planners lack the information to allocate capital sensibly, and computing power doesn’t supply the missing data.", "The Soviet Union had the best mathematicians alive and a shortage of soap.", "Socialism works until someone has to decide how many shoes."], "r": ["The modern proposal isn’t one ministry. It’s public ownership with markets or with democratic planning by sector, and every large firm already plans internally.", "They also put the first satellite up and taught a country to read in a generation. The soap was a choice of priorities.", "Amazon decides how many shoes, for every size in every city. It can be done."]}, {"b": "The Nordic countries show it works", "l": ["Those are market economies with private ownership, free trade and high taxes. Their own leaders have rejected the label.", "Sweden has more billionaires per person than America. That’s the model.", "Denmark’s prime minister asked people to stop calling it socialist."], "r": ["They got there through the strongest unions on earth and decades of socialist governments. Markets were part of it, and so was the labor movement the label refers to.", "With union density above sixty percent and a welfare state he’d have to pay into. Take the billionaires and the bargaining together.", "He asked Americans to stop. The party that built it is called the Social Democrats."]}, {"b": "Inequality is injustice", "l": ["What matters may be whether everyone has enough, not the gap. And some inequalities come from choices people are entitled to make.", "If inequality were injustice, the tallest person in every room would owe something.", "Everyone’s a socialist until they have something."], "r": ["Enough for everyone would be a start. Large gaps also buy political power and turn into unequal chances for the next generation, so the gap matters too.", "Nobody’s height comes out of anybody else’s. Wealth gets made in a workplace, by more than one person.", "Most socialists have something. They want to keep it and want you to have it too."]}, {"b": "Human needs should come before profit", "l": ["Profit signals where resources meet wants, and systems that suppressed it didn’t serve needs better. The slogan opposes two things that aren’t opposites.", "Bakeries feed more people for profit than any ministry of bread has for free.", "Socialism is when the government does stuff. Its fans love that definition."], "r": ["Profit tracks what people can pay for. Insulin and yachts send different signals, and that’s the complaint.", "Bakeries don’t feed people who can’t pay. That gap gets filled by somebody not making a profit.", "It’s when workers own things. The government part is your definition."]}], "s": "⚒︎"}, {"t": "Capitalism", "k": [{"b": "Markets allocate resources efficiently", "l": ["The efficiency results hold under conditions, such as full information and no spillover costs, that fail in health care, climate and finance.", "If markets were efficient there’d be no marketing department. Half the economy is persuading people the prices are right.", "The invisible hand needed a bailout in 2008."], "r": ["Those failures are the textbook exceptions and each has a market-compatible fix: price the pollution, disclose the risk. Every other system fails without any exception clause.", "Marketing is information about what exists. The alternative is one kind of soap and a queue.", "And the planned economies needed a bailout from 1989 onward."]}, {"b": "Capitalism lifted billions out of poverty", "l": ["The largest falls came in state-directed economies like China’s. Crediting capitalism as such ignores industrial policy, public health and schooling.", "Poverty went down while capitalism was around. So did smoking.", "The line goes up. Nobody asks whose line."], "r": ["China’s poverty fell when it let farmers sell their crops and firms keep profits. The state was there before 1978 too, and so was the poverty.", "Poverty fell fastest exactly where and when markets opened, country by country. Smoking didn’t follow that schedule.", "The line for the poorest billion went up most of all. That’s whose."]}, {"b": "Wages reflect what people contribute", "l": ["That holds in the textbook competitive market. Bargaining power, dominant employers and luck drive much of pay, and “contribution” is hard to define for joint work.", "A fund manager makes a thousand times what a nurse does, so he contributes a thousand nurses. Count them.", "The market pays people what they’re worth, which is why the richest man posts all day."], "r": ["Not perfectly. Over time and across countries, pay follows productivity closely, and the gaps people point to are mostly cases where competition is being blocked.", "One manager’s decision moves a billion dollars of other people’s savings. A mistake that size is worth paying to avoid.", "He was paid for the rockets and the cars. The posting is free, and you get what you pay for."]}, {"b": "Free exchange is voluntary, so it’s just", "l": ["Whether it’s voluntary depends on the alternatives. A choice among bad options made out of need isn’t free in the sense justice requires.", "“Take the job or starve” has the same structure as “your money or your life,” and only one of them gets called freedom.", "It’s voluntary. They could always not eat."], "r": ["The bad options aren’t made by the employer who adds one. Taking away the offer leaves the person with the same need and one choice fewer.", "The mugger takes away an option you had. The employer adds one you didn’t. That’s the whole structure.", "In every other system they also had to eat, and there was less of it."]}, {"b": "Competition drives innovation", "l": ["Many core technologies came from public money, including the internet, GPS and much drug research, and incumbents often profit by suppressing competition.", "The iPhone is a pile of government research in a nice case.", "Innovation: the same app, with a subscription now."], "r": ["The research was public and sat on shelves. Turning it into something a billion people can afford took firms that would go broke if they got it wrong.", "The government had all those parts for decades and didn’t make a phone.", "The phone in your hand would have been a supercomputer in 1995. Complain on it."]}], "s": "↗︎"}, {"t": "Libertarianism", "k": [{"b": "Taxation is theft", "l": ["Property rights are defined by a legal system that taxes pay for. There’s no pre-tax ownership to steal from.", "Theft is illegal and taxes are legal, so it’s not theft. That’s what the word means.", "Libertarians hate the government and love the roads, the courts, the patents and the police."], "r": ["If rights were only what law defines, nothing a legal system did to property could be unjust. People do judge confiscations unjust, so some claim comes first.", "Slavery was legal. Legal isn’t the test of whether something is taken by force.", "I use the road because it’s the only one they allowed. Using the monopoly isn’t endorsing it."]}, {"b": "Self-ownership grounds all rights", "l": ["Getting from owning oneself to full ownership of land and resources needs a rule of first acquisition, and Locke’s own rule, taken seriously, limits holdings a great deal.", "If you own yourself you can sell yourself. So the theory starts at freedom and reaches slavery in two steps.", "The non-aggression principle is a great rule as long as the libertarian decides what counts as aggression."], "r": ["The acquisition problem is real, and every theory of property has one. This one at least starts from a premise most people accept: that nobody else owns you.", "You can also choose not to sell. A right you may waive is still a right. You can give away your books too.", "And the state’s rule is fine so long as the state decides what counts as a crime."]}, {"b": "Only the minimal state is justified", "l": ["Nozick’s derivation pays off the people who never signed up in a way critics found improvised, and it rules out public goods most people would agree to fund.", "A state that only does police, courts and army is a state made entirely of men with guns. That’s the freedom one.", "Minimal state: just the parts that protect what they own."], "r": ["Whatever one makes of the derivation, the conclusion stands as a burden: each further function has to be justified to the people forced to pay for it.", "Men with guns who aren’t permitted to do anything but stop other men with guns. The limit is the freedom part.", "And what you own. Courts work for tenants too."]}, {"b": "Markets would solve it without regulation", "l": ["Spillover costs, unequal information and collective action problems are textbook cases where voluntary exchange falls short, and the era before regulation supplies examples.", "Before regulation, milk had chalk in it. The market had decades and chose chalk.", "Somalia had no government for twenty years and nobody moved there."], "r": ["Many of those failures have property-rights fixes, and regulators fail as well, often at the request of the firms they regulate. Compare real markets with real agencies.", "The chalk ended when buyers could sue and newspapers could print brand names. Liability law did that.", "Somalia had warlords, which is several governments. Its phone network did improve, as it happens."]}, {"b": "Liberty is the absence of coercion", "l": ["Private power can constrain as well as the state can, and a purely negative idea of liberty counts the destitute as fully free.", "A man alone in the desert is completely free of coercion. He’s the freest man alive, for about two days.", "Libertarianism is a phase between the first paycheck and the first kid."], "r": ["Poverty is a serious evil and it’s a different one. Folding it into “unfreedom” lets coercion be justified as liberation, which is how that argument has usually been used.", "Free and dead of thirst are different words. He’s free. He’s also in trouble. Both are true and only one is my topic.", "The kid is why the tax bill matters more."]}], "s": "0%"}, {"t": "Anarchism", "k": [{"b": "No one has the right to rule another", "l": ["Legitimacy might rest on fair procedures or the benefits of coordination, not consent. With no authority at all, collective decisions bind nobody.", "Somebody has to decide which side of the road. That’s ruling. It starts there.", "Anarchism works great until the second person shows up."], "r": ["Procedures bind those who took part in them. Anarchists don’t reject organization or decisions. They reject orders backed by force from people you can’t recall.", "People settled which side of the road by convention before any traffic law existed. That’s coordination. Ruling is the fine.", "The second person is a neighbor. You’re thinking of the third one, with the badge."]}, {"b": "Mutual aid can replace the state", "l": ["Voluntary cooperation works in small groups that deal with each other repeatedly. Large anonymous societies have free-rider and enforcement problems it hasn’t solved.", "Every group project.", "An anarchist commune is a homeowners association with worse meetings."], "r": ["Scale is the open problem, and federation is the proposed answer: small units, recallable delegates. Large voluntary networks exist, from the Red Cross to open-source software.", "The group project fails when a teacher assigned the groups. People who chose each other finish.", "An HOA has a board, fines and a lien on your house. That’s the thing we’re against."]}, {"b": "Catalonia and the Zapatistas show it works", "l": ["These were short-lived or local, relied on wartime conditions and their own coercion, and Catalonia was crushed. They show mobilization, not lasting order.", "The best example lasted under a year and lost. That’s the highlight reel.", "Anarchism’s golden age was ten months in 1936."], "r": ["Being crushed by two armies and betrayed by a third isn’t evidence it didn’t work. While it stood, factories and farms ran and output held.", "It lost to Franco, Hitler’s air force and Stalin’s police at once. That’s a strong opponent list for a pilot program.", "Ten months in which several million people ran a region. Your system needed a century to get the trains running."]}, {"b": "Hierarchy is the root of social problems", "l": ["Some hierarchy is useful and agreed to. “Unjustified hierarchy” pushes the question to what justifies, where anarchists differ from liberals less than advertised.", "An operating room with no hierarchy is five people holding the knife.", "Every anarchist group has a guy who’s in charge of saying nobody’s in charge."], "r": ["The test is the one stated: authority has to justify itself to those under it and be removable. A surgeon passes. A landlord has to make the case.", "The patient picked the surgeon and can fire him. That’s the kind of authority anarchists have always accepted.", "He rotates out next month. That’s the difference between a facilitator and a boss."]}, {"b": "Property is theft", "l": ["Proudhon also wrote that property is freedom. The slogan targets absentee owners, and without secure possession the reasons to build and maintain things collapse.", "If property is theft, it was stolen from an owner, so there was property first. The sentence needs the thing it bans.", "Property is theft, and somebody’s still mad about their bike."], "r": ["He distinguished possession, what you use and live in, from property, a title to charge others for what you don’t use. Possession is the one he called freedom.", "It was held in common before the first fence. You can steal from everyone.", "The bike is a possession. The building it’s chained to is the property."]}], "s": "Ⓐ︎"}, {"t": "Conservatism", "k": [{"b": "Tradition embodies accumulated wisdom", "l": ["Traditions also carry accumulated error and the interests of whoever shaped them. The argument needs a way to tell which is which, and offers deference.", "Every tradition was new once, and somebody conservative was against it.", "Conservatism is defending the last thing liberals did."], "r": ["The claim is a presumption: what has survived generations of trial has passed a test no new plan has. The burden sits with the reformer, and it can be met.", "And the tradition absorbed the changes that worked. That’s the filter running.", "Somebody has to check which of them were mistakes. You’re welcome."]}, {"b": "Change should be gradual", "l": ["Doing nothing has unintended consequences too. A presumption for things as they are counts existing harms at zero.", "The fence was put up by a guy who also didn’t know why the last fence was there.", "Chesterton’s fence: nobody can touch anything until they’ve done a history degree."], "r": ["Existing harms are known and bounded. The harms of a sweeping change aren’t, and they can’t be undone. Preferring the reversible step is a view about risk.", "He put it up because the cattle kept getting out. Somebody remembers. Ask before you pull it.", "A history degree is about four years. The fence took four centuries."]}, {"b": "Free markets and traditional values go together", "l": ["Markets are the great solvent of tradition, through mobility, consumerism and constant upheaval. The pairing is a coalition, not a coherent philosophy.", "The market sells whatever people buy, and they are not buying tradition.", "Conservatives want small government and a list of things for it to ban."], "r": ["The tension is real, and conservatives have said so for a century. Family, church and local ties are what make a market society livable, which is why they get defended.", "People buy tradition every December, and at every wedding and funeral.", "A short list. Yours is longer, it just has different things on it."]}, {"b": "Burke was right about the French Revolution", "l": ["He foresaw the Terror, and he also defended an old regime whose injustices produced the revolution, about which he had little to say.", "France is a republic with rights and the metric system. Burke’s side is a gift shop at Versailles.", "Burke predicted the Revolution would go badly. He predicted that about everything, so it’s one hit."], "r": ["He’d defended the Americans, the Irish and India against his own government. His objection was to tearing down every institution at once in the name of a theory.", "France took five republics, two empires and a terror to get there. Britain reformed and skipped that part.", "He predicted the Terror, the wars and a general in 1790. That’s three."]}, {"b": "Society is a pact among the dead, the living and the unborn", "l": ["The dead and the unborn can’t speak, so the idea hands their vote to whoever is invoking them.", "The dead don’t pay taxes and the unborn don’t vote. It’s a partnership where two of the three partners are unavailable for comment.", "Conservatism has been losing slowly for three hundred years and calls it prudence."], "r": ["It works as a restraint on the living: you aren’t the owner of what you inherited, only a tenant with duties in both directions.", "The unborn are exactly who gets the bill for whatever’s decided today. They’re the most affected party in the room.", "Three hundred years of losing slowly is called surviving."]}], "s": "#"}, {"t": "Democracy", "k": [{"b": "The people should rule", "l": ["“The people” don’t have a single will. Voting theory shows that no way of adding up preferences reliably gives a coherent collective one.", "The people ruled in Athens, and they voted to execute Socrates and invade Sicily. Two for two.", "The best argument against democracy is five minutes with the average voter. Churchill never said that, which most voters don’t know either."], "r": ["No voting rule is perfect, and that’s a result about every way of deciding together, juntas and committees included. Elections remain the one where losers accept the result.", "Athens also lasted two centuries, beat Persia and invented most of what you’re citing. Two bad votes in two hundred years.", "Five minutes with the average king would settle that one."]}, {"b": "Voters are capable of governing themselves", "l": ["Voter ignorance is well documented, and it’s rational given how little one vote weighs. Some argue it tilts policy in predictable ways.", "Most people can’t name their representative. They’re governing themselves the way a passenger is flying the plane.", "Half the electorate is below average, and they all show up."], "r": ["Voters lack detail and still do the one job that matters: noticing when things go badly and removing those in charge. No other system manages that.", "The passenger doesn’t fly the plane. He picks the airline and stops using it after a crash. That’s the job.", "Half of every profession is below average, including the one that writes about voters."]}, {"b": "Democracy is the least bad system", "l": ["That’s a comparative factual claim. Some non-democracies have done better on growth and state capacity, and the verdict depends on which goods are weighed.", "“Least bad” is what people say about the only one they’ve tried.", "“The worst system except for all the others” is a joke, and people use it as the argument."], "r": ["Those regimes do well under a good ruler and catastrophically under the next one. The case is the worst outcome avoided, and averages hide it.", "Every alternative has been tried, for most of history, by most of the world. That’s why they stopped.", "It’s a joke with a ninety-year track record."]}, {"b": "Elections make rulers accountable", "l": ["Voters judge on the recent past and on irrelevant events. Studies find incumbents punished for droughts and rewarded for growth in election year.", "In the U.S. House, incumbents win about nine times in ten. That’s the accountability.", "Elections: pick between two people chosen by people nobody elected."], "r": ["Even crude punishment is feedback. Leaders who know they can be thrown out for a bad year behave differently from those who can’t be.", "They win because they vote the way the district wants. Losing is the threat that makes them.", "And then you can fire one of them. Try that with the other kind."]}, {"b": "Majority rule is fair", "l": ["Majorities can oppress lasting minorities, which is why constitutional democracies bind them with rights and courts that the majority can’t overrule.", "Two wolves and a sheep. Fair vote, clean count.", "51% of people can’t be wrong, according to 51% of people."], "r": ["Rights and courts are part of modern democracy, adopted by supermajorities. Binding yourself in advance is something majorities chose to do.", "Under every other system it’s one wolf and nobody counts.", "51% can be wrong. They can also be outvoted next time. That’s the feature."]}], "s": "51"}, {"t": "Nationalism", "k": [{"b": "Every nation deserves its own state", "l": ["Peoples are intermingled and nations overlap, so the principle applied anywhere creates new minorities, and has done so at great cost.", "There are several thousand peoples and about two hundred states. Somebody’s doing the map in pen.", "Nationalism: the people on this side of the river are completely different from the ones over there. Look, there’s a line."], "r": ["The principle is self-rule for peoples who want it. Where populations mix, it argues for autonomy and federation, and the worst cases came from denying both.", "The map was drawn in pen by empires. Nationalism is the people on it asking to be consulted.", "The line is where one group of people agreed to pay for each other’s schools."]}, {"b": "Nations are ancient, natural communities", "l": ["Most national identities were assembled in the last two centuries by schools, armies and newspapers, with traditions often invented for the purpose.", "Most “ancient national traditions” date to about 1850. The kilt pattern was a marketing decision.", "Every nation’s eternal identity was invented around the time of the railway."], "r": ["The modern form is recent. It was built from shared languages, stories and territory much older than the railway.", "The kilt pattern is new. The language, the songs and the fact of being ruled from elsewhere weren’t.", "Invented the way a house is: by people, from materials already on the site."]}, {"b": "We owe more to compatriots than to strangers", "l": ["Special ties may justify some priority, but birthplace is as arbitrary as any trait, and the priority is rarely kept within decent bounds.", "He owes more to a stranger four hundred miles north than to one four miles east, because of a river.", "Patriotism is the belief that your country is the best because you were born in it."], "r": ["The priority comes from shared institutions: you pay into the same system and live under the same law. It’s the same kind of tie as family, at larger scale.", "He and the man four hundred miles north fund each other’s hospitals. The river comes with a treasury.", "It’s the belief that your family is yours, extended. Nobody demands a ranking for that."]}, {"b": "Shared identity is what makes solidarity possible", "l": ["Solidarity also forms around class, religion, city and cause, and national feeling has divided societies as often as it has bound them.", "The country with the strongest national feeling isn’t the one with the best welfare state. Check any list.", "National unity is mostly agreeing on who doesn’t count."], "r": ["Class and religion divide a country as readily as they unite it. A national “we” is the one that can include both sides of those.", "The strong welfare states were built when national feeling was high and trust followed it.", "Every “we” has an edge. Yours does too, and it just isn’t on a map."]}], "s": "⚐︎"}, {"t": "Social democracy", "k": [{"b": "Capitalism can be tamed by the welfare state", "l": ["The arrangement depended on unusual postwar conditions: fast growth, strong unions and capital that couldn’t leave. All three have weakened.", "Capital can move now and the welfare state can’t. It’s a leash where the dog holds the other end.", "Social democracy is capitalism with an apology."], "r": ["The conditions changed and the model adapted: more training, portable benefits, public childcare. The countries that kept it are still the best places to be poor.", "Capital threatens to leave and mostly stays where the workers are skilled and the courts work.", "An apology with paid parental leave and a pension attached."]}, {"b": "The Nordic model can be adopted anywhere", "l": ["It grew out of small, high-trust countries with strong unions and broad taxes on ordinary earners. Copying the spending without the rest hasn’t worked well.", "Step one is to be five million people who all trust each other and have oil. Step two is easy.", "“Why can’t we be like Denmark?” Because Denmark is full of Danes who pay 25% sales tax and don’t complain."], "r": ["The parts transfer separately: bargaining by sector, active job programs, universal services. Countries with none of the supposed prerequisites have adopted pieces and they worked.", "Four of the five have no oil to speak of. Trust rose after the programs came in.", "The Danes complain constantly. They vote for it anyway."]}, {"b": "High taxes and strong growth can coexist", "l": ["They have, in some places, with tax systems that fall heavily on consumption and wages. That’s not the version usually on offer.", "The Nordics fund it by taxing the middle class a lot. That part gets left out of the brochure.", "The plan is Scandinavian services at American tax rates, and nobody will say which half is the joke."], "r": ["That is the honest version, and its advocates say it: everyone pays in and everyone gets it back in services. Broad taxes are why it’s stable.", "It’s in the brochure. Everyone pays and everyone gets childcare. The middle class comes out ahead.", "Then the honest half is the taxes. Some of us do say so."]}, {"b": "Reform beats revolution", "l": ["Reforms can be reversed as soon as the balance of power shifts, and many have been. What’s granted without changing ownership stays revocable.", "Every reform is one election from being undone. They’ve been rebuilding the same sandcastle since 1945.", "Social democrats have been one more election away from socialism for a hundred years."], "r": ["Reforms that become universal are hard to reverse: nobody has abolished a public pension or a health service once people had it.", "The sandcastle is eighty years old and has a health service in it.", "A hundred years in which the working week halved and children left the mines. That’ll do."]}], "s": "✿︎"}, {"t": "Centrism", "k": [{"b": "The truth is usually somewhere in the middle", "l": ["The midpoint depends on where the extremes happen to be, so it moves with whoever shouts loudest. It isn’t a method for finding anything.", "One guy says two plus two is four, another says six. The centrist says five and feels mature.", "Centrism is having no opinions, strongly."], "r": ["The claim isn’t that you average. It’s that each camp tends to be right about what the other ignores, so a good policy usually has parts from both.", "If one says four and the other says six, check the sum. The centrist is the one who checks.", "Strong opinions about tax credits and zoning. They’re just boring ones."]}, {"b": "Both sides have a point", "l": ["Sometimes. As a standing rule it’s a way to avoid assessing which points are true, and symmetry is rarely what the evidence shows.", "Both sides had a point about whether the earth moves, too. One of the points was wrong.", "“Both sides” is what people say when they haven’t read either."], "r": ["It’s a starting presumption, dropped when the evidence says so. The alternative is assuming one side has no point before looking.", "One was wrong, and working out which took listening to both.", "It’s what people say when they’ve read both and found each leaving something out."]}, {"b": "Moderation and compromise are political virtues", "l": ["A compromise between a good policy and a bad one is half a bad policy. Whether to split the difference depends on what’s being split.", "Half a bridge is a compromise. Ask how it’s working for traffic.", "The compromise position on everything is to do it, but badly."], "r": ["In a divided country a compromise that sticks beats a good policy repealed in four years. Durability is part of whether a policy is good.", "Half a bridge is a bad compromise. A bridge with a toll neither side wanted is a normal one.", "Done badly and still in place twenty years later. Check what happened to the pure versions."]}, {"b": "Extremes on both ends resemble each other", "l": ["The comparison picks out style, such as certainty and anger, and ignores content. What people want to do with power matters more than how loudly they want it.", "Being very sure is not a political position. Abolitionists were very sure.", "Horseshoe theory is how someone who knows nothing about politics explains all of it."], "r": ["The resemblance is in methods: contempt for procedure, an enemy inside, an end that excuses means. Those matter whatever the goal.", "Abolitionists won through elections, courts and an amendment. Sure of the end, moderate in the means.", "It explains who ends up attacking the same courts and the same journalists."]}], "s": "↔︎"}, {"t": "Populism", "k": [{"b": "The people against the corrupt elite", "l": ["“The people” is never everyone. It’s a part claiming to be the whole, and those outside it become illegitimate by definition.", "Every populist leader is a millionaire explaining who the real elites are.", "Populism is the elite’s favorite way of running against the elite."], "r": ["When policy tracks the preferences of the top tenth and ignores everyone else’s, “the people” names the rest. The studies say that’s roughly the situation.", "It takes a man with money to say it without being fired. The message doesn’t depend on the messenger’s bank account.", "When both parties’ donors agree, somebody has to run against the donors."]}, {"b": "Ordinary people’s common sense beats expertise", "l": ["Common sense is local and often wrong about systems nobody experiences directly, like trade, epidemics or monetary policy.", "Common sense is great until the plane needs landing.", "“I trust regular people over experts,” he says, to his doctor."], "r": ["Experts know how. Who pays and who benefits is a question about interests, and the people who pay are the experts on that.", "The passengers don’t land the plane. They do get to say where it’s going.", "He trusts the doctor on the diagnosis. He decides whether he wants the surgery."]}, {"b": "A strong leader can express the popular will", "l": ["There’s no single popular will to express, and a leader who claims to embody it has a standing excuse to override courts, press and elections.", "If he is the will of the people, anyone against him is against the people. It’s a nice trick and it’s the whole trick.", "The voice of the common man always seems to own several homes."], "r": ["Institutions that have stopped answering to voters sometimes need someone with a mandate to break the logjam. The risk is real, and so is the logjam.", "It’s also how every reform got past people whose job was to block it.", "He owns homes and still says what they’ve been saying at the kitchen table for twenty years."]}, {"b": "Elites and institutions are rigged against us", "l": ["Sometimes they are, in specific ways that can be shown and fixed. As a blanket claim it can’t be tested, since every counterexample is part of the rigging.", "If everything is rigged, the election he won was too. He never mentions that one.", "The system is rigged, say people the system keeps electing."], "r": ["Specific claims can be tested: who wrote the bill, who got bailed out, who went to prison. Those have answers, and the answers are the argument.", "He won in spite of it. A rigged game can still be lost by the house now and then.", "They elect them when the alternative is someone the system preferred."]}], "s": "♟︎"}, {"t": "Technocracy", "k": [{"b": "Experts should make policy", "l": ["Policy turns on values and trade-offs as well as facts. Expertise says what will happen, not which outcome to want.", "Experts can say what a tax will do. They can’t say whether to want that. That’s the part with all the fighting.", "Technocracy: rule by the people who were confident about the last crisis."], "r": ["Set the goals democratically and hand the means to people who can calculate them. Central banks work that way and nobody wants monetary policy by referendum.", "The fighting part goes to the voters. The plumbing goes to plumbers.", "And about the one before, which is why it wasn’t worse."]}, {"b": "Policy questions have technical answers", "l": ["Framing a choice as technical hides the value judgment inside it and removes it from the people who’ll live with it.", "“It’s not political, it’s just the optimal solution” is the most political sentence there is.", "Every technocrat thinks politics is a math problem and voters are the rounding error."], "r": ["Many do, once the goal is agreed: how to cut emissions at least cost has an answer. Pretending it’s all values is how nothing gets built.", "Whether to cut emissions is political. How to do it cheapest isn’t, and the second question is most of the work.", "A rounding error is still counted. It’s better than being ignored for a slogan."]}, {"b": "Voters are too uninformed to decide", "l": ["Experts have their own blind spots and interests, and without accountability to the public nothing corrects them.", "The experts were informed in 2008. Very informed. They had models.", "“People are too dumb to vote” is always said by someone who’s sure he’d be on the committee."], "r": ["Experts err, and they err less and get checked by other experts. Accountability can run through performance targets as well as elections.", "The models missed 2008, and the experts stopped it becoming 1929. Compare the two.", "He would be. That’s rather the argument."]}, {"b": "Independent agencies beat elected politicians", "l": ["Insulation from voters is also insulation from correction. Agencies drift toward the industries they regulate or toward their own convenience.", "An agency nobody can vote out is called a what, in any other context?", "Technocrats want government run like a business, by people who’ve never run one."], "r": ["Capture is the known risk, and the fix is design: fixed terms, published reasoning, courts. Elected politicians are captured by donors with none of those.", "A court. You’re fine with courts.", "They’d settle for it being run like a competent hospital."]}], "s": "▥︎"}, {"t": "Meritocracy", "k": [{"b": "Positions should go to the most able", "l": ["“Ability” is measured after unequal upbringing, schooling and luck have done their work. The contest ratifies the head start.", "The most able are, by remarkable coincidence, the children of the last most able.", "Meritocracy is aristocracy with an entrance exam the aristocrats’ kids are tutored for."], "r": ["Head starts are an argument for fixing the start. They aren’t an argument for handing the scalpel to someone who can’t operate.", "And the alternative is the children of the well-connected with no exam at all. That was the previous system.", "An exam anyone may sit beats a title you have to be born with."]}, {"b": "Success reflects talent and effort", "l": ["Luck in genes, family, timing and country accounts for much of any outcome. Effort matters, and the capacity for it is partly inherited too.", "Every successful person worked hard. So did the guy who delivers their groceries.", "“I earned everything I have,” says a man who chose his parents very carefully."], "r": ["Luck sets the range and effort decides where in it you land. Policy can reward only the part people control, and that’s a reason to reward it.", "He did, and the pay gap is the problem being pointed at. That’s an argument about wages.", "Nobody earns their parents. What you do with the start is still yours."]}, {"b": "Equal opportunity makes unequal outcomes fair", "l": ["Opportunities are never equal, and one generation’s outcomes are the next one’s starting line.", "The race is fair, and some people start at the finish, and their kids start past it.", "Equal opportunity: everyone is free to compete with people who had tutors since age three."], "r": ["It’s a direction, and it’s measurable: how far a parent’s income predicts a child’s. Some countries have cut that in half.", "So move the start. Nobody’s proposal for fixing the race is to stop timing it.", "Free to compete, and in the countries that fund the schools, a lot of them win."]}, {"b": "A meritocratic elite governs better", "l": ["An elite convinced it earned its place owes nothing to anyone, and tends to read everyone else’s situation as deserved.", "The old aristocrats at least knew it was luck.", "The word “meritocracy” was coined in a satire warning against it. They took it as a business plan."], "r": ["The smugness is real and fixable. Compare the alternatives on results: selection by birth, by party loyalty or by lot.", "The old aristocrats knew it was luck and kept the land anyway.", "The author was warning about an elite chosen by test alone. People who read it added other checks."]}], "s": "①︎"}, {"t": "Georgism", "k": [{"b": "Land value belongs to the community", "l": ["Assessing land separately from buildings is hard and contestable, and a full tax would wipe out the savings of ordinary owners who paid market price.", "The retiree who bought her house in 1980 is not a feudal lord. The tax can’t tell the difference.", "Georgists have one idea, and they would like to tell you about it."], "r": ["Assessors already value land separately in several places. And a tax can be phased in over decades, which protects current owners.", "Phase it in and let her defer the bill until the house is sold. This was worked out long ago.", "It’s one idea that covers housing, sprawl, speculation and taxes on work. Most movements would like one of those."]}, {"b": "A single tax on land could fund government", "l": ["Total land rents fall well short of modern public spending. It could be a good tax among several and still not be the only one.", "The math worked in 1879, when government was a post office and a navy.", "The single tax has been the obvious solution to everything since 1879 and has been adopted by nowhere."], "r": ["Fair, the single-tax claim is too strong at today’s budgets. Shifting what we can from wages and buildings onto land is the live proposal.", "Land values rose along with government. Urban land is now the largest asset class there is.", "Pittsburgh, Denmark, Singapore, Taiwan and Hong Kong have all used versions. Where it’s been tried it’s hard to get repealed."]}, {"b": "A land tax has no deadweight loss", "l": ["In theory, if assessed perfectly. In practice, valuation errors and politics bring back the distortions the theory assumes away.", "“No distortions, assuming perfect assessment.” Assuming perfect anything, every tax is fine.", "Economists all agree the land value tax is the best tax, which is how you know it’ll never happen."], "r": ["Imperfect assessment means some error. Every other tax has the error and also discourages work or building. A tax can’t reduce the supply of land.", "Assuming rough anything. A sloppy land tax still can’t make there be less land.", "It’ll happen when the people who’d pay it stop being the ones who vote on it."]}, {"b": "Land speculation is the root of poverty", "l": ["Poverty has many causes. Housing costs matter a great deal in some cities, and that doesn’t make land the master key to the rest.", "There were poor people before there were landlords. They were called everyone.", "Monopoly was invented to teach Georgism. It’s now a game about loving being the landlord."], "r": ["He meant it as the reason progress and poverty arrive together: gains in productivity end up in rents. For cities now, the data fit.", "And when the landlords arrived, the ones doing the work started paying to stand on the ground.", "The inventor wrote two sets of rules. The cooperative set is the one that got dropped."]}], "s": "▱︎"}, {"t": "Neoreaction", "k": [{"b": "Democracy is a failed experiment", "l": ["Democracies have the best record on famine, mass killing by the state and long-run prosperity. The comparison class is what matters.", "The failed experiment contains every country he’d agree to live in.", "Neoreaction: a man with a blog has figured out that kings were good."], "r": ["The record belongs to rich countries with strong institutions, several of which were built under monarchs. The claim is about where the present trend leads.", "He’d live in the ones still running on capital built up before the franchise widened. That’s the argument.", "A blog was enough for Luther."]}, {"b": "A sovereign CEO would govern better", "l": ["Companies can fail and be replaced, and nobody is forced to stay. A state run that way has the powers of a CEO and none of the checks.", "CEOs get fired by boards. He left out the board. Without it that’s just a guy.", "The plan is to run the country like a startup. Nine in ten startups fail, and usually nobody dies."], "r": ["The design includes owners who can replace the executive. The proposal is to make government answer to someone with a stake in its long-run value.", "There’s a board in the proposal. People skip the corporate governance section.", "A country can’t fail quietly either way. A structure where somebody owns the downside is the point."]}, {"b": "“The Cathedral” of universities and media runs society", "l": ["The theory treats decentralized agreement among educated people as a ruling body, and can’t be wrong, since dissent within it is also the Cathedral.", "An institution with no leader, no members list and no meetings is called “a lot of people disagreeing with him.”", "The Cathedral controls everything except, somehow, the people writing about the Cathedral for major publications."], "r": ["It’s a claim about incentives: nobody coordinates, and the career rewards in universities and press point the same way. That predicts which errors go uncorrected.", "A lot of people who disagree with him, who all hire and promote each other.", "They publish him as a curiosity. Watch what happens to staff who agree."]}, {"b": "People should exit rather than have a voice", "l": ["Exit is cheap for the mobile and rich and close to impossible for everyone else. A world of exit without voice is a world run for those who can leave.", "“If you don’t like it, leave” is not a political philosophy. It’s a thing dads say.", "Monarchists never picture themselves as the peasant. Not once. Not one of them."], "r": ["Exit disciplines governments the way it disciplines firms. Lowering what it costs to leave is the program, and it would help the poor most.", "“Leave” is how most people have improved their lot. Ask an immigrant.", "Most of his ancestors were peasants, like everyone’s. They did better under some kings than others."]}], "s": "♔︎"}, {"t": "Pacifism", "k": [{"b": "Violence is never justified", "l": ["Refusing force against an aggressor leaves the victims to pay for one’s principles. Clean hands purchased with others’ lives isn’t obviously the moral position.", "Somebody’s breaking into a house. The pacifist has a position, and the family has a problem.", "Pacifism works as long as someone else isn’t one."], "r": ["Most pacifists reject war and killing and accept restraint and defense short of that. And the tradition is full of people who went unarmed into the danger.", "The pacifist stands in the doorway. Several are remembered for doing just that.", "It also works when enough people are. That’s how most wars have been ended."]}, {"b": "Nonviolent resistance works better than force", "l": ["The cases where it worked involved opponents with a press and a public that could be shamed. Against regimes with neither, the record is grim.", "It worked on the British, who had newspapers. Ask how it goes without the newspapers.", "Gandhi’s advice to those facing the Nazis was nonviolence. He gave it. It’s in print."], "r": ["In studies of campaigns over a century, nonviolent ones succeeded about twice as often as violent ones, including against dictatorships.", "It also worked in Poland, the Philippines, Chile and East Germany, against secret police and without the newspapers.", "He was wrong about that case. The record across a hundred others isn’t."]}, {"b": "War only breeds more war", "l": ["Some wars ended things: slavery in one country, a genocide in another. Others bred more. The record is mixed, and the slogan isn’t.", "Germany and Japan have been at peace for eighty years. Something bred that.", "“War never solved anything,” except the ones in all the history books."], "r": ["The second war grew out of the settlement of the first. The peace that held came from occupation, aid and rebuilding.", "Reconstruction bred it. The same countries after the first war got a punitive treaty and twenty years.", "Read on a chapter. Most of them are the opening of the next one."]}, {"b": "Refusing to fight keeps one’s hands clean", "l": ["Standing aside is also a choice with consequences. The appeal to clean hands puts the pacifist’s purity above the outcome for others.", "Hands are clean. Everything else is on fire.", "Pacifists are protected by people who aren’t, and are very brave about it."], "r": ["Purity isn’t the claim. It’s a refusal to be the one who kills, and someone has to hold that line or nobody does.", "Medics, stretcher-bearers and relief workers were on that fire, unarmed.", "A good number were jailed, beaten or shot for it. Brave is right."]}], "s": "☮︎"}, {"t": "Free speech", "k": [{"b": "The answer to bad speech is more speech", "l": ["Lies spread faster than corrections, and some speech works by intimidation, which more speech from its targets doesn’t answer.", "A lie gets around the world while the more-speech is still looking for its keys.", "“The answer to speech is more speech” is said by people with large platforms about people with none."], "r": ["The alternative is an official who decides what’s a lie. That power has been used against the truth at least as often as for it.", "Slower than the lie and faster than a ministry.", "Censorship rules are written by people with platforms too. The powerless are who they’ve been used on."]}, {"b": "Truth wins out in the marketplace of ideas", "l": ["Markets deliver what sells. There’s no reason the true idea should be the popular one, and plenty of history where it wasn’t.", "Markets also gave us the pet rock. Whatever’s winning, it’s what people buy.", "The marketplace of ideas has a bestseller list and it is mostly horoscopes."], "r": ["He never promised quick victory. The claim is that no one can be trusted to pick the winner in advance, and open contest corrects error over time.", "The pet rock is gone. That’s the market working.", "And an astronomy shelf nobody had to ban the horoscopes to stock."]}, {"b": "Any restriction is a slippery slope", "l": ["Every legal system restricts fraud, threats, perjury and libel without sliding into tyranny. Lines get drawn and held all the time.", "Fraud is banned. Perjury is banned. The slope has been right there for three hundred years and nobody’s slid.", "Free speech absolutists have a list of exceptions. It’s just shorter than yours and they made it."], "r": ["Those limits are narrow and old, tied to concrete injury. The slope worry is about the new category: opinions restricted for being false or hurtful.", "The old limits held because they’re tied to a specific injury. The new ones are tied to how someone feels, and that has no edge.", "A short list fixed in advance is the whole idea. A list that grows by complaint is something else."]}, {"b": "Offense is not harm", "l": ["Some speech does more than offend: it targets, excludes and silences. The line between offense and harm is real and less tidy than the slogan.", "“Words can’t hurt anyone,” he posts, furious about something someone said.", "The loudest defenders of free speech block the most people."], "r": ["Threats and harassment are conduct and already covered. What’s left is being confronted with a view you hate, and that is the cost of living among free people.", "He’s furious and he’s posting back. That’s the system.", "Blocking is choosing not to listen. That was always allowed."]}], "s": "❝︎"}, {"t": "Universal basic income", "k": [{"b": "A basic income would end poverty", "l": ["At a level that ends poverty the cost is enormous, and at an affordable level it’s too small to live on. Pilots can’t test the financing, since they don’t tax the participants.", "Multiply any real amount by the population. Then look at the budget. Then stop.", "UBI: every pilot is a success, and every pilot was paid for by somebody else."], "r": ["A modest amount paid to everyone, clawed back through the tax system, costs far less than the headline figure. Most people are paying themselves.", "Subtract what the same people pay in tax and the net figure is a fraction of that.", "Every pilot of anything is. That’s how you find out before spending the real money."]}, {"b": "People won’t stop working", "l": ["Short pilots can’t show what a permanent, universal guarantee would do, since people behave differently when they know it will end.", "A two-year study where everyone knows it stops in two years. Of course they kept their jobs.", "“People will use the free time to make art.” There’s a lot of evidence about what people do with free time."], "r": ["Alaska has paid a permanent dividend for forty years and employment there looks like anywhere else. The long experiments show small effects.", "Alaska’s has run for forty years with no end date. They kept their jobs.", "They look after children, study and start businesses. That’s what the data show for the hours given up."]}, {"b": "It’s simpler and less paternalistic than welfare", "l": ["A flat payment gives the same to people with very different needs. Keeping extra programs for disability and housing brings the complexity back.", "One check replaces everything, except all the things it can’t replace, which stay.", "It’s the only policy loved by both libertarians and socialists, and each thinks the other hasn’t read it."], "r": ["It replaces the cash programs and the forms that go with them. Disability and housing support stay, with one fewer layer of means-testing underneath.", "It replaces the programs with a caseworker and a waiting list. Those are most of the paperwork.", "Each has read it and likes a different half. That’s what a coalition is."]}, {"b": "Automation will make it necessary", "l": ["The prediction that machines will end work has been made for two centuries, and employment has kept shifting, not vanishing. It may be different this time, and that isn’t known.", "The robots have been about to take all the jobs since the loom.", "Tech executives love UBI. It’s the tip jar for the economy they’re planning."], "r": ["It may not be needed for that reason. The case stands without the robots: the bargaining power to refuse a bad job is worth having now.", "The loom took the weavers’ jobs and their grandchildren did fine. The weavers didn’t.", "A tip jar funded by the people who replaced your job is a start."]}], "s": "⊕︎"}]}]</script>

/* ---------- search: the heading's "…" is a text field ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"');

      else { for(let j = 0; j < x.k.length && !score; j++){ const li = x.k[j].l.findIndex(l => l.includes(q)); if(li >= 0){ score = 10 - li; lv = li; sub = LEVELS[li] + ' · “' + t.k[j].b + '”'; } } } }
    if(score) out.push({pi:x.pi, ti:x.ti, score, sub, lv, i}); });
  return out.sort((a,b) => b.score - a.score || a.i - b.i).slice(0, 8); }
function fw(){ let s = $('fw'); if(!s){ s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.id = 'fw'; s.setAttribute('aria-hidden','true'); document.body.appendChild(s); } return s; }
function pick(r){ Q.value = ''; Q.blur(); closeFind(); go({pi:r.pi, ti:r.ti, lv:r.lv}); }
function closeFind(){ found = []; foundKey = ''; FIND.innerHTML = ''; fw().innerHTML = ''; document.documentElement.classList.remove('finding'); sizeQ(); $('hint').classList.toggle('on', S.pi == null && !Q.value); place(); wire(null); creditCheck(); }

/* legs from the typed word to each match. Wide screens: the matches stand to the right of the heading, like a branch.

const NS = 'http://www.w3.org/2000/svg';
(function intro(){

  try { localStorage.setItem('pa-intro', new Date().toDateString()); } catch(e){}
