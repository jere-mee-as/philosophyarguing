bably true.", "Engineers expect the bridge to hold because every attempt to break the theory failed. Surviving tests is not the same as piling up confirmations.", "He boarded the planes that hadn’t been refuted. That’s the theory."]}, {"b": "A tolerant society can’t tolerate the intolerant", "l": ["Popper’s footnote is narrow: suppress those who refuse argument and turn to violence. It doesn’t license silencing views someone finds intolerant.", "If tolerance has an exception it isn’t tolerance, it’s a guest list. He refuted the open society in his own book about it.", "The paradox of tolerance is a footnote. People have built whole personalities on a footnote."], "r": ["The narrow version still makes the point: tolerance isn’t a suicide pact. Where the line falls is a judgment call, and that there is a line is what he showed.", "Every freedom has the exception that protects it. You can’t vote to abolish voting. That’s a lock on the door, not a guest list.", "It’s a long footnote."]}, {"b": "Marx and Freud are pseudoscience", "l": ["Popper held that Marx’s theory was falsifiable, was falsified, and was then rescued by its followers. So the test is about how adherents behave, which weakens it as a logical line.", "Evolution can’t be falsified either, which Popper said himself. He put Darwin in the bin with Freud and then asked for him back.", "Popper is every physicist’s favorite philosopher because he’s the only one they’ve heard of."], "r": ["That is his point: a theory can start out scientific and be made unfalsifiable by the people defending it. The criterion is about how a theory is held.", "He took it back in 1978 once he’d worked out what would count against Darwin. Changing your mind for a reason is the theory in action.", "They’ve heard of the others. They picked him."]}], "s": "✗︎"}, {"t": "Kuhn", "k": [{"b": "Science advances by paradigm shifts", "l": ["The revolution picture fits a few episodes in physics and astronomy and fits most of chemistry and biology badly, where change is piecemeal.", "If science moved by revolution, the old science would stop working. Newton still lands rockets. Nothing was overthrown, it got a decimal place.", "A paradigm shift is the old guys dying. Planck said it first and shorter."], "r": ["He never said every field has a Copernicus. The claim is that communities work inside shared exemplars, and when those change, the questions change with them. Chemistry had Lavoisier.", "Newton’s equations land the rocket. Newton’s universe, with absolute space and instant gravity, is gone. The numbers stayed and the world they describe was replaced.", "Planck was describing it. Kuhn explained why it has to work that way."]}, {"b": "Paradigms are incommensurable", "l": ["Physicists who lived through relativity understood and compared both theories, and Kuhn himself later retreated to a much milder version.", "If they couldn’t be compared, nobody could say the new one was better, so there’d be no reason to switch, and yet everybody switched.", "Kuhn says Newton and Einstein can’t be compared, which is odd, because physics students compare them every semester."], "r": ["Incommensurable never meant incomparable. It means no neutral language in which both can be fully stated, so some of the comparing is done by judgment, and he said so.", "They switched because the new one solved the puzzles the old one was stuck on. “Better at puzzles” was available the whole time.", "They compare them in Einstein’s terms. Ask a student to state relativity using Newton’s concept of mass."]}, {"b": "Evidence alone doesn’t dictate theory choice", "l": ["Values like simplicity and scope play a part at the margins. That doesn’t make the choice arbitrary, as Kuhn himself kept insisting afterwards.", "So something else dictates it, and the only other things are money and friends. He said science is a clique and called it history.", "So science is vibes with funding. Got it."], "r": ["He agreed, and the later essays say so: shared values constrain the choice without fixing it. That’s why good scientists can disagree for decades.", "The other things are accuracy, scope, simplicity and fruitfulness. He listed five. You came up with money.", "He called that reading a misunderstanding for thirty years."]}, {"b": "Science doesn’t converge on truth", "l": ["The success of mature theories, including predictions nobody expected, is hard to explain unless they’re approximately true.", "GPS works. Something that isn’t getting closer to the truth doesn’t find a parking lot from orbit.", "Kuhn says science doesn’t get closer to the truth. Typed, presumably, on a computer."], "r": ["He granted progress in solving problems. What he doubted is that “closer to the truth” adds anything, since nobody can compare a theory with reality from outside all theories.", "Ptolemy’s astronomy navigated ships for a thousand years. Getting places isn’t the same as having the furniture of the universe right.", "Typed on a computer built on a quantum theory nobody can agree on the meaning of."]}, {"b": "Normal science is puzzle-solving", "l": ["The picture underrates how much basic criticism goes on in ordinary periods. Popper thought “normal science,” where it exists, is just bad science.", "Puzzles have the answers printed in the back. If science were puzzle-solving they’d have looked.", "Kuhn used “paradigm” 21 different ways in one book. Someone counted."], "r": ["That it’s routine isn’t a criticism. Only a community committed enough to push one framework to its limits finds the anomalies that matter.", "No answers in the back, and no guarantee there’s a solution. That’s why he said puzzle and not exercise.", "A new word used 21 ways in its first book is doing well. Try counting “energy” in 1850."]}], "s": "↷︎"}, {"t": "Bayesianism", "k": [{"b": "Rational belief is updating by Bayes’ rule", "l": ["The rule assumes a reasoner who already sees every logical consequence and every hypothesis. It has nothing to say about a theory nobody had thought of yet.", "Nobody in history has computed a posterior before crossing the street. So either all of humanity is irrational or the theory describes zero people.", "Nobody has ever actually done the math. They say “I updated.”"], "r": ["It’s a standard of coherence, like logic, and nobody objects to logic because people reason badly. New hypotheses are a known gap that’s being worked on.", "Nobody solves the equations for a thrown ball either, and people catch. The theory describes what a good catch approximates.", "“I updated” beats “I’ve always said.”"]}, {"b": "Priors wash out with enough evidence", "l": ["Convergence is proved only in the long run and for people who agree on what’s possible. With real data, different priors give different answers.", "If priors wash out, they didn’t matter, and if they didn’t matter the theory is “look at the evidence,” which was available.", "The prior is made up, so everything after it is made up to more decimal places."], "r": ["True for the limit theorems. In practice you report how the answer changes across reasonable priors, which is more than rival methods disclose about their own assumptions.", "They wash out because the evidence overwhelms them. “Look at evidence, in this exact proportion” was not available before 1763.", "Every method has assumptions. Ours are written down."]}, {"b": "Degrees of belief should obey probability", "l": ["The betting arguments show that incoherent beliefs can be exploited by a clever bookie. That’s a practical point, not proof they’re worse as beliefs.", "Belief isn’t a number. Nobody is 0.73 married.", "“70% confident” means “I think so” in a lab coat."], "r": ["There are arguments that don’t involve bets: credences that break the axioms are guaranteed to be less accurate than some set that obeys them, whatever the truth is.", "You’re 0.99 married until the paperwork clears. Ask anyone who’s waited on a certificate.", "“I think so” is 70. “Pretty sure” is 90. You already have the numbers, you just won’t say them."]}, {"b": "Bayesian methods beat frequentist ones", "l": ["In practice the results often agree, and Bayesian analyses have their own wiggle room in choosing priors and models.", "Frequentist statistics ran every drug trial that worked. Bayes ran a spam filter.", "Frequentists built modern science while Bayesians were still choosing a prior."], "r": ["Agreed on the wiggle room. The gain is that the question answered is the one people ask: how likely is the hypothesis, given this? A p-value answers something else.", "The spam filter reads forty billion emails a day and it works. The drug trials are still arguing about what “significant” means.", "And then they had a replication crisis."]}, {"b": "Never assign probability 0 or 1", "l": ["The rule clashes with continuous probability, where events of probability zero happen, and it seems to forbid full belief in logical truths.", "Then the rule itself can’t be held at 100%, so there’s some chance certainty is fine, so I’m taking it.", "Nobody’s allowed to be 100% sure of anything, including that the moon isn’t cheese."], "r": ["The measure-zero cases are handled with richer number systems or by treating the rule as advice for hypotheses about the world. Logical truths were always exempt.", "You can take it. You just can never learn you were wrong. That’s what the rule was warning about.", "I’m not 100% on the moon. I’m 99.9999. That’s the difference between us."]}], "s": "∝︎"}, {"t": "Simulation theory", "k": [{"b": "We’re almost certainly in a simulation", "l": ["The argument offers three options. The simulation one needs civilizations that reach that power and then choose to run vast numbers of simulated histories, and there’s no evidence for either.", "Simulating a universe takes a computer bigger than the universe. So it has to sit in a bigger universe, and that one’s real, so most things are real.", "“The odds are a billion to one,” from a calculation where every number is invented."], "r": ["Right, and that’s all it claims: one of three things is true. People who say “almost certainly” have picked a branch. The argument itself only removes the comfortable fourth option.", "Nobody simulates a universe. You render what’s being looked at. Every video game already does this, and so, as it happens, does quantum mechanics.", "Assign your own numbers. Any ones you like. See what comes out."]}, {"b": "Simulated minds would be conscious", "l": ["That assumes minds don’t depend on what they’re made of, which is the disputed premise. If consciousness needs biology, the simulated crowds contain no one.", "A simulated fire doesn’t burn the computer. A simulated brain doesn’t think in it. Same computer.", "The argument assumes a computer can be conscious, which is the whole thing it needed to show."], "r": ["It’s a premise, and it’s stated as one. Most working theories of mind accept it, so the argument is as strong as a mainstream assumption.", "The simulated fire burns the simulated house. Inside is where the question is asked.", "It assumes it out loud, in the first section. That’s called a premise."]}, {"b": "Physics looks computational", "l": ["Discreteness and a top speed have ordinary physical explanations, and resemblance to current technology is weak evidence. Earlier ages saw clockwork.", "The speed of light is too slow for a good computer. Anyone building a simulation would have picked a faster one. So it’s real, and badly designed.", "Simulation theory is God for people with a graphics card."], "r": ["Agreed, it’s weak evidence, and the argument doesn’t use it. People notice the fit afterwards and nothing rests on that.", "A speed limit is what you set when you don’t want players reaching parts you haven’t rendered.", "God needed six days. This needs a server."]}, {"b": "It’s a scientific hypothesis, not a religious one", "l": ["Without a prediction that tells it apart from an unsimulated world it works as metaphysics, and the proposed tests assume how the simulators would build it.", "A creator outside space and time who made everything and might be watching. They changed the font.", "If it can’t be tested, it’s church."], "r": ["Many cosmological hypotheses can’t yet be tested and are still about what physically exists. That makes it speculative, and it stays a claim about the natural world.", "Religion tells you what the creator wants. This one’s creator is a graduate student who’s forgotten the job is running.", "Then so is the multiverse, and they give out prizes for that."]}, {"b": "Bostrom’s argument is rigorous probability", "l": ["It counts hypothetical simulated beings among the people we might be. Choose the comparison group differently and the conclusion changes.", "Probability needs a sample. The sample of known universes is one, and it isn’t a simulation, so that’s 100% so far.", "Bostrom gave three options and everyone only remembers the fun one."], "r": ["Every anthropic argument has to pick a comparison group, and he argues for his. It’s the standard difficulty of the field, and it applies to the rival reasoning too.", "A sample of one from inside can’t tell you which kind it is. That’s the whole argument, so thank you.", "The paper says he puts it under a third. The fans rounded up."]}], "s": "▣︎"}, {"t": "Scientific realism", "k": [{"b": "Our best theories are approximately true", "l": ["Many past theories were successful and are now judged false at the core, like caloric and the ether. Induction on that record isn’t encouraging.", "Every generation’s best theory turned out wrong. This generation’s is the first one in history that’s right. What are the odds.", "Realists believe the current textbook, which is what realists believed about the last one."], "r": ["The discarded theories were retained in their working parts: Fresnel’s equations survived the ether. Realists commit to what does the predicting.", "The earlier ones were approximately right, each more than the last. Newton is still good to eight decimals on a bridge.", "Believed the same core each time, with corrections. That’s what approximately true means."]}, {"b": "Otherwise the success of science is a miracle", "l": ["Success might be explained by selection: theories that fail are discarded, so the survivors predict well, true or not.", "Ptolemy predicted eclipses for fourteen centuries. If success means truth, the sun went round the earth until 1543.", "“It works, so it’s true” would have made a realist about epicycles."], "r": ["Selection explains why we have successful theories. It doesn’t explain why any theory can predict things nobody had looked for yet.", "Ptolemy fit what had been seen. Nobody pointed a telescope where he said and found a new planet.", "Epicycles never predicted anything new. That’s the test, and they fail it."]}, {"b": "Electrons are real", "l": ["What survives theory change is often the equations, not the picture of what the entities are. The electron of 1900 and today’s share little but the name.", "The electron has been a ball, a wave, a cloud and a vibration in a field. It’s real, they just can’t say what.", "Electrons are definitely real, and are also definitely not anything anyone can picture."], "r": ["The picture changed and the handle didn’t: the same charge and mass, measured ever more precisely, and you can spray them at a target and things happen.", "A person is a child, then an adult, then old, and stays one person.", "You can’t picture a four-dimensional cube either. Unpicturable isn’t unreal."]}, {"b": "Science gets closer to the truth over time", "l": ["“Closer” needs a measure of distance from a truth we don’t have independent access to, and attempts to define it formally ran into trouble.", "Closer to what? Nobody’s seen the answer key. He’s grading the test against the test.", "Science converges on the truth the way a hiker converges on the horizon."], "r": ["Closeness can be judged from inside: later theories explain why earlier ones worked where they did, and never the reverse.", "Each theory grades the previous one and says where it was off and by how much. That’s a key.", "A hiker with a map that keeps getting more of the coastline right."]}], "s": "e⁻"}, {"t": "Feyerabend", "k": [{"b": "Anything goes", "l": ["He meant it as what a rationalist would be forced to say after studying history. Taken as advice, it can’t tell astronomy from astrology.", "If anything goes, so does “not everything goes.” By his rule I’m allowed that, and then he’s done.", "“Anything goes” is the only philosophy of science that can be learned in two words and applied to nothing."], "r": ["Right, it’s the conclusion of a reductio. Every rule proposed for science was broken by someone we now call a great scientist, so the rules aren’t the essence.", "“Not everything goes” is permitted, as one tradition’s house rule. You may keep it at home.", "Two words is the summary of four hundred pages of history. Read the history."]}, {"b": "Galileo won by propaganda, not evidence", "l": ["Rhetoric was part of it, as it always is. The telescopic evidence and the physics that followed are why the view stuck after the persuading was over.", "Propaganda wears off. The moons of Jupiter are still there.", "Feyerabend took the Church’s side against Galileo, four hundred years late, for attention."], "r": ["The telescope’s reliability for the heavens couldn’t be established at the time, and the physics that later backed him didn’t yet exist. He was right ahead of his evidence.", "They’re there now. In 1610 half the people who looked saw nothing or saw double. He won before the instrument did.", "He said the Church had the better argument by the standards of the day. That’s a historical claim, and it’s hard to refute."]}, {"b": "Science is one tradition among many", "l": ["Traditions can be compared by what they deliver. One of them eradicated smallpox and the others didn’t.", "One of the traditions has antibiotics. When the traditions get sick, they all pick that one.", "He defended witchcraft and rain dances, and saw a doctor."], "r": ["Smallpox is a real result, and people who want it can choose it. The claim is that citizens should decide which traditions guide their lives.", "They pick it for infections and pick others for dying, raising children and meaning. Free choice is the proposal.", "He saw a traditional healer too, and said it helped. He tried both, which is the position."]}, {"b": "Science should be separated from the state", "l": ["Public decisions need some standard for evidence. Treating every tradition equally in schools and courts would hand them to whoever shouts.", "A state without science builds bridges by vote.", "“The worst enemy of science,” he was called, and he put it on the résumé."], "r": ["Standards of evidence for a decision are chosen by the people deciding, with experts as advisers. That’s already the theory of a jury.", "Juries are laypeople who overrule experts every day. The buildings stand.", "He kept that title because it came from physicists who couldn’t answer the history."]}], "s": "∗︎"}, {"t": "Occam's razor", "k": [{"b": "The simplest explanation is usually right", "l": ["Simplicity depends on the language a theory is stated in, and there’s no agreed measure. The history of science is full of the more complicated answer winning.", "The simplest explanation for lightning was a god throwing it. One cause, no math.", "The simplest explanation is usually that the person citing Occam’s razor wants to stop talking."], "r": ["There are formal measures, and they explain why the rule works: a model with fewer free knobs fits noise less, so it predicts better.", "“A god did it” explains anything, so it has every knob there is. It only sounds short.", "It usually ends the conversation because there’s nothing left to add."]}, {"b": "Don’t multiply entities beyond necessity", "l": ["“Necessity” does all the work. Whether an entity is needed is the question in dispute, so the rule can’t settle it.", "One element would be simpler than 118. Chemistry multiplied them anyway, because they were there.", "Ockham never wrote the famous version. The razor is itself an unnecessary entity."], "r": ["It breaks ties between theories that fit equally well. That’s a narrow job, and it does it.", "The elements were needed. “Beyond necessity” is in the rule.", "He wrote four versions. The famous wording is a tidy paraphrase, which is fitting."]}, {"b": "Simplicity is a guide to truth", "l": ["There’s no reason the world must be simple. Simpler theories are easier to use and test, which is a practical virtue and may be nothing more.", "The universe has dark matter, eleven kinds of quark behavior and the platypus. It was not consulted on simplicity.", "“Simple” means “the one I already believed.”"], "r": ["A world needn’t be simple for the rule to work. With limited data, simpler models make fewer errors on new cases, and that’s a theorem.", "Four forces and a handful of particles produce the platypus. The complicated part is downstream.", "Then test it. Simple models win on data they haven’t seen."]}, {"b": "It rules out God, souls and conspiracies", "l": ["The razor ranks rival explanations of the same data. It doesn’t say what exists, and both sides of each of those disputes claim the simpler account.", "A theist says one God is simpler than a trillion brute facts. Same razor. It cuts whichever way it’s held.", "Occam’s razor has ended zero arguments, because both people are holding one."], "r": ["It ranks. Where one account needs an added entity and explains nothing more, the entity goes. Whether a case is like that is the argument to have.", "One God with a mind, intentions and unlimited power isn’t one simple thing.", "It ends them fine when both people count the same way."]}], "s": "∕︎"}, {"t": "Scientism", "k": [{"b": "Science is the only way to know anything", "l": ["That statement isn’t a scientific finding. It’s a philosophical claim, so by its own standard nobody can know it.", "Then nobody knows that, because no experiment showed it. He’s doing philosophy and he’s bad at it.", "“Only science gives knowledge” was established in zero laboratories."], "r": ["Call it a methodological bet backed by a record. Every rival source of knowledge has had centuries to produce a result that holds up.", "It’s a generalization from four hundred years of every other method losing. That’s evidence.", "It was established in every laboratory, one result at a time."]}, {"b": "Philosophy is dead", "l": ["The people who announce it then go on to offer views about reality, knowledge and method, which is philosophy done without the training.", "Physicists declare philosophy dead and then spend the next chapter doing it, at the level of a first-year.", "Hawking said philosophy is dead in a book whose opening pages are philosophy."], "r": ["The questions aren’t dead. The claim is that the armchair method stopped producing answers once the sciences took its subjects one by one.", "They do it badly and still get further, because they can check.", "And the rest of that book has more to say about time than a century of seminars."]}, {"b": "If it can’t be measured, it isn’t real", "l": ["Measurement presupposes things that aren’t measured: logic, mathematics, the reliability of the instruments, the honesty of the reports.", "Measure that claim. In what units.", "“If you can’t measure it, it doesn’t exist” is the motto of everyone who has ruined a workplace."], "r": ["Those things are tested by use: logic and instruments are kept because the results come out. That’s measurement at one remove.", "It’s measured by its results. Fields that count things progress and fields that don’t go in circles.", "Measuring the wrong thing is bad measurement. The cure is better measurement."]}, {"b": "Ethics can be a science", "l": ["Science can say what increases well-being once well-being is defined and chosen as the goal. The choosing is the ethical part.", "Science can tell someone how to poison a well and how to clean one. It has never once said which.", "“Science can determine values” turned out to mean “assume my values, then science.”"], "r": ["Medicine assumes health is the goal and nobody calls it unscientific. Once you grant that suffering matters, the rest is findings.", "It says which wells kill children. If you need more than that to choose, the problem isn’t science.", "Every field assumes its goal. Chemistry assumes you want to know what’s in the beaker."]}], "s": "±"}, {"t": "LessWrong rationalism", "k": [{"b": "Rationality is systematized winning", "l": ["If it were, its practitioners would visibly outperform. The community’s own writers have asked why they don’t.", "If it were winning, they’d be winning. The scoreboard is public.", "Rationalists have been systematically winning for twenty years, mostly at writing blog posts about it."], "r": ["The slogan is a definition of the target, and the same writers were first to ask why results lagged. A group that audits itself is doing the thing.", "Several saw the pandemic, the crypto boom and the AI wave coming before the experts did.", "A blog that called the three biggest stories of the decade early."]}, {"b": "Bias can be trained away", "l": ["Knowing about biases does little to reduce them, and can make people better at spotting them in others.", "The research says learning about biases mostly teaches people to find them in whoever they’re arguing with. So that worked.", "They learned the name of every cognitive bias and now have all of them, with citations."], "r": ["Agreed for general knowledge of biases. Specific habits do work: keeping score on forecasts measurably improves them, and that was the practice all along.", "Forecasting with scorekeeping makes people measurably better calibrated. That part trains fine.", "Having the names beats having them and not knowing."]}, {"b": "Read the Sequences", "l": ["A million words by one self-taught author, largely restating existing philosophy and statistics without engaging the literature, is not a canon.", "Every field has a textbook. This one has a very long blog and a Harry Potter fan fiction, and the fan fiction is longer.", "“Read the Sequences” is “do your own research” for people with a higher SAT score."], "r": ["It’s an on-ramp written for people who’d never open a journal. Most of the field’s later ideas reached their audience that way.", "A long blog that got a generation to read about probability. Textbooks had their chance.", "It tells you to check it, with the math attached."]}, {"b": "Shut up and multiply", "l": ["Multiplying made-up probabilities by made-up magnitudes gives made-up answers with false precision, and lets a tiny chance of a huge payoff swamp everything.", "A one-in-a-trillion chance of infinite value is still infinite. So the math says to give the wallet to anyone who mentions infinity.", "They multiplied, and the answer was that the most important thing in the universe is their own field."], "r": ["The point was narrow: don’t let a vivid single case outweigh a larger number of real ones. The mugging problem was named and published by the same people.", "That’s a known problem. They found it, named it and wrote the papers on it.", "When the math says your field matters, you either go where it says or admit you weren’t doing math."]}], "s": "≺︎"}]}, {"n": "Language & Logic", "s": "∴︎", "t": [{"t": "Wittgenstein", "k": [{"b": "Meaning is use", "l": ["Use doesn’t fix meaning without some account of correct use, and it doesn’t explain how people understand sentences they’ve never heard before.", "People use “literally” to mean “not literally.” If meaning were use that would be fine, and it isn’t. Ask anyone.", "Late Wittgenstein: words mean how people use them. Dictionaries had this."], "r": ["Correct use is fixed by shared practice and training, and that’s the account. Rules for building sentences are part of the practice too.", "Everyone understands that “literally.” That’s meaning. The people complaining understand it best.", "Dictionaries are compiled by watching how people use words."]}, {"b": "Philosophical problems are confusions of language", "l": ["Many problems survive careful rewording: consciousness, induction, identity. That they dissolve was asserted more than shown, and is itself a philosophical thesis.", "Then translating them into another language would make them go away. They’ve been translated into all of them.", "He didn’t solve philosophical problems, he told people to stop asking. Any dad can do that."], "r": ["He never said one move dissolves them all. The work is case by case, and the claim is about where their grip comes from, which is why they return in new clothes.", "They’ve been mistranslated into all of them. Every language has the same few pictures built in.", "Any dad can say it. Getting the fly out of the bottle is the hard part."]}, {"b": "A private language is impossible", "l": ["The argument’s structure is disputed. If it rests on doubting memory it proves too much, since public checks use memory too.", "Diaries exist. People write in codes only they know. That’s a private language, and it’s been in drawers for centuries.", "Wittgenstein fans don’t answer questions. They ask what game the question is playing."], "r": ["The point isn’t about memory. In a private case there’d be no difference between following the rule and thinking you are, so “rule” has nothing to hold on to.", "A code is a translation of a public language. He meant words for what only you could ever have, with no key even in principle.", "And that reply was a move in one."]}, {"b": "The Tractatus shows the limits of what can be said", "l": ["By its own theory its sentences are nonsense, and the image of a ladder to be thrown away admits that without explaining how nonsense shows anything.", "A limit that can be described has been crossed. He drew the fence from the far side.", "The Tractatus ends by saying everything in it is nonsense. Agreed."], "r": ["The book says it can only show its point and must be thrown away after. Whether that can work is the question it deliberately leaves you with.", "He says so himself: to draw a limit to thought you’d have to think both sides. That’s why he draws it in language instead.", "Agreed is the right answer. You’ve finished the book."]}, {"b": "What can’t be said must be passed over in silence", "l": ["The line sends ethics, art and the book itself into silence. Ramsey’s reply: what can’t be said can’t be said, and it can’t be whistled either.", "Everything can be spoken of. I just spoke of the thing that can’t be. That was it.", "“Whereof one cannot speak,” from a man who would not stop."], "r": ["He thought those things were the most important, and that talk damages them. The silence is respect, and Ramsey’s joke assumes it was dismissal.", "You said the words. You didn’t say the thing. That’s the distinction, and you just illustrated it.", "He published one short book in his lifetime."]}], "s": "7"}, {"t": "Logical positivism", "k": [{"b": "Only verifiable statements are meaningful", "l": ["The principle is neither true by definition nor verifiable, so it fails its own test, and every attempt to state it precisely let in everything or shut out science.", "“There’s a teapot nobody can ever detect” can’t be verified, and everyone understood it immediately. That’s what meaning is.", "“Only verifiable statements have meaning” is not verifiable. One sentence, own goal."], "r": ["It was offered as a proposal for how to use “meaningful” in science, and proposals are judged by usefulness. On that reading it doesn’t apply to itself.", "You understood the grammar. Ask yourself what would be different if it were false, and notice you can’t say.", "It’s a rule, not a statement. Rules don’t score own goals."]}, {"b": "Metaphysics is nonsense", "l": ["Rejecting metaphysics took commitments about meaning and experience that were themselves metaphysical, and later analytic philosophy let ontology back in.", "Saying nothing exists beyond experience is a claim about what exists. They did metaphysics for thirty years and billed it as hygiene.", "The Vienna Circle set out to end metaphysics and ended themselves."], "r": ["The target was claims that no experience could bear on. The later ontology is tied to what science needs, which is the reform they were asking for.", "“We can’t talk about what’s beyond experience” is a remark about talking. Nothing beyond experience was mentioned.", "They ended because their country was taken over, and then they staffed half the philosophy departments in America."]}, {"b": "Moral statements only express feeling", "l": ["Moral sentences sit inside “if” clauses and arguments where nothing is being expressed, and they keep their meaning and their logic there.", "If “murder is wrong” just means “boo murder,” courtrooms are sporting events, and the home team has won every trial.", "Positivism said ethics is just cheering. Then the 1930s happened around them."], "r": ["The embedding problem has detailed answers now, built on the attitudes that complex sentences express. It’s a research program with results.", "Trials are about facts: did he do it. The booing comes at sentencing, and it’s quite audible.", "They booed. Several of them had to flee for it."]}, {"b": "Truths of logic and math are true by convention", "l": ["Quine: there’s no non-circular account of truth by meaning alone, and no statement is immune to revision.", "Conventions are decided by people. So with enough votes 2+2 would be 5. They never explained why nobody’s tried.", "Ayer was asked later what was wrong with positivism and said nearly all of it was false."], "r": ["Quine attacked one account of it. That adopting a framework differs from making a claim inside it survived him, and Carnap’s version is still defended.", "You can vote that “5” names what “4” used to. The arithmetic doesn’t move, only the spelling. That’s what convention covers.", "He said the spirit was right, in the same interview."]}, {"b": "Philosophy should be the logic of science", "l": ["Actual scientific practice turned out not to fit the reconstructions, and scientists made little use of them.", "Science already has a logic. It’s called math, and the people who do it are called scientists. The position was filled.", "Positivism is philosophy trying to get hired by the physics department."], "r": ["The reconstructions were about justification, how a theory relates to its evidence, and were never meant as histories of the laboratory.", "Scientists argue constantly about what counts as confirming a theory. That’s the job, and it isn’t math.", "Half of them were physicists already. Schlick studied under Planck."]}], "s": "⊢︎"}, {"t": "Analytic philosophy", "k": [{"b": "Clarity and rigor are how philosophy progresses", "l": ["Rigor on small questions can be bought by avoiding the large ones, and the tradition’s own surveys show standing disagreement on nearly every major issue.", "A hundred years of rigor and the surveys still split on everything. If rigor produced progress there’d be one thing they agreed on.", "Clarity is the only virtue, which is easy when nothing’s being said."], "r": ["The agreement is in what’s been ruled out and in the distinctions everyone now uses. Positions survive, and bad arguments for them mostly don’t.", "They agree on which arguments are valid. That’s the progress, and the other tradition can’t say the same.", "Something’s being said. It’s just possible to tell what, which you’re not used to."]}, {"b": "Intuitions about cases are evidence", "l": ["Some studies find case intuitions shift with wording, order and culture. Even where they’re stable, it’s unclear why they’d track the truth.", "Intuition said the earth was flat and heavy things fall faster. It’s 0 for everything it’s been tested on, so they kept it for the untestable stuff.", "“Intuitively” means “my friends and I think.”"], "r": ["The variation findings largely failed to replicate, and core judgments turn out stable across cultures. And every inquiry starts from what seems true.", "Those were predictions about the world. Intuitions about what counts as knowing are about our own concept, and we’re the authority on that.", "Your objection was an intuition."]}, {"b": "Thought experiments reveal conceptual truths", "l": ["Far-fetched cases may run past the conditions where our concepts are reliable. Verdicts about a man made by lightning in a swamp say little about minds as they are.", "An experiment has equipment and a result nobody chose. A thought experiment is a story where the author decides the ending.", "Fake barns, swamp men, twin earth. It’s science fiction with worse plots."], "r": ["A far-fetched case isolates one variable, as a frictionless plane does in physics. Unrealistic and uninformative are different things.", "Galileo refuted Aristotle on falling bodies with a thought experiment. Two weights and a string, no equipment.", "Plots are for people who need to be entertained to follow an argument."]}, {"b": "Formal logic disciplines argument", "l": ["Formalizing moves the dispute to the premises and to whether the symbols fit. Valid arguments with contested premises are everywhere.", "Putting P and Q on a sentence doesn’t make it truer. “If P then pizza” is valid.", "Analytic philosophers number their sentences so it looks like something is being calculated."], "r": ["Moving the dispute to the premises is the service. You find out exactly where you disagree, and most arguments never get that far.", "Yes, valid. And now you can see the problem is the premise. Took four seconds. That’s the tool working.", "So you can say which one you reject. Try that with a paragraph of Hegel."]}, {"b": "Continental philosophy is obscurantism", "l": ["The divide is mostly sociological. Analytic work has its own unreadable jargon, and many continental texts make arguments analytic philosophers later rediscovered.", "The continentals at least wrote about death, sex and power. The analytics picked “the present king of France is bald.” One of those has readers.", "Analytic philosophy is a hundred years on the word “the.”"], "r": ["Fair on the sociology. A real difference remains: here a claim is expected to be stated so that someone can show it false, and jargon answers to that.", "Having readers was never the test. Horoscopes have readers.", "And it got the word right."]}], "s": "(1)"}, {"t": "Gödel", "k": [{"b": "Incompleteness is only about formal systems", "l": ["Strictly yes, though Gödel drew large philosophical morals from it himself, so wider uses aren’t all illegitimate.", "A legal code is a set of rules meant to be consistent and complete. That’s a formal system. So there are true verdicts no court can reach.", "Incompleteness applies to every system: legal systems, political systems, relationships."], "r": ["He was careful to label those as philosophy, with extra premises. The theorem licenses the claims with the hypotheses attached, and none of the loose ones.", "A legal code isn’t recursively axiomatized and doesn’t contain arithmetic. Those are the two conditions. It has neither.", "Relationships don’t encode Peano arithmetic. Yours might, I haven’t asked."]}, {"b": "It says nothing about minds versus machines", "l": ["Gödel thought it did. His own conclusion was that either the mind outruns every machine or there are mathematical problems nobody can ever solve. That isn’t nothing.", "A machine can’t see that its own Gödel sentence is true and a person can. That’s the whole theorem, and it took one line.", "Gödel’s theorem is why AI can never match a human mind."], "r": ["His disjunction stands. To get anything about minds you must add that the mind is consistent and can know it, and nobody has earned that premise.", "A person can’t see it’s true either. They can see it’s true if the system is consistent, and so can a machine. Same position.", "A human can’t prove their own consistency either. Most don’t even try."]}, {"b": "It doesn’t show mathematics is unreliable", "l": ["Right, though the second theorem does mean no proof of arithmetic’s consistency can be had from within arithmetic. That is a real limit on what can be secured.", "A system that can’t prove it’s consistent might not be. Nobody would fly an airline that can’t prove its planes land.", "Gödel proved math is broken."], "r": ["Agreed, that’s the second theorem. Consistency is provable in stronger systems, so the limit is on self-certification, and nothing suggests arithmetic is in trouble.", "No airline proves that from inside the cockpit. You check from outside, with a stronger system. It’s called the ground.", "He proved that one specific kind of proof can’t exist. Everything else is fine. Go balance your checkbook."]}, {"b": "It isn’t just the liar paradox", "l": ["The construction does adapt the liar. What’s new is that “provable” can be defined inside arithmetic and “true” can’t. “Just” is unfair, and “isn’t” overstates.", "“This sentence can’t be proved.” Proved, it’s false. Unproved, it’s true. That’s the liar with one word swapped, and the word was the easy part.", "Gödel basically wrote “this sentence is false” in math and got famous."], "r": ["Fair. The liar yields a contradiction and his sentence yields a theorem, and that difference between truth and provability is the whole content.", "The easy word turns a paradox into a proof. If it were that easy, somebody in the previous 2,300 years would have swapped it.", "The liar is false if true. His is true and unprovable. Different sentence, different century, different result."]}, {"b": "Mathematical truth outruns proof", "l": ["It shows truth in the standard model outruns proof in any one system. A formalist reads the same sentence as provable in a stronger system, with no realm of truths needed.", "A truth nobody can prove is called an opinion. He formalized having one.", "Gödel showed there are truths logic can’t reach, which is basically proof of intuition."], "r": ["The stronger system has its own unprovable sentence, and we judge each of those true as we go. Formalism has to explain that judgment without the word.", "Then Goldbach’s conjecture is an opinion, and so was Fermat’s until 1994, when it got promoted.", "It’s proof that the sentence is true if the axioms are consistent. That’s all. It’s enough."]}, {"b": "His ontological proof is serious modal logic", "l": ["The axioms about “positive properties” carry the conclusion, and the system makes everything true necessarily true, which nobody wants.", "A computer checked it in 2013. Computers don’t make mistakes, so God exists and it’s reproducible.", "Gödel proved God exists, in symbols. Still unrefuted."], "r": ["Collapse can be blocked by weakening one axiom, and later versions do it. It’s a valid derivation, and the argument is over the premises, as with any proof.", "The computer checked that the conclusion follows. It also found his axioms were inconsistent in one version. Both results are reproducible.", "Unrefuted and unsound are different words."]}], "s": "⊬︎"}, {"t": "Frege", "k": [{"b": "Sense and reference are distinct", "l": ["What a “sense” is has never been made clear, and direct reference theorists argue that names contribute only their bearers.", "“The morning star is the evening star.” It’s Venus. It was always Venus. He built a theory on not knowing that.", "Frege discovered that the same thing can have two names."], "r": ["Direct reference still has to explain how “Hesperus is Phosphorus” can be news. Whatever does that job is what he called sense.", "The Babylonians didn’t know it was Venus and tracked both for centuries. Explaining how that’s possible is the theory.", "And that finding it out can take a thousand years. Explain that without him."]}, {"b": "Arithmetic is logic", "l": ["Russell’s paradox showed his system inconsistent, and repaired versions need axioms, like the existence of infinitely many things, that aren’t plausibly logic.", "Logic says if P then P. Arithmetic says there are infinitely many primes. One of those is about something.", "Frege spent twenty years reducing arithmetic to logic, and Russell broke it with a one-page letter."], "r": ["The contradiction came from one axiom. Drop it and a single principle about number still yields all of arithmetic, which is most of what he wanted.", "The primes follow from definitions and logic alone, once number is defined. He showed how.", "He answered the letter the same week and printed the problem in his own appendix. That’s how it’s done."]}, {"b": "Meaning is objective, not psychological", "l": ["Putting meanings in a third realm, neither mental nor physical, raises the question of how minds in this one ever get hold of them.", "Meanings are in a realm outside space, time and minds, and somehow every toddler finds it by age two.", "He threw psychology out of logic, and logic has been explaining nothing about how people think ever since."], "r": ["The alternative is that the Pythagorean theorem is a different thought in each head. Shared content has to live somewhere other than in individual minds.", "Two toddlers who learn “two” have learned the same thing. Whatever that is, it isn’t located in either of them.", "It explains how they can be wrong. Psychology only says what they did."]}, {"b": "He founded modern logic", "l": ["He did, in a notation so unwieldy nobody used it. The logic the world learned came through Peano and Russell.", "A founder whose notation nobody could read is a founder nobody followed. Peano did the part that got used.", "His notation was two-dimensional and the printers hated it. So did everyone else."], "r": ["The ideas are what counted: quantifiers, variables, and a proof as a checkable sequence. Peano and Russell both said where they got them.", "Peano and Russell rewrote him in a friendlier script. The content was his.", "The printers hated Principia too."]}], "s": "├︎"}, {"t": "Russell", "k": [{"b": "“The present king of France is bald” is false, not meaningless", "l": ["Strawson: the sentence doesn’t assert that there’s a king, it presupposes it, and when the presupposition fails the question of truth doesn’t arise.", "There’s no king of France. So it’s not true and not false, it’s a mistake. Anyone asked on the street says “France doesn’t have a king.”", "Russell’s great contribution was a sentence about a king who doesn’t exist. It’s still his most cited work."], "r": ["Strawson’s view needs sentences that are neither true nor false. Russell keeps ordinary logic and explains the oddness as a hidden claim that something exists.", "“It’s a mistake” is the theory: the mistake is that it asserts there’s a king. He told you what kind.", "Fourteen pages that showed grammar can hide what’s being claimed. Every later analysis copies the move."]}, {"b": "Mathematics reduces to logic", "l": ["Principia needed axioms of infinity and reducibility that nobody thought were logical truths, and then Gödel showed no such system could be complete.", "It takes several hundred pages to reach 1+1=2. If the foundation is that much harder than the building, it’s not the foundation.", "Principia Mathematica proves 1+1=2 a few hundred pages in, with the comment that this is occasionally useful."], "r": ["The full reduction failed. What it left is modern logic, type theory and the first proof that the question could be put exactly. Gödel proved his theorem about Principia.", "Foundations are always harder than the building. Go and look at what’s under a skyscraper.", "It’s a joke. He wrote it. He was funnier than his critics."]}, {"b": "The theory of types solves the paradoxes", "l": ["It blocks them by forbidding the sentences, which also forbids harmless ones, and the hierarchy can’t be stated without violating itself.", "He fixed the paradox by making it illegal to say. That’s not a solution, that’s a noise ordinance.", "Russell found the paradox, and his fix was that nobody’s allowed to talk about it."], "r": ["Every later set theory blocks the paradox by restricting what counts as a set. Types were the first version of the idea that won.", "A function that can’t take itself as input is how every typed programming language works. The ordinance is running on your phone.", "He found the hole in the foundations of mathematics and published it. That’s talking about it."]}, {"b": "Philosophy should be done with scientific method", "l": ["His own views changed with nearly every book, which doesn’t suggest a method converging on results.", "Science settles things. He held about six philosophies in sixty years and was certain during each.", "Russell changed his mind so often that Broad said he produced a new system every few years. He was right about one of them, maybe."], "r": ["Changing your view when an argument fails is the scientific part. The ones who never revised weren’t doing better.", "Six theories, each given up for stated reasons, in print. That’s what a method looks like from outside.", "Broad was right. Changing your mind was the point."]}], "s": "∉︎"}, {"t": "Kripke", "k": [{"b": "Names are rigid designators", "l": ["Descriptivists reply that names can be tied to descriptions that are themselves rigid, such as “the actual so-and-so.”", "“Aristotle” refers to Aristotle in every possible world. Yes. That’s what a name is. That was the lecture.", "Kripke’s discovery was that a name is the name of the thing it names."], "r": ["A description fixed with “actual” works because the reference is being held steady from outside. The rescue borrows the idea it’s resisting.", "It’s what a name is, and for sixty years the standard theory said a name was a disguised description. Someone had to say it.", "It sounds trivial now. That’s what winning looks like."]}, {"b": "Water is necessarily H2O, though we found that out", "l": ["The necessity depends on how “water” was fixed. If it meant “the clear drinkable stuff,” other worlds would have water that isn’t H2O.", "If it was necessary, nobody would have needed a lab. Necessary things are known from a chair. That’s the definition.", "Water is H2O in every possible world. It took a philosopher to add “possible world” to a chemistry fact."], "r": ["He grants that the reference could have been fixed differently. Given that the word picks out this stuff, anything without its makeup isn’t it, however it looks.", "Whether water is H2O took a lab. That it couldn’t have been anything else, once it is, takes an argument. Two questions.", "“Possible world” is what tells you a fact couldn’t have been otherwise. Chemistry doesn’t say that part."]}, {"b": "Reference is fixed by a causal chain back to a baptism", "l": ["Reference can shift: “Madagascar” once named part of the mainland. A chain back to the first use gives the wrong answer there.", "Nobody baptized “Santa Claus” by pointing at him. The chain goes back to nothing, and every kid still knows who’s meant.", "Naming and Necessity is a transcript. He gave it without notes and never wrote the book. That’s the level of effort."], "r": ["He offered a picture and said it wasn’t a theory. The Madagascar case refines it: later intentions to refer can re-anchor a name.", "The chain goes back to the stories, and that’s what makes it a name for a fictional figure. The picture covers it.", "Without notes, at twenty-nine, and the field reorganized around it. Effort isn’t the measure."]}, {"b": "Nothing fixes which rule you’re following", "l": ["If no fact fixes what anyone means, the argument’s own words mean nothing in particular. Most readers take that as a reason to reject a premise.", "I meant plus. I know because I was there. He can ask.", "Kripke proved nobody means anything by “plus,” and then everyone kept adding."], "r": ["He presents it as a problem he found in Wittgenstein and offers a solution through community practice. Whether it works is open, and the problem is real.", "“I was there” is a fact about feeling certain. The question is what made it plus and not something that agrees on every sum you’ve done.", "Yes. And nobody has said what makes it adding. That’s the result."]}], "s": "□︎"}, {"t": "Chomsky", "k": [{"b": "Language rests on an innate universal grammar", "l": ["Decades of proposed universals have shrunk under cross-linguistic evidence, and what remains is thin enough that critics ask what the claim now is.", "If grammar was built in, there’d be one language. There are seven thousand, and they don’t agree about where the verb goes.", "Universal grammar has been revised until the only universal left is that Chomsky was right."], "r": ["The list has been pared down to the core: structures built by one recursive operation. A narrower claim is what progress looks like in a science.", "Seven thousand languages and every one has structure-dependent rules and none counts words. That’s the universal.", "The data keep agreeing with him. It’s awkward for everyone."]}, {"b": "Children hear too little to learn it from experience", "l": ["Children hear millions of sentences, and statistical learners get much further from that input than the argument assumed in the 1960s.", "Kids hear about thirty million words by age four. That’s not a poverty of anything.", "The poverty of the stimulus was a claim about how much data kids get, made before anyone counted."], "r": ["The point isn’t quantity. Children never try certain errors that the input doesn’t rule out, such as rules based on word order alone.", "Thirty million words and not one saying “the following would be ungrammatical.” They know anyway.", "People have counted since. The missing evidence is still missing."]}, {"b": "Language evolved for thought, not communication", "l": ["The claim that language appeared by a single mutation in one individual, for inner use, has almost no support among people who study evolution.", "A language used by one person, silently, isn’t a language. It’s a guy thinking.", "His theory is that the first speaker had nobody to talk to. That’s a lecture, not an origin."], "r": ["Most language use is silent and internal. Whatever the origin, a system built for communicating would be far less ambiguous than this one.", "You talk to yourself all day. That’s most of what it’s used for.", "Everyone’s first audience is themselves."]}, {"b": "Language models tell us nothing about language", "l": ["Systems that learn fluent grammar from text alone are at least evidence about what can be learned without built-in rules, which was his central claim.", "It learned English from reading. He said that was impossible in 1957, and his answer now is that it doesn’t count.", "A machine learned grammar from examples and he said it wasn’t real grammar. He’s been grading the same paper since Eisenhower."], "r": ["Fluency from a trillion words shows what can be learned with that much text. How a child does it on a tiny fraction of that was always the question.", "It read more text than a child could hear in ten thousand lifetimes. That’s the opposite of his problem.", "It needed the whole internet. A child needs a few years of a parent mumbling."]}], "s": "⋀︎"}, {"t": "Sapir–Whorf", "k": [{"b": "Language shapes thought", "l": ["The measured effects are small and local, such as slightly faster color discrimination across a named boundary. The strong version has no support.", "People think of things they have no word for all the time. That’s why they say “the thing, you know, the thing.”", "Linguistic relativity is real and worth about forty milliseconds."], "r": ["Small and real is the modern claim. Effects on color, number, space and the gender of objects replicate, and they show up where the language forces a habit.", "People with no number words can’t match eleven nuts to eleven sticks. “The thing” doesn’t cover it.", "Forty milliseconds on every sentence, all your life."]}, {"b": "Speakers of different languages live in different worlds", "l": ["Translation works, and people learn second languages without reporting a change of universe.", "Bilingual people would be commuting between worlds. They report it as “knowing two words for bread.”", "Different languages, different worlds, same traffic."], "r": ["Translation works for content. The claim is about defaults: what your language makes you mark every time becomes what you notice without trying.", "Speakers who use compass directions for everything always know which way north is. You’d need an app.", "Ask people from two languages who was at fault in the accident. The grammar shows up in the answers."]}, {"b": "The Hopi have no concept of time", "l": ["A linguist later documented Hopi tense, time words and calendars at book length. The claim came from limited data and wishful reading.", "Someone checked. They have words for yesterday, tomorrow and late. Six hundred pages of them.", "Whorf was a fire insurance inspector. The Hopi time claim is what happens when one investigates a language part-time."], "r": ["He was wrong about Hopi. One bad example doesn’t settle the hypothesis, and the modern evidence comes from experiments.", "Fine, strike Hopi. There are languages where the future is behind you and speakers gesture that way.", "He published in the linguistics journals and Sapir vouched for him. The day job isn’t an argument."]}, {"b": "Change the words and you change the thinking", "l": ["Renaming things mostly moves the old attitudes onto the new name. The evidence that vocabulary reform changes beliefs is weak.", "Every new polite word becomes the rude word in ten years. The thought moved in and kept the furniture.", "The Eskimo snow words thing isn’t true either. Nobody checks anything in this theory."], "r": ["Vocabulary reform is the weak form of it. The stronger evidence is grammatical: what a language makes you say each time.", "The new word buys ten years. That’s ten years.", "Linguists struck that example decades ago. The experiments came after."]}], "s": "✻︎"}, {"t": "The liar paradox", "k": [{"b": "Truth needs a hierarchy of languages", "l": ["Ordinary language has one truth predicate that applies to its own sentences. A hierarchy describes a different, tidier language, not ours.", "English doesn’t have levels. People say “that’s true” about sentences containing “true” all day and nothing explodes.", "Tarski solved the liar by moving to a language nobody speaks."], "r": ["It was never offered as a description of English. He showed that English, taken as it is, is inconsistent, and gave a repair.", "Nothing explodes because nobody follows it through. He did.", "A language in which mathematics can be done without contradiction. It has speakers."]}, {"b": "Some contradictions are true", "l": ["If one contradiction can be true, the usual reason for ever rejecting a theory, that it contradicts itself, is gone.", "If contradictions can be true, then they also can’t. He has to accept that. Those are his rules.", "Dialetheism is true. Also false. Its defenders are fine with this, and also not."], "r": ["A theory can still be rejected for being false, unsupported or trivial. All that’s given up is one rule of inference, and logics without it are well understood.", "That’s fine. Some contradictions are true and that one isn’t among them. I’m allowed to tell them apart.", "Only a few of them. This is one. Yours isn’t."]}, {"b": "The liar sentence is neither true nor false", "l": ["Then “this sentence is not true” comes back: if it’s neither, it’s not true, which is what it says, so it’s true.", "“This sentence is not true.” Neither? Then it’s not true. Then it’s right. He moved the problem one inch.", "Every solution to the liar has a revenge version, and every revenge version has a paper."], "r": ["The revenge sentence is the standing difficulty. Theories with a truth predicate that never becomes fully defined handle it without a new gap.", "It moved an inch, into a region where the theory is exact. That’s what a partial solution is.", "That’s a field making progress one step at a time."]}, {"b": "It reveals a flaw in our concept of truth", "l": ["It may reveal only that some grammatical sentences fail to say anything, the way “the largest number” fails to pick anything out.", "It’s a sentence about nothing. “This sentence” doesn’t say anything to be false about. It’s a trick with a pronoun.", "The liar paradox is 2,400 years old and has produced no lies."], "r": ["“The largest number” fails for a statable reason. The liar sentence is built from parts that each work, by rules that otherwise work, and that’s the flaw being shown.", "“This sentence has five words” says something, with the same pronoun. The trick isn’t in the pronoun.", "It produced the theory of truth and one of Gödel’s theorems. That’s a decent return."]}], "s": "⊥︎"}, {"t": "Vagueness", "k": [{"b": "There’s no sharp line between a heap and a non-heap", "l": ["If there’s no line, then one grain is a heap or a million grains isn’t. Logic forces a line somewhere, however unwelcome.", "One grain isn’t a heap. Add one, still not. So nothing’s ever a heap, and yet there’s one in the yard. The argument lost to a pile of sand.", "The sorites paradox is the discovery that “pile” isn’t a unit."], "r": ["Logic forces a line only if every statement is flatly true or false. The lesson may be that this is the assumption to give up.", "And yet there’s one in the yard and none on the table. So the word works and the argument is what’s off.", "It’s the discovery that most words are like that, and logic was built for the ones that aren’t."]}, {"b": "There is a sharp line; we just can’t know where", "l": ["It’s hard to believe that usage fixes an exact grain at which sand becomes a heap, with nothing about how we talk determining which.", "So there’s an exact hair that makes a man bald and nobody can ever find it. That’s not a theory, it’s a ghost story.", "Epistemicism says there’s a precise minute when someone becomes old, and it’s a secret."], "r": ["It’s hard to believe and it keeps ordinary logic whole. Every rival ends up with a cutoff somewhere it also can’t locate.", "There’s an exact number of hairs on your head and you can’t find that out either.", "There’s a precise second when you fell asleep last night. Also a secret."]}, {"b": "Truth comes in degrees", "l": ["Degrees just move the problem: there has to be a sharp line where “fully true” ends, and nobody believes in that one either.", "“It’s 0.6 true that he’s tall.” Nobody has ever said that. A theory of language should include one thing a person has said.", "Fuzzy logic: for when someone wants to be wrong to two decimal places."], "r": ["The second-order worry is real, and it’s about the model’s numbers. A map with exact contour lines doesn’t claim the hill has edges.", "“Sort of tall,” “tallish,” “pretty tall.” People say it all day. They leave out the decimal.", "It runs the anti-lock brakes in your car."]}, {"b": "Vagueness is in language, not the world", "l": ["Clouds and mountains seem to lack sharp borders whatever we call them. It’s unclear that tidying the language would tidy them.", "Where does a mountain stop? That’s not a word problem. Go stand on it.", "“It’s just semantics” has been said about every problem by someone who then couldn’t solve it."], "r": ["The cloud has droplets with exact positions. “Cloud” doesn’t say which to count, and that’s a fact about the word.", "Every rock on it has a location. The boundary is our rounding.", "It’s semantics, and semantics is hard. That’s the claim."]}], "s": "≋︎"}]}, {"n": "Ethics", "s": "§", "t": [{"t": "Utilitarianism", "k": [{"b": "Maximize overall well-being", "l": ["Adding everyone up ignores that people are separate. It allows severe losses for a few in exchange for small gains to many.", "Nobody knows what overall well-being is, so nobody can maximize it. Every utilitarian has been doing something else the whole time and calling it that.", "Nobody can measure happiness, so the whole thing is arithmetic on vibes."], "r": ["Counting each person once and no one for more is how it respects persons. The alternative gives some people’s interests a veto over other people’s lives.", "Nobody knows exactly what health is either, and hospitals still improve it. Rough measures of misery are enough to tell a famine from a picnic.", "You can tell a broken leg is worse than a stubbed toe. Congratulations, you’ve done the arithmetic."]}, {"b": "Only consequences matter", "l": ["Transplant and scapegoat cases suggest some constraints matter in themselves. Replies that appeal to rules or long-run effects concede the verdict and move it.", "Consequences never end. Every act is still having them. So no act can ever be scored, and the theory has never produced a result.", "A surgeon has five dying patients and one healthy visitor. Utilitarianism has notes."], "r": ["A world where surgeons harvest visitors is a world where nobody goes to hospitals. The verdict comes from counting everything, which is what the theory says to do.", "Forecasts never end either, and you still bring an umbrella. You act on what can be foreseen. Nobody waits for the last consequence.", "The notes say no. Nobody would ever see a doctor again. We did the math."]}, {"b": "Everyone’s interests count equally", "l": ["Strict impartiality leaves no room for special duties to family and friends, which most people take to be the center of moral life.", "If everyone counts equally, so does the utilitarian, so he may as well keep the money. The theory funds itself.", "Ask a utilitarian to pick between their mom and two strangers and they have to think about it."], "r": ["Impartial at the level of justification, partial in practice: a world where people look after their own goes better. The theory endorses the loyalty. It just explains it.", "He keeps it only if he’s the best use of it. He almost never is. That’s the theory, and it’s why they give so much away.", "Two strangers also have moms."]}, {"b": "Higher pleasures outweigh lower ones", "l": ["Ranking pleasures by quality gives up the single measure that made the theory attractive, and Mill’s test of experienced judges brings in a standard that isn’t pleasure.", "The people who have tried both poetry and video games mostly went back to the video games. That’s the judges’ verdict, and Mill threw it out.", "Mill said some pleasures are higher than others, and the higher ones turned out to be his hobbies."], "r": ["Mill was patching hedonism in a hurry. The modern theory counts whatever makes a life go better for the one living it, and drops the ranking.", "Ask them at eighty which evenings they’d keep. The judges’ verdict comes in late, and it isn’t the games.", "Somebody’s hobbies had to be on top. Yours were considered."]}, {"b": "Rule utilitarianism avoids the counterexamples", "l": ["Either the rule gives way whenever breaking it does more good, and it’s the old theory again, or it’s followed anyway, and that’s rule worship.", "A rule that says “maximize, except when it looks bad” isn’t a theory. It’s PR.", "A utilitarian would frame an innocent man to stop a riot and call it Tuesday."], "r": ["The rule is kept because agents who break rules whenever their own sums say so do worse overall: they miscalculate and nobody can trust them. That’s a consequence.", "“Don’t frame innocent people” isn’t PR. It’s what you get when you include the cost of everyone finding out, which they do.", "And your theory lets the riot kill hundreds so your hands stay clean. Call that Tuesday."]}], "s": "Σ"}, {"t": "Kant", "k": [{"b": "Act only on maxims you could universalize", "l": ["The test depends on how the maxim is worded. Word it narrowly and nearly anything passes, while harmless maxims like “play tennis when the courts are empty” fail.", "If everyone became a dentist, society would collapse. So being a dentist is immoral. It’s his rule.", "The categorical imperative is the golden rule, long version."], "r": ["The maxim is your actual reason for acting, and you don’t get to pick its wording. Gerrymandered descriptions aren’t what you’re acting on, and judgment about that is part of the test.", "The maxim is “take up a trade I’m suited to in a society that needs many.” Everyone can will that. You universalized the job title.", "The golden rule lets a masochist hurt people. The long version is long because that had to be fixed."]}, {"b": "Never lie, even to the murderer at the door", "l": ["Most Kantians now think Kant misapplied his own theory, and that deceiving an aggressor passes the test.", "The murderer would have found him anyway. Murderers check. So the lie doesn’t even help, and Kant is right for the wrong reason, which in Kant is still wrong.", "Kant said no lying to the murderer at the door. Whole system, one example."], "r": ["Right, and that’s the system correcting its author. The principle of respecting persons can be defended on its own terms without the 1797 essay.", "He’s wrong about the case and the reason still matters: once you lie for good outcomes, you answer for every outcome. He was pointing at who owns what follows.", "It’s one late essay. Judge Newton by the alchemy while you’re at it."]}, {"b": "Treat people as ends, never merely as means", "l": ["“Merely” carries the weight and has no precise test, and the formula gives no clear answer when everyone’s ends conflict.", "Everyone uses a cashier as a means. Paying doesn’t change that, it makes it a means with a receipt.", "Kant is basically the Ten Commandments without God."], "r": ["“Merely” has a test: could the other person agree to the way they’re being treated? Deception and force fail it. Ordinary dealings pass.", "The cashier agreed to the job and you’re paying what was asked. Using with consent is the allowed kind. That’s the whole distinction and you walked into it.", "The Commandments say what. He says why, without anyone watching."]}, {"b": "Only acts done from duty have moral worth", "l": ["Someone who visits a friend in the hospital from duty alone seems to be missing something morally important. Schiller made the joke in Kant’s lifetime.", "So the best person is someone who hates helping and does it anyway. He described a resentful volunteer and called it the summit of ethics.", "Kant said helping people because you like helping has no moral worth. It only counts if it’s a chore."], "r": ["He doesn’t say inclination spoils the act. Duty must be enough to move you if the liking fails. The friend who visits gladly and would come anyway is his ideal case.", "The best person is the one who’d still show up on the day they didn’t feel like it. You’d want that friend. Everyone would.", "It counts when you’d do it anyway. That’s the test for whether you’re kind or just in a good mood."]}, {"b": "We know appearances, never things in themselves", "l": ["Jacobi’s problem: Kant says things in themselves cause appearances, and also that causation applies only within appearances.", "If nobody can know them, nobody can know there are any. He posited a room and lost the key on purpose.", "The thing-in-itself can’t be known, and Kant knows quite a lot about it."], "r": ["On the two-aspect reading there’s one set of things, considered as they appear and as they are apart from us. “Cause” is then a loose way of saying ground.", "We know there’s a room because the wall is here. Knowing a limit from this side is the entire Critique.", "He knows it’s there and that we can’t describe it. That’s two things. He stops there."]}], "s": "!"}, {"t": "Virtue ethics", "k": [{"b": "Ask what a virtuous person would do", "l": ["The test gives little guidance and looks circular unless virtue is spelled out without mentioning right action.", "A virtuous person would ask what a virtuous person would do. So it’s two people asking each other at a door forever.", "Virtue ethics: do what a good person would do. Who’s a good person? One who does good things."], "r": ["The virtues are specified through what a human life needs: courage, honesty, justice. Right action is derived from those, and it gives guidance through rules like “do what’s honest.”", "The first person at the door knows something about kindness already. Everyone does. The theory starts from that and no theory starts from nothing.", "Who’s a good doctor? One who heals people. Nobody thinks medicine is circular."]}, {"b": "Character, not rules or outcomes, comes first", "l": ["Experiments like Milgram’s suggest circumstances drive behavior more than stable traits do, though what they show is contested.", "Character is what someone has done so far. So it’s outcomes, on a delay.", "Psychologists found people help strangers more after finding a dime. So much for character."], "r": ["Those studies found most people aren’t virtuous, which Aristotle said. Virtue is rare and hard. And a third of Milgram’s subjects walked out, which is the trait showing.", "Then two people with the same record have the same character, and nobody who has hired anyone believes that.", "And some people help without the dime. That’s the character."]}, {"b": "The virtues are needed for flourishing", "l": ["Either flourishing is defined to include virtue, and the claim is empty, or it isn’t, and then vicious people sometimes flourish.", "Plenty of terrible people are doing great. Some of them have boats.", "Flourishing is what the virtuous have, and the virtuous are whoever’s flourishing."], "r": ["The vicious person who seems to flourish has wealth and comfort. Whether that’s a good human life is the question, and the theory argues it isn’t.", "A boat is not a life. Ask them how many people they trust.", "Health is what healthy people have, and the healthy are whoever’s well. Some circles are just definitions."]}, {"b": "Practical wisdom can’t be written down as rules", "l": ["That shields the theory from counterexamples and gives no way to settle a disagreement between two people who each claim to see it rightly.", "Anything that can’t be written down can’t be taught, and anything that can’t be taught is luck. So virtue is luck with good manners.", "“Practical wisdom” is the part where the theory says “you’ll figure it out.”"], "r": ["Every theory needs judgment to apply its rules. This one says so and studies how judgment is acquired, where the others leave it unmentioned.", "Riding a bike can’t be written down. It’s taught every day. Demonstration and practice are teaching.", "Medicine tells its residents the same thing. It’s called training."]}, {"b": "The virtues are the same everywhere", "l": ["The lists differ sharply: Aristotle’s pride, Christian humility, Confucian filial piety. MacIntyre granted that virtues belong to traditions.", "Homeric virtue was killing people well. If virtues were universal, Achilles and a kindergarten teacher would get the same performance review.", "Aristotle’s virtues are what a rich Athenian already liked about himself."], "r": ["The lists differ and the core overlaps: courage, justice, self-control and honesty turn up almost everywhere. Humility and pride may be one trait under two descriptions.", "Achilles and a kindergarten teacher both need courage, honesty and self-command. The job descriptions differ. The review form has the same headings.", "A rich Athenian with courage, justice and self-control. Which one are you against?"]}], "s": "φ"}, {"t": "Moral realism", "k": [{"b": "There are objective moral facts", "l": ["Mackie: facts that command by their nature would be unlike anything else we know of, and it’s unclear how anyone would detect them.", "Facts get found with instruments. Nobody has built a wrongness detector, and there’d be a lot of money in it.", "Moral facts exist, they just can’t be seen, measured or found anywhere. A ghost with opinions."], "r": ["The same oddness belongs to facts about what one ought to believe on the evidence. If those are too strange to exist, the argument against moral facts goes too.", "Nobody has built a number detector either. Some facts are found by thinking, and there’s plenty of money in those.", "You believe in logical validity and you can’t put that in a jar either."]}, {"b": "Moral progress shows we’re tracking something", "l": ["Progress is measured by today’s standards, so any path that ends at our views looks like progress. Changing sympathies and interests explain the same history.", "Every era thought it was the progress. The Victorians were sure. So the thing being tracked is “now is best,” and it’s always now.", "Every culture was sure it had the moral facts. They had different ones."], "r": ["The changes weren’t random drift. They followed from applying existing principles more consistently once the excuses were examined, which is what tracking looks like.", "The Victorians thought they were better than slaveholders. They were. Being sure doesn’t make you wrong.", "Every culture was sure it knew the shape of the earth too."]}, {"b": "Some things are just obviously wrong", "l": ["Strong conviction is equally expected on evolutionary and cultural stories that never mention truth.", "Obvious things don’t need a philosophy department. Nobody runs a seminar on whether water is wet.", "“It’s just obvious that torture is wrong” is a feeling with its voice lowered."], "r": ["Debunking has to stop somewhere or it takes logic and the senses with it. Realists argue that the judgments that survive reflection have the same standing as those.", "Nobody runs a seminar on it because nobody doubts it. The seminars are about why you’d doubt this and nothing else.", "Your confidence in that objection is a feeling too."]}, {"b": "Moral facts are like mathematical facts", "l": ["The comparison has to hold where it counts. Mathematics has agreed proof procedures and science can’t do without it, and ethics has neither.", "Math facts are the same on Mars. Nobody thinks tipping is.", "Realists say moral facts are like math facts. Math has proofs."], "r": ["Mathematics rests on axioms accepted because they seem true on reflection. Ethics has the same footing and fewer theorems so far.", "Tipping isn’t. Torturing children for fun is wrong on Mars. You went for the custom and skipped the fact.", "Proofs from axioms nobody proved."]}, {"b": "People disagreed about physics too", "l": ["Scientific disagreement tends to end when the evidence comes in. Basic moral disagreement persists among informed, reflective people, and that needs explaining.", "Physics arguments ended when someone ran an experiment. Ethics has had three thousand years and its experiment is two guys yelling.", "Moral realism is church for people who left church."], "r": ["Much of the disagreement is about non-moral facts or comes from self-interest. Among people who share the facts and have nothing at stake, it shrinks a great deal.", "Ethics ran its experiment. Slavery was tried at scale, the results came in, and almost nobody wants a replication.", "Church has commandments from a person. This doesn’t need one. That’s the difference."]}], "s": "⊤︎"}, {"t": "Moral anti-realism", "k": [{"b": "Morality depends on minds", "l": ["Then if everyone approved of cruelty it would be fine. The standard way of denying that borrows moral claims the view was supposed to explain.", "Money depends on minds too, and try not paying taxes. Mind-dependent things are the realest things there are.", "So genocide is a difference in taste. That’s the view."], "r": ["“If everyone approved, it’d be fine” is a moral claim, and one I reject from inside my own outlook. Having no outside standpoint doesn’t mean having no standpoint.", "Money stops being real the moment everyone stops believing. Tell me which moral fact survives that test, and then tell me how you checked.", "No, it’s wrong. I say that with everything I’ve got. I just don’t say the universe agrees."]}, {"b": "All moral claims are
