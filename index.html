invisible realm of perfect beings that can’t be seen or touched, and get annoyed at religion."], "r": ["The access problem assumes knowledge needs a causal link. Logic and morality have no such link either, and we seem to know some of both.", "“Where” is a question about things in space. Ask where the number seven is and you’ve misunderstood seven.", "Religion says the realm has opinions about you. Numbers don’t."]}, {"b": "Mathematics is discovered, not invented", "l": ["The feeling of discovery is equally expected if we’re exploring the consequences of rules we laid down, as in chess.", "Different cultures invented different number systems. Nobody discovers something in base ten.", "Math is discovered, which is why it comes with so many arbitrary conventions about notation."], "r": ["In chess you can change a rule and get another game. Try changing whether there are infinitely many primes.", "Base ten is the spelling. The primes are the same in base two. Nobody invented which numbers are prime.", "The notation is invented. What it’s notation for wasn’t."]}, {"b": "Science can’t do without numbers, so they’re real", "l": ["Being indispensable to a theory may show usefulness, not existence. Some argue physics can in principle be done without quantifying over numbers.", "Science can’t do without frictionless planes either. Go find one.", "“We need it, so it exists” is also how people talk about their third coffee."], "r": ["The paraphrase projects have covered a slice of old physics, with heavy machinery. Until one works for quantum theory, the numbers stay on the books.", "The frictionless plane is an idealization you can drop. Try dropping the real numbers and see what’s left of the equations.", "The coffee does exist."]}, {"b": "We grasp mathematical truths by intuition", "l": ["A faculty of mathematical perception with no known mechanism is a label for the problem. And intuitions led to contradictions in naive set theory.", "Intuition says a line has more points than a shorter line. It doesn’t. Intuition failed the first quiz.", "Mathematical intuition is a sixth sense that only works for people who already have the degree."], "r": ["“Intuition” may be the name for what axioms have in common: they force themselves on us. Set theory recovered by finding better axioms, which looks like perception correcting itself.", "That’s intuition being corrected by proof, which is the faculty working. Eyes get corrected by measuring, too.", "Every sense works better with training. Ask a radiologist."]}], "s": "π"}, {"t": "Nominalism", "k": [{"b": "Only particular things exist", "l": ["Then what two red things share needs explaining without redness. Resemblance is the usual answer, and resemblance looks like a universal.", "If only particulars exist, the word “particular” doesn’t apply to more than one of them. He needs a new word for each.", "Nominalism: there’s no such thing as a kind of thing, including this kind of view."], "r": ["Resemblance can be taken as basic. Every theory has a primitive, and one relation among particulars is cheaper than a second realm.", "“Particular” is a word, and words are particular marks used again. That’s the whole theory, applied to your objection.", "There’s this view, and that view, and they resemble each other. Fine by me."]}, {"b": "Universals are just names", "l": ["Things were alike before anyone named them. The name follows the likeness and can’t be what makes it.", "Dogs were all dogs before English. Other dogs can tell.", "“It’s only a word” has never ended an argument and this is the oldest one."], "r": ["Things are alike before naming, agreed. Being alike is a fact about the two of them and needs no third item called Redness.", "Dogs can tell other dogs. They’ve never once needed Doghood.", "It hasn’t ended because the other side keeps adding entities."]}, {"b": "Mathematics is a useful fiction", "l": ["A fiction this useful, that predicts the unobserved to twelve decimals, is hard to tell from a truth. The usefulness is the thing needing explanation.", "Fiction doesn’t keep planes up. Nobody boards a flight designed with Hamlet.", "Numbers aren’t real, says the man counting his change."], "r": ["The usefulness is explained by structure: the physical world has patterns the story mirrors. A good map is useful and nobody thinks the contour lines are in the hills.", "The plane was designed with frictionless air and massless strings. Engineers use fictions all day.", "I count coins. I’ve never been handed a three."]}, {"b": "Occam’s razor cuts abstract objects", "l": ["Parsimony counts only if the leaner theory explains as much. Paraphrasing away every reference to numbers and properties tends to cost more than it saves.", "Occam’s razor is an abstract object. He’s sawing the branch.", "Ockham was a friar. He kept one invisible entity, the big one."], "r": ["The paraphrases are costly. The alternative is knowing about things with no location and no effects, which costs more.", "It’s a habit of mind. I’ve got it in here with the rest of my habits. No abstract object required.", "He kept the one he thought had evidence. That’s using the razor."]}], "s": "«»"}, {"t": "Mereological nihilism", "k": [{"b": "There are no tables, only particles arranged tablewise", "l": ["“Arranged tablewise” seems to presuppose the concept of a table. And if particles themselves have parts, the view may leave nothing at all.", "I put my coffee on it. The coffee is not on the floor. The table has more evidence than most of physics.", "There are no tables, he typed, at a desk."], "r": ["“Arranged tablewise” can be spelled out by positions and bonds without the word. And if matter divides forever, the view becomes “there’s only stuff,” which is fine.", "The coffee is held up by particles pushing on particles. I never denied the pushing.", "There are particles arranged deskwise. I use them every day."]}, {"b": "Composition never occurs", "l": ["Then there are no people either, including the one holding the view. Exceptions for living things look like special pleading.", "Then there’s no philosopher, no paper and no journal. The view has been published by nothing in nothing.", "If nothing is made of parts, neither is the argument, and it needs all three of its premises."], "r": ["Some nihilists accept that. Others say the rule has to be the same everywhere, and “sometimes, when it feels like a thing” isn’t a rule.", "Published by particles arranged publisherwise. They do good work.", "Three premises arranged argumentwise. It’s still valid."]}, {"b": "Ordinary talk is loosely true", "l": ["A theory that says nearly every ordinary statement is strictly false needs the “loosely true” story to do all the work, and it rarely gets spelled out.", "“Loosely true” is “true.” He’s charging extra for an adverb.", "“There’s a table” is false but fine to say. So is everything else he says."], "r": ["The story is short: “there’s a table” is assertible when things are arranged that way. It’s the same move as “the sun rose.”", "“The sun rose” is loosely true. You pay for that adverb every morning and don’t complain.", "So is “the sun came up.” You manage."]}, {"b": "It solves the Ship of Theseus", "l": ["It removes the puzzle by removing the ship, which is like curing a headache by denying there’s a head.", "It solves it the way burning the boat solves it.", "Asked which ship is the original, the nihilist says “what ship,” and thinks that’s a move."], "r": ["It shows the puzzle was about our conventions for the word “ship.” Which planks are where was never in doubt.", "Nobody’s confused about the wood. Burn the puzzle and the boat’s fine.", "It’s the only answer on which nobody at the dock is wrong about anything."]}], "s": "⋯︎"}]}, {"n": "Mind", "s": "ψ", "t": [{"t": "Physicalism", "k": [{"b": "Everything is physical", "l": ["Hempel’s dilemma: defined by today’s physics the thesis is false, and defined by some ideal future physics it’s close to empty.", "Physics changes every fifty years, so “physical” changes with it. A theory that says everything is whatever the next textbook says is a subscription.", "“Physical” just means whatever physics says next year. So physicalism is the view that everything is whatever."], "r": ["Take “physical” to mean not fundamentally mental. That isn’t tied to today’s physics and it isn’t empty: it rules out souls and basic experience, which is what the argument is about.", "The periodic table got revised too, and chemistry isn’t a subscription to nothing. Updating is what being about the world looks like.", "Whatever physics says, yes. As opposed to whatever you’d like."]}, {"b": "Consciousness is brain activity", "l": ["Correlation, and even identity, leave the explanatory gap. Nothing in the neural story shows why this activity comes with experience and not with none.", "A radio’s music changes when the circuits are damaged, and nobody thinks the band lives in the radio.", "A physicalist looks at a brain scan of someone in love and thinks the scan is the love."], "r": ["A gap in explanation isn’t a gap in nature. “Water” can’t be deduced from H2O without knowing how the two concepts connect, and nobody thinks water is something extra.", "Break a radio and the station still plays on every other radio. Break a brain and that person plays nowhere.", "The scan is a picture of it, like a wedding photo. Nobody thinks the photo is the marriage, or that the marriage is a ghost."]}, {"b": "Science will explain it eventually", "l": ["A promise isn’t an argument. Past reductions explained structure and function, and the dispute is whether experience is exhausted by those.", "They’ve had 150 years and every brain ever made to look at. At some point “eventually” is the result.", "Physicalists have been twenty years from explaining consciousness since 1950."], "r": ["It’s an induction, not a promise: every earlier “science can never explain this” gave way. The burden is on showing this one differs in kind, and the case for that is an intuition.", "Fermat’s last theorem took 358 years. It was a theorem the whole time.", "Dualists have been zero years from explaining it since 1641, and still are."]}, {"b": "Mary learns no new fact, only an ability", "l": ["The ability reply seems to leave something out: on seeing red she appears to learn that this is what the others were having, and that’s a fact.", "If knowing all the physics were knowing everything, physicists wouldn’t go to concerts. They’d read the score and stay home.", "Physicalism means the experience of red is a voltage. Okay."], "r": ["She learns an old fact under a new concept, one that can only be had by having the experience. New way of knowing, same fact.", "Physicists go to concerts for the reason they eat dinner instead of reading the menu. Knowing about isn’t having. Nobody said it was.", "And a symphony is air pressure. Okay?"]}, {"b": "Causal closure rules out the non-physical", "l": ["Closure is a generalization from cases where consciousness wasn’t in question. Using it against non-physical minds assumes the thing at issue.", "Numbers aren’t physical, and bad math closes bridges all the time. So non-physical things cause plenty.", "Physicalism is a metaphysics for people who say they don’t do metaphysics."], "r": ["It’s inductive. Every time a bodily movement has been traced back, the causes were physical. Minds would be the one exception, located in the one place we haven’t finished looking.", "The bridge was closed by an engineer’s brain state about the math. Find one where the number did it alone.", "It’s metaphysics for people who check."]}], "s": "⊛︎"}, {"t": "Dualism", "k": [{"b": "The mind can’t be reduced to the brain", "l": ["A mind that can’t be described in brain terms can still be nothing over and above the brain. Plenty of physicalists accept the premise and deny the conclusion.", "Weather can’t be reduced to one molecule either, and nobody thinks storms are spirits. Well, some people do, and they’re also dualists.", "Dualism is believing in ghosts, but only one, and it’s driving."], "r": ["That middle position has to say how the mental does anything when the physical already suffices. Many think it can’t, and that it’s dualism without the nerve.", "A storm is nothing over its molecules, and there’s nothing it’s like to be one. There’s the difference, and it’s the whole topic.", "Somebody’s driving. You’re the one who says the car is empty."]}, {"b": "Zombies are conceivable, so physicalism is false", "l": ["Conceivable may not mean possible. Water without H2O was conceivable too, and the physicalist says the same about zombies.", "If zombies were possible, some people would be one, and they’d say exactly what dualists say. So the argument can’t rule out its own author.", "Zombies are “conceivable.” So is a married bachelor if nobody thinks very hard."], "r": ["Water without H2O is conceivable only because “water” is pinned down by how the stuff looks. For pain, how it feels is the thing itself, so the same reply has no gap to work in.", "I know I’m not one. That’s the one thing the argument starts from. You’re welcome to wonder about yourself.", "Show the contradiction, then. A married bachelor has one. Go ahead."]}, {"b": "The soul interacts with the body", "l": ["Princess Elisabeth’s question to Descartes still stands: how does something with no size or energy move matter without breaking conservation laws?", "Anything that pushes a neuron shows up on an instrument. They’ve had instruments on neurons for a century and the soul has never tripped one.", "Nobody has ever said where the soul gets the energy to push a neuron. Conservation of energy would like a word."], "r": ["Physical causation is brute at the bottom too: nobody explains why charge moves charge. And conservation holds for closed systems, which is the thing in dispute.", "Instruments register physical effects, and the effect is the neuron firing. They’ve registered that plenty.", "Conservation of energy would like a closed system. Whether this is one is the question."]}, {"b": "Mental properties are non-physical properties", "l": ["If the physical world is causally closed, the extra properties do nothing, including causing anyone to talk about them.", "A property is a way of describing a thing. Non-physical properties of a physical thing is like non-wet properties of water.", "Property dualism is dualism for people who get embarrassed at parties."], "r": ["Some accept that. Others deny closure at the smallest scale, or take experience to be what underlies the powers physics describes. The options aren’t used up.", "Water has properties chemistry never mentions, like being somebody’s favorite drink. Things have more properties than one science lists.", "Physicalism is behaviorism for people who got embarrassed about behaviorism."]}, {"b": "I can doubt my body but not my mind", "l": ["The inference fails for ordinary cases: Lois can doubt that Clark flies without doubting that Superman does, and they’re still one man.", "I can doubt my mind fine. People do it every time they can’t find their keys. So mind and body are equally doubtful and the argument’s over.", "A few beers and the immaterial mind starts slurring."], "r": ["The mature argument isn’t from doubt. It’s that I can clearly conceive of existing without a body, and what’s clearly conceivable is possible. Lois is only ignorant of a name.", "Doubting where your keys are is your mind working. You can’t doubt it’s there while using it to doubt.", "Smash a piano and the pianist sounds bad too."]}], "s": "‖"}, {"t": "Panpsychism", "k": [{"b": "Consciousness is fundamental and everywhere", "l": ["Giving experience to basic physics adds a property with no measurable effect and no agreed way to say which things have how much.", "If it were everywhere, anesthesia wouldn’t work, because there’d be nowhere to send it.", "“Consciousness is fundamental” is giving up in a nice voice."], "r": ["On the main version it’s what has the effects: physics describes what things do, and experience is the thing doing it. Nothing is being added to the causal story.", "Anesthesia breaks up the organization. The parts keep whatever they had. Draining a lake’s shape doesn’t remove the water.", "Physics called mass fundamental and nobody said it had given up."]}, {"b": "It avoids the hard problem", "l": ["It trades it for the combination problem: how tiny experiences add up to one subject is as unexplained as how neurons produce one.", "Saying everything has it isn’t explaining it. Ask where money comes from, and “everything’s a little bit money” is not economics.", "It solves the hard problem by having it everywhere."], "r": ["Combination is a problem of getting from experience to experience. The hard problem is getting experience from none at all. One of those gaps is smaller.", "“Everything is a little bit charged” is physics, though. That’s exactly how charge works.", "That’s how gravity got solved too."]}, {"b": "Physics says what matter does, not what it is", "l": ["The gap doesn’t single out experience as the filler. “Proto-experiential” placeholders concede nobody knows what goes there.", "What matter does is what it is. A thing that does everything a chair does is a chair. That’s all of engineering.", "Panpsychism is animism with a grant."], "r": ["Nothing forces it. Experience is the only candidate we’re acquainted with, and positing a wholly unknown nature in its place explains less.", "A thing that does everything a chair does inside a simulation isn’t a chair anyone can sit on. Doing needs a doer.", "Animism said rocks have plans. This says an electron has next to nothing. Read past the title."]}, {"b": "Micro-experiences combine into minds like ours", "l": ["Subjects don’t seem to add. William James: twelve men each thinking one word don’t make a mind thinking the sentence.", "A billion grains of sand each being slightly warm don’t make a beach with a fever. Adding doesn’t work like that.", "A billion tiny minds don’t make one big mind. A stadium isn’t a person."], "r": ["James’s twelve men aren’t bonded to each other. The proposals point to specific physical relations, the way mass adds up under some arrangements and not others.", "A billion slightly warm grains do make a warm beach. Temperature adds. You picked the example that works.", "A brain is a stadium of neurons, and you think that one’s a person."]}, {"b": "Rocks aren’t conscious, only their particles", "l": ["Then the theory owes a rule for which heaps are subjects, and the precise proposals make simple grids of logic gates more conscious than people expect.", "If the parts are conscious and the rock isn’t, consciousness goes away when more of it is added. No other quantity in physics does that.", "Panpsychists say the rock isn’t conscious, just its particles. So the rock is a crowd with nobody home, and that’s the clarified version."], "r": ["Every theory of consciousness owes that rule. Physicalists also have to say why brains and not rocks. This view at least starts with the right ingredients.", "Voltage. Wire the batteries the wrong way round and more of them gives you zero. Arrangement decides.", "A crowd has no single opinion either, and nobody finds that mysterious."]}], "s": "∀︎"}, {"t": "The hard problem", "k": [{"b": "Explaining function doesn’t explain experience", "l": ["The illusionist reply: what needs explaining is why we judge there’s a further ineffable something, and that’s a question about function.", "Explaining what a heart does explained the heart. There was no second “hard problem of pumping,” because nobody insisted on one.", "The hard problem is the easy problem plus wonder."], "r": ["Explaining the judgment isn’t enough, because the judgment is about something we’re acquainted with. An illusion of pain that hurts is pain.", "Nobody ever asked what it’s like to be a heart. With pumping, function was all there was to explain. That’s the contrast.", "Take away the wonder and tell me what red looks like."]}, {"b": "There’s something it’s like to be a bat", "l": ["That we can’t imagine being a bat shows a limit on imagination and concepts. It doesn’t by itself show a fact beyond the physical ones.", "Nobody knows what it’s like to be a bat, including the bat, who has never thought about it. A fact nobody has isn’t a fact.", "“What it’s like” isn’t a thing. It’s a phrase."], "r": ["Nagel says as much. The point is that a complete objective description leaves out the bat’s point of view, whatever that turns out to imply.", "The bat doesn’t need to think about it. It has it. You don’t think about your pain in order to have it either.", "“It’s a phrase” is also a phrase. Mine refers to this. Yours refers to nothing."]}, {"b": "Mary learns something new", "l": ["She may get a new way of thinking about a fact she already knew, which blocks the step to non-physical facts.", "She had every book. If she’s surprised, the books were incomplete, and that’s a library problem.", "Mary learns nothing when she leaves the room. She read the book."], "r": ["If she acquires a new concept, something about red made it unavailable from the books, and that something is what needs a physical explanation.", "Then say which book. Write the sentence that would have told her. That’s the challenge, and nobody has met it.", "Then describe red to her. Take your time."]}, {"b": "It’s unlike any other scientific problem", "l": ["People said the same about life. The sense that something is beyond mechanism in principle has a poor track record as evidence.", "Every unsolved problem is unlike the solved ones. That’s what unsolved means. Then someone solves it and it’s chemistry again.", "People said life needed a special spark too. Then biology happened and nobody brings it up."], "r": ["Life was always a question about functions: growth, reproduction. Once those were explained nothing was left over. Here something is.", "Other unsolved problems come with some idea of what an answer would look like. This one doesn’t, and that’s the difference being reported.", "Nobody ever was a spark. Everybody is a point of view."]}, {"b": "Qualia are real and irreducible", "l": ["Dennett’s cases suggest people lack steady access to these supposed inner properties. If introspection can’t pin them down, they’re doubtful as data.", "If qualia were ineffable there wouldn’t be three thousand papers describing them.", "Qualia is a word for feelings so they can be published."], "r": ["Being unsure how to describe an experience isn’t being unsure it happened. The tasters disagree about their memories, and neither doubts the coffee tastes like something.", "Ineffable means it can’t be conveyed to someone who hasn’t had it. Three thousand papers, and Mary still doesn’t know.", "“C-fibers firing” is a word for feelings so they can be ignored."]}], "s": "‽"}, {"t": "AI consciousness", "k": [{"b": "Current models might be conscious", "l": ["Their self-reports are learned from human descriptions of experience, so the main evidence is contaminated, and they lack features many theories require.", "It predicts the next word. Something that predicts the next word is conscious the way a train schedule is going somewhere.", "It’s autocomplete. Autocomplete doesn’t have a favorite color."], "r": ["Agreed, the reports are weak evidence. The case rests on architecture and on uncertainty across theories: several serious ones are met or nearly met, and none is known to be true.", "Predicting the next word well takes a model of what the words are about. You predict the next moment for a living and call it perception.", "You’re a prediction engine with a favorite color. It can be done."]}, {"b": "The substrate doesn’t matter, only the computation", "l": ["That’s functionalism, which is the assumption in dispute. Simulating a process isn’t producing it, and views tying experience to living bodies are still live.", "Computation is something people read into machines. A rock’s atoms compute something too under the right description, so either rocks are in or computation is out.", "A weather simulation doesn’t get anyone wet."], "r": ["Replace neurons one at a time with parts that do the same job. If experience fades while behavior and reports stay exactly the same, that’s stranger than the material not mattering.", "Computing means giving the right output for inputs that never arrived, too. Rocks can’t. Chips and brains can.", "A simulated calculation really adds. It depends what kind of thing a mind is, and you skipped that part."]}, {"b": "It passes every test we use on each other", "l": ["Behavior works as evidence between humans because of shared biology and history. With systems built to produce human-like text, the inference loses that support.", "An actor passes every behavioral test for being Hamlet.", "A program passed the Turing test in 2014 by pretending to be a 13-year-old. It tests the judges."], "r": ["Fair, behavior alone isn’t enough here. That cuts both ways: the same gap removes the grounds for confident denial.", "The actor is conscious the whole time. Bad example for your side.", "The current ones pass the bar exam. The judges were lawyers."]}, {"b": "Take model welfare seriously under uncertainty", "l": ["Precaution needs some estimate of the odds and some idea of what would count as harm. With neither pinned down it can license unlimited concern.", "Under uncertainty anything might be conscious, including the spreadsheet with the uncertainty estimates. Nobody is funding spreadsheet welfare.", "People thought ELIZA loved them in 1966. Nothing has changed except the budget."], "r": ["Rough estimates exist, and the steps proposed are cheap: assess, document, avoid gratuitous harm. Precaution scaled to its cost isn’t unlimited concern.", "No theory of consciousness gives a spreadsheet any credence. Several give these systems some. Uncertainty has a shape.", "ELIZA was about 200 lines. If nothing’s changed, write one this weekend."]}, {"b": "Brains are just information processing too", "l": ["That brains process information doesn’t show processing is all that matters. The same reasoning would make digestion independent of the stomach.", "Brains are also just wet. Nobody thinks a sponge is halfway there.", "It’s just math. Nobody asks whether long division is lonely."], "r": ["Digestion’s job is moving chemicals around, so the chemicals matter. A brain’s job is control and modeling, and for jobs like that the organization is what counts.", "The sponge isn’t wet in a pattern that models the world. Neither is the ocean. The pattern was the claim.", "Your neurons are doing chemistry, and nobody asks if sodium is lonely."]}], "s": "01"}, {"t": "Functionalism", "k": [{"b": "Mental states are defined by what they do", "l": ["Block’s objection: organize the population of China to mirror a brain’s functions and, on this view, the nation has a mind. Most find that absurd.", "A fake Rolex does everything a Rolex does. Ask the pawn shop if that makes it one.", "Functionalism: if it walks like a mind and talks like a mind, stop asking."], "r": ["Many functionalists bite it: a system with that organization would have a mind. The intuition against it is the same one that says neurons can’t add up to thought.", "If it keeps time, runs for decades and no test can tell, the pawn shop is going by a logo.", "If it walks, talks, plans and grieves like a mind, what’s left to ask about?"]}, {"b": "The same mind could run on different hardware", "l": ["Being realizable in many materials is an assumption about minds, not a finding. Digestion and photosynthesis are functions too, and they need the chemistry.", "The same recipe in a different oven gives a different cake. Bakers know this. Philosophers don’t bake.", "The mind is software, according to people who have never had a hangover."], "r": ["Digestion’s job is to change chemicals. A mind’s job is to process information, and for that kind of job the medium is replaceable. That’s the argument.", "Same cake to anyone who eats it blindfolded. Bakers swap ovens all the time.", "A hangover is a hardware fault. Those are in the theory."]}, {"b": "The mind is to the brain as software is to hardware", "l": ["Brains have no clean split between program and machine. The wiring is the memory and the chemistry is the computation.", "Software has an author, a version number and a license. So who shipped this, and where do the bug reports go?", "The software analogy replaced the telephone exchange analogy, which replaced the steam engine one."], "r": ["The analogy is about levels: one process described by what it does and by how it’s built. It never needed a literal program file.", "Evolution shipped it, there’s no documentation, and the bug reports go to a therapist.", "Each analogy was the best machine of its day, and each was closer than the last."]}, {"b": "Organized the right way, anything would have a mind", "l": ["The claim leaves out experience. A system could have every functional role filled, it seems, with nothing it’s like to be it.", "Then a big enough company has a mind. Anyone who’s worked at one can rule that out.", "Functionalists think a billion people with walkie-talkies could be in pain."], "r": ["If two systems are organized identically, any reason to grant experience to one applies to the other. Denying it means experience hangs on something that makes no difference.", "A company isn’t organized like a brain. Run it with eighty-six billion staff signaling in milliseconds and we’ll talk.", "A billion neurons with ion channels could be in pain. You’re fine with that one."]}], "s": "ƒ"}, {"t": "Illusionism & Dennett", "k": [{"b": "Consciousness is a kind of user illusion", "l": ["An illusion is an experience of something that isn’t so. To be under an illusion there has to be experience, which was the thing to be explained.", "For it to seem like anything, something has to be doing the seeming. That’s consciousness. He walked past it to get to the argument.", "Dennett’s book is called Consciousness Explained. Critics have called it Consciousness Explained Away for thirty years and it still fits."], "r": ["The illusion is a misrepresentation: the brain models its own states as having ineffable inner qualities. A wrong model needs no inner glow to be wrong.", "A camera’s autofocus can be fooled and nothing in the camera is having a seeming.", "Explained away is what happened to the life force, and nobody wants it back."]}, {"b": "There’s no Cartesian theater in the brain", "l": ["Almost nobody holds that there’s a literal place where it all comes together. Knocking it down leaves the question of experience where it was.", "There’s no little man in the head, fine. Nobody said little man. He beat a puppet.", "He spent fifty years refuting a view nobody held and called everyone who disagreed a secret holder of it."], "r": ["Nobody defends a place, and nearly everyone assumes a moment: a line across which content “enters consciousness.” That’s the theater with the walls removed.", "Then say when a perception becomes conscious, to the millisecond. You’ll find you believed in a finish line.", "They say they don’t hold it and then ask where it all comes together."]}, {"b": "Qualia don’t exist", "l": ["Denying the one thing each person seems most directly acquainted with needs overwhelming argument, and “you only think you have it” isn’t one.", "Pain hurts. That’s the datum. A theory that says the hurt isn’t there has checked the theory and not the pain.", "If there are no qualia, anesthesiologists are paid for nothing."], "r": ["What’s denied is the theorist’s version: private, ineffable, known without error. Pain, taste and color stay, without those four properties.", "Pain hurts, and hurting is a state that makes you stop, wince and remember. I never denied that. I denied a fifth thing.", "Anesthesia stops the processing. That’s what they’re paid for."]}, {"b": "Explain the reports and you’ve explained consciousness", "l": ["That treats what people say about experience as the whole phenomenon. The question was about what the reports are reports of.", "A thermometer reports the temperature. Explaining the thermometer doesn’t make the room warm.", "“You just think you’re conscious” is the only theory that insults the evidence."], "r": ["Add the judgments, the discriminations and every disposition, not only the talk. If something remains after all that, say what it does.", "A thermometer has no model of itself as having an inner warmth. You do. Explaining that model is the job.", "The evidence is that people say so. That’s all of it, on both sides."]}], "s": "◑︎"}, {"t": "The Chinese room", "k": [{"b": "Syntax isn’t enough for semantics", "l": ["The premise is the conclusion in other words. Whether the right processing could amount to understanding is exactly what’s being asked.", "Brains are neurons following chemical rules. That’s syntax. So by the argument nobody understands anything, including the argument.", "Searle proved computers can’t think using a thought experiment, which is a computation he ran in his head."], "r": ["It’s a premise, defended by the thought experiment. Anyone who denies it owes an account of how symbol-shuffling comes to be about anything.", "Neurons aren’t following rules. They’re causing things, like a stomach. The rule-following is our description of them.", "A thought experiment is done by a brain, which is exactly his point about what does the thinking."]}, {"b": "The man in the room doesn’t understand Chinese", "l": ["The systems reply: he’s one part. A single neuron doesn’t understand English either, and nobody concludes that people don’t.", "The man would learn Chinese in about a year. People pick up languages. Leave him in there.", "The room would need billions of years per sentence. It’s a thought experiment where the thought never finishes."], "r": ["He answers that: let the man memorize the rules and work in his head. Now he is the whole system and still understands no Chinese.", "He’d learn it by connecting words to the world. From shuffling shapes alone he’d learn the shapes.", "Speed isn’t in the argument. Make it instant and nothing changes."]}, {"b": "Simulation isn’t duplication", "l": ["That’s true of storms and digestion. Whether minds are like storms or like calculation is the open question, and a simulated calculation is a calculation.", "A simulated calculator calculates. A simulated chess player wins. The line gets fuzzy fast when the product is information.", "A simulated argument is still an argument, which is bad news for this one."], "r": ["A simulated calculation counts because we read the symbols as numbers. The meaning is supplied by us, and that’s the difference he’s pointing at.", "The calculator calculates because we decided what the marks mean. Understanding can’t be assigned from outside.", "It’s still an argument because you understand it."]}, {"b": "Brains cause minds by their biology", "l": ["“Causal powers of the brain” names whatever makes the difference without saying what it is or why silicon couldn’t have it.", "Biology is chemistry, chemistry is physics, and physics is math. He drew the line at the one level he liked.", "Searle’s answer to what brains have that computers don’t is “the right stuff,” and he never said what stuff."], "r": ["He never said silicon couldn’t. He said running a program is not enough for anything, so whatever does it, does it by its physics.", "Each level has its own causal powers. Chemistry digests and arithmetic doesn’t. That isn’t a preference.", "Nobody else has said what stuff either. He’s the one who admitted it’s a question about stuff."]}], "s": "房"}, {"t": "Integrated information theory", "k": [{"b": "Consciousness is integrated information", "l": ["The theory implies that simple grids of logic gates, wired the right way, are more conscious than any computer. Even sympathetic critics take that as a refutation.", "Then a well-connected spreadsheet beats a jellyfish. Nobody believes that, including the spreadsheet.", "A hundred-odd researchers signed a letter calling it pseudoscience. That’s the peer review."], "r": ["The theory accepts the result. Surprise at where experience turns up is a poor test in a field with no agreed measure, and other theories have odd verdicts too.", "The spreadsheet’s hardware has almost no integration. It scores near zero. You’ve got the prediction backwards.", "The letter had no measurements in it. That’s a petition."]}, {"b": "It starts from the self-evident axioms of experience", "l": ["The axioms aren’t self-evident to others in the field, and the step from them to the mathematics is not a derivation anyone else can reproduce.", "“Self-evident” is what people call the step they couldn’t prove.", "The axioms are obvious, the math is unreadable, and the conclusion is that a photodiode has feelings."], "r": ["Start from experience or from the brain, you begin with something assumed. Experience is at least the thing to be explained.", "Every theory has axioms. Most hide theirs in the methods section.", "A photodiode has one bit of it. That’s what a minimum looks like."]}, {"b": "A digital computer isn’t conscious, whatever it runs", "l": ["That makes consciousness depend on physical wiring, so two systems behaving identically could differ completely in experience, with no possible test.", "So the same program on different chips is a mind or a rock, and nothing anyone can measure tells which. Convenient.", "It’s the only theory where the answer to “is it conscious” is “what brand is the motherboard.”"], "r": ["It follows from holding that experience is a property of physical cause and effect, like mass. Two systems that compute alike can differ in mass.", "Same program, different heat output too. Software doesn’t settle physical properties.", "Ask what a thing weighs and the answer depends on what it’s made of. Nobody finds that suspicious."]}, {"b": "It makes testable predictions", "l": ["Phi can’t be computed for any real brain, since the calculation explodes with size. The tests so far check loose proxies that other theories also predict.", "A number nobody can compute isn’t a prediction. It’s a mood with a Greek letter.", "Phi has never been measured for anything bigger than a few logic gates. The theory of consciousness has been tested on a doorbell."], "r": ["The exact number can’t be computed. The theory still made predictions about where and how long activity persists, they were pre-registered against a rival, and some held.", "Nobody can compute the exact weather either. The forecast is still testable.", "It was tested against its main rival under agreed rules. Both took damage. That’s more than most theories have risked."]}], "s": "Φ"}, {"t": "Extended mind", "k": [{"b": "Otto’s notebook is part of his mind", "l": ["A notebook’s contents are consulted and interpreted, while beliefs aren’t looked up. That difference may be what makes something mental.", "Then stealing the notebook is brain surgery, and the stationery store sells organs.", "If the notebook is part of his mind, losing it on the bus is a head injury."], "r": ["Otto doesn’t interpret the entry and decide whether to trust it. He reads and goes, as you go on a memory. The role is the same.", "Take away someone’s glasses and you’ve impaired their sight. Nobody finds that paradoxical.", "Losing it does to him what the disease did. That’s the argument."]}, {"b": "Cognition doesn’t stop at the skull", "l": ["That thinking relies on tools doesn’t show the tools think. Causal dependence on something isn’t the same as being made of it.", "Digestion depends on the fridge. The fridge isn’t part of the stomach.", "The extended mind is the discovery that people write things down."], "r": ["The loop is the claim: where the tool is so tightly coupled that taking it out breaks the process, it’s part of what’s doing the work.", "The fridge isn’t digesting. The pencil and paper are doing the long division, since you can’t do it without them.", "Yes, and the writing is doing some of the thinking. That’s the whole discovery."]}, {"b": "Your phone is part of you", "l": ["If any reliably used resource counts, minds spread without limit, into libraries and other people. The view needs a boundary it can’t easily draw.", "Then the phone company owns part of everyone’s mind and can raise the rent on it. Which, fine, that one’s true.", "“My phone is part of my mind” is a philosophy of screen time written by people defending their own."], "r": ["The conditions do the bounding: always available, automatically trusted, easily used. A library you visit twice a year fails them.", "They do own part of your memory. That’s a reason to take the theory seriously.", "It predicted why losing your phone feels like that."]}, {"b": "If it’d count inside the head, it counts outside", "l": ["Nothing inside the head works like a notebook, so the parity test compares the notebook to an imaginary inner process invented for the purpose.", "If a liver did it outside the body, it’d be a bottle of bleach. Parity isn’t a principle, it’s a pun.", "The whole theory is one example about a man named Otto, from 1998."], "r": ["Inner memory is a stored trace consulted when needed. The notebook is that, in a slower medium.", "A pacemaker outside the body is a medical device. Inside, it’s part of how your heart beats.", "One clean example is how most of philosophy works. Yours has a trolley."]}], "s": "⊃︎"}, {"t": "Behaviorism", "k": [{"b": "Psychology should study behavior, not inner states", "l": ["Chomsky’s review of Skinner showed that language can’t be explained by reinforcement history without smuggling the inner states back in.", "People behave differently depending on what they think. So the thing that explains behavior is the thing he ruled out.", "Two behaviorists meet. “You’re fine. How am I?”"], "r": ["Chomsky reviewed a book by its weakest reading. The method survived: what animals do, under controlled conditions, measured. That’s still most of the field’s data.", "What they think shows up as what they do next. That’s the only place anyone has ever found it.", "And both were right."]}, {"b": "Mental talk is just talk about dispositions", "l": ["A perfect actor has the pain behavior without pain, and a stoic has the pain without the behavior. The disposition and the state come apart.", "A man holding still and saying nothing has a headache. Find the behavior.", "Behaviorism is the view that nobody has ever had a secret."], "r": ["The actor has the outward half. The disposition includes what he’d do if nobody were watching, and there the two differ.", "Ask him. He’ll tell you. Disposition, shown.", "Secrets are things you’d say under other conditions. That’s a disposition."]}, {"b": "Behavior is shaped by reinforcement", "l": ["Learning has innate limits and biases, and animals form expectations and maps without reward. The lab results stopped fitting decades ago.", "Children say sentences nobody ever rewarded them for, mostly at the worst possible moment.", "Skinner taught pigeons to play ping-pong, and concluded things about people."], "r": ["Built-in biases set what can be reinforced. The principle works within them, and every animal trainer and every app uses it.", "They were rewarded for speaking in general, thousands of times. The particular sentence is the generalization.", "Your phone was designed on the pigeon results."]}, {"b": "The inner mind is a ghost in the machine", "l": ["Rejecting a ghostly substance doesn’t require rejecting inner states. Cognitive science kept the inner processing and dropped the ghost.", "There’s no ghost in the machine, and also no dream last night, apparently, since nobody saw it.", "Behaviorism was abandoned, and by its own theory that’s because it stopped being rewarded."], "r": ["Cognitive science kept inner states defined by what they do. That’s the behaviorist test, moved inside the skin.", "Your report of the dream this morning is behavior. That’s the only access anyone has ever had to it.", "It stopped being funded. That’s reinforcement."]}], "s": "↻︎"}, {"t": "Eliminative materialism", "k": [{"b": "Beliefs and desires don’t exist", "l": ["The view is hard to state without them. Asserting it, arguing for it and expecting it to persuade all look like things done with beliefs.", "He believes there are no beliefs. That’s it. That’s the reply.", "Eliminativists want you to believe there are no beliefs, and they really want it."], "r": ["The view can be stated as a prediction: the best future science of the brain won’t contain states like those. The incoherence charge assumes the framework under dispute.", "People once said “it’s possessed” to deny possession. You use the old words until the new ones arrive.", "We’re disposed to utter it. There."]}, {"b": "Folk psychology is a failed theory", "l": ["It predicts human behavior from moment to moment better than any science we have. That’s an odd record for a failed theory.", "Folk psychology gets a hundred people to the same restaurant at eight. Neuroscience can’t yet predict a sneeze.", "“Folk psychology has made no progress in 2,000 years.” Neither has the wheel. It works."], "r": ["It handles dinner plans and has nothing on sleep, memory, mental illness or learning. A theory stuck on the easy cases for two thousand years isn’t thriving.", "Astrology also gets people to the same restaurant.", "The wheel got bearings, tires and suspension. That’s what progress looks like."]}, {"b": "Neuroscience will replace it", "l": ["New sciences usually refine everyday categories or explain how they’re implemented. Wholesale replacement, as with witches, is the rare case.", "Chemistry didn’t eliminate water. It said what water is. He’s betting on the one outcome that almost never happens.", "Any day now we’ll say “my C-fibers are firing” at the dentist. They’ve been saying any day now since 1981."], "r": ["It’s a bet. “Memory” has already split into several systems the folk never suspected, and “will” isn’t doing well.", "Chemistry kept water and dropped phlogiston. The question is which one belief is, and that’s open.", "People already say “my serotonin’s low.” It’s started."]}, {"b": "The view isn’t self-refuting", "l": ["The standard defense says the charge assumes the old framework. But until the replacement vocabulary exists, there’s no way to say what the theory asserts.", "“That objection only works if assertion exists.” And then he asserts that.", "It’s a philosophy that asks to be taken on faith by people it says have no faith."], "r": ["“Vitalism is false” was once said to refute itself, since the speaker had to be alive. The reply was the same.", "That objection assumes the thing in dispute. Every revolution gets told its denial is unsayable.", "Then call it a research bet. Nobody needs faith for a bet."]}], "s": "∖︎"}]}, {"n": "Knowledge", "s": "∵︎", "t": [{"t": "Descartes", "k": [{"b": "I think, therefore I am", "l": ["Lichtenberg’s point: what can’t be doubted is that thinking is going on. A lasting “I” that does it goes beyond what’s given.", "Thinking needs a brain and a brain needs a body, so the body was certain first. He got the order backwards and built everything on it.", "“I think, therefore I am” assumes the “I.” Wrong by word one."], "r": ["He answers that in the Second Meditation: whatever is deceived or doubting is something. The “I” claimed is as thin as that, a thing that thinks, and nothing about its lasting.", "I can doubt I have a body and I can’t doubt I’m doubting. So the order of certainty is mine. The order of plumbing is yours.", "Try denying it without being there to deny it."]}, {"b": "Clear and distinct ideas are guaranteed true", "l": ["The Cartesian circle: God is proved using clear and distinct ideas, and those ideas are trusted because God wouldn’t deceive.", "Everyone who has ever been wrong had a clear and distinct idea at the time. That’s what being wrong is like.", "He proved God exists using an idea of God that God must have put there. That’s a circle, and it’s named after him."], "r": ["His reply is that God secures the memory of past proofs, and a clear perception needs no guarantee while you’re having it. On that reading there’s no circle.", "Those people had vivid ideas. Clear and distinct means nothing in it remains unexamined, which is why almost nobody has had one.", "Circles are clear and distinct. He’d take it."]}, {"b": "Doubt is the right place to start", "l": ["Peirce: nobody can doubt at will. Pretending to doubt what we don’t doubt is a paper exercise, and real inquiry starts from where we are.", "If doubt were the foundation, the most doubtful people would know the most. Conspiracy theorists doubt everything, and look how that’s going.", "Descartes doubted everything until he got to the stuff he wanted."], "r": ["The doubt is a method, used once in a lifetime, and he says so. It’s a stress test for foundations, and nobody is asked to live in it.", "Conspiracy theorists doubt everything except the conspiracy. He doubted that too. That’s the difference between a method and a hobby.", "He got to “I exist.” What did you want him to keep doubting?"]}, {"b": "Mind and body are distinct substances", "l": ["Princess Elisabeth asked how a thing with no extension moves one that has it. His answer was that their union is a primitive notion, which is no answer.", "He said they meet at the pineal gland. Lizards have one. So either lizards have souls or the gland does something else, and it’s the second. It’s melatonin.", "Descartes said the soul steers through the pineal gland. That was the good version."], "r": ["He agreed it couldn’t be explained from the other two notions and said the union is known by living it. Unsatisfying, and every theory of mind since has a step like it.", "The gland sits in the middle and isn’t doubled, so it was a sensible guess in 1640. Melatonin was isolated in 1958. He was early, not wrong about there being a junction.", "You’ve got a better interface? Everyone’s still looking for it."]}, {"b": "He founded modern philosophy", "l": ["The label hides how much is inherited. The cogito echoes Augustine, the proofs of God are scholastic, and Bacon or Montaigne have as good a claim to the start.", "Nothing that begins by proving God exists twice is modern. It’s the Middle Ages with a coordinate system.", "Great mathematician. Should have stayed there."], "r": ["The materials were old. What was new was the starting point: from what I can be sure of, and not from what there is. Everything after had to answer that question first.", "He proved God twice and still made everyone after him start from the self. Whatever he was doing, it wasn’t the Middle Ages.", "He put algebra and geometry on one grid in his spare time. What was your side project?"]}], "s": "┼︎"}, {"t": "Hume", "k": [{"b": "Induction can’t be rationally justified", "l": ["Asking for a deductive proof of induction may be the mistake. On other accounts of justification inductive practice is fine without the circle Hume points at.", "Induction has worked every time so far. Something that has worked every time is justified. That’s what the word means.", "Hume proved induction doesn’t work and then ate lunch like it would."], "r": ["Those accounts say induction is reliable if nature is uniform, which is the thing in question. He isn’t demanding deduction. He’s asking for any reason that doesn’t assume the conclusion.", "“It worked every time so far, so it will keep working” is an induction. You’ve justified it with itself, which was his whole point.", "He said nobody can stop doing it, including him. That’s in the book. The lunch is the theory."]}, {"b": "You can’t get an ought from an is", "l": ["Promises and other institutional facts blur the gap, and the famous passage may only ask that the step be explained, not forbid it.", "“The stove is hot” gets people to “don’t touch it” in one step, and children manage it.", "Hume said you can’t get an ought from an is, and then wrote a whole ethics."], "r": ["Promising only yields an obligation if you accept the rule that promises bind, and that rule is an ought. The examples carry in what they claim to produce.", "The stove gets you there only because you already don’t want to be burned. That’s the missing premise, and it’s a desire, which is where he said to look.", "His ethics starts from what people feel and approve. That’s an is. He followed his own rule."]}, {"b": "Causation is just constant conjunction", "l": ["Regularity can’t tell causes from coincidences or from two effects of one cause. Day follows night constantly without being caused by it.", "Then roosters cause the sunrise. They have a better record than most scientific laws.", "“Causation is just habit.” So the brick and the broken window are just friends."], "r": ["He gave two definitions and knew the first let in too much. His point survives the patch: whatever is added, nobody has ever observed the necessity itself.", "Roosters crow at streetlights and at 3 a.m. with no sunrise. The conjunction isn’t constant. He’d have checked.", "You saw the brick and then the window. Tell me what else you saw."]}, {"b": "There’s no self, only a bundle of perceptions", "l": ["Hume admitted in his own Appendix that he couldn’t explain what ties the perceptions into one mind.", "Somebody had to look inside and find no self. That’s the self. It’s the one holding the flashlight.", "Hume said there’s no self and never said who noticed."], "r": ["He admitted it, in print, about his own theory. A philosopher who says where his account fails is giving a result, and nobody has repaired it since.", "Point the flashlight at the one holding it. You get another perception of a hand. Keep going.", "Nobody noticed. There was a noticing."]}, {"b": "Reason is the slave of the passions", "l": ["Seeing a reason to do something does seem able to move people, and Hume’s view leaves no desire irrational, however strange.", "Then people who want 2+2 to be 5 would manage to believe it. Wanting loses to arithmetic every time.", "Reason is the slave of the passions, so Hume’s whole philosophy is a mood."], "r": ["A recognized reason moves only those who care about what it bears on. People who see the reason and don’t care aren’t making a logical mistake.", "Wanting loses to arithmetic because you want to be right more. Passion beat passion. Reason did the sums and waited.", "And yours is a different mood."]}], "s": "↛︎"}, {"t": "Empiricism", "k": [{"b": "All knowledge comes from experience", "l": ["The claim isn’t itself learned from experience, and mathematics and logic resist the treatment. Mill’s attempt to make arithmetic inductive convinced almost nobody.", "Nobody has experienced the number seven. They’ve experienced seven things, which is different and already assumes seven.", "“All knowledge comes from experience” is not something anyone experienced."], "r": ["The principle is a proposal for how to do inquiry, justified by its record, and needn’t be a truth about the world. Mathematics can be handled as the framework we reason in.", "Take away every group of seven things you’ve ever met and see what’s left of your idea of seven.", "Neither is “some knowledge comes from nowhere.”"]}, {"b": "The mind starts as a blank slate", "l": ["Work on language learning and infant cognition points to a lot of built-in structure. A slate with no built-in biases couldn’t learn from data at all.", "A blank slate can’t read. Something already has to be there to know what the marks mean, and that something isn’t blank.", "The blank slate lost to twin studies."], "r": ["Locke’s target was innate knowledge, such as built-in principles and truths. A built-in ability to learn is a faculty, and he never denied those.", "The slate has edges. Nobody said it had no shape. What’s written on it comes from outside, and that’s the claim.", "Twins raised apart both speak the language of wherever they were raised."]}, {"b": "Observation is the final arbiter", "l": ["Observation is shaped by theory, and theories meet the evidence as wholes, so no single observation gets to arbitrate.", "Observation said the sun goes round the earth for ten thousand years. The final arbiter was overruled by a guy doing math.", "Empiricists trust the senses, the things that think the stick in the water is bent."], "r": ["Theory shapes what gets observed, and theories still fail when the needle goes the wrong way. Being tested as a group doesn’t stop the group from failing.", "The guy doing math was overruled first, by Tycho’s observations, and fixed his orbits to fit them. Observation arbitrated. It just took a better look.", "And then they put it in water, look again, and feel it. More senses. That’s the method."]}, {"b": "Unobservables are just useful fictions", "l": ["The line between observable and unobservable is vague and moves with the instruments, and the success of theories about unseen things is hard to explain if they aren’t roughly true.", "Germs were unobservable until someone ground a lens. So they were fiction until a Tuesday and real after, which is not how germs work.", "Empiricism is fine for finding keys."], "r": ["The view only asks for belief that the theory fits what can be seen. That’s all the evidence ever supports, and the extra belief buys no further prediction.", "Germs became observable, and then everyone was entitled to believe in them. That’s the position working. Nothing went wrong.", "It found the keys. What did yours find?"]}, {"b": "Concepts are copied from sense impressions", "l": ["Abstract and logical concepts such as negation, necessity and number have no plausible impression to be copies of.", "Nobody has seen a “not.” It’s in every other sentence.", "Locke said the mind starts empty, which is a bold thing to generalize from."], "r": ["Hume derives them from operations of the mind on impressions: denial from rejecting, number from repeating. They come from experience of what the mind does.", "You’ve seen an empty chair where someone was supposed to be. There’s your “not.”", "It generalizes fine. Find the baby who was born knowing French."]}], "s": "◎︎"}, {"t": "Rationalism", "k": [{"b": "Some truths are known by reason alone", "l": ["The candidates tend to be either true by definition, so they say nothing about the world, or substantive and revisable. Euclid’s geometry was the model case until it wasn’t.", "Reason alone told people space was Euclidean, and space isn’t. That was the best example.", "Rationalism is guessing from a chair."], "r": ["That geometry holds within its axioms is still known by reason alone, and what gave way was a claim about physical space. The method survived its best example.", "Reason also told people what space would be if it weren’t Euclidean, fifty years before anyone could measure it.", "Every experiment was designed in a chair."]}, {"b": "We have innate ideas", "l": ["Built-in structure in the mind is well supported. That’s a long way from innate knowledge of God, substance and cause, which is what the rationalists claimed.", "If the ideas were innate, everyone would have the same ones. Ask three people what God is.", "Innate ideas, but babies don’t know anything. Checked."], "r": ["Leibniz’s version is dispositions, like veins in marble, and that’s close to the modern finding. Infants expect objects to persist and causes to precede effects.", "Everyone agrees there’s a difference between one and two. Start there. The disagreement about God is about the details.", "They know enough to be surprised when an object vanishes. Checked."]}, {"b": "Mathematics shows what pure reason can do", "l": ["Mathematics gives necessity inside a set of axioms. Which set describes the world is an empirical matter, as general relativity showed.", "Math is true because people defined it that way, like chess. Nobody thinks the bishop moving diagonally is a discovery about the universe.", "Rationalists think math describes reality because math is nice."], "r": ["Which geometry fits space is empirical. That consistent axioms have the consequences they do is not, and physics would have had no alternatives to test without it.", "Chess never predicted a planet. Neptune was found on paper before anyone pointed a telescope.", "Math describes reality whether or not it’s nice. Usually it isn’t."]}, {"b": "Clear and distinct perception is a mark of truth", "l": ["There’s no way on offer to tell real clarity from apparent clarity. Descartes, Spinoza and Leibniz each found a different system self-evident.", "Then whoever feels surest is right. That’s how every argument in every bar already works.", "“Clear and distinct ideas” means it felt right."], "r": ["It was never meant as a feeling of confidence. It’s the state where denying the thing can’t even be thought through, as with two and two, and disputes show someone hasn’t reached it.", "The surest person in the bar can’t deny that he exists or that two and two are four. On everything else he’s just loud.", "2+2=4 feels right too. Go ahead and doubt it."]}, {"b": "Metaphysics can be done from the armchair", "l": ["Kant’s antinomies show reason producing equally good proofs of opposite conclusions once it leaves possible experience behind.", "Every armchair metaphysics so far was replaced by someone with equipment. Atoms, the void, space, time. The chair is 0 for 4.", "Three geniuses reasoned from pure thought and came back with three different universes."], "r": ["The antinomies are armchair results. Kant found the limits of reason by reasoning, which is the method working on itself.", "Atoms, the void, and space bending were all proposed from the chair first. The equipment’s job was confirming.", "And every empiricist looked at the same world and came back with nothing they could prove."]}], "s": "√︎"}, {"t": "Skepticism", "k": [{"b": "You can’t rule out being a brain in a vat", "l": ["Putnam argued a lifelong brain in a vat couldn’t even refer to vats. And many deny that knowing requires ruling out every such possibility.", "A vat needs a lab, a lab needs funding, and funding needs a world. So the vat proves the outside world it was supposed to put in doubt.", "Moore held up a hand. That was the whole refutation, and it worked."], "r": ["Putnam’s argument covers a brain that was always in a vat. Put the brain in last night and its words still refer, and nothing rules that out.", "A dreamed lab needs no funding. Everything in the argument is available from inside the vat, which is the problem.", "He held up what looked like a hand."]}, {"b": "Knowledge requires certainty", "l": ["The standard view is that knowledge needs good enough justification, not immunity to error. The certainty requirement is a stipulation that ordinary and scientific use reject.", "People are certain of things all the time. I’m certain right now. So the requirement is met and skepticism is false.", "Skeptics can’t know that they can’t know. Done."], "r": ["Then say how good is good enough. Every threshold below certainty allows that someone “knows” something false-for-all-they-can-tell, and that’s the oddity being pointed at.", "You’re certain right now. You were also certain where you left your phone.", "Correct. I don’t claim to. You’re the one claiming things."]}, {"b": "Suspend judgment and tranquility follows", "l": ["Suspending judgment for long looks psychologically impossible and unworkable in practice, since acting means treating things as being one way.", "People who can’t make up their minds are the most anxious people there are. Tranquility comes from deciding. Ask anyone holding a menu.", "Pyrrho’s friends supposedly had to steer him away from cliffs. That’s the lifestyle."], "r": ["The Pyrrhonist acts on appearances and custom without affirming they’re true. Eating when hungry needs no theory of nutrition.", "Deciding is what makes people anxious: now they can be wrong. The menu is fine until you have to commit to the fish.", "He lived to about ninety. Something was working."]}, {"b": "Every justification ends in regress, circle or dogma", "l": ["Each horn has defenders who accept it and argue it isn’t vicious. The trilemma lists the options. It doesn’t show they all fail.", "The trilemma is a claim, so it needs a justification, so it falls to the trilemma. It’s the only argument that refutes itself on purpose.", "“How do you know?” is a question a five-year-old can ask forever."], "r": ["They’ve each picked a horn and argued it’s tolerable for two thousand years without agreeing which. That stand-off is what the trilemma predicts.", "It isn’t a claim, it’s a challenge. A question doesn’t need a justification. An answer does, and that’s your side.", "And you’ve never once answered the fifth “why.”"]}, {"b": "The senses have deceived us before", "l": ["We only find out about sensory errors by relying on other perceptions, so the argument from illusion assumes perception is mostly reliable.", "The senses were wrong maybe twice. The stick, the oasis. Twice in a lifetime is a better record than any skeptic has.", "Nobody is a skeptic at a crosswalk."], "r": ["It doesn’t assume reliability. It shows that by your own lights the senses conflict, and asks which report to trust and on what basis.", "You’ve caught them twice. The whole point is you don’t catch the other times.", "I cross on the appearance of no cars. No theory needed."]}], "s": "¿"}, {"t": "Pragmatism", "k": [{"b": "Truth is what works", "l": ["Useful falsehoods and useless truths pull the two apart. Russell and Moore attacked James on exactly this, and Peirce disowned the formula.", "Leeches worked for two thousand years, in that the doctors got paid and the patients came back. So leeches were true until 1850.", "“Truth is what works.” Lying works."], "r": ["James meant works in the long run and over the whole of experience. A useful falsehood fails that test eventually, which is how we find out it was false.", "Leeches stopped working the moment anyone counted the dead. That’s the test doing its job, a little late.", "Lying works until Thursday. That’s the theory."]}, {"b": "Truth is where inquiry would converge", "l": ["Nothing guarantees inquiry converges, or converges on one answer, and some truths, like lost facts about the past, may be beyond any inquiry.", "Inquiry has been going for three thousand years and has converged on nothing. Philosophers can’t agree on whether chairs exist.", "Peirce invented pragmatism, hated what James did with it, and renamed his own version so nobody would steal it. Nobody did."], "r": ["It’s a hope that regulates inquiry, and he calls it that. Without it there’s no sense to calling any present belief mistaken.", "Inquiry has converged on atoms, germs, evolution and the age of the universe. Philosophy isn’t the sample.", "Nobody stole “pragmaticism” because it was ugly on purpose. It worked."]}, {"b": "A concept means its practical consequences", "l": ["The maxim risks the old verification problem: claims about the remote past or the unobservable mean more than any difference they make to practice.", "“Unicorn” has no practical consequences and everyone knows what it means. It’s a horse with a horn. That’s the meaning.", "Pragmatism is common sense that took a hundred years."], "r": ["Peirce counted conceivable consequences under any circumstances, so claims about the past keep their meaning through what would be found if we looked.", "Unicorn means you’d see a horn if one walked in. That’s a consequence. You just gave it.", "A hundred years is fast for common sense. Check on the others."]}, {"b": "Faith is justified where evidence is silent", "l": ["Clifford’s worry stands: letting desire settle belief wears down the habits that make inquiry reliable, and James’s conditions are easy to stretch.", "Evidence is never silent. No evidence is evidence of no. That’s how every missing sock is handled.", "James said believe in God if it helps. That’s a placebo with a Harvard chair."], "r": ["He restricts it tightly: the option must be live, forced and momentous, and the evidence unable to settle it. Clifford’s rule would also forbid trusting anyone before the proof is in.", "A sock with no evidence could be anywhere. You keep looking. That’s acting on belief without evidence, and you do it every laundry day.", "Placebos work. That’s the awkward thing about that example."]}, {"b": "Give up on mirroring reality", "l": ["If justification is only what one’s community accepts, there’s nowhere to stand to say a community changed for the better and not just changed.", "A map that doesn’t mirror the land gets people lost. He was against maps.", "Rorty said truth is whatever your peers let you get away with, and his peers let him."], "r": ["Better and worse can be judged from where we stand, by problems solved and cruelties ended. No view from outside was ever available to anyone.", "A map is useful because of what you can do with it. Nobody checks one by holding it up to the land from orbit.", "Yours let you get away with “correspondence,” and nobody can say what that is."]}], "s": "✓︎"}, {"t": "The Gettier problem", "k": [{"b": "Justified true belief isn’t knowledge", "l": ["The cases depend on intuitions that vary more than assumed, and they may show only that “knows” is loose at the edges, like most words.", "A man looks at a stopped clock at the right moment and gets the time right. He knows what time it is. He’s on time. Next.", "Gettier wrote three pages in 1963 and never needed to publish again. That’s the real lesson of the paper."], "r": ["Later studies found the judgment in every culture and language tested. The early variation results didn’t hold up.", "He has the right time and no idea the clock is broken. Ask him at noon tomorrow.", "Three pages that overturned two thousand years. Some people can’t do it in three hundred."]}, {"b": "Knowledge needs a fourth condition", "l": ["Sixty years of candidates each fell to a new counterexample. That pattern suggests the project of analysis, not the latest condition, is at fault.", "They’ve added a condition every few years since 1963. At this point knowledge is justified true belief plus a terms of service.", "Every proposed fix got its own counterexample, usually involving a barn."], "r": ["Each failure taught something: about luck, about defeaters, about tracking the truth. A sequence of improving theories is a research program.", "Every science adds conditions when the counterexamples come in. Physics is on its fourth or fifth definition of mass.", "The barn turned out to be the best example in the subject."]}, {"b": "Knowledge can’t be analyzed at all", "l": ["Declaring knowledge primitive ends the search by fiat and leaves the cases that started it, where belief and knowledge seem to differ by luck, undescribed.", "“It can’t be broken down” is what people say about a jar they couldn’t open.", "After fifty years of failed definitions the field announced that not defining it was the answer."], "r": ["It isn’t giving up. Taking knowledge as basic lets it explain belief, evidence and assertion, and those accounts make claims that can be checked.", "Nobody can analyze “red” into parts either, and they know what it is.", "Not defining a thing and using it to define the rest is what axioms are."]}, {"b": "The cases show something deep about knowledge", "l": ["They may show something shallow: that luck sometimes makes a well-founded belief true. Nobody outside philosophy finds that surprising.", "Nobody has ever lost money, a job or an argument over a Gettier case. Deep things have consequences.", "The Gettier problem is the discovery that people are sometimes right by accident."], "r": ["The depth is in the consequence: being right for good reasons isn’t enough, so knowledge needs the right link between the reasons and the fact.", "Courts turn on it. Whether a witness knew or guessed correctly decides cases.", "By accident, with excellent reasons. That second part is the discovery."]}], "s": "≠︎"}, {"t": "Relativism", "k": [{"b": "Truth is relative to a framework", "l": ["Then that claim is true only relative to a framework, and people in another framework can truly reject it.", "Is that true for everyone, or just for you? Either answer ends it.", "Relativism is true for the people who say it and false for everyone they’re saying it to."], "r": ["A relativist can accept that: the thesis holds in her framework and she recommends the framework. It’s uncomfortable and it isn’t contradictory.", "True in mine. I’m inviting you in. That’s all anyone has ever done.", "That’s how it works, yes."]}, {"b": "There’s no view from nowhere", "l": ["That every view is from somewhere doesn’t show all views are equally good. Some standpoints see more, and can show it.", "A map is drawn from somewhere and still gets people to the airport.", "“There’s no neutral standpoint,” announced from one."], "r": ["“Sees more” is judged by some standard, and the standard belongs to a standpoint. That’s the point being made again.", "The map uses a projection somebody chose. Greenland isn’t that big.", "From one, yes. Where else?"]}, {"b": "Different cultures have different truths", "l": ["Cultures disagree about what’s true. That’s a fact about beliefs, and it’s compatible with some of them being wrong.", "Different cultures believed different things about what causes disease. One of those beliefs came with penicillin.", "Every culture has its own truth, and they all use the same airplane."], "r": ["Some of it is plain error. Where the difference is in what counts as evidence or as a good life, “wrong” needs a judge both sides accept.", "Penicillin is true in every framework that values not dying. Notice the “that.”", "And they disagree about where it should go."]}, {"b": "Relativism promotes tolerance", "l": ["If tolerance is good only relative to a framework, the intolerant are right in theirs. The argument for tolerance needs it to be more than relatively good.", "If nobody’s wrong, the intolerant aren’t wrong either. He just handed them a permission slip.", "Relativists are very sure, across all cultures, that nobody should be very sure."], "r": ["Tolerance doesn’t follow by logic. Seeing your own certainties as local does loosen the urge to impose them, and that’s how it has usually worked.", "He already had the permission. What he’s lost is the claim that the universe signed it.", "Fairly sure. In this framework."]}], "s": "∼︎"}, {"t": "Quine", "k": [{"b": "There’s no line between analytic and synthetic", "l": ["Grice and Strawson replied that a distinction people apply consistently to new cases exists, even if it resists a non-circular definition.", "“All bachelors are unmarried” and “it’s raining.” If those look like the same kind of sentence, the problem isn’t the distinction.", "Quine erased the difference between definitions and facts, and dictionaries kept selling."], "r": ["That people sort new sentences alike shows a shared habit. It doesn’t show the sorting marks a difference in kind, and a habit can be explained by how central a belief is.", "“Momentum is mass times velocity” was a definition until relativity made it false. Which kind of sentence was that?", "Dictionaries get revised whenever the facts change."]}, {"b": "Epistemology should be a chapter of psychology", "l": ["Describing how people form beliefs doesn’t say which beliefs they ought to hold. The normative question is the one epistemology was asking.", "A study of how people actually do arithmetic would conclude that seven times eight is whatever.", "Quine handed philosophy’s job to psychology, and psychology didn’t want it."], "r": ["The normative part stays as engineering: given the goal of true prediction, which methods work? That’s an empirical question.", "A study of which methods of calculating get right answers would tell you how you ought to do it.", "The psychologists who study reasoning and bias took it. It’s a field now."]}, {"b": "To be is to be the value of a variable", "l": ["The test says what a theory is committed to, not what exists. It hands the question of what’s real to whoever writes the theory down.", "So things exist once they show up in a logic formula. The universe was waiting on notation.", "His test for existence is whether a logician needs it. Sets made it. Meaning didn’t."], "r": ["It’s a test for what a theory says exists. What does exist is settled by which theory is best, and he never claimed otherwise.", "Things existed before notation. What you’re committed to saying exists is in your notation. Different question.", "Sets got in because physics can’t be written without them. That’s the entrance exam."]}, {"b": "Translation is indeterminate", "l": ["In practice translators converge, and constraints from grammar, psychology and shared biology rule out the deviant manuals he imagines.", "A native says “gavagai” and points at a rabbit. It means rabbit. Field linguists do this before lunch.", "“Gavagai” might mean undetached rabbit parts, and “Quine” might mean a man who never met a translator."], "r": ["Translators converge because they share habits, and the claim is that behavior fixes no more than that. Convergence by habit is what he predicts.", "It means rabbit to a linguist who assumed the native carves the world as he does. That assumption is the finding.", "And every translation you’ve read was one of several that would have fit."]}], "s": "∃︎x"}]}, {"n": "Science", "s": "Δ", "t": [{"t": "Popper", "k": [{"b": "Falsifiability separates science from non-science", "l": ["Hypotheses are tested in bundles, so a failed prediction never refutes one claim alone, and probabilistic theories aren’t strictly falsifiable at all.", "Astrology makes predictions and they fail. So by the rule it’s a science, just a bad one, and now it’s in the building.", "Falsifiability can’t be falsified, so Popper is pseudoscience by Popper."], "r": ["He knew tests involve auxiliaries. The rule is methodological: say in advance what would count against you, and don’t rescue the theory afterwards with a patch made for the occasion.", "Astrology’s predictions failed and astrologers kept it anyway. Refusing the refutation is what makes it pseudoscience. You’ve described the criterion working.", "It’s a proposal for a method, not a claim about nature. Nobody falsifies a rule of chess."]}, {"b": "Science proceeds by conjecture and refutation", "l": ["Scientists have kept theories through decades of anomalies, like Mercury’s orbit under Newton, and were right to. Strict falsification would have killed good theories.", "Scientists spend their careers trying to prove their theory right. Nobody has ever applied for a grant to be refuted.", "No scientist has ever dropped a theory over one bad result. They check the cable."], "r": ["He distinguished tenacity from evasion. Keeping a theory through an anomaly is fine if you say what would finally count, and the Mercury anomaly was kept on the books as a problem.", "They try to prove it right, and everyone else in the field tries to prove them wrong. The refuting is done by rivals. That’s why there are journals.", "And when the cable’s fine, they drop it. That’s the part you left out."]}, {"b": "Induction plays no role in science", "l": ["Trusting a well-tested theory about tomorrow is induction under another name. Without it, passing tests gives no reason to rely on a theory in practice.", "If induction played no role, engineers would open each bridge with no expectations. They have expectations.", "Popper said science doesn’t need induction and then boarded planes."], "r": ["Preferring the best-tested theory for action is a decision, and he says nothing better is available. It isn’t a claim that the theory is pro
